<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Вторжение — оборона Земли</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #04060f; color: #eaf0ff;
    -webkit-user-select: none; user-select: none;
  }
  #game { display: flex; flex-direction: column; height: 100%; }

  /* ====== Панель ====== */
  #hud {
    display: flex; align-items: center; gap: 16px;
    padding: 9px 16px; font-size: 14px; z-index: 5;
    background: rgba(255,255,255,.05);
    border-bottom: 1px solid rgba(255,255,255,.09);
    flex-wrap: wrap;
  }
  #hud .item { white-space: nowrap; }
  #hud .label { opacity: .6; margin-right: 4px; }
  #hud .val { font-weight: 700; font-variant-numeric: tabular-nums; }
  #hud .spacer { flex: 1; }
  #wave { color: #6ff0a8; font-weight: 700; }
  #combo { color: #ffd84d; font-weight: 700; }

  /* Щит (здоровье) */
  #shield { display: flex; gap: 3px; }
  #shield .hp {
    width: 16px; height: 12px; border-radius: 3px;
    background: linear-gradient(180deg,#7fd4ff,#2e9be0);
    box-shadow: 0 0 6px rgba(127,212,255,.7);
    transition: background .2s, box-shadow .2s;
  }
  #shield .hp.empty { background: rgba(255,255,255,.12); box-shadow: none; }

  /* ====== Звёздное поле ====== */
  #arena {
    position: relative; flex: 1; overflow: hidden;
    cursor: none; touch-action: none;
    background: radial-gradient(circle at 50% 120%, rgba(60,110,220,.18), transparent 55%), #04060f;
  }
  #stars { position: absolute; inset: 0; pointer-events: none; }
  .star {
    position: absolute; border-radius: 50%; background: #fff;
    animation: starFall linear infinite;
  }
  @keyframes starFall { to { transform: translateY(110vh); } }

  /* Земля внизу */
  #earth {
    position: absolute; bottom: -46vmin; left: 50%;
    width: 110vmin; height: 110vmin; margin-left: -55vmin;
    border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle at 50% 22%, #4aa3ff 0 30%, #1e6fd0 55%, #0d3f88 80%);
    box-shadow: 0 0 90px rgba(80,160,255,.55), inset 0 20px 60px rgba(120,200,255,.4);
    z-index: 1;
  }
  #earth::after {
    content: ""; position: absolute; inset: -2%;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 35%, rgba(90,220,140,.7) 0 12%, transparent 13%),
                radial-gradient(circle at 62% 28%, rgba(90,220,140,.6) 0 9%, transparent 10%),
                radial-gradient(circle at 45% 50%, rgba(90,220,140,.5) 0 7%, transparent 8%);
    opacity: .8;
  }

  /* ====== Прицел ====== */
  #crosshair {
    position: absolute; width: 36px; height: 36px;
    margin: -18px 0 0 -18px; pointer-events: none;
    opacity: 0; transition: opacity .15s; z-index: 25;
  }
  #crosshair::before, #crosshair::after {
    content: ""; position: absolute; background: #6fff9e;
    box-shadow: 0 0 8px rgba(111,255,158,.9);
  }
  #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; margin-left: -1px; }
  #crosshair::after  { top: 50%; left: 0; height: 2px; width: 100%; margin-top: -1px; }
  #crosshair .dot {
    position: absolute; left: 50%; top: 50%; width: 6px; height: 6px;
    margin: -3px 0 0 -3px; border-radius: 50%; background: #6fff9e;
  }

  /* ====== Пришельцы ====== */
  .alien {
    position: absolute; display: flex; align-items: center; justify-content: center;
    will-change: transform; z-index: 3;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,.6));
  }
  .alien svg { width: 100%; height: 100%; display: block; }
  .alien .hpbar {
    position: absolute; left: 12%; right: 12%; bottom: -7px; height: 3px;
    background: rgba(255,255,255,.2); border-radius: 2px; overflow: hidden;
  }
  .alien .hpbar i { display: block; height: 100%; width: 100%; background: #6fff9e; }
  .alien.hit { animation: alienHit .25s forwards; }
  @keyframes alienHit { to { transform: scale(1.5); opacity: 0; } }
  .alien.gone { opacity: 0; transform: scale(.3); transition: all .3s; }

  /* Спец-пришельцы */
  .alien.scout  { filter: drop-shadow(0 0 10px rgba(255,220,80,.9)); }   /* быстрый, много очков */
  .alien.tank   { filter: drop-shadow(0 0 12px rgba(255,90,90,.9)); }     /* крепкий, 3 hp */
  .alien.ufo    { filter: drop-shadow(0 0 14px rgba(180,120,255,.95)); }  /* бонус */

  /* Вспышки */
  .flash {
    position: absolute; width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%; pointer-events: none; z-index: 20;
    background: radial-gradient(circle, rgba(160,255,200,.95), rgba(90,255,160,0) 70%);
    animation: flash .3s ease-out forwards;
  }
  @keyframes flash { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.8); opacity: 0; } }
  .beam {
    position: absolute; width: 3px; pointer-events: none; z-index: 19;
    background: linear-gradient(180deg, rgba(150,255,200,.9), rgba(150,255,200,0));
    box-shadow: 0 0 8px rgba(150,255,200,.8);
    animation: beam .18s ease-out forwards;
  }
  @keyframes beam { from { opacity: 1; } to { opacity: 0; } }

  /* Всплывающий текст */
  .float {
    position: absolute; font-weight: 800; font-size: 18px;
    text-shadow: 0 2px 8px rgba(0,0,0,.8); pointer-events: none;
    animation: floatUp .8s ease-out forwards; z-index: 22; white-space: nowrap;
  }
  .float.good { color: #6fff9e; }
  .float.bad  { color: #ff5a5a; }
  .float.gold { color: #ffd84d; }
  .float.info { color: #c79bff; }
  @keyframes floatUp {
    from { transform: translate(-50%,-50%) scale(.7); opacity: 1; }
    to   { transform: translate(-50%,-180%) scale(1.15); opacity: 0; }
  }

  /* Красная вспышка при пробитии щита */
  #dmg {
    position: absolute; inset: 0; pointer-events: none; z-index: 6;
    background: radial-gradient(circle, transparent 40%, rgba(255,40,40,.5));
    opacity: 0;
  }
  #dmg.on { animation: dmgFlash .5s; }
  @keyframes dmgFlash { 0% { opacity: 1; } 100% { opacity: 0; } }

  /* ====== Оверлей ====== */
  #overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(3,6,14,.88); backdrop-filter: blur(5px); z-index: 30;
    text-align: center; padding: 20px; overflow: auto;
  }
  #overlay.hidden { display: none; }
  #overlay .card {
    max-width: 540px; width: 100%; padding: 30px 28px; border-radius: 20px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  #overlay h1 { margin: 0 0 6px; font-size: 34px; letter-spacing: .5px; }
  #overlay h2 { margin: 20px 0 8px; font-size: 17px; opacity: .9; }
  #overlay p { margin: 8px 0; line-height: 1.55; opacity: .85; font-size: 14px; }
  #overlay .big { font-size: 46px; font-weight: 800; color: #6fff9e; margin: 4px 0; }
  #overlay button {
    margin: 6px; padding: 13px 32px; font-size: 17px; font-weight: 700;
    color: #04140a; background: linear-gradient(180deg,#8dffb4,#35e08a);
    border: none; border-radius: 12px; cursor: pointer;
    box-shadow: 0 8px 22px rgba(53,224,138,.3);
    transition: transform .1s, box-shadow .15s;
  }
  #overlay button:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(53,224,138,.45); }
  #overlay button:active { transform: translateY(1px) scale(.98); }
  #overlay button.ghost {
    background: rgba(255,255,255,.08); color: #eaf0ff; box-shadow: none;
    border: 1px solid rgba(255,255,255,.15);
  }
  #overlay .row { display: flex; justify-content: center; gap: 22px; margin-top: 14px; flex-wrap: wrap; }
  #overlay .row .col { opacity: .9; font-size: 13px; }
  #overlay .row .col b { display: block; font-size: 24px; margin-top: 4px; color: #fff; }
  .board { margin: 10px auto 0; max-width: 400px; }
  .board .line {
    display: flex; align-items: center; gap: 10px; padding: 7px 12px;
    border-radius: 10px; font-size: 14px; margin-bottom: 5px;
    background: rgba(255,255,255,.05);
  }
  .board .line.me { background: rgba(53,224,138,.18); border: 1px solid rgba(53,224,138,.4); }
  .board .rank { width: 22px; text-align: center; opacity: .8; font-weight: 700; }
  .board .m { flex: 1; text-align: left; opacity: .7; font-size: 12px; }
  .board .s { font-weight: 800; color: #ffd84d; }
  .legend { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 14px; font-size: 12px; opacity: .85; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend b { font-size: 16px; }
</style>
</head>
<body>
  <div id="game">
    <div id="hud">
      <div class="item"><span class="label">Очки:</span><span class="val" id="score">0</span></div>
      <div class="item"><span class="label">Волна:</span><span id="wave">1</span></div>
      <div class="item"><span class="label">Щит:</span><span id="shield"></span></div>
      <div class="item" id="combo"></div>
      <div class="spacer"></div>
      <div class="item"><span class="label">Рекорд:</span><span class="val" id="best">0</span></div>
    </div>

    <div id="arena">
      <div id="stars"></div>
      <div id="earth"></div>
      <div id="dmg"></div>
      <div id="crosshair"><span class="dot"></span></div>
      <div id="overlay"></div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  /* ===================== НАСТРОЙКИ ===================== */
  var START_HP      = 5;      // прочность щита Земли
  var BASE_SPAWN_MS = 1000;   // стартовая пауза между пришельцами
  var MIN_SPAWN_MS  = 340;    // минимальная пауза
  var START_SPEED   = 34;     // стартовая скорость падения (px/сек)
  var SPEED_PER_WAVE= 8;      // прибавка скорости за волну
  /* ==================================================== */

  var arena     = document.getElementById("arena");
  var starsEl   = document.getElementById("stars");
  var crosshair = document.getElementById("crosshair");
  var overlay   = document.getElementById("overlay");
  var dmgEl     = document.getElementById("dmg");
  var scoreEl   = document.getElementById("score");
  var waveEl    = document.getElementById("wave");
  var shieldEl  = document.getElementById("shield");
  var comboEl   = document.getElementById("combo");
  var bestEl    = document.getElementById("best");

  /* ---------- Состояние ---------- */
  var running = false;
  var score = 0, hp = START_HP, wave = 1, combo = 0, maxCombo = 0;
  var killed = 0, escaped = 0, shots = 0, hits = 0;
  var spawnTimer = null, rafId = null, lastTs = 0;
  var aliens = [];            // {el,x,y,speed,hp,maxHp,kind,pts,r}
  var shieldUsed = 0;         // сколько пришельцев пробили (для прогресса)
  var shieldRechargeAt = 0;   // бонус: щит может восстановиться
  var waveKillsNeeded = 8, waveKills = 0;

  function loadBoard() {
    try { return JSON.parse(localStorage.getItem("alien_board") || "[]"); }
    catch (e) { return []; }
  }
  function saveBoard(b) { localStorage.setItem("alien_board", JSON.stringify(b)); }
  var best = loadBoard().length ? loadBoard()[0].score : 0;
  bestEl.textContent = best;

  /* ---------- Звёзды ---------- */
  function buildStars() {
    starsEl.innerHTML = "";
    for (var i = 0; i < 90; i++) {
      var s = document.createElement("div");
      s.className = "star";
      var sz = Math.random() * 2 + 0.6;
      s.style.width = sz + "px"; s.style.height = sz + "px";
      s.style.left = Math.random() * 100 + "%";
      s.style.top = (-Math.random() * 100) + "%";
      s.style.opacity = (Math.random() * 0.6 + 0.3).toFixed(2);
      s.style.animationDuration = (Math.random() * 6 + 4) + "s";
      s.style.animationDelay = (-Math.random() * 10) + "s";
      starsEl.appendChild(s);
    }
  }
  buildStars();

  /* ---------- Звук ---------- */
  var audioCtx = null;
  function getAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, to, dur, type, vol) {
    var ac = getAudio(); if (!ac) return;
    var t = ac.currentTime;
    var o = ac.createOscillator(); o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    var g = ac.createGain();
    g.gain.setValueAtTime(vol || 0.2, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur * 1.1);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur * 1.2);
  }
  function sndLaser() { tone(1400, 500, 0.07, "square", 0.08); }
  function sndKill()  { tone(500, 1100, 0.12, "triangle", 0.2); }
  function sndTank()  { tone(300, 180, 0.15, "sawtooth", 0.18); }
  function sndUfo()   { tone(900, 1600, 0.12, "square", 0.16); setTimeout(function(){ tone(1300,2000,.12,"square",.13); }, 90); }
  function sndDamage(){ tone(200, 60, 0.4, "sawtooth", 0.3); }
  function sndWave()  { tone(600, 1200, 0.18, "triangle", 0.2); setTimeout(function(){ tone(900,1500,.18,"triangle",.18); }, 140); }
  function sndGameOver(){ tone(400, 80, 0.8, "sawtooth", 0.3); }

  /* ---------- Утилиты ---------- */
  function rand(a, b) { return Math.random() * (b - a) + a; }
  function W() { return arena.clientWidth; }
  function H() { return arena.clientHeight; }
  function accuracy() { return shots === 0 ? 0 : Math.round(hits / shots * 100); }

  function updateHUD() {
    scoreEl.textContent = score;
    waveEl.textContent = wave;
    comboEl.textContent = combo >= 2 ? "🔥 " + combo : "";
    // щит
    var html = "";
    for (var i = 0; i < START_HP; i++) {
      html += '<span class="hp' + (i < hp ? "" : " empty") + '"></span>';
    }
    shieldEl.innerHTML = html;
  }

  function floatText(x, y, text, cls) {
    var el = document.createElement("div");
    el.className = "float " + (cls || "good");
    el.textContent = text;
    el.style.left = x + "px"; el.style.top = y + "px";
    arena.appendChild(el);
    setTimeout(function () { el.remove(); }, 800);
  }
  function flashAt(x, y) {
    var f = document.createElement("div");
    f.className = "flash";
    f.style.left = x + "px"; f.style.top = y + "px";
    arena.appendChild(f);
    setTimeout(function () { f.remove(); }, 320);
  }
  function beamAt(x, y) {
    var b = document.createElement("div");
    b.className = "beam";
    b.style.left = (x - 1) + "px";
    b.style.top = "0px";
    b.style.height = y + "px";
    arena.appendChild(b);
    setTimeout(function () { b.remove(); }, 200);
  }

  /* ---------- Рисуем пришельца (SVG) ---------- */
  function alienSVG(kind) {
    if (kind === "tank") {
      return '<svg viewBox="0 0 60 60">' +
        '<ellipse cx="30" cy="34" rx="20" ry="17" fill="#b33"/>' +
        '<ellipse cx="30" cy="30" rx="16" ry="13" fill="#e05252"/>' +
        '<ellipse cx="24" cy="28" rx="4.5" ry="6" fill="#1a0a0a"/>' +
        '<ellipse cx="36" cy="28" rx="4.5" ry="6" fill="#1a0a0a"/>' +
        '<circle cx="23" cy="26" r="1.7" fill="#fff"/>' +
        '<circle cx="35" cy="26" r="1.7" fill="#fff"/>' +
        '<path d="M14 40 Q30 50 46 40" stroke="#7a2020" stroke-width="3" fill="none"/>' +
      '</svg>';
    }
    if (kind === "ufo") {
      return '<svg viewBox="0 0 60 60">' +
        '<ellipse cx="30" cy="38" rx="22" ry="8" fill="#8b5cf6"/>' +
        '<ellipse cx="30" cy="34" rx="18" ry="6" fill="#c4b5fd"/>' +
        '<path d="M22 32 Q30 16 38 32 Z" fill="#a78bfa"/>' +
        '<circle cx="30" cy="26" r="4" fill="#eaffea" opacity=".9"/>' +
        '<circle cx="16" cy="38" r="2" fill="#fff"/>' +
        '<circle cx="30" cy="40" r="2" fill="#fff"/>' +
        '<circle cx="44" cy="38" r="2" fill="#fff"/>' +
      '</svg>';
    }
    // scout (жёлтый быстрый) / normal (зелёный)
    var body = kind === "scout" ? "#d9c22a" : "#4bd06a";
    var body2 = kind === "scout" ? "#f5e66a" : "#7ff09a";
    var ant = kind === "scout" ? "#fff" : "#1a3f22";
    return '<svg viewBox="0 0 60 60">' +
      '<path d="M30 6 L30 16" stroke="' + body + '" stroke-width="2"/>' +
      '<circle cx="30" cy="5" r="3" fill="' + body2 + '"/>' +
      '<ellipse cx="30" cy="32" rx="19" ry="21" fill="' + body + '"/>' +
      '<ellipse cx="30" cy="30" rx="15" ry="16" fill="' + body2 + '"/>' +
      '<ellipse cx="23" cy="28" rx="5" ry="7.5" fill="#101820"/>' +
      '<ellipse cx="37" cy="28" rx="5" ry="7.5" fill="#101820"/>' +
      '<circle cx="24" cy="25" r="1.8" fill="#fff"/>' +
      '<circle cx="38" cy="25" r="1.8" fill="#fff"/>' +
      '<path d="M22 41 Q30 47 38 41" stroke="' + ant + '" stroke-width="2.5" fill="none"/>' +
    '</svg>';
  }

  /* ---------- Создание пришельца ---------- */
  function spawnAlien() {
    if (!running) return;

    var r = Math.random();
    var kind = "normal";
    // Спец-пришельцы появляются тем чаще, чем выше волна
    var scoutChance = 0.12 + wave * 0.03;
    var tankChance  = 0.08 + wave * 0.03;
    var ufoChance   = 0.05 + wave * 0.01;
    if (r < scoutChance) kind = "scout";
    else if (r < scoutChance + tankChance) kind = "tank";
    else if (r < scoutChance + tankChance + ufoChance) kind = "ufo";

    var size = kind === "tank" ? rand(64, 80) : (kind === "scout" ? rand(34, 46) : rand(48, 64));
    var x = rand(10, Math.max(10, W() - size - 10));
    var y = -size;

    var baseSpeed = START_SPEED + (wave - 1) * SPEED_PER_WAVE;
    var speed = baseSpeed * (kind === "scout" ? 1.9 : (kind === "tank" ? 0.65 : 1)) * rand(0.85, 1.2);

    var maxHp = kind === "tank" ? 3 : 1;
    var pts = kind === "ufo" ? 150 : (kind === "scout" ? 100 : (kind === "tank" ? 60 : 30));
    pts += (wave - 1) * 5;

    var el = document.createElement("div");
    el.className = "alien " + kind;
    el.style.width = size + "px";
    el.style.height = size + "px";
    el.innerHTML = alienSVG(kind) + (maxHp > 1 ? '<div class="hpbar"><i></i></div>' : "");

    var a = {
      el: el, x: x, y: y, size: size, speed: speed,
      hp: maxHp, maxHp: maxHp, kind: kind, pts: pts, dead: false,
      sway: rand(0, Math.PI * 2), swayAmp: rand(10, 40)
    };
    el.style.left = x + "px";
    el.style.top = y + "px";
    el.__alien = a;

    el.addEventListener("pointerdown", function (e) {
      e.stopPropagation();
      if (!running || a.dead) return;
      shootAt(a, e.clientX, e.clientY);
    });

    arena.appendChild(el);
    aliens.push(a);

    var delay = Math.max(MIN_SPAWN_MS, BASE_SPAWN_MS - (wave - 1) * 70);
    delay *= rand(0.7, 1.35);
    spawnTimer = setTimeout(spawnAlien, delay);
  }

  /* ---------- Выстрел по пришельцу ---------- */
  function shootAt(a, clientX, clientY) {
    var rect = arena.getBoundingClientRect();
    var px = clientX - rect.left, py = clientY - rect.top;
    shots++;

    sndLaser();
    beamAt(px, py);
    flashAt(px, py);

    a.hp--;
    hits++;
    combo++;
    if (combo > maxCombo) maxCombo = combo;

    if (a.hp > 0) {
      // ещё жив (танк)
      sndTank();
      floatText(px, py, "×", "bad");
      var bar = a.el.querySelector(".hpbar i");
      if (bar) bar.style.width = (a.hp / a.maxHp * 100) + "%";
      a.el.style.transform = "scale(1.12)";
      setTimeout(function () { if (!a.dead) a.el.style.transform = ""; }, 90);
      updateHUD();
      return;
    }

    // Убит
    a.dead = true;
    var mult = Math.min(1 + (combo - 1) * 0.1, 3);
    var gained = Math.round(a.pts * mult);
    score += gained;
    killed++;
    waveKills++;

    if (a.kind === "ufo") { sndUfo(); floatText(px, py, "+" + gained + " 🛸 бонус", "info"); }
    else if (a.kind === "tank") { sndKill(); floatText(px, py, "+" + gained, "gold"); }
    else { sndKill(); floatText(px, py, "+" + gained + (combo >= 3 ? " x" + mult.toFixed(1) : ""), "good"); }

    a.el.classList.add("hit");
    setTimeout(function () { a.el.remove(); }, 260);
    var i = aliens.indexOf(a); if (i >= 0) aliens.splice(i, 1);

    // Новая волна?
    if (waveKills >= waveKillsNeeded) nextWave();

    updateHUD();
  }

  /* ---------- Промах ---------- */
  arena.addEventListener("pointerdown", function (e) {
    if (!running) return;
    if (e.target.closest && e.target.closest(".alien")) return;
    var rect = arena.getBoundingClientRect();
    var px = e.clientX - rect.left, py = e.clientY - rect.top;
    shots++;
    combo = 0;
    sndLaser();
    beamAt(px, py);
    floatText(px, py, "мимо", "bad");
    updateHUD();
  });

  /* ---------- Пришелец долетел до Земли ---------- */
  function breach(a, py) {
    a.dead = true;
    escaped++;
    combo = 0;
    a.el.remove();
    var i = aliens.indexOf(a); if (i >= 0) aliens.splice(i, 1);

    // УФО не вредит — это бонус, просто улетает
    if (a.kind === "ufo") { updateHUD(); return; }

    hp--;
    sndDamage();
    dmgEl.classList.remove("on"); void dmgEl.offsetWidth; dmgEl.classList.add("on");
    floatText(W() / 2, H() - 90, "ЩИТ ПРОБИТ!", "bad");
    updateHUD();

    if (hp <= 0) endGame();
  }

  /* ---------- Волны ---------- */
  function nextWave() {
    wave++;
    waveKills = 0;
    waveKillsNeeded = 6 + wave * 2;
    sndWave();
    floatText(W() / 2, H() / 2 - 40, "ВОЛНА " + wave, "gold");
    floatText(W() / 2, H() / 2 - 10, "Пришельцы усилены!", "info");
  }

  /* ---------- Анимационный цикл ---------- */
  function loop(ts) {
    if (!running) return;
    var dt = lastTs ? Math.min((ts - lastTs) / 1000, 0.05) : 0;
    lastTs = ts;

    var bottom = H() - 60;   // «поверхность» Земли

    for (var i = aliens.length - 1; i >= 0; i--) {
      var a = aliens[i];
      if (a.dead) continue;

      a.y += a.speed * dt;
      a.sway += dt * 1.6;

      // Плавное покачивание влево-вправо вокруг исходной точки
      var swayX = Math.sin(a.sway) * a.swayAmp;
      var left = a.x + swayX;
      if (left < 4) left = 4;
      if (left > W() - a.size - 4) left = W() - a.size - 4;

      a.el.style.top = a.y + "px";
      a.el.style.left = left + "px";

      if (a.y + a.size >= bottom) {
        breach(a, a.y);
      }
    }
    rafId = requestAnimationFrame(loop);
  }

  /* ---------- Прицел ---------- */
  arena.addEventListener("pointermove", function (e) {
    var rect = arena.getBoundingClientRect();
    crosshair.style.left = (e.clientX - rect.left) + "px";
    crosshair.style.top = (e.clientY - rect.top) + "px";
    crosshair.style.opacity = running ? "1" : "0";
  });
  arena.addEventListener("pointerleave", function () { crosshair.style.opacity = "0"; });

  /* ---------- Экран старта ---------- */
  function showStart() {
    overlay.classList.remove("hidden");
    var b = loadBoard().slice(0, 5);
    var boardHtml = "";
    if (b.length) {
      boardHtml = '<h2>🏆 Рекорды</h2><div class="board">';
      for (var i = 0; i < b.length; i++) {
        boardHtml += '<div class="line"><span class="rank">' + (i + 1) + '</span>' +
                     '<span class="m">Волна ' + b[i].wave + '</span>' +
                     '<span class="s">' + b[i].score + '</span></div>';
      }
      boardHtml += "</div>";
    }
    overlay.innerHTML =
      '<div class="card">' +
        '<h1>👽 Вторжение</h1>' +
        '<p>Пришельцы спускаются к Земле! Стреляй по ним <b>кликом</b>, пока они не пробили щит.</p>' +
        '<p style="font-size:13px">У Земли <b>' + START_HP + ' единиц щита</b>. Не дай им долететь!</p>' +
        '<div class="legend">' +
          '<span><b>🟢</b> обычный 30</span>' +
          '<span><b>🟡</b> разведчик 100 (быстрый)</span>' +
          '<span><b>🔴</b> танк 60 (3 попадания)</span>' +
          '<span><b>🛸</b> НЛО 150 (бонус)</span>' +
        '</div>' +
        '<div style="margin-top:18px"><button>Начать оборону</button></div>' +
        boardHtml +
        '<p style="margin-top:14px;font-size:12px;opacity:.6">Серии попаданий умножают очки • Каждая волна сложнее</p>' +
      '</div>';
  }

  /* ---------- Конец игры ---------- */
  function showGameOver() {
    var board = loadBoard();
    var entry = { score: score, wave: wave, acc: accuracy(), date: Date.now() };
    board.push(entry);
    board.sort(function (a, c) { return c.score - a.score; });
    board = board.slice(0, 10);
    saveBoard(board);
    best = board.length ? board[0].score : 0;
    bestEl.textContent = best;
    var isRecord = board.length && board[0].score === score && board[0].date === entry.date;

    var html = '<div class="board">';
    for (var i = 0; i < Math.min(board.length, 5); i++) {
      var me = (board[i].date === entry.date) ? " me" : "";
      html += '<div class="line' + me + '"><span class="rank">' + (i + 1) + '</span>' +
              '<span class="m">Волна ' + board[i].wave + '</span><span class="s">' + board[i].score + '</span></div>';
    }
    html += "</div>";

    overlay.classList.remove("hidden");
    overlay.innerHTML =
      '<div class="card">' +
        '<h1>' + (isRecord ? "🏆 Новый рекорд!" : "💥 Земля пала…") + '</h1>' +
        '<p style="opacity:.7;margin-top:-2px">Пришельцы пробили щит</p>' +
        '<div class="big">' + score + '</div>' +
        '<div class="row">' +
          '<div class="col">Волна<b>' + wave + '</b></div>' +
          '<div class="col">Уничтожено<b>' + killed + '</b></div>' +
          '<div class="col">Точность<b>' + accuracy() + '%</b></div>' +
          '<div class="col">Макс. серия<b>' + maxCombo + '</b></div>' +
        '</div>' +
        '<h2>🏆 Рекорды</h2>' + html +
        '<div style="margin-top:16px">' +
          '<button data-action="again">Играть снова</button>' +
          '<button class="ghost" data-action="menu">В меню</button>' +
        '</div>' +
      '</div>';
  }

  /* ---------- Старт / стоп ---------- */
  function clearAll() {
    for (var i = 0; i < aliens.length; i++) aliens[i].el.remove();
    aliens = [];
    var list = arena.querySelectorAll(".alien, .float, .flash, .beam");
    for (var j = 0; j < list.length; j++) list[j].remove();
  }

  function startGame() {
    getAudio();
    clearTimeout(spawnTimer);
    cancelAnimationFrame(rafId);
    clearAll();

    running = true;
    score = 0; hp = START_HP; wave = 1; combo = 0; maxCombo = 0;
    killed = 0; escaped = 0; shots = 0; hits = 0;
    waveKills = 0; waveKillsNeeded = 8;

    overlay.classList.add("hidden");
    updateHUD();
    lastTs = 0;
    rafId = requestAnimationFrame(loop);
    buildStars();

    // первая волна чуть медленнее
    spawnAlien();
  }

  function endGame() {
    running = false;
    clearTimeout(spawnTimer);
    cancelAnimationFrame(rafId);
    crosshair.style.opacity = "0";
    sndGameOver();
    showGameOver();
  }

  /* ---------- Кнопки ---------- */
  overlay.addEventListener("click", function (e) {
    var btn = e.target.closest && e.target.closest("button");
    if (!btn) return;
    if (btn.dataset.action === "menu") showStart();
    else startGame();   // старт и «играть снова»
  });

  document.addEventListener("keydown", function (e) {
    if (!running && (e.key === " " || e.key === "Enter")) { e.preventDefault(); startGame(); }
  });

  window.addEventListener("resize", function () {
    for (var i = 0; i < aliens.length; i++) {
      var a = aliens[i];
      if (a.x + a.size > W()) { a.x = Math.max(4, W() - a.size - 4); a.el.style.left = a.x + "px"; }
    }
    buildStars();
  });

  updateHUD();
  showStart();
})();
</script>
</body>
</html>
