<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Тапай хомяка 🐹</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #game { display: flex; flex-direction: column; height: 100%;
    background: radial-gradient(circle at 50% 30%, #ffe9c2, #ffd08a 55%, #f0b25a 100%); }

  /* ===== HUD ===== */
  #hud {
    display: flex; align-items: center; gap: 16px; padding: 10px 18px;
    font-size: 14px; z-index: 6; flex-wrap: wrap; color: #6b3f1d;
    background: linear-gradient(180deg, rgba(255,245,220,.9), rgba(255,230,180,.6));
    border-bottom: 2px solid #e0ac4c;
  }
  #hud .item { white-space: nowrap; }
  #hud .label { opacity: .65; margin-right: 5px; font-size: 12px; }
  #hud .val { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 18px; }
  #hud .spacer { flex: 1; }
  #taps { color: #d9772b; }
  #combo { color: #e04b8c; font-weight: 800; }

  /* ===== Сцена ===== */
  #stage {
    position: relative; flex: 1; display: flex; align-items: center; justify-content: center;
    overflow: hidden; touch-action: manipulation;
  }

  /* трава/земля */
  #ground {
    position: absolute; left: 0; right: 0; bottom: 0; height: 26%;
    background: linear-gradient(180deg, #8ec96a, #6aab48);
    border-top: 4px solid #7ab84f;
  }
  .tuft { position: absolute; color: #4a8a34; font-size: 22px; opacity: .7; }

  /* Подставка */
  #hamWrap {
    position: relative; width: min(70vmin, 480px); height: min(70vmin, 480px);
    z-index: 3; display: flex; align-items: center; justify-content: center;
    cursor: pointer; touch-action: manipulation;
    transition: transform .07s;
  }
  #hamWrap.squash { transform: scale(0.92, 1.04); }
  #hamster { width: 100%; height: 100%; display: block;
    filter: drop-shadow(0 16px 22px rgba(120,70,30,.35)); }
  #hamster.bounce { animation: bounce .28s ease-out; }
  @keyframes bounce {
    0% { transform: scale(1,1); }
    30% { transform: scale(1.12,.86); }
    60% { transform: scale(.94,1.08); }
    100% { transform: scale(1,1); }
  }

  /* ===== Эффекты ===== */
  .float {
    position: absolute; font-weight: 800; pointer-events: none; z-index: 12;
    color: #d9772b; text-shadow: 0 2px 0 #fff, 0 3px 6px rgba(0,0,0,.15);
    animation: floatUp .8s ease-out forwards; white-space: nowrap;
  }
  @keyframes floatUp {
    from { transform: translate(-50%,-50%) scale(.6); opacity: 1; }
    to   { transform: translate(-50%,-190%) scale(1.15); opacity: 0; }
  }
  .ripple {
    position: absolute; border-radius: 50%; pointer-events: none; z-index: 10;
    border: 3px solid rgba(255,255,255,.85); margin: -20px 0 0 -20px;
    animation: ripple .5s ease-out forwards;
  }
  @keyframes ripple {
    from { width: 40px; height: 40px; opacity: 1; }
    to   { width: 150px; height: 150px; opacity: 0; }
  }
  .sparkle {
    position: absolute; pointer-events: none; z-index: 11; font-size: 22px;
    animation: sparkle .7s ease-out forwards;
  }
  @keyframes sparkle {
    from { transform: translate(-50%,-50%) scale(.4) rotate(0); opacity: 1; }
    to   { transform: translate(-50%,-160%) scale(1.2) rotate(200deg); opacity: 0; }
  }
  /* Сыр/морковка, которые летят вверх */
  .gift {
    position: absolute; pointer-events: none; z-index: 11; font-size: 26px;
    animation: giftFly .9s ease-out forwards;
  }
  @keyframes giftFly {
    0% { transform: translate(-50%,-50%) scale(.5); opacity: 1; }
    100% { transform: translate(-50%,-260%) scale(1); opacity: 0; }
  }

  /* Золотой хомяк */
  #hamster.gold { filter: drop-shadow(0 0 30px rgba(255,210,60,.95)) drop-shadow(0 16px 22px rgba(120,70,30,.35)); }
  .goldAura {
    position: absolute; border-radius: 50%; pointer-events: none; z-index: 2;
    background: radial-gradient(circle, rgba(255,220,90,.55), rgba(255,220,90,0) 70%);
    animation: pulseGlow 1s infinite alternate;
  }
  @keyframes pulseGlow { from { opacity: .5; } to { opacity: 1; } }

  /* Текст-подбадривание */
  #cheer {
    position: absolute; top: 12%; left: 50%; transform: translateX(-50%);
    font-size: 26px; font-weight: 800; color: #d9772b; text-align: center;
    text-shadow: 0 2px 0 #fff; z-index: 13; pointer-events: none;
    opacity: 0; transition: opacity .2s;
  }
  #cheer.on { opacity: 1; animation: cheerPop .5s; }
  @keyframes cheerPop { 0% { transform: translateX(-50%) scale(.6); } 60% { transform: translateX(-50%) scale(1.15); } 100% { transform: translateX(-50%) scale(1); } }

  /* ===== Полоса прогресса до достижения ===== */
  #achWrap {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
    width: min(80%, 420px); z-index: 13; text-align: center; color: #5a3d17;
    font-size: 13px; font-weight: 700; pointer-events: none;
  }
  #achBar { position: relative; height: 16px; border-radius: 10px; margin-top: 6px;
    background: rgba(255,255,255,.6); box-shadow: inset 0 2px 5px rgba(120,70,30,.25);
    overflow: hidden; }
  #achFill { height: 100%; width: 0%; border-radius: 10px;
    background: linear-gradient(90deg,#ffb347,#e07b1a); transition: width .2s; }

  /* ===== Оверлей ===== */
  #overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(70,40,10,.72); backdrop-filter: blur(5px); z-index: 30;
    text-align: center; padding: 20px; overflow: auto;
  }
  #overlay.hidden { display: none; }
  #overlay .card { max-width: 500px; width: 100%; padding: 30px 28px; border-radius: 24px;
    background: linear-gradient(180deg,#fff8ec,#ffe6bd); border: 3px solid #f0c088;
    box-shadow: 0 24px 60px rgba(70,30,0,.5); color: #6b3f1d; }
  #overlay h1 { margin: 0 0 8px; font-size: 34px; color: #d9772b; }
  #overlay p { margin: 10px 0; line-height: 1.6; font-size: 15px; }
  #overlay .big { font-size: 48px; font-weight: 800; color: #e07b1a; margin: 6px 0; }
  #overlay button { margin-top: 18px; padding: 15px 40px; font-size: 18px; font-weight: 800;
    color: #fff; background: linear-gradient(180deg,#ffb347,#f08a1d); border: none;
    border-radius: 16px; cursor: pointer; box-shadow: 0 7px 0 #c26a0d, 0 12px 24px rgba(0,0,0,.2);
    transition: transform .08s; font-family: inherit; }
  #overlay button:active { transform: translateY(4px); box-shadow: 0 3px 0 #c26a0d; }
  #overlay .legend { display: flex; flex-direction: column; gap: 8px; margin-top: 16px;
    font-size: 14px; text-align: left; }
  #overlay .legend div { display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,.5); padding: 8px 12px; border-radius: 12px; }
  #overlay .ach-list { display: flex; flex-direction: column; gap: 6px; margin-top: 12px;
    max-height: 200px; overflow-y: auto; }
  #overlay .ach { display: flex; align-items: center; gap: 10px; font-size: 13px;
    padding: 7px 12px; border-radius: 10px; background: rgba(255,255,255,.5); text-align: left; }
  #overlay .ach.done { background: rgba(255,200,90,.5); font-weight: 800; }
  #overlay .ach .em { font-size: 18px; }
</style>
</head>
<body>
  <div id="game">
    <div id="hud">
      <div class="item"><span class="label">Тапов</span><span class="val" id="taps">0</span></div>
      <div class="item"><span class="label">Время</span><span class="val" id="timeLeft">30</span></div>
      <div class="item" id="combo"></div>
      <div class="spacer"></div>
      <div class="item"><span class="label">Рекорд</span><span class="val" id="best">0</span></div>
    </div>

    <div id="stage">
      <div id="cheer"></div>
      <div id="hamWrap">
        <svg id="hamster" viewBox="0 0 400 400">
          <!-- тело -->
          <ellipse cx="200" cy="270" rx="140" ry="120" fill="#d9a25c"/>
          <!-- живот -->
          <ellipse cx="200" cy="295" rx="88" ry="84" fill="#f7e2c1"/>
          <!-- задние лапки -->
          <ellipse cx="120" cy="360" rx="44" ry="26" fill="#f7e2c1"/>
          <ellipse cx="280" cy="360" rx="44" ry="26" fill="#f7e2c1"/>
          <path d="M100 356 q16 12 34 0 M266 356 q16 12 34 0" stroke="#d9a25c" stroke-width="4" fill="none" stroke-linecap="round"/>
          <!-- ручки -->
          <ellipse class="pawL" cx="118" cy="250" rx="34" ry="26" fill="#f7e2c1"/>
          <ellipse class="pawR" cx="282" cy="250" rx="34" ry="26" fill="#f7e2c1"/>
          <!-- уши -->
          <circle cx="130" cy="120" r="40" fill="#d9a25c"/>
          <circle cx="270" cy="120" r="40" fill="#d9a25c"/>
          <circle cx="130" cy="120" r="22" fill="#e8a9a0"/>
          <circle cx="270" cy="120" r="22" fill="#e8a9a0"/>
          <!-- голова -->
          <ellipse cx="200" cy="180" rx="118" ry="98" fill="#e0aa62"/>
          <!-- щёчки -->
          <ellipse cx="120" cy="215" rx="40" ry="30" fill="#f0c288" opacity=".85"/>
          <ellipse cx="280" cy="215" rx="40" ry="30" fill="#f0c288" opacity=".85"/>
          <!-- глаза -->
          <g class="eyes">
            <circle cx="155" cy="170" r="24" fill="#fff"/>
            <circle cx="245" cy="170" r="24" fill="#fff"/>
            <circle class="pupil" cx="158" cy="172" r="14" fill="#3a2a1a"/>
            <circle class="pupil" cx="248" cy="172" r="14" fill="#3a2a1a"/>
            <circle cx="163" cy="166" r="5" fill="#fff"/>
            <circle cx="253" cy="166" r="5" fill="#fff"/>
          </g>
          <!-- носик -->
          <ellipse cx="200" cy="205" rx="11" ry="8" fill="#e07b7b"/>
          <!-- ротик -->
          <path class="mouth" d="M200 215 q-16 16 -30 2 M200 215 q16 16 30 2" stroke="#8a5a2a" stroke-width="5" fill="none" stroke-linecap="round"/>
          <!-- усы -->
          <path d="M140 205 L80 196 M140 218 L82 224 M260 205 L320 196 M260 218 L318 224"
            stroke="#e8cfa0" stroke-width="4" fill="none" stroke-linecap="round"/>
          <!-- корона (золотой) -->
          <g class="crown" style="display:none">
            <path d="M150 96 L164 62 L184 88 L200 52 L216 88 L236 62 L250 96 Z" fill="#ffcf3f" stroke="#e0a800" stroke-width="4"/>
            <circle cx="150" cy="94" r="7" fill="#e0a800"/>
            <circle cx="250" cy="94" r="7" fill="#e0a800"/>
            <circle cx="200" cy="50" r="7" fill="#e0a800"/>
          </g>
        </svg>
      </div>

      <div id="achWrap">
        <span id="achLabel">Достижение: первые 10 тапов</span>
        <div id="achBar"><span id="achFill"></span></div>
      </div>
    </div>

    <div id="overlay"></div>
  </div>

<script>
(function () {
  "use strict";

  /* ===================== НАСТРОЙКИ ===================== */
  var GOLD_CHANCE   = 0.12;    // шанс золотого хомяка
  var GOLD_MULT     = 10;      // очки за золотого
  var COMBO_WINDOW  = 0.9;     // через сколько секунд без тапа комбо сбрасывается
  var CRIT_CHANCE   = 0.18;    // шанс крита
  var CRIT_MULT     = 5;
  var GAME_TIME     = 30;      // сколько секунд длится раунд
  /* ==================================================== */

  var stage   = document.getElementById("stage");
  var hamWrap = document.getElementById("hamWrap");
  var hamster = document.getElementById("hamster");
  var overlay = document.getElementById("overlay");
  var tapsEl  = document.getElementById("taps");
  var tpsEl   = document.getElementById("timeLeft");
  var comboEl = document.getElementById("combo");
  var bestEl  = document.getElementById("best");
  var cheerEl = document.getElementById("cheer");
  var achLabel = document.getElementById("achLabel");
  var achFill = document.getElementById("achFill");

  var taps = 0, combo = 0, maxCombo = 0, score = 0;
  var gold = false, goldUntil = 0;
  var lastTapT = 0;
  var tapTimes = [];
  var tps = 0;
  var timeLeft = GAME_TIME;
  var playing = false;
  var timeNow = 0, lastTs = 0, rafId = null;

  var ACHIEVEMENTS = [
    { id: "first10",  em: "🐾", name: "Первые шаги",      need: 10,      done: false },
    { id: "t100",     em: "🐹", name: "Сотка тапов",       need: 100,     done: false },
    { id: "t500",     em: "💪", name: "Марафонец",         need: 500,     done: false },
    { id: "t1000",    em: "🔥", name: "Тысяча!",           need: 1000,    done: false },
    { id: "combo20",  em: "⚡", name: "Комбо ×20",         need: 20,      done: false, combo: true },
    { id: "combo50",  em: "🌟", name: "Комбо ×50",         need: 50,      done: false, combo: true },
    { id: "t5000",    em: "👑", name: "Повелитель хомяков", need: 5000,   done: false },
    { id: "t10000",   em: "🏆", name: "Легенда тапов",     need: 10000,   done: false }
  ];
  var currentAch = 0;

  function loadBest() {
    try { return parseInt(localStorage.getItem("tapham_best") || "0", 10) || 0; }
    catch (e) { return 0; }
  }
  var best = loadBest();
  bestEl.textContent = best;

  /* ---------------------- Звук ---------------------- */
  var audioCtx = null;
  function getAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, to, dur, type, vol, delay) {
    var ac = getAudio(); if (!ac) return;
    var t = ac.currentTime + (delay || 0);
    var o = ac.createOscillator(); o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(Math.max(1, to), t + dur);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.04);
  }
  function sndSqueak() {
    var base = 700 + Math.random() * 300;
    tone(base, base * 1.6, 0.08, "sine", 0.13);
    tone(base * 1.4, base * 0.9, 0.1, "sine", 0.1, 0.05);
  }
  function sndGold() {
    [900, 1200, 1500, 1900].forEach(function (f, i) { tone(f, f * 1.3, 0.1, "triangle", 0.14, i * 0.06); });
  }
  function sndCrit() { tone(1200, 2000, 0.1, "square", 0.12); tone(1600, 2400, 0.1, "square", 0.1, 0.06); }
  function sndAch() { [600, 800, 1100, 1400].forEach(function (f, i) { tone(f, f * 1.2, 0.14, "triangle", 0.15, i * 0.1); }); }
  function sndCombo() { tone(500, 900, 0.08, "square", 0.09); }

  /* ---------------------- Утилиты ---------------------- */
  function rand(a, b) { return Math.random() * (b - a) + a; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  /* ---------------------- Эффекты ---------------------- */
  function floatText(x, y, text, color, size) {
    var el = document.createElement("div");
    el.className = "float";
    el.textContent = text;
    el.style.left = x + "px"; el.style.top = y + "px";
    el.style.fontSize = (size || 22) + "px";
    if (color) el.style.color = color;
    stage.appendChild(el);
    setTimeout(function () { el.remove(); }, 800);
  }
  function ripple(x, y) {
    var el = document.createElement("div");
    el.className = "ripple";
    el.style.left = x + "px"; el.style.top = y + "px";
    stage.appendChild(el);
    setTimeout(function () { el.remove(); }, 500);
  }
  function sparkle(x, y, emoji) {
    var s = document.createElement("div");
    s.className = "sparkle";
    s.textContent = emoji || "✨";
    s.style.left = x + "px"; s.style.top = y + "px";
    stage.appendChild(s);
    setTimeout(function () { s.remove(); }, 700);
  }
  function giftFly(x, y, emoji) {
    var g = document.createElement("div");
    g.className = "gift";
    g.textContent = emoji;
    g.style.left = x + "px"; g.style.top = y + "px";
    stage.appendChild(g);
    setTimeout(function () { g.remove(); }, 900);
  }
  var cheerT = 0;
  function cheer(text) {
    cheerEl.textContent = text;
    cheerEl.classList.remove("on"); void cheerEl.offsetWidth; cheerEl.classList.add("on");
    cheerT = 1.3;
  }

  /* ---------------------- Тап ---------------------- */
  function tapAt(clientX, clientY) {
    if (!playing) return;
    var r = stage.getBoundingClientRect();
    var x = clientX - r.left, y = clientY - r.top;

    getAudio();
    var now = performance.now();
    // комбо
    if (now - lastTapT < COMBO_WINDOW * 1000) combo++;
    else combo = 1;
    lastTapT = now;
    maxCombo = Math.max(maxCombo, combo);

    // счёт
    var gain = 1;
    var crit = Math.random() < CRIT_CHANCE;
    var isGold = gold;
    if (isGold) gain = GOLD_MULT;
    if (crit) gain *= CRIT_MULT;

    taps += 1;
    score += gain;

    // эффекты
    ripple(x, y);
    hamster.classList.remove("bounce"); void hamster.offsetWidth; hamster.classList.add("bounce");
    hamWrap.classList.add("squash");
    setTimeout(function () { hamWrap.classList.remove("squash"); }, 80);

    if (isGold) {
      sndGold();
      floatText(x, y, "+" + gain + " 👑", "#d99a00", 30);
      sparkle(x, y - 20, "🌟");
      for (var i = 0; i < 5; i++) sparkle(x + rand(-50, 50), y + rand(-40, 40), "💛");
    } else if (crit) {
      sndCrit();
      floatText(x, y, "+" + gain + " КРИТ!", "#e04b8c", 28);
      sparkle(x, y - 20, "✨");
    } else {
      sndSqueak();
      floatText(x, y, "+" + gain, "#d9772b", 22);
      if (Math.random() < 0.3) sparkle(x + rand(-40, 40), y - 10);
      // случайные вкусняшки
      if (Math.random() < 0.12) giftFly(x, y, ["🥕","🌻","🧀","🍎"][Math.floor(Math.random()*4)]);
    }

    // комбо-эффект
    if (combo > 0 && combo % 10 === 0) {
      sndCombo();
      cheer("КОМБО ×" + combo + "! 🎉");
    }

    // скорость тапов
    tapTimes.push(now);
    updateHUD();
    checkAchievements();
  }

  function updateHUD() {
    tapsEl.textContent = taps;
    tpsEl.textContent = Math.max(0, Math.ceil(timeLeft));
    comboEl.textContent = combo >= 3 ? "🔥 ×" + combo : "";
    if (score > best) { /* рекорд обновляем в конце */ }
  }

  /* ---------------------- Достижения ---------------------- */
  function checkAchievements() {
    for (var i = 0; i < ACHIEVEMENTS.length; i++) {
      var a = ACHIEVEMENTS[i];
      if (a.done) continue;
      var val = a.combo ? maxCombo : taps;
      if (val >= a.need) {
        a.done = true;
        sndAch();
        cheer("🏆 " + a.em + " " + a.name + "!");
        sparkle(stage.clientWidth / 2, stage.clientHeight * 0.3, a.em);
      }
    }
    updateAchBar();
  }
  function nextUndone() {
    for (var i = 0; i < ACHIEVEMENTS.length; i++) if (!ACHIEVEMENTS[i].done) return ACHIEVEMENTS[i];
    return null;
  }
  function updateAchBar() {
    var a = nextUndone();
    if (!a) {
      achLabel.textContent = "🏆 ВСЕ ДОСТИЖЕНИЯ ОТКРЫТЫ!";
      achFill.style.width = "100%";
      return;
    }
    var val = a.combo ? maxCombo : taps;
    var pct = clamp((val / a.need) * 100, 0, 100);
    achLabel.textContent = a.em + " " + a.name + " — " + val + " / " + a.need;
    achFill.style.width = pct + "%";
  }

  /* ---------------------- Золотой хомяк ---------------------- */
  function setGold(on) {
    gold = on;
    var crown = hamster.querySelector(".crown");
    if (crown) crown.style.display = on ? "" : "none";
    hamster.classList.toggle("gold", on);
  }
  function scheduleGold() {
    goldUntil = timeNow + rand(3, 6);
  }

  /* ---------------------- Цикл ---------------------- */
  function frame(ts) {
    var dt = lastTs ? Math.min((ts - lastTs) / 1000, 0.05) : 0.016;
    lastTs = ts;
    timeNow += dt;

    // тапы в секунду (за последнюю секунду)
    var now = performance.now();
    while (tapTimes.length && now - tapTimes[0] > 1000) tapTimes.shift();
    tps = tapTimes.length;

    // сброс комбо
    if (playing && combo > 0 && now - lastTapT > COMBO_WINDOW * 1000) {
      combo = 0;
      comboEl.textContent = "";
    }

    // таймер раунда
    if (playing) {
      timeLeft -= dt;
      tpsEl.textContent = Math.max(0, Math.ceil(timeLeft));
      if (timeLeft <= 0) { timeLeft = 0; endRound(); }
    }

    // золотой хомяк
    if (playing) {
      if (!gold && timeNow > goldUntil) setGold(true);
      if (gold && timeNow > goldUntil + 3.5) { setGold(false); scheduleGold(); }
    }

    if (cheerT > 0) { cheerT -= dt; if (cheerT <= 0) cheerEl.classList.remove("on"); }

    updateAchBar();
    rafId = requestAnimationFrame(frame);
  }

  function endRound() {
    playing = false;
    setGold(false);
    showRecords();
  }

  /* ---------------------- Старт / экраны ---------------------- */
  function showStart() {
    overlay.classList.remove("hidden");
    overlay.innerHTML =
      '<div class="card">' +
        '<h1>🐹 Тапай хомяка</h1>' +
        '<p>Тапай по хомяку — он пищит, подпрыгивает и даёт очки!</p>' +
        '<div class="legend">' +
          '<div><span style="font-size:22px">👑</span> Золотой хомяк даёт ×10 очков!</div>' +
          '<div><span style="font-size:22px">✨</span> Бывает крит — ×5 очков</div>' +
          '<div><span style="font-size:22px">🔥</span> Комбо — тапай подряд без пауз</div>' +
        '</div>' +
        '<p style="margin-top:14px;font-size:13px;opacity:.8">У тебя <b>' + GAME_TIME + ' секунд</b>! Тапай мышкой или пальцем. На компьютере можно и <b>Пробелом</b>.</p>' +
        '<button id="startBtn">ТАПАТЬ! 🐹</button>' +
      '</div>';
  }

  function showRecords() {
    overlay.classList.remove("hidden");
    var isRecord = score > best;
    if (isRecord) { best = score; try { localStorage.setItem("tapham_best", String(best)); } catch (e) {} }
    bestEl.textContent = best;
    var achHtml = '<div class="ach-list">';
    for (var i = 0; i < ACHIEVEMENTS.length; i++) {
      var a = ACHIEVEMENTS[i];
      achHtml += '<div class="ach' + (a.done ? " done" : "") + '">' +
        '<span class="em">' + (a.done ? "🏆" : a.em) + '</span>' +
        '<span>' + a.name + (a.combo ? " (комбо)" : "") + ' — ' + a.need + '</span>' +
        '</div>';
    }
    achHtml += '</div>';
    overlay.innerHTML =
      '<div class="card">' +
        '<h1>' + (isRecord ? "🏆 Новый рекорд!" : "🐹 Молодец!") + '</h1>' +
        '<div class="big">' + score + '</div>' +
        '<p>очков набрано за ' + GAME_TIME + ' сек</p>' +
        '<div style="display:flex;gap:26px;justify-content:center;margin-top:8px">' +
          '<div><b style="font-size:24px">' + taps + '</b><br><small>тапов всего</small></div>' +
          '<div><b style="font-size:24px">' + maxCombo + '</b><br><small>макс. комбо</small></div>' +
          '<div><b style="font-size:24px">' + best + '</b><br><small>рекорд</small></div>' +
        '</div>' +
        '<h2 style="font-size:16px;margin:18px 0 4px;color:#d9772b">🏆 Достижения</h2>' +
        achHtml +
        '<button id="startBtn">Ещё раз! 🐹</button>' +
      '</div>';
  }

  function resetGame() {
    taps = 0; combo = 0; maxCombo = 0; score = 0;
    tapTimes = []; lastTapT = 0; timeNow = 0; timeLeft = GAME_TIME;
    for (var i = 0; i < ACHIEVEMENTS.length; i++) ACHIEVEMENTS[i].done = false;
    setGold(false);
    scheduleGold();
    updateHUD();
    updateAchBar();
  }

  function startGame() {
    getAudio();
    resetGame();
    overlay.classList.add("hidden");
    playing = true;
    lastTs = 0;
    if (!rafId) rafId = requestAnimationFrame(frame);
    cheer("Тапай! 🐹");
  }

  /* ---------------------- Ввод ---------------------- */
  hamWrap.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    tapAt(e.clientX, e.clientY);
  });
  // тапы мимо хомяка — считаем как промах (без очков, сбрасывают комбо)
  stage.addEventListener("pointerdown", function (e) {
    if (!playing) return;
    if (e.target.closest && e.target.closest("#hamWrap")) return;
    if (e.target.closest && e.target.closest("#overlay")) return;
    if (combo > 0) { combo = 0; comboEl.textContent = ""; floatText(e.clientX - stage.getBoundingClientRect().left, e.clientY - stage.getBoundingClientRect().top, "мимо 😿", "#b03a2e", 18); }
  });

  document.addEventListener("keydown", function (e) {
    if (!playing && (e.key === " " || e.key === "Enter")) { e.preventDefault(); startGame(); }
    if (playing && e.key === " ") {
      e.preventDefault();
      // тап по центру хомяка с клавиатуры
      var r = hamWrap.getBoundingClientRect();
      tapAt(r.left + r.width / 2, r.top + r.height / 2);
    }
  });

  overlay.addEventListener("click", function (e) {
    var btn = e.target.closest && e.target.closest("button");
    if (btn) startGame();
  });

  // Декоративная трава
  (function buildTufts() {
    var ground = document.createElement("div");
    ground.id = "ground";
    ground.style.position = "absolute";
    ground.style.left = "0"; ground.style.right = "0"; ground.style.bottom = "0";
    ground.style.height = "26%";
    ground.style.background = "linear-gradient(180deg,#8ec96a,#6aab48)";
    ground.style.borderTop = "4px solid #7ab84f";
    ground.style.zIndex = "1";
    stage.appendChild(ground);
    for (var i = 0; i < 14; i++) {
      var t = document.createElement("div");
      t.className = "tuft";
      t.textContent = "🌿";
      t.style.left = (Math.random() * 96) + "%";
      t.style.bottom = (2 + Math.random() * 20) + "%";
      t.style.fontSize = (16 + Math.random() * 16) + "px";
      ground.appendChild(t);
    }
  })();

  showStart();
  if (!rafId) rafId = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
