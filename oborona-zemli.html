<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ОБОРОНА ЗЕМЛИ — от первого лица</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #05060a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #eaf0ff; -webkit-user-select: none; user-select: none;
  }
  #game { display: flex; flex-direction: column; height: 100%; }

  /* ===== HUD ===== */
  #hud {
    display: flex; align-items: center; gap: 16px; padding: 8px 16px;
    font-size: 13px; z-index: 5; background: rgba(6,8,14,.92);
    border-bottom: 1px solid rgba(255,180,60,.14);
    text-transform: uppercase; letter-spacing: .06em; flex-wrap: wrap;
  }
  #hud .item { white-space: nowrap; }
  #hud .label { opacity: .45; margin-right: 5px; font-size: 11px; }
  #hud .val { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 15px; }
  #hud .spacer { flex: 1; }
  #wave { color: #ffcf6b; font-weight: 800; font-size: 15px; }
  #combo { color: #ffd84d; font-weight: 800; }
  #shield { display: flex; gap: 3px; }
  #shield .hp { width: 16px; height: 12px; border-radius: 2px;
    background: linear-gradient(180deg,#8fe0ff,#2e9be0);
    box-shadow: 0 0 7px rgba(127,212,255,.8); transition: all .2s; }
  #shield .hp.empty { background: rgba(255,255,255,.1); box-shadow: none; }

  /* ===== Мир ===== */
  #arena { position: relative; flex: 1; overflow: hidden; cursor: none; touch-action: none; background: #05060a; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* Тревога */
  #danger { position: absolute; inset: 0; pointer-events: none; z-index: 4; opacity: 0;
    box-shadow: inset 0 0 140px rgba(255,30,30,.8); transition: opacity .2s; }
  #danger.on { opacity: 1; animation: dpulse .5s infinite alternate; }
  @keyframes dpulse { from { opacity: .3; } to { opacity: 1; } }

  /* Урон */
  #dmg { position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(circle, transparent 20%, rgba(200,10,10,.75));
    opacity: 0; }
  #dmg.on { animation: dmgFlash .6s; }
  @keyframes dmgFlash { 0% { opacity: 1; } 100% { opacity: 0; } }

  /* Постоянная кровавая вуаль при низком щите */
  #lowhp { position: absolute; inset: 0; pointer-events: none; z-index: 3; opacity: 0;
    background: radial-gradient(circle, transparent 35%, rgba(160,0,0,.55));
    transition: opacity .5s; }
  #lowhp.on { opacity: 1; animation: breathe 1.6s infinite alternate; }
  @keyframes breathe { from { opacity: .5; } to { opacity: 1; } }

  /* ===== Прицел ===== */
  #crosshair { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px;
    pointer-events: none; opacity: 0; transition: opacity .15s; z-index: 25; }
  #crosshair .h, #crosshair .v { position: absolute; background: rgba(230,255,240,.92);
    box-shadow: 0 0 6px rgba(0,0,0,.9); }
  #crosshair .h { left: 0; top: 50%; width: 100%; height: 1.5px; margin-top: -.75px; }
  #crosshair .v { top: 0; left: 50%; height: 100%; width: 1.5px; margin-left: -.75px; }
  #crosshair .gap { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px;
    margin: -5px 0 0 -5px; border-radius: 50%; background: transparent;
    box-shadow: 0 0 0 1.5px rgba(230,255,240,.6) inset; }
  #crosshair.hot .h, #crosshair.hot .v { background: #ff4d6d; }
  #crosshair.hot .gap { box-shadow: 0 0 0 1.5px #ff4d6d inset; }

  /* Метка попадания */
  #hitmark { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px;
    pointer-events: none; z-index: 24; opacity: 0; }
  #hitmark.on { animation: hm .25s; }
  @keyframes hm { 0% { opacity: 1; transform: scale(.5); } 100% { opacity: 0; transform: scale(1.4); } }
  #hitmark i { position: absolute; left: 50%; top: 0; width: 2px; height: 100%;
    margin-left: -1px; background: #fff; }
  #hitmark i:nth-child(2) { transform: rotate(90deg); }

  /* ===== Оверлей ===== */
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(3,4,8,.9); backdrop-filter: blur(6px); z-index: 30; text-align: center; padding: 20px; overflow: auto; }
  #overlay.hidden { display: none; }
  #overlay .card { max-width: 560px; width: 100%; padding: 30px 28px; border-radius: 16px;
    background: rgba(22,20,16,.7); border: 1px solid rgba(255,180,60,.22);
    box-shadow: 0 20px 70px rgba(0,0,0,.8), 0 0 80px rgba(255,140,40,.08) inset; }
  #overlay h1 { margin: 0 0 6px; font-size: 34px; letter-spacing: .08em;
    background: linear-gradient(90deg,#ffcf6b,#ff8a4d,#ff5a3c);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  #overlay h2 { margin: 20px 0 8px; font-size: 16px; opacity: .9; text-transform: uppercase; letter-spacing: .08em; }
  #overlay p { margin: 8px 0; line-height: 1.6; opacity: .85; font-size: 14px; }
  #overlay .big { font-size: 48px; font-weight: 800; color: #ffcf6b; margin: 4px 0; }
  #overlay button { margin: 6px; padding: 14px 34px; font-size: 16px; font-weight: 800;
    color: #1a0f04; background: linear-gradient(180deg,#ffd98a,#ff9b3d); border: none; border-radius: 10px;
    cursor: pointer; letter-spacing: .06em; box-shadow: 0 8px 24px rgba(255,150,60,.35);
    transition: transform .1s, box-shadow .15s; }
  #overlay button:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(255,150,60,.5); }
  #overlay button:active { transform: translateY(1px) scale(.98); }
  #overlay button.ghost { background: rgba(255,255,255,.08); color: #eaf0ff; box-shadow: none;
    border: 1px solid rgba(255,255,255,.18); }
  #overlay .row { display: flex; justify-content: center; gap: 24px; margin-top: 14px; flex-wrap: wrap; }
  #overlay .row .col { opacity: .9; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  #overlay .row .col b { display: block; font-size: 24px; margin-top: 4px; color: #fff; letter-spacing: 0; }
  .board { margin: 10px auto 0; max-width: 400px; }
  .board .line { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-radius: 8px;
    font-size: 13px; margin-bottom: 5px; background: rgba(255,255,255,.05); }
  .board .line.me { background: rgba(255,180,60,.18); border: 1px solid rgba(255,180,60,.4); }
  .board .rank { width: 22px; text-align: center; opacity: .8; font-weight: 800; }
  .board .m { flex: 1; text-align: left; opacity: .7; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .board .s { font-weight: 800; color: #ffcf6b; }
  .legend { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 14px; font-size: 11px;
    opacity: .9; text-transform: uppercase; letter-spacing: .04em; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend b { font-size: 15px; }
</style>
</head>
<body>
  <div id="game">
    <div id="hud">
      <div class="item"><span class="label">Счёт</span><span class="val" id="score">0</span></div>
      <div class="item"><span class="label">Волна</span><span id="wave">1</span></div>
      <div class="item"><span class="label">Броня</span><span id="shield"></span></div>
      <div class="item" id="combo"></div>
      <div class="spacer"></div>
      <div class="item"><span class="label">Рекорд</span><span class="val" id="best">0</span></div>
    </div>

    <div id="arena">
      <canvas id="view"></canvas>
      <div id="lowhp"></div>
      <div id="danger"></div>
      <div id="dmg"></div>
      <div id="crosshair">
        <span class="h"></span><span class="v"></span><span class="gap"></span>
      </div>
      <div id="hitmark"><i></i><i></i></div>
      <div id="overlay"></div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  /* ======================= НАСТРОЙКИ ======================= */
  var START_HP    = 5;      // единиц брони
  var FAR         = 1500;   // дистанция появления врагов
  var NEAR        = 110;    // с какой дистанции они атакуют вас
  var BASE_SPEED  = 130;    // скорость полёта к вам (единиц/сек)
  var SPEED_WAVE  = 22;     // ускорение за волну
  var BASE_SPAWN  = 1150;   // пауза между врагами (мс)
  var MIN_SPAWN   = 400;
  var GROUND_Y    = -280;   // высота земли относительно глаз
  var LOOK_YAW    = 0.62;   // амплитуда поворота головы (радианы)
  var LOOK_PITCH  = 0.26;
  /* ========================================================= */

  var arena     = document.getElementById("arena");
  var canvas    = document.getElementById("view");
  var ctx       = canvas.getContext("2d");
  var overlay   = document.getElementById("overlay");
  var dangerEl  = document.getElementById("danger");
  var dmgEl     = document.getElementById("dmg");
  var lowHpEl   = document.getElementById("lowhp");
  var crosshair = document.getElementById("crosshair");
  var hitmark   = document.getElementById("hitmark");
  var scoreEl   = document.getElementById("score");
  var waveEl    = document.getElementById("wave");
  var shieldEl  = document.getElementById("shield");
  var comboEl   = document.getElementById("combo");
  var bestEl    = document.getElementById("best");

  var W = 0, H = 0, DPR = 1, FOCAL = 800;

  function resize() {
    var r = arena.getBoundingClientRect();
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    FOCAL = Math.max(520, W * 1.02);
  }

  /* ---------------------- Состояние ---------------------- */
  var running = false;
  var score = 0, hp = START_HP, wave = 1, combo = 0, maxCombo = 0;
  var killed = 0, escaped = 0, shots = 0, hits = 0;
  var waveKills = 0, waveKillsNeeded = 8;
  var aliens = [], stars = [], groundDots = [], craters = [], fx = [], tracers = [], floats = [];
  var spawnTimer = null, rafId = null, lastTs = 0;
  var mouseX = 0, mouseY = 0, hasMouse = false;
  var yaw = 0, pitch = 0;                  // текущий поворот головы
  var bobT = 0;                            // дыхание/покачивание
  var recoil = 0;                          // отдача оружия
  var shakeUntil = 0, shakeMag = 0;
  var muzzleT = 0;                         // вспышка выстрела
  var timeNow = 0;

  function loadBoard() {
    try { return JSON.parse(localStorage.getItem("earth_def_board") || "[]"); }
    catch (e) { return []; }
  }
  function saveBoard(b) { try { localStorage.setItem("earth_def_board", JSON.stringify(b)); } catch (e) {} }
  var best = loadBoard().length ? loadBoard()[0].score : 0;
  bestEl.textContent = best;

  /* ---------------------- Звук ---------------------- */
  var audioCtx = null, ambient = null;
  function getAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, to, dur, type, vol, delay) {
    var ac = getAudio(); if (!ac) return;
    var t = ac.currentTime + (delay || 0);
    var o = ac.createOscillator(); o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, cutoff, vol, delay) {
    var ac = getAudio(); if (!ac) return;
    var t = ac.currentTime + (delay || 0);
    var buf = ac.createBuffer(1, Math.max(1, ac.sampleRate * dur), ac.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.2);
    var src = ac.createBufferSource(); src.buffer = buf;
    var flt = ac.createBiquadFilter(); flt.type = "lowpass"; flt.frequency.value = cutoff || 1200;
    var g = ac.createGain(); g.gain.value = vol || 0.2;
    src.connect(flt); flt.connect(g); g.connect(ac.destination); src.start(t);
  }
  function sndShot()   { noise(0.09, 2600, 0.22); tone(260, 90, 0.09, "square", 0.06); }
  function sndKill()   { tone(520, 1200, 0.13, "triangle", 0.2); noise(0.1, 900, 0.12); }
  function sndTankHit(){ tone(240, 150, 0.12, "sawtooth", 0.16); noise(0.06, 500, 0.1); }
  function sndUfo()    { tone(880, 1650, 0.12, "square", 0.15); tone(1300, 2100, 0.12, "square", 0.11, 0.09); }
  function sndDamage() { noise(0.5, 400, 0.4); tone(170, 45, 0.5, "sawtooth", 0.3); }
  function sndWave()   { tone(520, 1050, 0.18, "triangle", 0.2); tone(780, 1400, 0.2, "triangle", 0.16, 0.16); }
  function sndOver()   { tone(380, 60, 1.0, "sawtooth", 0.32); noise(1.0, 300, 0.3); }
  function sndEmpty()  { tone(140, 100, 0.06, "square", 0.12); }

  function startAmbient() {
    var ac = getAudio(); if (!ac || ambient) return;
    var o1 = ac.createOscillator(); o1.type = "sine"; o1.frequency.value = 55;
    var o2 = ac.createOscillator(); o2.type = "sine"; o2.frequency.value = 82.4; o2.detune.value = 6;
    var g = ac.createGain(); g.gain.value = 0.0;
    g.gain.linearRampToValueAtTime(0.035, ac.currentTime + 2.5);
    // медленная пульсация
    var lfo = ac.createOscillator(); lfo.frequency.value = 0.12;
    var lg = ac.createGain(); lg.gain.value = 0.02;
    lfo.connect(lg); lg.connect(g.gain);
    o1.connect(g); o2.connect(g); g.connect(ac.destination);
    o1.start(); o2.start(); lfo.start();
    ambient = { o1: o1, o2: o2, lfo: lfo, g: g };
  }
  function stopAmbient() {
    if (!ambient) return;
    try {
      var ac = getAudio();
      ambient.g.gain.cancelScheduledValues(ac.currentTime);
      ambient.g.gain.setValueAtTime(ambient.g.gain.value, ac.currentTime);
      ambient.g.gain.linearRampToValueAtTime(0, ac.currentTime + 0.6);
      ambient.o1.stop(ac.currentTime + 0.7);
      ambient.o2.stop(ac.currentTime + 0.7);
      ambient.lfo.stop(ac.currentTime + 0.7);
    } catch (e) {}
    ambient = null;
  }

  /* ---------------------- Утилиты ---------------------- */
  function rand(a, b) { return Math.random() * (b - a) + a; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function accuracy() { return shots === 0 ? 0 : Math.round(hits / shots * 100); }

  /* ============ 3D-проекция ============ */
  // Камера в (0,0,0), смотрит в +Z. yaw — поворот влево/вправо, pitch — вверх/вниз.
  function project(x, y, z) {
    var cy = Math.cos(yaw), sy = Math.sin(yaw);
    var x1 = x * cy - z * sy;
    var z1 = x * sy + z * cy;
    var cp = Math.cos(pitch), sp = Math.sin(pitch);
    var y1 = y * cp - z1 * sp;
    var z2 = y * sp + z1 * cp;
    if (z2 < 2) z2 = 2;
    var s = FOCAL / z2;
    var bobY = Math.sin(bobT) * 1.2;
    return { sx: W / 2 + x1 * s, sy: H * 0.5 - y1 * s + bobY, s: s, z: z2, x1: x1 };
  }
  function horizonY() { return H * 0.5 + FOCAL * Math.tan(-pitch); }

  /* ---------------------- Мир: звёзды, земля ---------------------- */
  function buildStars() {
    stars = [];
    for (var i = 0; i < 170; i++) {
      stars.push({ x: rand(-4000, 4000), y: rand(-1200, 2200), z: rand(300, 9000), b: rand(0.25, 1), tw: rand(0, 6.28) });
    }
  }
  function buildGround() {
    groundDots = [];
    for (var i = 0; i < 130; i++) {
      groundDots.push({
        x: rand(-2600, 2600), z: rand(NEAR, FAR * 1.4),
        r: rand(3, 12), tone: rand(0, 1)
      });
    }
    craters = [];
    for (var j = 0; j < 16; j++) {
      craters.push({ x: rand(-2200, 2200), z: rand(300, FAR * 1.3), r: rand(50, 170) });
    }
  }

  /* ---------------------- Пришельцы ---------------------- */
  function spawnAlien() {
    if (!running) return;

    var r = Math.random();
    var kind = "normal";
    var scoutChance = 0.13 + wave * 0.03;
    var tankChance  = 0.09 + wave * 0.03;
    var ufoChance   = 0.05 + wave * 0.012;
    if (r < scoutChance) kind = "scout";
    else if (r < scoutChance + tankChance) kind = "tank";
    else if (r < scoutChance + tankChance + ufoChance) kind = "ufo";

    var world = kind === "tank" ? rand(95, 125) : (kind === "scout" ? rand(55, 72) : rand(72, 98));
    var speed = (BASE_SPEED + (wave - 1) * SPEED_WAVE) *
                (kind === "scout" ? 1.75 : (kind === "tank" ? 0.68 : 1)) * rand(0.85, 1.2);

    var half = FAR * W / (2 * FOCAL);
    var a = {
      kind: kind,
      x: rand(-half * 0.8, half * 0.8),
      y: rand(-140, 340),
      z: FAR * rand(0.92, 1.1),
      world: world, speed: speed,
      hp: kind === "tank" ? 3 : 1,
      maxHp: kind === "tank" ? 3 : 1,
      pts: (kind === "ufo" ? 150 : kind === "scout" ? 100 : kind === "tank" ? 60 : 30) + (wave - 1) * 5,
      swayPhase: rand(0, 6.28), swaySpeed: rand(0.5, 1.5), swayAmp: rand(25, 80),
      dead: false, hitFlash: 0, dying: 0, birth: 0.35
    };
    aliens.push(a);

    var delay = Math.max(MIN_SPAWN, BASE_SPAWN - (wave - 1) * 78) * rand(0.7, 1.35);
    spawnTimer = setTimeout(spawnAlien, delay);
  }

  /* ---------------------- Рисование мира ---------------------- */
  function drawSky() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#03040c");
    g.addColorStop(0.35, "#071026");
    g.addColorStop(0.62, "#12203f");
    g.addColorStop(1, "#2a2a4a");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // далёкая туманность (параллакс по yaw)
    var nx = W / 2 - yaw * 260;
    var neb = ctx.createRadialGradient(nx, H * 0.28, 10, nx, H * 0.28, W * 0.6);
    neb.addColorStop(0, "rgba(90,60,160,.28)");
    neb.addColorStop(0.5, "rgba(40,80,150,.14)");
    neb.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = neb; ctx.fillRect(0, 0, W, H);

    var nx2 = W * 0.85 - yaw * 160;
    var neb2 = ctx.createRadialGradient(nx2, H * 0.15, 5, nx2, H * 0.15, W * 0.4);
    neb2.addColorStop(0, "rgba(180,90,60,.18)");
    neb2.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = neb2; ctx.fillRect(0, 0, W, H);
  }

  function drawStars() {
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      var p = project(st.x, st.y, st.z);
      if (p.sx < -30 || p.sx > W + 30 || p.sy < -30 || p.sy > horizonY() + 20) continue;
      var tw = 0.7 + 0.3 * Math.sin(timeNow * 2 + st.tw);
      var sz = clamp(p.s * 1.6 * st.b, 0.5, 3.2);
      ctx.globalAlpha = clamp(1 - st.z / 9000, 0.1, 0.95) * st.b * tw;
      ctx.fillStyle = st.b > 0.75 ? "#dbe9ff" : "#9fb4d8";
      ctx.fillRect(p.sx, p.sy, sz, sz);
    }
    ctx.globalAlpha = 1;
  }

  function drawGround() {
    var hy = horizonY();
    // Основная поверхность планеты
    var g = ctx.createLinearGradient(0, hy, 0, H);
    g.addColorStop(0, "#4a3a30");
    g.addColorStop(0.25, "#3a2b22");
    g.addColorStop(0.7, "#241812");
    g.addColorStop(1, "#160d09");
    ctx.fillStyle = g;
    ctx.fillRect(0, Math.max(0, hy), W, H - Math.max(0, hy));

    // Атмосферная дымка у горизонта
    var haze = ctx.createLinearGradient(0, hy - 10, 0, hy + 150);
    haze.addColorStop(0, "rgba(120,110,160,.55)");
    haze.addColorStop(1, "rgba(120,110,160,0)");
    ctx.fillStyle = haze;
    ctx.fillRect(0, Math.max(0, hy - 10), W, 170);

    // Дальние скалы на горизонте (силуэты, параллакс по yaw)
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, Math.max(0, hy - 240), W, 300);
    ctx.clip();
    for (var m = 0; m < 9; m++) {
      var mx = ((m * 720 + 200) - yaw * 900) % (W + 900);
      if (mx < -300) mx += W + 900;
      var mh = 40 + ((m * 53) % 90);
      ctx.fillStyle = "rgba(30,26,40,.7)";
      ctx.beginPath();
      ctx.moveTo(mx - 160, hy + 6);
      ctx.lineTo(mx - 40, hy - mh);
      ctx.lineTo(mx + 60, hy - mh * 0.7);
      ctx.lineTo(mx + 170, hy + 6);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();

    // Кратеры
    for (var c = 0; c < craters.length; c++) {
      var cr = craters[c];
      var p = project(cr.x, GROUND_Y, cr.z);
      if (p.sx < -300 || p.sx > W + 300) continue;
      var rx = cr.r * p.s;
      var ry = rx * 0.32;
      if (rx < 1) continue;
      ctx.globalAlpha = clamp(1 - cr.z / (FAR * 1.3), 0.06, 0.5);
      var cg = ctx.createRadialGradient(p.sx, p.sy, 0, p.sx, p.sy, rx);
      cg.addColorStop(0, "rgba(0,0,0,.55)");
      cg.addColorStop(0.75, "rgba(0,0,0,.18)");
      cg.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = cg;
      ctx.beginPath(); ctx.ellipse(p.sx, p.sy, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Мелкие камни/текстура
    for (var d = 0; d < groundDots.length; d++) {
      var gd = groundDots[d];
      var pp = project(gd.x, GROUND_Y, gd.z);
      if (pp.sx < -40 || pp.sx > W + 40) continue;
      var rr = gd.r * pp.s;
      if (rr < 0.6) continue;
      ctx.globalAlpha = clamp(1 - gd.z / (FAR * 1.4), 0.05, 0.65);
      ctx.fillStyle = gd.tone > 0.6 ? "rgba(120,90,70,.9)" : "rgba(50,34,26,.9)";
      ctx.beginPath(); ctx.ellipse(pp.sx, pp.sy, rr, rr * 0.4, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Перспективная сетка (навигационные линии обороны)
    var lineY = GROUND_Y + 3;
    for (var z = Math.ceil(NEAR / 150) * 150; z < FAR * 1.2; z += 150) {
      var halfW = z * W / (2 * FOCAL) * 1.7;
      var a1 = project(-halfW, lineY, z), b1 = project(halfW, lineY, z);
      ctx.globalAlpha = clamp(1 - z / (FAR * 1.2), 0.03, 0.3) * 0.8;
      ctx.strokeStyle = "rgba(120,200,255,.7)";
      ctx.lineWidth = clamp(b1.s * 4, 0.5, 2);
      ctx.beginPath(); ctx.moveTo(a1.sx, a1.sy); ctx.lineTo(b1.sx, b1.sy); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  /* ---------------------- Рисование пришельца ---------------------- */
  function alienColors(kind) {
    if (kind === "scout") return { a: "#e6d34a", b: "#fff08a", c: "#8a7a12", glow: "rgba(255,225,80,.9)" };
    if (kind === "tank")  return { a: "#c94b3f", b: "#f08a7c", c: "#6e1f18", glow: "rgba(255,90,70,.9)" };
    if (kind === "ufo")   return { a: "#8b5cf6", b: "#c4b5fd", c: "#4c2f8f", glow: "rgba(180,120,255,.95)" };
    return { a: "#3fae5c", b: "#8ff0a6", c: "#1c5c2c", glow: "rgba(110,255,150,.85)" };
  }

  function drawAlien(a, p) {
    var r = a.world * p.s * 0.5;
    if (r < 0.8) return;

    var fog = clamp(1 - (p.z - NEAR) / (FAR * 1.15), 0.18, 1);
    var danger = clamp(1 - (p.z - NEAR) / 520, 0, 1);
    var col = alienColors(a.kind);

    // Масштаб рождения и смерти
    var scale = 1;
    if (a.birth > 0) scale = clamp(1 - a.birth / 0.35, 0.35, 1);
    var alpha = fog;
    if (a.dying > 0) { alpha *= clamp(a.dying / 0.3, 0, 1); scale *= 1 + (0.3 - a.dying) * 1.6; }

    // тень на земле
    var sh = project(a.x, GROUND_Y, a.z);
    var shR = r * 0.85;
    if (shR > 1 && !a.dead) {
      var sg = ctx.createRadialGradient(sh.sx, sh.sy, 0, sh.sx, sh.sy, shR);
      sg.addColorStop(0, "rgba(0,0,0,.5)");
      sg.addColorStop(1, "rgba(0,0,0,0)");
      ctx.globalAlpha = fog * 0.7;
      ctx.fillStyle = sg;
      ctx.beginPath(); ctx.ellipse(sh.sx, sh.sy, shR, shR * 0.3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.save();
    ctx.translate(p.sx, p.sy);
    ctx.scale(scale, scale);
    ctx.globalAlpha = alpha;

    // Свечение / контур
    ctx.shadowColor = danger > 0.55 ? "rgba(255,50,50,.95)" : col.glow;
    ctx.shadowBlur = r * (0.6 + danger * 1.2);

    if (a.kind === "ufo") {
      // корпус-тарелка с бликом
      var bg = ctx.createLinearGradient(0, -r * 0.4, 0, r * 0.5);
      bg.addColorStop(0, col.b); bg.addColorStop(0.5, col.a); bg.addColorStop(1, col.c);
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.ellipse(0, r * 0.12, r, r * 0.34, 0, 0, Math.PI * 2); ctx.fill();
      // купол
      var cg = ctx.createRadialGradient(-r * 0.15, -r * 0.28, r * 0.05, 0, -r * 0.15, r * 0.55);
      cg.addColorStop(0, "#eaffea"); cg.addColorStop(0.6, col.b); cg.addColorStop(1, col.c);
      ctx.fillStyle = cg;
      ctx.beginPath(); ctx.arc(0, -r * 0.14, r * 0.44, Math.PI, 0); ctx.fill();
      ctx.closePath();
      ctx.shadowBlur = 0;
      // огни по краю (мигают)
      for (var i = -2; i <= 2; i++) {
        var lit = (Math.floor(timeNow * 6 + i) % 2 === 0);
        ctx.fillStyle = lit ? "#fff" : "rgba(255,255,255,.25)";
        ctx.beginPath(); ctx.arc(i * r * 0.36, r * 0.18, r * 0.06, 0, Math.PI * 2); ctx.fill();
      }
      // луч вниз
      var beamA = 0.12 + 0.08 * Math.sin(timeNow * 4);
      var lg = ctx.createLinearGradient(0, r * 0.3, 0, r * 2.4);
      lg.addColorStop(0, "rgba(200,180,255," + beamA + ")");
      lg.addColorStop(1, "rgba(200,180,255,0)");
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.moveTo(-r * 0.3, r * 0.3); ctx.lineTo(r * 0.3, r * 0.3);
      ctx.lineTo(r * 0.9, r * 2.4); ctx.lineTo(-r * 0.9, r * 2.4);
      ctx.closePath(); ctx.fill();
    } else {
      // антенна с шариком
      ctx.shadowBlur = 0;
      ctx.strokeStyle = col.a; ctx.lineWidth = Math.max(1, r * 0.07);
      ctx.beginPath(); ctx.moveTo(0, -r * 0.72); ctx.lineTo(0, -r * 1.16); ctx.stroke();
      var ag = ctx.createRadialGradient(-r * 0.04, -r * 1.24, 0, 0, -r * 1.2, r * 0.16);
      ag.addColorStop(0, "#ffffff"); ag.addColorStop(1, col.a);
      ctx.fillStyle = ag;
      ctx.beginPath(); ctx.arc(0, -r * 1.2, r * 0.14, 0, Math.PI * 2); ctx.fill();

      // голова-тело с объёмным градиентом (свет слева-сверху)
      var g2 = ctx.createRadialGradient(-r * 0.34, -r * 0.4, r * 0.05, 0, 0, r * 1.05);
      g2.addColorStop(0, col.b);
      g2.addColorStop(0.55, col.a);
      g2.addColorStop(1, col.c);
      ctx.fillStyle = g2;
      ctx.beginPath(); ctx.ellipse(0, -r * 0.06, r * 0.9, r * 0.98, 0, 0, Math.PI * 2); ctx.fill();

      // блик
      ctx.globalAlpha = alpha * 0.5;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.ellipse(-r * 0.36, -r * 0.45, r * 0.2, r * 0.32, -0.5, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = alpha;

      // глаза (большие, тёмные, с блеском)
      var eg = ctx.createRadialGradient(-r * 0.32, -r * 0.14, r * 0.02, -r * 0.3, -r * 0.1, r * 0.3);
      eg.addColorStop(0, "#2a3340"); eg.addColorStop(1, "#05080c");
      ctx.fillStyle = eg;
      ctx.beginPath(); ctx.ellipse(-r * 0.3, -r * 0.1, r * 0.22, r * 0.32, -0.22, 0, Math.PI * 2); ctx.fill();
      var eg2 = ctx.createRadialGradient(r * 0.34, -r * 0.14, r * 0.02, r * 0.3, -r * 0.1, r * 0.3);
      eg2.addColorStop(0, "#2a3340"); eg2.addColorStop(1, "#05080c");
      ctx.fillStyle = eg2;
      ctx.beginPath(); ctx.ellipse(r * 0.3, -r * 0.1, r * 0.22, r * 0.32, 0.22, 0, Math.PI * 2); ctx.fill();
      // зрачки-блеск
      ctx.fillStyle = "rgba(255,255,255,.95)";
      ctx.beginPath(); ctx.arc(-r * 0.26, -r * 0.2, r * 0.07, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(r * 0.34, -r * 0.2, r * 0.07, 0, Math.PI * 2); ctx.fill();

      // рот
      ctx.strokeStyle = "#06120a"; ctx.lineWidth = Math.max(1, r * 0.05);
      ctx.beginPath(); ctx.arc(0, r * 0.26, r * 0.32, 0.22 * Math.PI, 0.78 * Math.PI); ctx.stroke();

      // руки-щупальца
      ctx.strokeStyle = col.c; ctx.lineWidth = Math.max(1.2, r * 0.1); ctx.lineCap = "round";
      var wa = Math.sin(timeNow * 3 + a.swayPhase) * r * 0.14;
      ctx.beginPath();
      ctx.moveTo(-r * 0.78, r * 0.3); ctx.quadraticCurveTo(-r * 1.1, r * 0.6, -r * 1.25, r * 0.95 + wa);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(r * 0.78, r * 0.3); ctx.quadraticCurveTo(r * 1.1, r * 0.6, r * 1.25, r * 0.95 - wa);
      ctx.stroke();
    }

    // вспышка попадания
    if (a.hitFlash > 0) {
      ctx.globalAlpha = a.hitFlash * 0.85;
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(0, 0, r * 0.85, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = alpha;
    }

    // полоска здоровья танка
    if (a.maxHp > 1 && a.dying <= 0) {
      var bw = r * 1.7, bh = Math.max(3.5, r * 0.1);
      var by = -r * 1.5;
      ctx.shadowBlur = 0;
      ctx.fillStyle = "rgba(0,0,0,.6)";
      ctx.fillRect(-bw / 2 - 1, by - 1, bw + 2, bh + 2);
      ctx.fillStyle = "#ff6b5a";
      ctx.fillRect(-bw / 2, by, bw * (a.hp / a.maxHp), bh);
    }

    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  /* ---------------------- Оружие от первого лица ---------------------- */
  function gunPose() {
    var t = timeNow;
    // покачивание от дыхания + отдача
    var swayX = Math.sin(t * 1.3) * 6 + yaw * 40;
    var swayY = Math.sin(t * 2.1) * 4 + Math.abs(yaw) * 10 - pitch * 30;
    var rc = recoil;                       // 0..1
    var bx = W * 0.66 + swayX;
    var by = H * 0.92 + swayY + rc * 34;
    return { x: bx, y: by, rc: rc };
  }

  function drawGun() {
    var g = gunPose();
    var rc = g.rc;
    var scale = clamp(W / 1280, 0.75, 1.35);

    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.rotate(-rc * 0.12 + yaw * 0.15);
    ctx.scale(scale, scale);

    // ===== ствол в перспективе (уходит к центру экрана) =====
    // приклад / корпус
    var body = ctx.createLinearGradient(-90, -40, 60, 120);
    body.addColorStop(0, "#4c5560");
    body.addColorStop(0.45, "#2c333c");
    body.addColorStop(1, "#161a20");
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.moveTo(-120, 40);
    ctx.lineTo(-40, -30);
    ctx.lineTo(70, -22);
    ctx.lineTo(120, 30);
    ctx.lineTo(96, 150);
    ctx.lineTo(-96, 158);
    ctx.closePath();
    ctx.fill();

    // верхняя грань (блик)
    ctx.fillStyle = "rgba(150,170,190,.25)";
    ctx.beginPath();
    ctx.moveTo(-40, -30); ctx.lineTo(70, -22); ctx.lineTo(64, -6); ctx.lineTo(-38, -12);
    ctx.closePath(); ctx.fill();

    // ствол
    var barr = ctx.createLinearGradient(0, -80, 0, 10);
    barr.addColorStop(0, "#6b7683");
    barr.addColorStop(0.5, "#39414c");
    barr.addColorStop(1, "#1b1f26");
    ctx.fillStyle = barr;
    ctx.beginPath();
    ctx.moveTo(-26, -18);
    ctx.lineTo(30, -22);
    ctx.lineTo(40, -96);
    ctx.lineTo(-14, -92);
    ctx.closePath();
    ctx.fill();

    // дуло
    ctx.fillStyle = "#0d0f13";
    ctx.beginPath();
    ctx.ellipse(11, -95, 15, 7, 0.06, 0, Math.PI * 2); ctx.fill();

    // энергоядро (пульсирует)
    var coreA = 0.55 + 0.45 * Math.sin(timeNow * 6);
    var core = ctx.createRadialGradient(-6, 34, 1, -6, 34, 30);
    core.addColorStop(0, "rgba(220,255,255," + coreA + ")");
    core.addColorStop(0.5, "rgba(80,220,255," + (coreA * 0.8) + ")");
    core.addColorStop(1, "rgba(30,120,200,0)");
    ctx.fillStyle = core;
    ctx.beginPath(); ctx.arc(-6, 34, 30, 0, Math.PI * 2); ctx.fill();

    // светящаяся полоса
    ctx.shadowColor = "rgba(80,220,255,.9)"; ctx.shadowBlur = 16;
    ctx.strokeStyle = "rgba(150,240,255," + (0.5 + coreA * 0.5) + ")";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-70, 96); ctx.lineTo(60, 92); ctx.stroke();
    ctx.shadowBlur = 0;

    // рука (перчатка) слева
    ctx.fillStyle = "#2a2f36";
    ctx.beginPath(); ctx.ellipse(-84, 120, 44, 30, 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#39404a";
    ctx.beginPath(); ctx.ellipse(-84, 112, 40, 20, 0.2, 0, Math.PI * 2); ctx.fill();

    ctx.restore();

    // ===== Вспышка у дула =====
    if (muzzleT > 0) {
      var mx = g.x - 14 * scale;
      var my = g.y - 96 * scale;
      var fr = 46 * scale * (0.7 + Math.random() * 0.6);
      ctx.globalAlpha = clamp(muzzleT / 0.09, 0, 1);
      var fg = ctx.createRadialGradient(mx, my, 0, mx, my, fr);
      fg.addColorStop(0, "rgba(255,255,240,.98)");
      fg.addColorStop(0.35, "rgba(255,220,120,.85)");
      fg.addColorStop(1, "rgba(255,150,40,0)");
      ctx.fillStyle = fg;
      ctx.beginPath(); ctx.arc(mx, my, fr, 0, Math.PI * 2); ctx.fill();

      // лучи
      ctx.strokeStyle = "rgba(255,235,170,.9)";
      ctx.lineWidth = 2 * scale;
      for (var k = 0; k < 6; k++) {
        var ang = Math.random() * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(mx, my);
        ctx.lineTo(mx + Math.cos(ang) * fr * 1.3, my + Math.sin(ang) * fr * 1.3);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  }

  function muzzleScreen() {
    var g = gunPose();
    var scale = clamp(W / 1280, 0.75, 1.35);
    return { x: g.x - 14 * scale, y: g.y - 96 * scale };
  }

  /* ---------------------- Эффекты ---------------------- */
  function addFloat(x, y, text, color, size) {
    floats.push({ x: x, y: y, text: text, color: color || "#6fff9e", size: size || 18, life: 0.95, max: 0.95 });
  }
  function addTracer(x1, y1, x2, y2) {
    tracers.push({ x1: x1, y1: y1, x2: x2, y2: y2, t: 0 });
  }

  /* ---------------------- Обновление мира ---------------------- */
  function update(dt) {
    timeNow += dt;
    bobT += dt * 1.6;
    if (recoil > 0) recoil = Math.max(0, recoil - dt * 4.5);
    if (muzzleT > 0) muzzleT = Math.max(0, muzzleT - dt);

    // поворот головы к курсору
    if (hasMouse) {
      var ty = ((mouseX / W) - 0.5) * 2 * LOOK_YAW;
      var tp = ((mouseY / H) - 0.5) * 2 * LOOK_PITCH;
      yaw += (ty - yaw) * Math.min(1, dt * 7);
      pitch += (tp - pitch) * Math.min(1, dt * 7);
    }

    // звёзды медленно дрейфуют (ощущение вращения)
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      st.z -= (40 + wave * 4) * dt;
      if (st.z < 200) { st.x = rand(-4000, 4000); st.y = rand(-1200, 2200); st.z = 9000; }
    }

    // пришельцы
    var anyClose = false;
    for (var k = aliens.length - 1; k >= 0; k--) {
      var a = aliens[k];

      // анимация гибели — обрабатываем до проверки dead
      if (a.dying > 0) {
        a.dying -= dt;
        if (a.dying <= 0) aliens.splice(k, 1);
        continue;
      }
      if (a.dead) continue;

      if (a.birth > 0) a.birth -= dt;

      a.z -= a.speed * dt;
      a.swayPhase += dt * a.swaySpeed;
      a.x += Math.sin(a.swayPhase) * a.swayAmp * dt;
      if (a.hitFlash > 0) a.hitFlash = Math.max(0, a.hitFlash - dt * 5);

      if (a.z < 560) anyClose = true;

      if (a.z <= NEAR) {
        a.dead = true;
        aliens.splice(k, 1);
        escaped++;
        combo = 0;
        if (a.kind === "ufo") { updateHUD(); continue; }
        hp--;
        sndDamage();
        triggerShake(520, 10);
        dmgEl.classList.remove("on"); void dmgEl.offsetWidth; dmgEl.classList.add("on");
        addFloat(W / 2, H * 0.66, "БРОНЯ ПРОБИТА", "#ff5a5a", 28);
        updateHUD();
        if (hp <= 0) { endGame(); return; }
      }
    }
    dangerEl.classList.toggle("on", anyClose);
    lowHpEl.classList.toggle("on", hp <= 2 && running);
  }

  function triggerShake(ms, mag) {
    shakeUntil = performance.now() + ms;
    shakeMag = mag || 8;
  }

  /* ---------------------- Отрисовка кадра ---------------------- */
  function render(ts) {
    var sx = 0, sy = 0;
    if (ts < shakeUntil) {
      sx = rand(-shakeMag, shakeMag);
      sy = rand(-shakeMag, shakeMag);
    }

    ctx.save();
    ctx.translate(sx, sy);

    drawSky();
    drawStars();
    drawGround();

    // пришельцы от дальних к ближним
    var order = aliens.slice().sort(function (a, b) { return b.z - a.z; });
    for (var j = 0; j < order.length; j++) {
      var a = order[j];
      var p = project(a.x, a.y, a.z);
      drawAlien(a, p);
    }

    // трассеры
    for (var t = tracers.length - 1; t >= 0; t--) {
      var tr = tracers[t];
      tr.t += 0.016 * 7;
      if (tr.t >= 1) {
        // достиг цели — вспышка
        addFloat(tr.x2, tr.y2 - 14, "", "#fff", 1);
        fx.push({ x: tr.x2, y: tr.y2, r: 34, life: 0.22, max: 0.22 });
        tracers.splice(t, 1);
        continue;
      }
      var cx = tr.x1 + (tr.x2 - tr.x1) * tr.t;
      var cy = tr.y1 + (tr.y2 - tr.y1) * tr.t;
      var tailX = tr.x1 + (tr.x2 - tr.x1) * Math.max(0, tr.t - 0.28);
      var tailY = tr.y1 + (tr.y2 - tr.y1) * Math.max(0, tr.t - 0.28);
      ctx.save();
      ctx.strokeStyle = "rgba(180,255,220,.9)";
      ctx.lineWidth = 2.4;
      ctx.shadowColor = "#8dffc4"; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.moveTo(tailX, tailY); ctx.lineTo(cx, cy); ctx.stroke();
      ctx.restore();
    }

    // вспышки
    for (var f = 0; f < fx.length; f++) {
      var e = fx[f];
      var rr = e.r * (1.7 - e.life / e.max);
      ctx.globalAlpha = clamp(e.life / e.max, 0, 1);
      var rg = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, rr);
      rg.addColorStop(0, "rgba(220,255,235,.95)");
      rg.addColorStop(0.4, "rgba(140,255,190,.6)");
      rg.addColorStop(1, "rgba(120,255,170,0)");
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(e.x, e.y, rr, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // всплывающий текст
    ctx.textAlign = "center";
    for (var q = 0; q < floats.length; q++) {
      var fl = floats[q];
      if (!fl.text) continue;
      ctx.globalAlpha = clamp(fl.life / fl.max, 0, 1);
      ctx.font = "800 " + fl.size + "px -apple-system, Segoe UI, Roboto, sans-serif";
      ctx.fillStyle = "rgba(0,0,0,.65)";
      ctx.fillText(fl.text, fl.x + 1.5, fl.y + 1.5);
      ctx.fillStyle = fl.color;
      ctx.fillText(fl.text, fl.x, fl.y);
    }
    ctx.globalAlpha = 1;

    // оружие поверх всего мира
    drawGun();

    ctx.restore();
  }

  /* ---------------------- Стрельба ---------------------- */
  function shootAtScreen(mx, my) {
    shots++;
    sndShot();
    recoil = 1;
    muzzleT = 0.09;
    triggerShake(90, 3);

    var m = muzzleScreen();
    addTracer(m.x, m.y, mx, my);

    // ищем ближайшего пришельца под прицелом (по радиусу)
    var target = null, bestZ = Infinity;
    for (var i = 0; i < aliens.length; i++) {
      var a = aliens[i];
      if (a.dead || a.dying > 0) continue;
      var p = project(a.x, a.y, a.z);
      var rad = a.world * p.s * 0.5 * 1.05 + 6;
      var dx = mx - p.sx, dy = my - p.sy;
      if (dx * dx + dy * dy <= rad * rad) {
        if (p.z < bestZ) { bestZ = p.z; target = a; }
      }
    }

    if (!target) {
      combo = 0;
      addFloat(mx, my, "МИМО", "#ff5a5a", 15);
      updateHUD();
      return;
    }

    hits++;
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    var p2 = project(target.x, target.y, target.z);
    showHitmark(mx, my);

    target.hp--;
    target.hitFlash = 1;

    if (target.hp > 0) {
      sndTankHit();
      addFloat(p2.sx, p2.sy - target.world * p2.s * 0.5 - 8, "×", "#ff5a5a", 22);
      updateHUD();
      return;
    }

    // уничтожен
    var mult = Math.min(1 + (combo - 1) * 0.1, 3);
    var gained = Math.round(target.pts * mult);
    score += gained;
    killed++; waveKills++;

    if (target.kind === "ufo") { sndUfo(); addFloat(p2.sx, p2.sy - 20, "+" + gained + "  БОНУС", "#c79bff", 22); }
    else if (target.kind === "tank") { sndKill(); addFloat(p2.sx, p2.sy - 20, "+" + gained, "#ffcf6b", 22); }
    else { sndKill(); addFloat(p2.sx, p2.sy - 20, "+" + gained + (combo >= 3 ? "  x" + mult.toFixed(1) : ""), "#8dffb4", 20); }

    target.dying = 0.3;
    target.dead = true;    // больше не цель

    if (waveKills >= waveKillsNeeded) nextWave();
    updateHUD();
  }

  function showHitmark(x, y) {
    hitmark.style.left = x + "px";
    hitmark.style.top = y + "px";
    hitmark.classList.remove("on"); void hitmark.offsetWidth; hitmark.classList.add("on");
  }

  function nextWave() {
    wave++;
    waveKills = 0;
    waveKillsNeeded = 6 + wave * 2;
    sndWave();
    addFloat(W / 2, H * 0.36, "ВОЛНА " + wave, "#ffcf6b", 38);
    addFloat(W / 2, H * 0.36 + 44, "ПРИБЛИЖАЮТСЯ", "#ff8a4d", 18);
  }

  /* ---------------------- HUD ---------------------- */
  function updateHUD() {
    scoreEl.textContent = score;
    waveEl.textContent = wave;
    comboEl.textContent = combo >= 2 ? "×" + combo + " СЕРИЯ" : "";
    var html = "";
    for (var i = 0; i < START_HP; i++) html += '<span class="hp' + (i < hp ? "" : " empty") + '"></span>';
    shieldEl.innerHTML = html;
  }

  /* ---------------------- Главный цикл ---------------------- */
  function frame(ts) {
    if (!running) return;
    var dt = lastTs ? Math.min((ts - lastTs) / 1000, 0.05) : 0.016;
    lastTs = ts;

    // эффекты
    for (var i = fx.length - 1; i >= 0; i--) { fx[i].life -= dt; if (fx[i].life <= 0) fx.splice(i, 1); }
    for (var f = floats.length - 1; f >= 0; f--) { floats[f].life -= dt; floats[f].y -= dt * 50; if (floats[f].life <= 0) floats.splice(f, 1); }

    update(dt);
    render(ts);
    hotReticle();

    rafId = requestAnimationFrame(frame);
  }

  function hotReticle() {
    var hot = false;
    for (var i = 0; i < aliens.length; i++) {
      var a = aliens[i];
      if (a.dead || a.dying > 0) continue;
      var p = project(a.x, a.y, a.z);
      var rad = a.world * p.s * 0.5 * 1.05 + 6;
      var dx = mouseX - p.sx, dy = mouseY - p.sy;
      if (dx * dx + dy * dy <= rad * rad) { hot = true; break; }
    }
    crosshair.classList.toggle("hot", hot);
  }

  /* ---------------------- Экран старта ---------------------- */
  function showStart() {
    overlay.classList.remove("hidden");
    var b = loadBoard().slice(0, 5);
    var boardHtml = "";
    if (b.length) {
      boardHtml = '<h2>Лучшие обороны</h2><div class="board">';
      for (var i = 0; i < b.length; i++) {
        boardHtml += '<div class="line"><span class="rank">' + (i + 1) + '</span>' +
                     '<span class="m">Волна ' + b[i].wave + '</span><span class="s">' + b[i].score + '</span></div>';
      }
      boardHtml += "</div>";
    }
    overlay.innerHTML =
      '<div class="card">' +
        '<h1>ОБОРОНА ЗЕМЛИ</h1>' +
        '<p>Ты — последний стрелок на передовой. Пришельцы вылетают из глубины космоса и летят <b>прямо на тебя</b>.</p>' +
        '<p style="font-size:13px">Веди мышкой, чтобы осмотреться. <b>Клик</b> — выстрел. Не подпускай их к себе: у тебя <b>' + START_HP + ' единиц брони</b>.</p>' +
        '<div class="legend">' +
          '<span><b>🟢</b> 30</span>' +
          '<span><b>🟡</b> разведчик 100</span>' +
          '<span><b>🔴</b> танк 60 ×3</span>' +
          '<span><b>🛸</b> НЛО 150</span>' +
        '</div>' +
        '<div style="margin-top:20px"><button>В БОЙ</button></div>' +
        boardHtml +
        '<p style="margin-top:14px;font-size:11px;opacity:.55;text-transform:uppercase;letter-spacing:.06em">Серии попаданий дают множитель до ×3</p>' +
      '</div>';
  }

  /* ---------------------- Конец игры ---------------------- */
  function showGameOver() {
    var board = loadBoard();
    var entry = { score: score, wave: wave, acc: accuracy(), date: Date.now() };
    board.push(entry);
    board.sort(function (a, c) { return c.score - a.score; });
    board = board.slice(0, 10);
    saveBoard(board);
    best = board.length ? board[0].score : 0;
    bestEl.textContent = best;
    var isRecord = board.length && board[0].date === entry.date;

    var html = '<div class="board">';
    for (var i = 0; i < Math.min(board.length, 5); i++) {
      var me = (board[i].date === entry.date) ? " me" : "";
      html += '<div class="line' + me + '"><span class="rank">' + (i + 1) + '</span>' +
              '<span class="m">Волна ' + board[i].wave + '</span><span class="s">' + board[i].score + '</span></div>';
    }
    html += "</div>";

    overlay.classList.remove("hidden");
    overlay.innerHTML =
      '<div class="card">' +
        '<h1>' + (isRecord ? "НОВЫЙ РЕКОРД" : "ОБОРОНА ПРОРВАНА") + '</h1>' +
        '<p style="opacity:.7;margin-top:-2px">Пришельцы пробили броню</p>' +
        '<div class="big">' + score + '</div>' +
        '<div class="row">' +
          '<div class="col">Волна<b>' + wave + '</b></div>' +
          '<div class="col">Уничтожено<b>' + killed + '</b></div>' +
          '<div class="col">Точность<b>' + accuracy() + '%</b></div>' +
          '<div class="col">Макс. серия<b>' + maxCombo + '</b></div>' +
        '</div>' +
        '<h2>Лучшие обороны</h2>' + html +
        '<div style="margin-top:16px">' +
          '<button data-action="again">ЕЩЁ РАЗ</button>' +
          '<button class="ghost" data-action="menu">В МЕНЮ</button>' +
        '</div>' +
      '</div>';
  }

  /* ---------------------- Старт / стоп ---------------------- */
  function clearAll() { aliens = []; fx = []; tracers = []; floats = []; }

  function startGame() {
    getAudio();
    startAmbient();
    clearTimeout(spawnTimer);
    cancelAnimationFrame(rafId);
    clearAll();
    resize();

    running = true;
    score = 0; hp = START_HP; wave = 1; combo = 0; maxCombo = 0;
    killed = 0; escaped = 0; shots = 0; hits = 0;
    waveKills = 0; waveKillsNeeded = 8;
    yaw = 0; pitch = 0; recoil = 0; muzzleT = 0; timeNow = 0;
    shakeUntil = 0;
    buildStars(); buildGround();

    overlay.classList.add("hidden");
    updateHUD();
    lastTs = 0;
    rafId = requestAnimationFrame(frame);
    spawnAlien();
  }

  function endGame() {
    running = false;
    clearTimeout(spawnTimer);
    cancelAnimationFrame(rafId);
    crosshair.style.opacity = "0";
    dangerEl.classList.remove("on");
    lowHpEl.classList.remove("on");
    stopAmbient();
    sndOver();
    showGameOver();
  }

  /* ---------------------- Управление ---------------------- */
  function toLocal(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  arena.addEventListener("pointermove", function (e) {
    var p = toLocal(e);
    mouseX = p.x; mouseY = p.y; hasMouse = true;
    crosshair.style.left = p.x + "px";
    crosshair.style.top = p.y + "px";
    crosshair.style.opacity = running ? "1" : "0";
  });
  arena.addEventListener("pointerleave", function () { crosshair.style.opacity = "0"; });

  arena.addEventListener("pointerdown", function (e) {
    if (!running) return;
    if (e.target.closest && e.target.closest("#overlay")) return;
    var p = toLocal(e);
    mouseX = p.x; mouseY = p.y; hasMouse = true;
    shootAtScreen(p.x, p.y);
  });

  overlay.addEventListener("click", function (e) {
    var btn = e.target.closest && e.target.closest("button");
    if (!btn) return;
    if (btn.dataset.action === "menu") showStart();
    else startGame();
  });

  document.addEventListener("keydown", function (e) {
    if (!running && (e.key === " " || e.key === "Enter")) { e.preventDefault(); startGame(); }
  });

  window.addEventListener("resize", function () { resize(); buildStars(); buildGround(); });

  resize(); buildStars(); buildGround();
  updateHUD();
  showStart();
})();
</script>
</body>
</html>
