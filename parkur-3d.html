<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Паркур 3D: убеги от монстра 👹</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #05060e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff; -webkit-user-select: none; user-select: none;
  }
  #game { display: flex; flex-direction: column; height: 100%; }

  /* ===== HUD ===== */
  #hud {
    display: flex; align-items: center; gap: 16px; padding: 8px 16px;
    font-size: 14px; z-index: 6; flex-wrap: wrap;
    background: linear-gradient(180deg, rgba(20,16,30,.96), rgba(12,10,20,.86));
    border-bottom: 1px solid rgba(255,90,90,.25);
  }
  #hud .item { white-space: nowrap; }
  #hud .label { opacity: .6; margin-right: 5px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  #hud .val { font-weight: 800; font-variant-numeric: tabular-nums; }
  #dist { color: #8fe0ff; }
  #crys { color: #ff7ad0; }
  #hud .spacer { flex: 1; }
  #best { color: #ffd76e; }

  /* ===== Сцена ===== */
  #arena { position: relative; flex: 1; overflow: hidden; background: #05060e; touch-action: none; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* Красная виньетка опасности */
  #danger { position: absolute; inset: 0; pointer-events: none; z-index: 4; opacity: 0;
    box-shadow: inset 0 0 160px rgba(220,20,20,.85); transition: opacity .2s; }
  #dmg { position: absolute; inset: 0; pointer-events: none; z-index: 5; opacity: 0;
    background: radial-gradient(circle, transparent 35%, rgba(220,20,20,.6)); }
  #dmg.on { animation: dmgf .45s; }
  @keyframes dmgf { 0% { opacity: 1; } 100% { opacity: 0; } }

  /* Полоска погони */
  #chaseWrap { position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
    z-index: 7; width: min(70%, 420px); pointer-events: none; text-align: center; }
  #chaseBar { position: relative; height: 16px; border-radius: 10px;
    background: rgba(10,10,20,.6); box-shadow: inset 0 1px 4px rgba(0,0,0,.5);
    border: 1px solid rgba(255,90,90,.35); overflow: hidden; }
  #chaseFill { position: absolute; right: 0; top: 0; height: 100%; width: 100%;
    background: linear-gradient(90deg,#ff3a3a,#ff8a3a); transition: width .12s linear; }
  #chaseTxt { font-size: 12px; margin-top: 4px; opacity: .85; text-shadow: 0 2px 6px #000; }

  /* ===== Оверлей ===== */
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(8,6,14,.9); backdrop-filter: blur(6px); z-index: 30;
    text-align: center; padding: 20px; overflow: auto; }
  #overlay.hidden { display: none; }
  #overlay .card { max-width: 560px; width: 100%; padding: 32px 30px; border-radius: 22px;
    background: linear-gradient(180deg, rgba(46,24,34,.96), rgba(24,14,22,.98));
    border: 2px solid rgba(255,90,90,.35);
    box-shadow: 0 24px 70px rgba(0,0,0,.8), 0 0 90px rgba(255,50,50,.12) inset; }
  #overlay h1 { margin: 0 0 8px; font-size: 33px; letter-spacing: .01em;
    background: linear-gradient(90deg,#ff6b6b,#ffd76e,#8fe0ff);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  #overlay p { margin: 10px 0; line-height: 1.6; font-size: 15px; opacity: .92; }
  #overlay .keys { display: flex; flex-direction: column; gap: 8px; margin: 16px auto 0; max-width: 420px; }
  #overlay .keys div { display: flex; align-items: center; gap: 12px; font-size: 14px; }
  #overlay .key { display: inline-block; min-width: 38px; text-align: center; padding: 5px 10px;
    border-radius: 8px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
    font-weight: 800; font-size: 12px; }
  #overlay button { margin-top: 22px; padding: 15px 40px; font-size: 18px; font-weight: 800;
    color: #2a0808; background: linear-gradient(180deg,#ff9a8a,#ff5a4a);
    border: none; border-radius: 14px; cursor: pointer; letter-spacing: .03em;
    box-shadow: 0 8px 26px rgba(255,80,60,.4); transition: transform .1s, box-shadow .15s;
    font-family: inherit; }
  #overlay button:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255,80,60,.55); }
  #overlay button:active { transform: translateY(1px) scale(.98); }
  #overlay .big { font-size: 46px; font-weight: 800; color: #8fe0ff; margin: 6px 0; }
  #overlay .row { display: flex; justify-content: center; gap: 28px; margin-top: 14px; flex-wrap: wrap; }
  #overlay .row .col { opacity: .9; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  #overlay .row .col b { display: block; font-size: 24px; margin-top: 4px; color: #fff; letter-spacing: 0; }
  #overlay .legend { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;
    margin-top: 16px; font-size: 13px; opacity: .9; }
  #overlay .legend span { display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.08); padding: 6px 12px; border-radius: 999px; }

  /* ===== Мобильное управление ===== */
  #mobile { position: absolute; inset: 0; z-index: 14; pointer-events: none; display: none; }
  #mobile.on { display: block; }
  .mbtn { position: absolute; pointer-events: auto; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.16); border: 2px solid rgba(255,255,255,.36);
    color: #fff; backdrop-filter: blur(3px); touch-action: none;
    box-shadow: 0 4px 12px rgba(0,0,0,.4); user-select: none; }
  .mbtn:active, .mbtn.press { background: rgba(255,110,90,.6); transform: scale(.94); }
  #btnLeft  { left: 20px; bottom: 30px; width: 88px; height: 88px; font-size: 38px; }
  #btnRight { left: 122px; bottom: 30px; width: 88px; height: 88px; font-size: 38px; }
  #btnJump  { right: 24px; bottom: 40px; width: 100px; height: 100px; font-size: 42px; }
</style>
</head>
<body>
  <div id="game">
    <div id="hud">
      <div class="item"><span class="label">Уровень</span><span class="val" id="lvl">1</span></div>
      <div class="item"><span class="label">Дистанция</span><span class="val" id="dist">0 м</span></div>
      <div class="item"><span class="label">Кристаллы</span><span class="val" id="crys">0</span></div>
      <div class="spacer"></div>
      <div class="item"><span class="label">Рекорд</span><span class="val" id="best">0 м</span></div>
    </div>

    <div id="arena">
      <canvas id="view"></canvas>
      <div id="danger"></div>
      <div id="dmg"></div>
      <div id="chaseWrap">
        <div id="chaseBar"><span id="chaseFill"></span></div>
        <div id="chaseTxt">👹 монстр</div>
      </div>
      <div id="mobile">
        <div class="mbtn" id="btnLeft">◀</div>
        <div class="mbtn" id="btnRight">▶</div>
        <div class="mbtn" id="btnJump">⤒</div>
      </div>
      <div id="overlay"></div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  /* ======================= НАСТРОЙКИ ======================= */
  var CAM_DIST    = 14;     // насколько камера позади героя
  var CAM_HEIGHT  = 2.6;    // высота камеры над героем
  var CAM_AHEAD   = 3;      // камера чуть впереди, чтобы видеть путь
  var GRAVITY     = 30;     // гравитация
  var RUN_SPEED   = 12;     // скорость бега
  var JUMP_VEL    = 11.5;   // сила прыжка
  var DJUMP_VEL   = 9.5;    // второй прыжок
  var START_TOP   = 12;     // высота стартовой крыши
  var MON_BASE    = 7.5;    // начальная скорость монстра
  var MON_MAX     = 12.6;   // максимальная скорость монстра
  var MON_RAMP    = 0.11;   // ускорение монстра (в секунду)
  var MON_CAP     = 13;     // монстр не отстаёт дальше этого
  var CATCH       = 1.6;    // дистанция поимки
  var LEVEL_DIST  = 120;    // метров на один уровень
  var LEVEL_NAMES = ["Ночные крыши", "Старый город", "Высотки", "Неоновый район",
                     "Промзона", "Разрушенный квартал", "Небесный город", "Бездна"];
  /* Типы монстров по уровням: разные внешность и характер */
  var MON_TYPES = [
    { name: "Тень",        body: "#3a1020", glow: "180,10,30",  eye: "#ff2a2a", horns: true,  hair: true,  spike: false },
    { name: "Призрак",     body: "#1a2a3a", glow: "80,180,255", eye: "#8fe0ff", horns: false, hair: false, spike: false, ghost: true },
    { name: "Робот-охотник", body: "#2a2a30", glow: "255,160,40", eye: "#ffa020", horns: false, hair: false, spike: true },
    { name: "Демон",       body: "#4a0a10", glow: "255,30,30",  eye: "#ffd020", horns: true,  hair: false, spike: true },
    { name: "Мутант",      body: "#2a4a1a", glow: "120,255,80", eye: "#aaff50", horns: false, hair: true,  spike: true },
    { name: "Легион",      body: "#2a1030", glow: "200,60,255", eye: "#e080ff", horns: true,  hair: true,  spike: true },
    { name: "Космический", body: "#0a0a2a", glow: "120,140,255",eye: "#c0d0ff", horns: true,  hair: false, spike: true },
    { name: "БОСС",        body: "#500008", glow: "255,20,20",  eye: "#ff0000", horns: true,  hair: true,  spike: true, boss: true }
  ];
  /* ========================================================= */

  var arena   = document.getElementById("arena");
  var canvas  = document.getElementById("view");
  var ctx     = canvas.getContext("2d");
  var overlay = document.getElementById("overlay");
  var distEl  = document.getElementById("dist");
  var crysEl  = document.getElementById("crys");
  var lvlEl   = document.getElementById("lvl");
  var bestEl  = document.getElementById("best");
  var dangerEl= document.getElementById("danger");
  var dmgEl   = document.getElementById("dmg");
  var chaseFill = document.getElementById("chaseFill");
  var chaseTxt = document.getElementById("chaseTxt");
  var mobileEl = document.getElementById("mobile");

  var W = 1, H = 1, DPR = 1, FOCAL = 600, HORIZON = 0;

  function resize() {
    var r = arena.getBoundingClientRect();
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    FOCAL = H * 0.9;
    HORIZON = H * 0.46;
  }

  var isMobile = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
  if (isMobile) mobileEl.classList.add("on");

  /* ---------------------- Состояние ---------------------- */
  var rooftops = [], obstacles = [], crystals = [], particles = [], stars = [];
  var lastRight = 0, lastTop = START_TOP;
  var player, monster;
  var running = false;
  var timeNow = 0, lastTs = 0, rafId = null;
  var shakeT = 0, shakeMag = 0;
  var dir = 0;
  var keys = {};
  var slowT = 0, growlT = 0, hurtCd = 0;
  var startX = 0, score = 0, crystalsGot = 0;
  var camX = 0, camY = 0;
  var level = 1, levelBannerT = 0;
  var skyTop = "#0a0a20", skyMid = "#1c1638", skyLow = "#3a2050", skyBot = "#5a2a40";

  function loadBest() {
    try { return parseInt(localStorage.getItem("parkour3d_best") || "0", 10) || 0; }
    catch (e) { return 0; }
  }
  var best = loadBest();
  bestEl.textContent = best + " м";

  /* ---------------------- Звук ---------------------- */
  var audioCtx = null;
  function getAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, to, dur, type, vol, delay) {
    var ac = getAudio(); if (!ac) return;
    var t = ac.currentTime + (delay || 0);
    var o = ac.createOscillator(); o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(Math.max(1, to), t + dur);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.06);
  }
  function noise(dur, cutoff, vol) {
    var ac = getAudio(); if (!ac) return;
    var buf = ac.createBuffer(1, Math.max(1, Math.floor(ac.sampleRate * dur)), ac.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, 1.5);
    var src = ac.createBufferSource(); src.buffer = buf;
    var f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cutoff || 900;
    var g = ac.createGain(); g.gain.value = vol || 0.12;
    src.connect(f); f.connect(g); g.connect(ac.destination); src.start();
  }
  function sndJump()  { tone(520, 900, 0.1, "square", 0.08); }
  function sndDJump() { tone(760, 1200, 0.1, "square", 0.08); }
  function sndLand()  { noise(0.06, 700, 0.08); }
  function sndCrystal(){ tone(1000, 1600, 0.09, "triangle", 0.13); tone(1400, 2000, 0.1, "triangle", 0.11, 0.07); }
  function sndHit()   { noise(0.2, 700, 0.2); tone(220, 90, 0.2, "sawtooth", 0.16); }
  function sndGrowl() { tone(rand(80,120), rand(50,70), 0.5, "sawtooth", 0.14); noise(0.4, 380, 0.1); }
  function sndCatch() { tone(300, 60, 0.8, "sawtooth", 0.3); noise(0.8, 700, 0.3); }
  function sndFall()  { tone(500, 60, 0.7, "sawtooth", 0.24); }

  function rand(a, b) { return Math.random() * (b - a) + a; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function hash(n) { var s = Math.sin(n * 12.9898) * 43758.5453; return s - Math.floor(s); }

  /* ======================= МИР ======================= */
  function resetWorld() {
    rooftops = []; obstacles = []; crystals = []; particles = [];
    var r0 = { x: -8, w: 18, top: START_TOP, z: -5, d: 13 };
    rooftops.push(r0);
    lastRight = r0.x + r0.w;
    lastTop = START_TOP;
    for (var i = 0; i < 14; i++) genNext();

    stars = [];
    for (var s = 0; s < 70; s++) stars.push({ x: Math.random(), y: Math.random() * 0.5, r: Math.random() * 1.6 + 0.5, tw: Math.random() * 6.28 });
  }

  function genNext() {
    // сложность зависит от уровня: чем выше уровень — тем шире пропасти и выше здания
    var lv = level - 1;
    var gap = rand(2.4, 5.4) + lv * 0.35;
    var w = rand(9, 15) - lv * 0.4;
    w = Math.max(5.5, w);
    var top = clamp(lastTop + rand(-1.5, 1.5) + lv * 0.15, 6, 20 + lv * 0.8);
    var r = { x: lastRight + gap, w: w, top: top, z: -5 + rand(-1, 1), d: rand(9, 14) };
    rooftops.push(r);

    // препятствие (через него надо прыгнуть) — чем выше уровень, тем чаще
    if (Math.random() < 0.28 + lv * 0.04 && w > 7) {
      var oh = rand(0.9, 1.5);
      obstacles.push({ x: r.x + rand(2, Math.max(3, w - 4)), w: rand(1.4, 2.6), h: oh, top: top, z: r.z + 2, d: 3 });
    }
    // кристалл над крышей
    if (Math.random() < 0.7) {
      crystals.push({ x: r.x + w / 2, y: top + 2.4, z: r.z + r.d / 2, got: false, t: Math.random() * 6.28 });
    }

    lastRight = r.x + w;
    lastTop = top;
  }

  function ensureWorld() {
    while (lastRight < player.x + 120) genNext();
    // убираем то, что уехало за камеру
    while (rooftops.length && rooftops[0].x + rooftops[0].w < camX - 40) rooftops.shift();
    while (obstacles.length && obstacles[0].x + obstacles[0].w < camX - 40) obstacles.shift();
    while (crystals.length && crystals[0].x < camX - 40) crystals.shift();
  }

  // высота крыши под точкой x (или null, если там пропасть)
  function groundAt(x) {
    for (var i = 0; i < rooftops.length; i++) {
      var r = rooftops[i];
      if (x >= r.x && x <= r.x + r.w) return r.top;
    }
    return null;
  }

  /* ======================= ИГРОК ======================= */
  function resetGame() {
    resetWorld();
    player = { x: 0, y: START_TOP, vy: 0, onGround: true, jumps: 0, anim: 0, facing: 1 };
    monster = { x: -11, y: START_TOP, speed: MON_BASE, anim: 0, lunge: 0 };
    startX = 0; score = 0; crystalsGot = 0;
    level = 1; levelBannerT = 0;
    skyTop = "#0a0a20"; skyMid = "#1c1638"; skyLow = "#3a2050"; skyBot = "#5a2a40";
    timeNow = 0; dir = 0; slowT = 0; growlT = 1; hurtCd = 0;
    camX = player.x + CAM_AHEAD;
    camY = player.y + CAM_HEIGHT;
    shakeT = 0;
    updateHUD();
  }

  function updateHUD() {
    distEl.textContent = Math.max(0, Math.floor(score)) + " м";
    crysEl.textContent = crystalsGot;
    if (lvlEl) lvlEl.textContent = level;
  }

  // Повышение уровня по дистанции
  function checkLevel() {
    var lv = 1 + Math.floor(score / LEVEL_DIST);
    if (lv > level) {
      level = lv;
      levelBannerT = 2.6;
      sndLevelUp();
      // при смене уровня монстр на миг отстаёт — передышка
      monster.x = player.x - MON_CAP;
      // обновляем параметры сложности
      applyLevelMood();
      updateHUD();
    }
  }

  // Настроение уровня — оттенок неба/города
  function applyLevelMood() {
    var t = clamp((level - 1) / 6, 0, 1);
    // смещаем цвета неба
    skyTop = mixHex("#0a0a20", "#20083a", t);
    skyMid = mixHex("#1c1638", "#3a1045", t);
    skyLow = mixHex("#3a2050", "#6a1a4a", t);
    skyBot = mixHex("#5a2a40", "#8a2a3a", t);
  }
  function mixHex(a, b, t) {
    function p(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
    var A = p(a), B = p(b);
    return "#" + A.map(function (v, i) { return Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0"); }).join("");
  }

  function sndLevelUp() {
    [600, 800, 1100, 1500].forEach(function (f, i) { tone(f, f * 1.25, 0.16, "triangle", 0.16, i * 0.11); });
  }

  /* ======================= ВВОД ======================= */
  window.addEventListener("keydown", function (e) {
    var k = e.key.toLowerCase();
    if (k === "arrowleft" || k === "a" || k === "ф") keys.left = true;
    if (k === "arrowright" || k === "d" || k === "в") keys.right = true;
    if (k === " " || k === "arrowup" || k === "w" || k === "ц") { e.preventDefault(); if (!e.repeat) jump(); }
    if (!running && (e.key === " " || e.key === "Enter")) { e.preventDefault(); startGame(); }
  });
  window.addEventListener("keyup", function (e) {
    var k = e.key.toLowerCase();
    if (k === "arrowleft" || k === "a" || k === "ф") keys.left = false;
    if (k === "arrowright" || k === "d" || k === "в") keys.right = false;
  });

  function jump() {
    if (!running) return;
    if (player.onGround) {
      player.vy = -JUMP_VEL; player.onGround = false; player.jumps = 1;
      sndJump(); burst(player.x, player.y, "#cfe8ff", 6);
    } else if (player.jumps < 2) {
      player.vy = -DJUMP_VEL; player.jumps = 2;
      sndDJump(); burst(player.x, player.y, "#ffd76e", 8);
    }
  }

  // мобильные кнопки
  function bindBtn(id, down, up) {
    var el = document.getElementById(id);
    el.addEventListener("touchstart", function (e) { e.preventDefault(); el.classList.add("press"); down(); }, { passive: false });
    el.addEventListener("touchend", function (e) { e.preventDefault(); el.classList.remove("press"); if (up) up(); }, { passive: false });
    el.addEventListener("mousedown", function (e) { if (isMobile) return; e.preventDefault(); down(); });
    el.addEventListener("mouseup", function (e) { if (isMobile) return; e.preventDefault(); if (up) up(); });
  }
  bindBtn("btnLeft", function () { keys.left = true; }, function () { keys.left = false; });
  bindBtn("btnRight", function () { keys.right = true; }, function () { keys.right = false; });
  bindBtn("btnJump", function () { jump(); });

  /* ======================= ОБНОВЛЕНИЕ ======================= */
  function update(dt) {
    timeNow += dt;
    var p = player, m = monster;

    if (slowT > 0) slowT -= dt;
    if (hurtCd > 0) hurtCd -= dt;

    // ---- управление игроком ----
    dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (dir !== 0) p.facing = dir;
    var speed = RUN_SPEED * (slowT > 0 ? 0.45 : 1);
    p.x += dir * speed * dt;
    if (p.x < startX - 2) p.x = startX - 2;

    // ---- вертикаль ----
    p.vy += GRAVITY * dt;
    p.y += p.vy * dt;
    var g = groundAt(p.x);
    if (g !== null && p.y >= g && p.vy >= 0) {
      if (!p.onGround && p.vy > 8) { sndLand(); burst(p.x, g, "#a8c0d8", 6); }
      p.y = g; p.vy = 0;
      p.onGround = true; p.jumps = 0;
    } else {
      p.onGround = false;
    }
    // упал в пропасть
    if (p.y > START_TOP + 40 || p.y < -8) { gameOver("fall"); return; }

    p.anim += dt * (Math.abs(dir) > 0 ? 10 : 3);

    // ---- препятствия ----
    for (var oi = 0; oi < obstacles.length; oi++) {
      var ob = obstacles[oi];
      if (p.x + 0.5 > ob.x && p.x - 0.5 < ob.x + ob.w &&
          p.y < ob.top + ob.h && p.y > ob.top - 1 && hurtCd <= 0) {
        // врезались
        hurtCd = 0.9;
        slowT = 0.7;
        sndHit();
        shakeT = 0.3; shakeMag = 10;
        dmgEl.classList.remove("on"); void dmgEl.offsetWidth; dmgEl.classList.add("on");
        burst(p.x, p.y - 0.8, "#ff8a8a", 12);
        m.x += 3.5;                 // монстр выигрывает
        m.lunge = 1;
      }
    }

    // ---- кристаллы ----
    for (var ci = 0; ci < crystals.length; ci++) {
      var c = crystals[ci];
      if (c.got) continue;
      c.t += dt * 2;
      if (Math.abs(c.x - p.x) < 1.1 && Math.abs(c.y - (p.y + 0.9)) < 1.6) {
        c.got = true;
        crystalsGot++; score += 5;
        sndCrystal();
        burst(c.x, c.y, "#ff7ad0", 12);
        m.x -= 3;                   // отталкиваем монстра
        if (m.x < p.x - MON_CAP) m.x = p.x - MON_CAP;
        updateHUD();
      }
    }

    // ---- монстр ----
    m.speed = Math.min(MON_MAX, MON_BASE + timeNow * MON_RAMP + (level - 1) * 0.7);
    m.x += m.speed * dt;
    var mg = groundAt(m.x);
    if (mg !== null) m.y += (mg - m.y) * Math.min(1, dt * 8);
    else m.y += (p.y - m.y) * Math.min(1, dt * 3);
    m.anim += dt * (6 + m.speed * 0.4);
    if (m.lunge > 0) m.lunge -= dt;

    // не отстаёт слишком далеко
    if (p.x - m.x > MON_CAP) m.x = p.x - MON_CAP;

    // рычание
    growlT -= dt;
    if (growlT <= 0) { growlT = rand(1.4, 3); sndGrowl(); }

    // ---- поймал? ----
    var gap = p.x - m.x;
    if (gap < CATCH) { gameOver("catch"); return; }

    // опасность на экране
    var danger = clamp(1 - gap / 10, 0, 1);
    dangerEl.style.opacity = (danger * danger * 0.9).toFixed(2);

    // ---- дистанция ----
    score = Math.max(score, p.x - startX);
    checkLevel();
    updateHUD();

    // ---- частицы ----
    for (var fi = particles.length - 1; fi >= 0; fi--) {
      var pt = particles[fi];
      pt.vy += 26 * dt;
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.life -= dt;
      if (pt.life <= 0) particles.splice(fi, 1);
    }

    // ---- камера ----
    var tcx = p.x + CAM_AHEAD;
    var tcy = p.y + CAM_HEIGHT;
    camX += (tcx - camX) * Math.min(1, dt * 5);
    camY += (tcy - camY) * Math.min(1, dt * 6);

    ensureWorld();

    if (shakeT > 0) shakeT -= dt;
    if (levelBannerT > 0) levelBannerT -= dt;
  }

  function burst(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      particles.push({ x: x, y: y, vx: rand(-8, 8), vy: rand(-10, 2), life: rand(0.3, 0.7), max: 0.7, color: color, r: rand(0.06, 0.16) });
    }
  }

  /* ======================= 3D-ПРОЕКЦИЯ ======================= */
  // Мир: x — вправо, y — вверх, z — в глубину (камера смотрит в +z).
  function project(x, y, z) {
    var dx = x - camX, dy = y - camY, dz = z - (camX * 0); // camZ = -CAM_DIST
    dz = z + CAM_DIST;   // камера на z = -CAM_DIST
    if (dz < 0.5) dz = 0.5;
    var s = FOCAL / dz;
    return { sx: W / 2 + dx * s, sy: HORIZON - dy * s, s: s, z: dz };
  }

  /* ======================= ОТРИСОВКА ======================= */
  function render() {
    var sx = 0, sy = 0;
    if (shakeT > 0) { sx = rand(-shakeMag, shakeMag); sy = rand(-shakeMag, shakeMag); }

    drawSky();

    ctx.save();
    ctx.translate(sx, sy);

    drawBackdrop();

    // крыши — от дальних к ближним
    for (var i = 0; i < rooftops.length; i++) drawRoof(rooftops[i]);
    for (var oi = 0; oi < obstacles.length; oi++) drawObstacle(obstacles[oi]);
    for (var ci = 0; ci < crystals.length; ci++) drawCrystal(crystals[ci]);
    drawParticles();
    drawMonster();
    drawPlayer();

    ctx.restore();

    drawLevelBanner();
  }

  function drawLevelBanner() {
    if (levelBannerT <= 0) return;
    var a = clamp(levelBannerT / 0.5, 0, 1);           // затухание в конце
    if (levelBannerT > 2.1) a = clamp((2.6 - levelBannerT) / 0.5, 0, 1);  // появление
    ctx.save();
    ctx.globalAlpha = a;
    var cy = H * 0.30;
    var type = currentMonType();
    var isBoss = !!type.boss;
    // плашка
    ctx.fillStyle = "rgba(10,8,20,.75)";
    var bw = Math.min(W * 0.86, 560), bh = isBoss ? 128 : 108;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(W / 2 - bw / 2, cy - bh / 2, bw, bh, 18);
    else ctx.rect(W / 2 - bw / 2, cy - bh / 2, bw, bh);
    ctx.fill();
    ctx.strokeStyle = isBoss ? "rgba(255,20,20,.9)" : "rgba(255,120,90,.7)"; ctx.lineWidth = isBoss ? 3 : 2; ctx.stroke();
    // текст
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffd76e";
    ctx.font = "800 " + Math.round(Math.min(W * 0.07, 34)) + "px -apple-system, 'Segoe UI', Roboto, sans-serif";
    ctx.fillText("УРОВЕНЬ " + level, W / 2, cy - 22);
    ctx.fillStyle = "#cfe0ff";
    ctx.font = "700 " + Math.round(Math.min(W * 0.04, 18)) + "px -apple-system, 'Segoe UI', Roboto, sans-serif";
    var nm = LEVEL_NAMES[Math.min(level - 1, LEVEL_NAMES.length - 1)];
    ctx.fillText(nm + " — быстрее!", W / 2, cy + 6);
    // новый монстр
    ctx.fillStyle = isBoss ? "#ff5a5a" : "#ffb08a";
    ctx.font = "800 " + Math.round(Math.min(W * 0.045, 20)) + "px -apple-system, 'Segoe UI', Roboto, sans-serif";
    ctx.fillText((isBoss ? "👑 БОСС: " : "👹 Новый монстр: ") + type.name + "!", W / 2, cy + (isBoss ? 38 : 34));
    ctx.restore();
  }

  function drawSky() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, skyTop);
    g.addColorStop(0.45, skyMid);
    g.addColorStop(0.72, skyLow);
    g.addColorStop(1, skyBot);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // луна
    var mx = W * 0.8 - camX * 4;
    mx = ((mx % (W + 400)) + W + 400) % (W + 400) - 200;
    var my = HORIZON - H * 0.32;
    var mg = ctx.createRadialGradient(mx, my, 6, mx, my, 90);
    mg.addColorStop(0, "rgba(255,250,220,.95)");
    mg.addColorStop(0.3, "rgba(255,245,200,.3)");
    mg.addColorStop(1, "rgba(255,240,180,0)");
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(mx, my, 90, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fdf6dc";
    ctx.beginPath(); ctx.arc(mx, my, 32, 0, Math.PI * 2); ctx.fill();

    // звёзды
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      var x = ((st.x * (W + 200) - camX * 2) % (W + 200) + (W + 200)) % (W + 200) - 100;
      ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(timeNow * 1.5 + st.tw));
      ctx.fillStyle = "#dbe9ff";
      ctx.fillRect(x, st.y * H, st.r, st.r);
    }
    ctx.globalAlpha = 1;
  }

  // Дальние дома (параллакс)
  function drawBackdrop() {
    // параллакс: дальний слой движется медленнее
    var px = camX * 0.45;
    var spacing = 20;
    var i0 = Math.floor(px / spacing) - 12;
    for (var i = i0; i < i0 + 40; i++) {
      var h = 14 + hash(i * 1.7) * 55;
      var w = spacing * (0.6 + hash(i * 3.1) * 0.5);
      var zz = 58;
      // экранная x для дальнего слоя
      var s = FOCAL / zz;
      var sx = W / 2 + (i * spacing - px) * s;
      var sw = w * s;
      if (sx + sw < -20 || sx > W + 20) continue;
      var baseY = HORIZON;
      var topY = HORIZON - h * s;
      // тело
      ctx.fillStyle = "#1a1830";
      ctx.fillRect(sx, topY, sw, baseY - topY + 4);
      // окна
      ctx.fillStyle = hash(i * 5.3) > 0.5 ? "rgba(255,214,140,.3)" : "rgba(140,190,255,.2)";
      var cols = 3, rows = 4;
      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          if (hash(i * 9 + r * 3 + c) < 0.55) continue;
          ctx.fillRect(sx + sw * (0.15 + c * 0.28), topY + (baseY - topY) * (0.1 + r * 0.18), sw * 0.16, (baseY - topY) * 0.1);
        }
      }
    }
  }

  function quad(A, B, C, D, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(A.sx, A.sy); ctx.lineTo(B.sx, B.sy); ctx.lineTo(C.sx, C.sy); ctx.lineTo(D.sx, D.sy);
    ctx.closePath(); ctx.fill();
  }

  function drawRoof(r) {
    if (r.x + r.w < camX - 50 || r.x > camX + 60) return;
    var zNear = r.z, zFar = r.z + r.d;
    // ближняя грань (к камере), от крыши вниз
    var nA = project(r.x, r.top, zNear), nB = project(r.x + r.w, r.top, zNear);
    var nC = project(r.x + r.w, r.top - r.top, zNear), nD = project(r.x, 0, zNear);
    var nB2 = project(r.x + r.w, 0, zNear);
    // верхняя грань
    var tA = project(r.x, r.top, zNear), tB = project(r.x + r.w, r.top, zNear);
    var tC = project(r.x + r.w, r.top, zFar), tD = project(r.x, r.top, zFar);

    // вертикальная передняя стена
    quad(project(r.x, r.top, zNear), project(r.x + r.w, r.top, zNear),
         project(r.x + r.w, 0, zNear), project(r.x, 0, zNear), "#20283c");
    // тонкая светлая кромка сверху стены
    quad(project(r.x, r.top, zNear), project(r.x + r.w, r.top, zNear),
         project(r.x + r.w, r.top - 0.4, zNear), project(r.x, r.top - 0.4, zNear), "#3a4664");
    // верхняя грань (крыша) — светлее, уходит в глубину
    quad(tA, tB, tC, tD, "#4e5c7e");
    quad(project(r.x, r.top, zFar - 0.6), project(r.x + r.w, r.top, zFar - 0.6),
         project(r.x + r.w, r.top, zFar), project(r.x, r.top, zFar), "#5e6c8e");
    // окантовка края
    ctx.strokeStyle = "rgba(150,190,255,.28)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(tA.sx, tA.sy); ctx.lineTo(tB.sx, tB.sy);
    ctx.stroke();
  }

  function drawObstacle(ob) {
    if (ob.x + ob.w < camX - 40 || ob.x > camX + 40) return;
    var zN = ob.z, zF = ob.z + ob.d;
    var top = ob.top + ob.h;
    // передняя грань
    quad(project(ob.x, top, zN), project(ob.x + ob.w, top, zN),
         project(ob.x + ob.w, ob.top, zN), project(ob.x, ob.top, zN), "#5a4a3a");
    // верх
    quad(project(ob.x, top, zN), project(ob.x + ob.w, top, zN),
         project(ob.x + ob.w, top, zF), project(ob.x, top, zF), "#8a6a4a");
    // полоски
    ctx.strokeStyle = "rgba(255,215,110,.7)"; ctx.lineWidth = 2;
    var a = project(ob.x + ob.w * 0.2, top, zN), b = project(ob.x + ob.w * 0.2, ob.top, zN);
    ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke();
  }

  function drawCrystal(c) {
    if (c.got) return;
    if (c.x < camX - 40 || c.x > camX + 50) return;
    var bob = Math.sin(c.t) * 0.25;
    var p = project(c.x, c.y + bob, c.z);
    if (p.s < 2) return;
    var R = p.s * 0.42;
    ctx.save();
    ctx.translate(p.sx, p.sy);
    var gg = ctx.createRadialGradient(0, 0, 1, 0, 0, R * 2.2);
    gg.addColorStop(0, "rgba(255,140,220,.55)");
    gg.addColorStop(1, "rgba(255,140,220,0)");
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(0, 0, R * 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ff7ad0";
    ctx.beginPath();
    ctx.moveTo(0, -R * 1.3); ctx.lineTo(R, 0); ctx.lineTo(0, R * 1.3); ctx.lineTo(-R, 0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#ffc4ec";
    ctx.beginPath(); ctx.moveTo(0, -R * 1.3); ctx.lineTo(R, 0); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var pt = particles[i];
      var p = project(pt.x, pt.y, 0);
      if (p.s < 1) continue;
      ctx.globalAlpha = clamp(pt.life / pt.max, 0, 1);
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(p.sx, p.sy, Math.max(1, pt.r * p.s * 1.6), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- Игрок (вид сбоку, бежит вправо) ---------- */
  function drawPlayer() {
    var p = project(player.x, player.y, 0);
    if (p.s < 2) return;
    var s = p.s;
    var feetY = p.sy;
    var face = player.facing;

    ctx.save();
    ctx.translate(p.sx, feetY);
    ctx.scale(face, 1);

    // тень
    ctx.globalAlpha = 0.28; ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.ellipse(0, 0, 0.55 * s, 0.16 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    var legSw = Math.sin(player.anim) * 0.5;
    // ноги
    ctx.strokeStyle = "#1e3350"; ctx.lineWidth = 0.16 * s; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0, -0.5 * s); ctx.lineTo(legSw * 0.4 * s, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -0.5 * s); ctx.lineTo(-legSw * 0.4 * s, 0); ctx.stroke();
    // тело
    var g = ctx.createLinearGradient(0, -1.4 * s, 0, -0.4 * s);
    g.addColorStop(0, "#4aa8e8"); g.addColorStop(1, "#2560a0");
    ctx.fillStyle = g;
    roundRect(-0.26 * s, -1.32 * s, 0.52 * s, 0.86 * s, 0.16 * s);
    ctx.fill();
    // рука
    ctx.strokeStyle = "#e8b894"; ctx.lineWidth = 0.13 * s;
    var armSw = Math.sin(player.anim + 1.5) * 0.4;
    ctx.beginPath(); ctx.moveTo(0.06 * s, -1.15 * s); ctx.lineTo(0.3 * s, -0.9 * s + armSw * 0.4 * s); ctx.stroke();
    // голова
    ctx.fillStyle = "#e8b894";
    ctx.beginPath(); ctx.arc(0.02 * s, -1.5 * s, 0.24 * s, 0, Math.PI * 2); ctx.fill();
    // маска/шапка
    ctx.fillStyle = "#2a3350";
    ctx.beginPath(); ctx.arc(0.02 * s, -1.55 * s, 0.25 * s, Math.PI, Math.PI * 1.9); ctx.fill();
    // глаз
    ctx.fillStyle = "#1a1f2e";
    ctx.beginPath(); ctx.arc(0.14 * s, -1.5 * s, 0.045 * s, 0, Math.PI * 2); ctx.fill();

    ctx.restore();

    // индикатор двойного прыжка
    if (!player.onGround && player.jumps < 2) {
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = player.jumps < 1 ? "#8fe0ff" : "#ffd76e";
      ctx.beginPath(); ctx.arc(p.sx, p.sy - 1.9 * s, Math.max(2, s * 0.08), 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  /* ---------- Монстр ---------- */
  function currentMonType() {
    var idx = clamp(level - 1, 0, MON_TYPES.length - 1);
    return MON_TYPES[idx];
  }

  function drawMonster() {
    var gap = player.x - monster.x;
    var type = currentMonType();
    var boss = !!type.boss;
    var loom = 1 + clamp(1 - gap / 12, 0, 1) * 0.55;
    var baseScale = boss ? 1.7 : 1;
    var p = project(monster.x, monster.y, boss ? -2.5 : -1.5);
    if (p.z < 0.6) return;
    var s = p.s * loom * baseScale;
    if (s < 2) return;

    ctx.save();
    ctx.translate(p.sx, p.sy);

    // свечение (цвет зависит от типа)
    var gg = ctx.createRadialGradient(0, -0.9 * s, 1, 0, -0.9 * s, 2 * s);
    gg.addColorStop(0, "rgba(" + type.glow + ",.55)");
    gg.addColorStop(1, "rgba(" + type.glow + ",0)");
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(0, -0.9 * s, 2 * s, 0, Math.PI * 2); ctx.fill();

    // тень
    ctx.globalAlpha = 0.3; ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.ellipse(0, 0, (boss ? 1.1 : 0.7) * s, 0.18 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    var legSw = Math.sin(monster.anim) * 0.6;

    // призрак — полупрозрачный, без ног
    if (type.ghost) {
      ctx.globalAlpha = 0.7;
    }

    // ноги
    if (!type.ghost) {
      ctx.strokeStyle = shadeHex(type.body, 0.6); ctx.lineWidth = 0.22 * s; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-0.1 * s, -0.7 * s); ctx.lineTo(-0.1 * s + legSw * 0.5 * s, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0.15 * s, -0.7 * s); ctx.lineTo(0.15 * s - legSw * 0.5 * s, 0); ctx.stroke();
    }

    // тело
    var bg = ctx.createLinearGradient(0, -1.6 * s, 0, -0.4 * s);
    bg.addColorStop(0, type.body);
    bg.addColorStop(1, shadeHex(type.body, 0.45));
    ctx.fillStyle = bg;
    ctx.beginPath();
    if (type.ghost) {
      // призрак: струящееся тело
      ctx.moveTo(-0.6 * s, -0.6 * s);
      ctx.quadraticCurveTo(-0.75 * s, -1.9 * s, 0.05 * s, -1.9 * s);
      ctx.quadraticCurveTo(0.85 * s, -1.9 * s, 0.7 * s, -0.6 * s);
      // волнистый низ
      ctx.lineTo(0.5 * s, -0.8 * s);
      ctx.lineTo(0.3 * s, -0.55 * s);
      ctx.lineTo(0.1 * s, -0.8 * s);
      ctx.lineTo(-0.1 * s, -0.55 * s);
      ctx.lineTo(-0.3 * s, -0.8 * s);
      ctx.lineTo(-0.5 * s, -0.55 * s);
      ctx.closePath();
    } else if (boss) {
      // босс: огромное тело
      ctx.ellipse(0.05 * s, -1.05 * s, 0.8 * s, 0.92 * s, 0, 0, Math.PI * 2);
    } else {
      ctx.ellipse(0.05 * s, -1.05 * s, 0.62 * s, 0.72 * s, 0, 0, Math.PI * 2);
    }
    ctx.fill();
    if (type.ghost) ctx.globalAlpha = 1;

    // шерсть/искры
    if (type.hair) {
      ctx.strokeStyle = shadeHex(type.body, 0.7); ctx.lineWidth = 0.05 * s;
      for (var k = 0; k < 8; k++) {
        var a = k / 8 * Math.PI * 2 + timeNow * 2;
        ctx.beginPath();
        ctx.moveTo(0.05 * s + Math.cos(a) * 0.45 * s, -1.05 * s + Math.sin(a) * 0.5 * s);
        ctx.lineTo(0.05 * s + Math.cos(a) * 0.72 * s, -1.05 * s + Math.sin(a) * 0.78 * s);
        ctx.stroke();
      }
    }
    // шипы (робот/демон/мутант/легион/космос/босс)
    if (type.spike) {
      ctx.fillStyle = shadeHex(type.body, 1.3);
      for (var sp = 0; sp < 5; sp++) {
        var sa = -Math.PI * 0.5 + (sp - 2) * 0.32;
        var px = 0.05 * s + Math.cos(sa) * 0.55 * s;
        var py = -1.05 * s + Math.sin(sa) * 0.6 * s;
        ctx.beginPath();
        ctx.moveTo(px - 0.07 * s, py);
        ctx.lineTo(px + Math.cos(sa) * 0.28 * s, py + Math.sin(sa) * 0.28 * s);
        ctx.lineTo(px + 0.07 * s, py);
        ctx.closePath(); ctx.fill();
      }
    }

    // рука с когтями
    ctx.strokeStyle = shadeHex(type.body, 0.6); ctx.lineWidth = 0.18 * s;
    var reach = (boss ? 0.95 : 0.7) * s + Math.max(0, monster.lunge) * 0.4 * s;
    ctx.beginPath(); ctx.moveTo(0.3 * s, -1.2 * s); ctx.lineTo(reach, -0.95 * s); ctx.stroke();
    ctx.fillStyle = "#e0d0c0";
    for (var c = -1; c <= 1; c++) {
      ctx.beginPath();
      ctx.moveTo(reach, -0.95 * s);
      ctx.lineTo(reach + 0.18 * s, -0.95 * s + c * 0.12 * s);
      ctx.lineTo(reach + 0.05 * s, -0.95 * s + c * 0.14 * s);
      ctx.closePath(); ctx.fill();
    }

    // ГОЛОВА
    var headR = boss ? 0.6 : 0.44;
    var headY = boss ? -2.05 : -1.75;
    ctx.fillStyle = shadeHex(type.body, 0.45);
    ctx.beginPath(); ctx.arc(0.2 * s, headY * s, headR * s, 0, Math.PI * 2); ctx.fill();

    // рога
    if (type.horns) {
      ctx.fillStyle = shadeHex(type.body, 0.5);
      var hornLen = boss ? 0.7 : 0.5;
      ctx.beginPath();
      ctx.moveTo(-0.05 * s, (headY - 0.25) * s); ctx.lineTo(-0.25 * s, (headY - 0.25 - hornLen) * s); ctx.lineTo(0.1 * s, (headY - 0.3) * s);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0.4 * s, (headY - 0.25) * s); ctx.lineTo(0.62 * s, (headY - 0.25 - hornLen) * s); ctx.lineTo(0.3 * s, (headY - 0.3) * s);
      ctx.closePath(); ctx.fill();
    }

    // глаза (число зависит от босса — три глаза)
    var eg = 0.7 + 0.3 * Math.sin(timeNow * 8);
    ctx.save();
    ctx.shadowColor = "rgba(" + type.glow + "," + eg + ")";
    ctx.shadowBlur = boss ? 26 : 18;
    ctx.fillStyle = type.eye;
    ctx.beginPath(); ctx.ellipse(0.36 * s, headY * s, 0.1 * s, 0.09 * s, 0, 0, Math.PI * 2); ctx.fill();
    if (boss) {
      ctx.beginPath(); ctx.ellipse(0.02 * s, headY * s, 0.09 * s, 0.09 * s, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0.6 * s, headY * s, 0.06 * s, 0.06 * s, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    // пасть с зубами
    ctx.fillStyle = "#2a0004";
    ctx.beginPath(); ctx.ellipse(0.34 * s, (headY + 0.2) * s, 0.22 * s, 0.1 * s, 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#e8e0d0";
    for (var t = 0; t < 4; t++) {
      var tx = 0.18 * s + t * 0.1 * s;
      ctx.beginPath();
      ctx.moveTo(tx, (headY + 0.13) * s); ctx.lineTo(tx + 0.07 * s, (headY + 0.13) * s); ctx.lineTo(tx + 0.035 * s, (headY + 0.27) * s);
      ctx.closePath(); ctx.fill();
    }

    // корона у босса
    if (boss) {
      ctx.fillStyle = "#ffcf3f";
      ctx.strokeStyle = "#c09000"; ctx.lineWidth = Math.max(1, 0.03 * s);
      ctx.beginPath();
      ctx.moveTo(-0.1 * s, (headY - 0.4) * s);
      ctx.lineTo(-0.05 * s, (headY - 0.7) * s);
      ctx.lineTo(0.1 * s, (headY - 0.5) * s);
      ctx.lineTo(0.25 * s, (headY - 0.75) * s);
      ctx.lineTo(0.4 * s, (headY - 0.5) * s);
      ctx.lineTo(0.55 * s, (headY - 0.7) * s);
      ctx.lineTo(0.6 * s, (headY - 0.4) * s);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }

    ctx.restore();
  }

  function shadeHex(hex, f) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    r = Math.min(255, Math.round(r * f)); g = Math.min(255, Math.round(g * f)); b = Math.min(255, Math.round(b * f));
    return "rgb(" + r + "," + g + "," + b + ")";
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* ======================= HUD погони ======================= */
  function updateChaseHUD() {
    var gap = player.x - monster.x;
    var f = clamp(gap / MON_CAP, 0, 1);   // 1 = далеко, 0 = поймал
    chaseFill.style.width = (f * 100) + "%";
    var type = currentMonType();
    var boss = !!type.boss;
    var nm = (boss ? "👑 " : "👹 ") + type.name;
    if (gap > 8) { chaseTxt.textContent = nm + " далеко"; chaseTxt.style.color = "#8fe0a0"; }
    else if (gap > 4.5) { chaseTxt.textContent = nm + " близко"; chaseTxt.style.color = "#ffd76e"; }
    else { chaseTxt.textContent = nm + " — ОН РЯДОМ! БЕГИ!"; chaseTxt.style.color = "#ff5a5a"; }
  }

  /* ======================= ГЛАВНЫЙ ЦИКЛ ======================= */
  function frame(ts) {
    var dt = lastTs ? Math.min((ts - lastTs) / 1000, 0.033) : 0.016;
    lastTs = ts;
    if (running) {
      var steps = 2, h = dt / steps;
      for (var i = 0; i < steps && running; i++) update(h);
      updateChaseHUD();
    }
    render();
    rafId = requestAnimationFrame(frame);
  }

  /* ======================= ЭКРАНЫ ======================= */
  function showStart() {
    overlay.classList.remove("hidden");
    var keysHtml = isMobile
      ? '<div class="keys">' +
          '<div><span class="key">◀</span><span class="key">▶</span> бежать влево / вправо</div>' +
          '<div><span class="key">⤒</span> прыжок (нажми дважды — двойной)</div>' +
        '</div>'
      : '<div class="keys">' +
          '<div><span class="key">A</span><span class="key">D</span> или <span class="key">←</span><span class="key">→</span> — бежать</div>' +
          '<div><span class="key">ПРОБЕЛ</span> или <span class="key">W</span> — прыжок (дважды — двойной)</div>' +
        '</div>';
    overlay.innerHTML =
      '<div class="card">' +
        '<h1>👹 ПАРКУР 3D</h1>' +
        '<p>Ты бежишь по крышам ночного города в 3D. <b>За тобой гонится монстр!</b><br>' +
        'Беги вправо, прыгай через пропасти и доставляй... то есть — <b>выживи</b>!</p>' +
        '<p style="font-size:13px;opacity:.85">💎 Собирай кристаллы — они <b>отталкивают монстра</b>.<br>' +
        '⚠️ Врезался в препятствие или упал — монстр догоняет. Стоишь на месте — он тоже догоняет!</p>' +
        keysHtml +
        '<div class="legend">' +
          '<span>🌃 3D-город в перспективе</span>' +
          '<span>👹 8 разных монстров + босс</span>' +
          '<span>⬆️ каждый уровень — быстрее</span>' +
        '</div>' +
        '<button id="startBtn">НАЧАТЬ БЕГ!</button>' +
      '</div>';
  }

  function gameOver(reason) {
    running = false;
    if (reason === "catch") { sndCatch(); shakeT = 0.7; shakeMag = 22; }
    else sndFall();
    // всплеск
    for (var i = 0; i < 30; i++) burst(player.x, player.y, reason === "catch" ? "#ff3a3a" : "#8fa0c0", 2);

    var m = Math.floor(score);
    var isRecord = m > best;
    if (isRecord) { best = m; try { localStorage.setItem("parkour3d_best", String(best)); } catch (e) {} }
    bestEl.textContent = best + " м";

    setTimeout(function () {
      overlay.classList.remove("hidden");
      overlay.innerHTML =
        '<div class="card">' +
          '<h1>' + (reason === "catch" ? "👹 Монстр поймал!" : "🕳️ Ты упал!") + '</h1>' +
          '<p>' + (isRecord ? "🏆 Но это новый рекорд!" : (reason === "catch" ? "Беги быстрее в следующий раз!" : "Не прыгай в пропасть!")) + '</p>' +
          '<div class="big">' + m + ' м</div>' +
          '<div class="row">' +
            '<div class="col">Уровень<b>' + level + '</b></div>' +
            '<div class="col">Кристаллы<b>' + crystalsGot + '</b></div>' +
            '<div class="col">Рекорд<b>' + best + ' м</b></div>' +
          '</div>' +
          '<button id="startBtn">Ещё раз! 👹</button>' +
        '</div>';
    }, 900);
  }

  function startGame() {
    getAudio();
    resetGame();
    overlay.classList.add("hidden");
    running = true;
    lastTs = 0;
    if (!rafId) rafId = requestAnimationFrame(frame);
  }

  overlay.addEventListener("click", function (e) {
    var btn = e.target.closest && e.target.closest("button");
    if (btn) startGame();
  });
  overlay.addEventListener("touchend", function (e) {
    var btn = e.target.closest && e.target.closest("button");
    if (btn) { e.preventDefault(); startGame(); }
  });
  document.addEventListener("keydown", function (e) {
    if (!running && (e.key === " " || e.key === "Enter")) { e.preventDefault(); startGame(); }
  });

  window.addEventListener("resize", resize);

  resize();
  resetGame();
  showStart();
  if (!rafId) rafId = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
