<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Паук-курьер 🕷️📦</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0a0e1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff; -webkit-user-select: none; user-select: none;
  }
  #game { display: flex; flex-direction: column; height: 100%; }

  /* ===== HUD ===== */
  #hud {
    display: flex; align-items: center; gap: 16px; padding: 8px 16px;
    font-size: 14px; z-index: 6; flex-wrap: wrap;
    background: linear-gradient(180deg, rgba(24,20,40,.96), rgba(14,12,26,.88));
    border-bottom: 1px solid rgba(255,90,90,.25);
  }
  #hud .item { white-space: nowrap; }
  #hud .label { opacity: .6; margin-right: 5px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  #hud .val { font-weight: 800; font-variant-numeric: tabular-nums; }
  #delivered { color: #8dffb4; }
  #hud .spacer { flex: 1; }

  /* Паутина (бесконечная) */
  #webWrap { display: flex; align-items: center; gap: 8px; }

  /* ===== Сцена ===== */
  #arena { position: relative; flex: 1; overflow: hidden; background: #1a1030; touch-action: none; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }

  #task {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    z-index: 7; font-size: 14px; font-weight: 700; padding: 8px 18px; border-radius: 999px;
    background: rgba(12,10,24,.75); backdrop-filter: blur(4px);
    box-shadow: 0 4px 16px rgba(0,0,0,.4); pointer-events: none; white-space: nowrap;
    border: 1px solid rgba(255,90,90,.35);
  }
  #task .hl { color: #ffd76e; }

  #arrow { position: absolute; z-index: 6; font-size: 32px; pointer-events: none;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.6)); transition: opacity .2s; }

  #dmg { position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(circle, transparent 40%, rgba(255,40,40,.55)); opacity: 0; }
  #dmg.on { animation: dmgf .4s; }
  @keyframes dmgf { 0% { opacity: 1; } 100% { opacity: 0; } }

  /* Сплэш скорости */
  #dash { position: absolute; inset: 0; pointer-events: none; z-index: 4; opacity: 0;
    background: radial-gradient(circle at 50% 50%, transparent 30%, rgba(140,200,255,.25) 100%); }

  /* ===== Оверлей ===== */
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(10,8,22,.9); backdrop-filter: blur(6px); z-index: 30;
    text-align: center; padding: 20px; overflow: auto; }
  #overlay.hidden { display: none; }
  #overlay .card { max-width: 560px; width: 100%; padding: 32px 30px; border-radius: 22px;
    background: linear-gradient(180deg, rgba(44,26,46,.96), rgba(24,14,30,.98));
    border: 2px solid rgba(255,90,90,.35);
    box-shadow: 0 24px 70px rgba(0,0,0,.75), 0 0 90px rgba(255,60,60,.12) inset; }
  #overlay h1 { margin: 0 0 8px; font-size: 33px; letter-spacing: .01em;
    background: linear-gradient(90deg,#ff6b6b,#ffd76e,#8fe0ff);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  #overlay p { margin: 10px 0; line-height: 1.6; font-size: 15px; opacity: .92; }
  #overlay .keys { display: flex; flex-direction: column; gap: 8px; margin: 16px auto 0; max-width: 420px; }
  #overlay .keys div { display: flex; align-items: center; gap: 12px; font-size: 14px; }
  #overlay .key { display: inline-block; min-width: 38px; text-align: center; padding: 5px 10px;
    border-radius: 8px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
    font-weight: 800; font-size: 12px; }
  #overlay button { margin-top: 22px; padding: 15px 40px; font-size: 18px; font-weight: 800;
    color: #2a0808; background: linear-gradient(180deg,#ff9a8a,#ff5a4a);
    border: none; border-radius: 14px; cursor: pointer; letter-spacing: .03em;
    box-shadow: 0 8px 26px rgba(255,80,60,.4); transition: transform .1s, box-shadow .15s;
    font-family: inherit; }
  #overlay button:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255,80,60,.55); }
  #overlay button:active { transform: translateY(1px) scale(.98); }
  #overlay .big { font-size: 46px; font-weight: 800; color: #8dffb4; margin: 6px 0; }
  #overlay .row { display: flex; justify-content: center; gap: 28px; margin-top: 14px; flex-wrap: wrap; }
  #overlay .row .col { opacity: .9; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  #overlay .row .col b { display: block; font-size: 24px; margin-top: 4px; color: #fff; letter-spacing: 0; }
  #overlay .legend { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap;
    margin-top: 16px; font-size: 13px; opacity: .9; }
  #overlay .legend span { display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.08); padding: 6px 12px; border-radius: 999px; }

  /* ===== Мобильное управление ===== */
  #mobile { position: absolute; inset: 0; z-index: 14; pointer-events: none; display: none; }
  #mobile.on { display: block; }
  #joy { position: absolute; left: 20px; bottom: 24px; width: 130px; height: 130px;
    border-radius: 50%; pointer-events: auto;
    background: radial-gradient(circle, rgba(255,255,255,.16), rgba(255,255,255,.05));
    border: 2px solid rgba(255,255,255,.35); touch-action: none; }
  #joyKnob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px;
    margin: -29px 0 0 -29px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #ffd0d0, #d13b2a);
    box-shadow: 0 4px 12px rgba(0,0,0,.4); }
  .mbtn { position: absolute; pointer-events: auto; width: 96px; height: 96px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 40px;
    background: rgba(255,255,255,.18); border: 2px solid rgba(255,255,255,.4);
    color: #fff; backdrop-filter: blur(3px); touch-action: none;
    box-shadow: 0 4px 12px rgba(0,0,0,.35); user-select: none; }
  .mbtn:active, .mbtn.press { background: rgba(255,110,90,.65); transform: scale(.94); }
  #btnWeb { right: 24px; bottom: 90px; }
  #btnDrop { right: 120px; bottom: 24px; width: 70px; height: 70px; font-size: 30px; }
</style>
</head>
<body>
  <div id="game">
    <div id="hud">
      <div class="item"><span class="label">Доставлено</span><span class="val" id="delivered">0</span></div>
      <div class="item"><span class="label">Груз</span><span class="val" id="cargo">—</span></div>
      <div class="item" id="webWrap"><span class="label">Паутина</span>
        <span style="font-weight:800;color:#8fe0ff">∞ бесконечная</span></div>
      <div class="spacer"></div>
      <div class="item"><span class="label">Очки</span><span class="val" id="score">0</span></div>
      <div class="item"><span class="label">Рекорд</span><span class="val" id="best">0</span></div>
    </div>

    <div id="arena">
      <canvas id="view"></canvas>
      <div id="task">Забери посылку 🏭</div>
      <div id="arrow">➡️</div>
      <div id="dmg"></div>
      <div id="dash"></div>
      <div id="mobile">
        <div id="joy"><div id="joyKnob"></div></div>
        <div class="mbtn" id="btnWeb">🕸️</div>
        <div class="mbtn" id="btnDrop">📦</div>
      </div>
      <div id="overlay"></div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  /* ===================== НАСТРОЙКИ ===================== */
  var GRAVITY     = 2000;    // гравитация
  var MAX_SPEED   = 1500;    // ограничение скорости
  var AIR_DRAG    = 0.35;    // сопротивление воздуха (свободный полёт)
  var WEB_RANGE   = 640;     // дальность паутины
  var WEB_REEL    = 220;     // скорость подтягивания (сокращение троса)
  var MIN_ROPE    = 90;      // минимальная длина троса
  var WORLD_W     = 6000;    // ширина города
  var GROUND_Y    = 1250;    // уровень земли
  var WALL_JUMP   = 620;
  /* ==================================================== */

  var arena   = document.getElementById("arena");
  var canvas  = document.getElementById("view");
  var ctx     = canvas.getContext("2d");
  var overlay = document.getElementById("overlay");
  var deliveredEl = document.getElementById("delivered");
  var cargoEl = document.getElementById("cargo");
  var scoreEl = document.getElementById("score");
  var bestEl  = document.getElementById("best");
  var taskEl = document.getElementById("task");
  var arrowEl = document.getElementById("arrow");
  var dmgEl = document.getElementById("dmg");
  var dashEl = document.getElementById("dash");
  var mobileEl = document.getElementById("mobile");

  var W = 1, H = 1, DPR = 1;
  function resize() {
    var r = arena.getBoundingClientRect();
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  var isMobile = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
  if (isMobile) mobileEl.classList.add("on");

  /* ---------------------- Состояние ---------------------- */
  var running = false, paused = false;
  var player = null;
  var camX = 0, camY = 0;
  var keys = {};
  var buildings = [];        // небоскрёбы
  var anchors = [];          // точки крепления паутины
  var pickups = [];          // склады (взять посылку)
  var dropoffs = [];         // дома (доставить)
  var rings = [];            // бонус-кольца
  var particles = [];
  var clouds = [];
  var stars = [];
  var birds = [];

  var delivered = 0, score = 0, carrying = false;
  var timeNow = 0, lastTs = 0, rafId = null;
  var shakeT = 0, shakeMag = 0;
  var combo = 0;

  function loadBest() {
    try { return parseInt(localStorage.getItem("spider_courier_best") || "0", 10) || 0; }
    catch (e) { return 0; }
  }
  var best = loadBest();
  bestEl.textContent = best;

  /* ---------------------- Звук ---------------------- */
  var audioCtx = null;
  function getAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, to, dur, type, vol, delay) {
    var ac = getAudio(); if (!ac) return;
    var t = ac.currentTime + (delay || 0);
    var o = ac.createOscillator(); o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(Math.max(1, to), t + dur);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.06);
  }
  function noise(dur, cutoff, vol) {
    var ac = getAudio(); if (!ac) return;
    var buf = ac.createBuffer(1, Math.max(1, Math.floor(ac.sampleRate * dur)), ac.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, 1.5);
    var src = ac.createBufferSource(); src.buffer = buf;
    var f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cutoff || 900;
    var g = ac.createGain(); g.gain.value = vol || 0.12;
    src.connect(f); f.connect(g); g.connect(ac.destination); src.start();
  }
  function sndShoot() { tone(900, 1600, 0.08, "square", 0.1); noise(0.05, 3000, 0.06); }
  function sndPickup() { tone(600, 1000, 0.1, "triangle", 0.16); tone(900, 1300, 0.1, "triangle", 0.13, 0.08); }
  function sndDeliver(){ [700,900,1200].forEach(function (f,i){ tone(f, f*1.3, 0.14, "triangle", 0.16, i*0.1); }); }
  function sndRing() { tone(1200, 1800, 0.1, "square", 0.12); }
  function sndHit() { noise(0.3, 800, 0.28); tone(180, 70, 0.3, "sawtooth", 0.2); }
  function sndWeb() { tone(1400, 900, 0.1, "sawtooth", 0.08); }
  function sndEmpty() { tone(160, 100, 0.12, "square", 0.12); }

  /* ---------------------- Утилиты ---------------------- */
  function rand(a, b) { return Math.random() * (b - a) + a; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }

  /* ---------------------- Мир ---------------------- */
  function buildWorld() {
    buildings = [];
    anchors = [];
    pickups = [];
    dropoffs = [];
    rings = [];

    // Небоскрёбы
    var x = 120;
    var idx = 0;
    while (x < WORLD_W - 200) {
      var w = rand(160, 280);
      var h = rand(360, 900);
      var b = {
        x: x, y: GROUND_Y - h, w: w, h: h,
        col: ["#3a3a55","#45395c","#333a52","#4a3d5e","#2f3550"][idx % 5],
        lit: Math.random()
      };
      buildings.push(b);
      // точки крепления: два верхних угла + центр чуть выше
      anchors.push({ x: b.x + 12, y: b.y + 6 });
      anchors.push({ x: b.x + w - 12, y: b.y + 6 });
      anchors.push({ x: b.x + w / 2, y: b.y - 40 });
      // иногда — высокий "небесный" якорь над крышей
      if (Math.random() < 0.5) anchors.push({ x: b.x + w / 2, y: b.y - 220 });

      // некоторые — склады (взять), некоторые — дома доставки
      if (idx % 4 === 1) pickups.push({ x: b.x + w/2, y: b.y - 20, b: b, done: false });
      if (idx % 4 === 3) dropoffs.push({ x: b.x + w/2, y: b.y - 20, b: b, done: false });

      x += w + rand(160, 340);
      idx++;
    }
    // гарантируем хотя бы по несколько целей
    if (pickups.length === 0) { var pb = buildings[1]; pickups.push({ x: pb.x + pb.w/2, y: pb.y - 20, b: pb, done: false }); }
    if (dropoffs.length === 0) { var db = buildings[3] || buildings[buildings.length-1]; dropoffs.push({ x: db.x + db.w/2, y: db.y - 20, b: db, done: false }); }

    // Кольца-бонусы (в воздухе между домами)
    for (var i = 0; i < 12; i++) {
      rings.push({ x: 400 + i * 460 + rand(-80, 80), y: rand(300, GROUND_Y - 500), got: false, t: Math.random()*6.28 });
    }

    // Облака
    clouds = [];
    for (var c = 0; c < 26; c++) {
      clouds.push({ x: rand(0, WORLD_W), y: rand(80, 500), s: rand(60, 150), p: rand(0.2, 0.5) });
    }
    // Звёзды (в сумеречном небе)
    stars = [];
    for (var s = 0; s < 80; s++) {
      stars.push({ x: rand(0, WORLD_W), y: rand(20, 360), r: rand(0.6, 1.8), p: rand(0.06, 0.18) });
    }
    // Птицы (декор)
    birds = [];
    for (var b2 = 0; b2 < 8; b2++) {
      birds.push({ x: rand(200, WORLD_W), y: rand(150, 500), vx: rand(-40, -15), flap: Math.random()*6.28 });
    }
  }

  // Ближайшая невыполненная цель
  function nextTarget() {
    var list = carrying ? dropoffs : pickups;
    var bestT = null, bd = Infinity;
    for (var i = 0; i < list.length; i++) {
      if (list[i].done) continue;
      var d = dist(player.x, player.y, list[i].x, list[i].y);
      if (d < bd) { bd = d; bestT = list[i]; }
    }
    return bestT;
  }

  /* ---------------------- Игрок (паук) ---------------------- */
  function resetPlayer() {
    player = {
      x: 300, y: GROUND_Y - 700, vx: 0, vy: 0,
      attached: false, anchor: null, ropeLen: 0,
      facing: 1, anim: 0, swingPhase: 0, wallSlide: 0,
      wallTouch: 0, clinging: false
    };
    carrying = false;
    camX = player.x - W / 2; camY = player.y - H / 2;
  }

  /* ---------------------- Ввод ---------------------- */
  window.addEventListener("keydown", function (e) {
    var k = e.key.toLowerCase();
    if (k === "arrowleft" || k === "a" || k === "ф") keys.left = true;
    if (k === "arrowright" || k === "d" || k === "в") keys.right = true;
    if (k === "arrowup" || k === "w" || k === "ц") keys.up = true;
    if (k === "arrowdown" || k === "s" || k === "ы") keys.down = true;
    if (k === " ") { e.preventDefault(); if (!e.repeat) toggleWeb(); }
    if (k === "shift") { e.preventDefault(); toggleWeb(); }
    if (k === "e" || k === "у") { e.preventDefault(); action(); }
    if (!running && (e.key === " " || e.key === "Enter")) { e.preventDefault(); startGame(); }
  });
  window.addEventListener("keyup", function (e) {
    var k = e.key.toLowerCase();
    if (k === "arrowleft" || k === "a" || k === "ф") keys.left = false;
    if (k === "arrowright" || k === "d" || k === "в") keys.right = false;
    if (k === "arrowup" || k === "w" || k === "ц") keys.up = false;
    if (k === "arrowdown" || k === "s" || k === "ы") keys.down = false;
  });

  canvas.addEventListener("mousedown", function (e) {
    if (!running) return;
    if (isMobile) return;
    if (e.button === 0) toggleWeb();
    if (e.button === 2) action();
  });
  window.addEventListener("mouseup", function (e) {
    if (isMobile) return;
    // мышь тоже работает как переключатель — отпускание не сбрасывает паутину
  });
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  document.addEventListener("pointerlockchange", function () {});
  window.addEventListener("blur", function () { releaseWeb(); });

  /* ---------------------- Мобильное управление ---------------------- */
  var joyEl = document.getElementById("joy");
  var joyKnob = document.getElementById("joyKnob");
  var joyActive = false, joyId = null, joyCX = 0, joyCY = 0, joyDX = 0, joyDY = 0;
  joyEl.addEventListener("touchstart", function (e) {
    e.preventDefault();
    var t = e.changedTouches[0];
    joyActive = true; joyId = t.identifier;
    var r = joyEl.getBoundingClientRect();
    joyCX = r.left + r.width / 2; joyCY = r.top + r.height / 2;
    updateJoy(t.clientX, t.clientY);
  }, { passive: false });
  function updateJoy(x, y) {
    var dx = x - joyCX, dy = y - joyCY, max = 52, len = Math.hypot(dx, dy);
    if (len > max) { dx = dx / len * max; dy = dy / len * max; }
    joyKnob.style.transform = "translate(" + dx + "px," + dy + "px)";
    joyDX = dx / max; joyDY = dy / max;
  }
  window.addEventListener("touchmove", function (e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier === joyId) { e.preventDefault(); updateJoy(t.clientX, t.clientY); return; }
    }
  }, { passive: false });
  window.addEventListener("touchend", function (e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joyId) {
        joyActive = false; joyId = null; joyDX = 0; joyDY = 0;
        joyKnob.style.transform = "translate(0,0)";
      }
    }
  });
  function bindBtn(id, down, up) {
    var el = document.getElementById(id);
    el.addEventListener("touchstart", function (e) { e.preventDefault(); el.classList.add("press"); down(); }, { passive: false });
    el.addEventListener("touchend", function (e) { e.preventDefault(); el.classList.remove("press"); if (up) up(); }, { passive: false });
    el.addEventListener("mousedown", function (e) { if (isMobile) return; e.preventDefault(); down(); });
    el.addEventListener("mouseup", function (e) { if (isMobile) return; e.preventDefault(); if (up) up(); });
  }
  bindBtn("btnWeb", function () { toggleWeb(); });
  bindBtn("btnDrop", function () { action(); });

  /* ---------------------- Паутина ---------------------- */
  function toggleWeb() {
    if (!running || paused) return;
    if (player.attached) releaseWeb();
    else attachWeb();
  }
  function attachWeb() {
    if (!running || paused) return;
    if (player.attached) return;

    // выбор лучшей точки крепления
    var facing = player.vx >= 0.5 ? 1 : (player.vx <= -0.5 ? -1 : player.facing);
    var cands = candidateAnchors();
    var bestA = null, bestScore = -Infinity;
    for (var i = 0; i < cands.length; i++) {
      var a = cands[i];
      var dx = a.x - player.x;
      var dy = a.y - player.y;
      var d = Math.hypot(dx, dy);
      if (d > WEB_RANGE || d < MIN_ROPE) continue;
      // верхние точки — должны быть выше игрока; стены — почти на любой высоте
      if (a.type === "top" && dy > -30) continue;
      if (a.type === "wall" && dy > 70) continue;
      // предпочитаем направление движения
      if (dx * facing < -90) continue;
      var toward = dx * facing;
      var score = toward * 1.0 - dy * 0.6 - Math.abs(d - 360) * 0.6;
      if (a.type === "top") score += 40;             // верхние точки чуть предпочтительнее
      if (score > bestScore) { bestScore = score; bestA = a; }
    }
    if (bestA) {
      player.attached = true;
      player.anchor = bestA;
      player.ropeLen = Math.max(MIN_ROPE, dist(player.x, player.y, bestA.x, bestA.y));
      sndShoot();
      burst(bestA.x, bestA.y, "#e8f4ff", 6);
      updateHUD();
      return;
    }

    // fallback: если рядом стена — цепляемся прямо в неё
    if (player.wallTouch !== 0) {
      var wallX = player.x + player.wallTouch * 12;
      var wa = { x: wallX, y: player.y - 30, type: "wall" };
      player.attached = true;
      player.anchor = wa;
      player.ropeLen = Math.max(MIN_ROPE, 60);
      sndShoot();
      burst(wa.x, wa.y, "#e8f4ff", 6);
      updateHUD();
      return;
    }

    sndEmpty(); flashTask("Не за что зацепиться! 😅");
  }

  // Все возможные точки крепления: верхушки зданий + точки на стенах
  function candidateAnchors() {
    var pts = [];
    for (var i = 0; i < buildings.length; i++) {
      var b = buildings[i];
      // верхние точки
      pts.push({ x: b.x + 8, y: b.y - 4, type: "top" });
      pts.push({ x: b.x + b.w - 8, y: b.y - 4, type: "top" });
      pts.push({ x: b.x + b.w / 2, y: b.y - 30, type: "top" });
      // точки на левой и правой стенах (можно цепляться за стены!)
      for (var y = b.y + 30; y < GROUND_Y - 20; y += 64) {
        pts.push({ x: b.x + 6, y: y, type: "wall" });
        pts.push({ x: b.x + b.w - 6, y: y, type: "wall" });
      }
    }
    return pts;
  }
  function releaseWeb() {
    if (!player || !player.attached) return;
    player.attached = false;
    player.anchor = null;
    player.facing = player.vx >= 0 ? 1 : -1;
  }

  function action() {
    if (!running || paused) return;
    if (!carrying) {
      var t = nextTarget();
      if (t && dist(player.x, player.y, t.x, t.y) < 110) { pickup(t); }
      else { flashTask("Подлетни к складу ближе 🏭"); sndEmpty(); }
    } else {
      var t2 = nextTarget();
      if (t2 && dist(player.x, player.y, t2.x, t2.y) < 110) { deliver(t2); }
      else { flashTask("Подлетни к дому ближе 🏠"); sndEmpty(); }
    }
  }

  function pickup(p) {
    p.done = true;
    carrying = true;
    sndPickup();
    burst(p.x, p.y, "#ffd76e", 14);
    flashTask("Посылка взята! Доставь её 📦");
    updateHUD();
  }
  function deliver(d) {
    d.done = true;
    carrying = false;
    delivered++;
    combo++;
    var pts = 100 + Math.min(combo, 5) * 20;
    score += pts;
    sndDeliver();
    burst(d.x, d.y, "#8dffb4", 20);
    flashTask("Доставлено! +" + pts + (combo > 1 ? " (×" + combo + ")" : "") + " ✨");
    // перезапускаем цели, чтобы можно было играть бесконечно
    pickups.forEach(function (x) { x.done = false; });
    dropoffs.forEach(function (x) { x.done = false; });
    updateHUD();
  }

  var taskFlashT = 0;
  function flashTask(txt) { taskEl.innerHTML = txt; taskFlashT = 2.2; }
  function updateTask() {
    if (taskFlashT > 0) return;
    var t = nextTarget();
    if (!t) { taskEl.innerHTML = "Цель найдена! 🎯"; return; }
    var d = Math.round(dist(player.x, player.y, t.x, t.y) / 10);
    if (!carrying) taskEl.innerHTML = "🏭 Лети к складу · <span class='hl'>" + d + " м</span>";
    else taskEl.innerHTML = "🏠 Доставь в дом · <span class='hl'>" + d + " м</span>";
  }
  function updateArrow() {
    var t = nextTarget();
    if (!t || !running) { arrowEl.style.opacity = "0"; return; }
    var sx = t.x - camX, sy = t.y - camY;
    var ang = Math.atan2(sy - H / 2, sx - W / 2);
    var radius = Math.min(W, H) * 0.36;
    var ax = W / 2 + Math.cos(ang) * radius;
    var ay = H / 2 + Math.sin(ang) * radius;
    if (sx > 60 && sx < W - 60 && sy > 60 && sy < H - 60) { arrowEl.style.opacity = "0"; return; }
    arrowEl.style.opacity = "0.95";
    arrowEl.style.left = (ax - 16) + "px";
    arrowEl.style.top = (ay - 16) + "px";
    arrowEl.style.transform = "rotate(" + (ang * 180 / Math.PI) + "deg)";
  }

  /* ---------------------- Эффекты ---------------------- */
  function burst(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      particles.push({
        x: x, y: y, vx: rand(-180, 180), vy: rand(-180, 180),
        life: rand(0.4, 0.9), max: 0.9, color: color, r: rand(2, 5)
      });
    }
  }
  function triggerShake(t, m) { shakeT = t; shakeMag = m; }

  /* ---------------------- Физика ---------------------- */
  function update(dt) {
    timeNow += dt;
    var p = player;

    // восстановление паутины (паутина бесконечна — ничего не тратится)

    // ==== горизонтальное управление ====
    var dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (joyActive) dir += joyDX;
    dir = clamp(dir, -1, 1);
    if (dir > 0.1) p.facing = 1;
    if (dir < -0.1) p.facing = -1;

    // ==== гравитация ====
    p.vy += GRAVITY * dt;

    // в свободном полёте можно немного рулить
    if (!p.attached) {
      if (dir !== 0) p.vx += dir * 520 * dt;
      p.vx -= p.vx * AIR_DRAG * dt;
      p.vy -= p.vy * AIR_DRAG * 0.2 * dt;
    } else {
      // подтягивание троса (сокращение) — для набора скорости/высоты
      var reel = 0;
      if (keys.up || joyDY < -0.3) reel = -1;      // сократить трос
      if (keys.down || joyDY > 0.3) reel = 1;      // удлинить трос
      p.ropeLen = clamp(p.ropeLen + reel * WEB_REEL * dt, MIN_ROPE, WEB_RANGE);
      // лёгкое управление в стороны в каче
      if (dir !== 0) p.vx += dir * 220 * dt;
    }

    // ограничение скорости
    p.vx = clamp(p.vx, -MAX_SPEED, MAX_SPEED);
    p.vy = clamp(p.vy, -MAX_SPEED, MAX_SPEED);

    // ==== интегрирование ====
    p.x += p.vx * dt;
    p.y += p.vy * dt;

    // ==== ограничение троса (маятник) ====
    if (p.attached && p.anchor) {
      var ax = p.anchor.x, ay = p.anchor.y;
      var dx = p.x - ax, dy = p.y - ay;
      var d = Math.hypot(dx, dy) || 1;
      if (d > p.ropeLen) {
        var nx = dx / d, ny = dy / d;
        p.x = ax + nx * p.ropeLen;
        p.y = ay + ny * p.ropeLen;
        // убираем радиальную (наружу) составляющую скорости
        var radial = p.vx * nx + p.vy * ny;
        if (radial > 0) {
          p.vx -= radial * nx * 0.96;
          p.vy -= radial * ny * 0.96;
        }
        // небольшое ускорение вперёд при раскачивании (чтобы разгоняться)
        p.vx += Math.sign(p.vx || p.facing) * 30 * dt;
      }
    }

    // ==== столкновения со зданиями ====
    var touchingWall = 0;   // -1 левая стена, +1 правая стена, 0 нет
    for (var i = 0; i < buildings.length; i++) {
      var b = buildings[i];
      var px = p.x, py = p.y;
      if (px > b.x - 12 && px < b.x + b.w + 12 && py > b.y && py < GROUND_Y) {
        // выталкиваем к ближайшей грани
        var dLeft = Math.abs(px - (b.x - 12));
        var dRight = Math.abs(px - (b.x + b.w + 12));
        var dTop = Math.abs(py - b.y);
        if (dTop < dLeft && dTop < dRight) {
          p.y = b.y - 12;
          if (p.vy > 0) p.vy = 0;
        } else if (dLeft < dRight) {
          p.x = b.x - 12;
          if (p.vx > 0) p.vx = -p.vx * 0.35;
          touchingWall = -1;
        } else {
          p.x = b.x + b.w + 12;
          if (p.vx < 0) p.vx = -p.vx * 0.35;
          touchingWall = 1;
        }
        releaseWeb();
      }
    }

    // ==== прилипание к стенам (скольжение / удержание) ====
    p.wallTouch = touchingWall;
    if (touchingWall !== 0) {
      // держим направление в сторону стены — паук цепляется и висит
      var intoWall = (touchingWall === -1 && dir < -0.1) || (touchingWall === 1 && dir > 0.1);
      if (intoWall) {
        p.vy = Math.min(p.vy, 40);    // почти висит
        p.clinging = true;
        if (Math.random() < dt * 4) burst(p.x - touchingWall * 12, p.y, "#8fe0ff", 1);
      } else {
        if (p.vy > 180) p.vy = 180;   // иначе — медленно скользит
        p.clinging = false;
      }
    } else {
      p.clinging = false;
    }

    // ==== земля ====
    if (p.y > GROUND_Y - 16) {
      p.y = GROUND_Y - 16;
      if (p.vy > 400) { sndHit(); triggerShake(0.3, 8); burst(p.x, p.y, "#a8a0c0", 8); }
      p.vy = 0;
      releaseWeb();
      // отталкиваемся, чтобы не застрять
      p.vx *= 0.8;
    }

    // границы мира
    if (p.x < 20) { p.x = 20; p.vx = Math.abs(p.vx) * 0.3; }
    if (p.x > WORLD_W - 20) { p.x = WORLD_W - 20; p.vx = -Math.abs(p.vx) * 0.3; }
    if (p.y < 20) { p.y = 20; p.vy = Math.abs(p.vy) * 0.3; }

    // анимация
    p.anim += dt * (1 + Math.abs(p.vx) / 200);
    p.swingPhase += dt;

    // ==== бонус-кольца ====
    for (var r = 0; r < rings.length; r++) {
      var rg = rings[r];
      rg.t += dt * 2;
      if (rg.got) continue;
      if (dist(p.x, p.y, rg.x, rg.y) < 50) {
        rg.got = true;
        score += 40;
        sndRing(); burst(rg.x, rg.y, "#8fe0ff", 12);
        flashTask("Кольцо! +40 ✨");
        updateHUD();
      }
    }

    // ==== авто-подбор/доставка при пролёте рядом ====
    if (!carrying) {
      var t = nextTarget();
      if (t && dist(p.x, p.y, t.x, t.y) < 90) pickup(t);
    } else {
      var t2 = nextTarget();
      if (t2 && dist(p.x, p.y, t2.x, t2.y) < 90) deliver(t2);
    }

    // ==== камера ====
    var tcx = p.x + p.vx * 0.18 - W / 2;
    var tcy = p.y + p.vy * 0.10 - H / 2;
    camX += (tcx - camX) * Math.min(1, dt * 6);
    camY += (tcy - camY) * Math.min(1, dt * 6);
    camX = clamp(camX, -100, WORLD_W - W + 100);
    camY = clamp(camY, -300, GROUND_Y - H + 200);

    // ==== частицы ====
    for (var f = particles.length - 1; f >= 0; f--) {
      var pt = particles[f];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vy += 120 * dt; pt.vx *= 0.98;
      pt.life -= dt;
      if (pt.life <= 0) particles.splice(f, 1);
    }

    // птицы
    for (var bi = 0; bi < birds.length; bi++) {
      var bd = birds[bi];
      bd.x += bd.vx * dt; bd.flap += dt * 10;
      if (bd.x < 0) bd.x = WORLD_W;
    }

    if (shakeT > 0) shakeT -= dt;
    if (taskFlashT > 0) taskFlashT -= dt;

    updateTask();
    updateArrow();
    updateHUD();

    // сплэш скорости
    var spd = Math.hypot(p.vx, p.vy);
    dashEl.style.opacity = clamp((spd - 900) / 900, 0, 0.7);
  }

  /* ---------------------- Отрисовка ---------------------- */
  function render() {
    var sx = 0, sy = 0;
    if (shakeT > 0) { sx = rand(-shakeMag, shakeMag); sy = rand(-shakeMag, shakeMag); }

    drawSky();
    drawStars();

    ctx.save();
    ctx.translate(sx, sy);

    // параллакс-облака
    for (var i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      var cx = c.x - camX * c.p;
      var cy = c.y - camY * c.p;
      if (cx < -300 || cx > W + 300) continue;
      drawCloud(cx, cy, c.s);
    }
    // параллакс-город сзади
    drawBackCity();

    // птицы
    for (var b = 0; b < birds.length; b++) {
      var bd = birds[b];
      var bx = bd.x - camX * 0.7, by = bd.y - camY * 0.7;
      if (bx < -40 || bx > W + 40) continue;
      ctx.save(); ctx.translate(bx, by);
      ctx.fillStyle = "rgba(40,30,50,.6)";
      var wing = Math.sin(bd.flap) * 6;
      ctx.beginPath(); ctx.ellipse(0, 0, 7, 4, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-4,0); ctx.lineTo(-14,-wing); ctx.lineTo(-2,-2); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(4,0); ctx.lineTo(14,-wing); ctx.lineTo(2,-2); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    // мир
    ctx.save();
    ctx.translate(-camX, -camY);
    drawGround();
    drawBuildings();
    drawRings();
    drawTargets();
    drawParticles();
    drawSpider();
    ctx.restore();

    ctx.restore();
  }

  function drawSky() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#1a1030");
    g.addColorStop(0.4, "#3a2050");
    g.addColorStop(0.7, "#8a3a5a");
    g.addColorStop(1, "#e07a5a");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // луна
    var mx = W * 0.78 - camX * 0.03;
    var my = H * 0.16 - camY * 0.03;
    var mg = ctx.createRadialGradient(mx, my, 6, mx, my, 90);
    mg.addColorStop(0, "rgba(255,250,220,.95)");
    mg.addColorStop(0.3, "rgba(255,245,200,.3)");
    mg.addColorStop(1, "rgba(255,240,180,0)");
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(mx, my, 90, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fdf6dc";
    ctx.beginPath(); ctx.arc(mx, my, 32, 0, Math.PI * 2); ctx.fill();
  }

  function drawStars() {
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var x = s.x - camX * s.p;
      if (x < -10 || x > W + 10) continue;
      var y = s.y - camY * s.p;
      ctx.globalAlpha = 0.5 + 0.5 * Math.sin(timeNow * 2 + i);
      ctx.fillStyle = "#dbe9ff";
      ctx.fillRect(x, y, s.r, s.r);
    }
    ctx.globalAlpha = 1;
  }

  function drawCloud(x, y, s) {
    ctx.fillStyle = "rgba(200,170,210,.35)";
    ctx.beginPath();
    ctx.ellipse(x, y, s, s * 0.5, 0, 0, Math.PI * 2);
    ctx.ellipse(x + s * 0.6, y + s * 0.1, s * 0.7, s * 0.4, 0, 0, Math.PI * 2);
    ctx.ellipse(x - s * 0.6, y + s * 0.1, s * 0.6, s * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBackCity() {
    // дальний слой домов (параллакс)
    ctx.fillStyle = "#241a3a";
    var offset = -camX * 0.35;
    var spacing = 130;
    var startI = Math.floor((-offset) / spacing) - 1;
    var baseY = H - (GROUND_Y - camY) * 0.35;
    for (var i = startI; i < startI + Math.ceil(W / spacing) + 3; i++) {
      var bx = offset + i * spacing;
      var seed = ((i * 9301 + 49297) % 233280) / 233280;
      var bh = 120 + seed * 300;
      ctx.fillRect(bx, baseY - bh, spacing * 0.8, bh + H);
      // окна
      ctx.fillStyle = "rgba(255,214,140,.25)";
      for (var wy = 0; wy < Math.floor(bh / 50); wy++) {
        for (var wx = 0; wx < 2; wx++) {
          if ((seed * 100 + wx * 7 + wy * 13) % 3 < 1.6) continue;
          ctx.fillRect(bx + 16 + wx * 34, baseY - bh + 24 + wy * 50, 14, 20);
        }
      }
      ctx.fillStyle = "#241a3a";
    }
  }

  /* ---------- Якоря для паутины (тонкие точки) ---------- */
  function drawAnchors() {
    var cands = candidateAnchors();
    for (var i = 0; i < cands.length; i++) {
      var a = cands[i];
      if (a.x < camX - 40 || a.x > camX + W + 40) continue;
      var d = dist(player.x, player.y, a.x, a.y);
      var reachable = d < WEB_RANGE && !player.attached;
      if (a.type === "top") reachable = reachable && a.y < player.y - 30;
      if (a.type === "wall") reachable = reachable && a.y < player.y + 70;
      var show = reachable || d < WEB_RANGE * 0.6;
      if (!show) continue;
      ctx.globalAlpha = reachable ? 0.85 : 0.18;
      if (a.type === "wall") {
        // на стенах — маленькие «крючки», показываем только вблизи
        if (d > WEB_RANGE * 0.75) continue;
        ctx.fillStyle = reachable ? "#8fe0ff" : "#4a5a7a";
        ctx.fillRect(a.x - 2, a.y - 3, 4, 6);
      } else {
        ctx.fillStyle = reachable ? "#ffd76e" : "#6a5a3a";
        ctx.beginPath(); ctx.arc(a.x, a.y, reachable ? 4.5 : 2.5, 0, Math.PI * 2); ctx.fill();
        if (reachable) {
          ctx.strokeStyle = "rgba(255,215,110,.5)"; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.arc(a.x, a.y, 9, 0, Math.PI * 2); ctx.stroke();
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawBuildings() {
    for (var i = 0; i < buildings.length; i++) {
      var b = buildings[i];
      if (b.x + b.w < camX - 100 || b.x > camX + W + 100) continue;
      // тень
      ctx.fillStyle = "rgba(0,0,0,.25)";
      ctx.fillRect(b.x + 8, b.y + 10, b.w, b.h);
      // тело здания
      var g = ctx.createLinearGradient(b.x, 0, b.x + b.w, 0);
      g.addColorStop(0, "#2a2a40");
      g.addColorStop(0.5, b.col);
      g.addColorStop(1, "#1a1a2c");
      ctx.fillStyle = g;
      ctx.fillRect(b.x, b.y, b.w, b.h);
      // верхняя грань
      ctx.fillStyle = "rgba(255,255,255,.12)";
      ctx.fillRect(b.x, b.y, b.w, 6);
      // окна
      var cols = Math.max(2, Math.floor(b.w / 44));
      var rows = Math.max(3, Math.floor(b.h / 60));
      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          var lit = ((Math.floor(b.lit * 1000) + r * 7 + c * 13) % 3) === 0;
          ctx.fillStyle = lit ? "rgba(255,210,130,.9)" : "rgba(30,30,55,.9)";
          ctx.fillRect(b.x + 14 + c * 44, b.y + 22 + r * 60, 24, 32);
        }
      }
    }
    drawAnchors();
  }

  function drawGround() {
    var g = ctx.createLinearGradient(0, GROUND_Y, 0, GROUND_Y + 200);
    g.addColorStop(0, "#1a1428");
    g.addColorStop(1, "#0a0814");
    ctx.fillStyle = g;
    ctx.fillRect(-200, GROUND_Y, WORLD_W + 400, 300);
    // дорожная разметка
    ctx.strokeStyle = "rgba(255,214,120,.35)";
    ctx.lineWidth = 3;
    ctx.setLineDash([30, 30]);
    ctx.beginPath(); ctx.moveTo(-200, GROUND_Y + 30); ctx.lineTo(WORLD_W + 200, GROUND_Y + 30); ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawRings() {
    for (var i = 0; i < rings.length; i++) {
      var r = rings[i];
      if (r.got) continue;
      if (r.x < camX - 80 || r.x > camX + W + 80) continue;
      var bob = Math.sin(r.t) * 6;
      ctx.save();
      ctx.translate(r.x, r.y + bob);
      ctx.rotate(Math.sin(r.t * 0.5) * 0.15);
      var gg = ctx.createRadialGradient(0, 0, 4, 0, 0, 42);
      gg.addColorStop(0, "rgba(140,224,255,.5)");
      gg.addColorStop(1, "rgba(140,224,255,0)");
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(0, 0, 42, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#8fe0ff"; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  }

  /* ---------- Склады и дома-цели ---------- */
  function drawTargets() {
    var t = nextTarget();
    // склады
    for (var i = 0; i < pickups.length; i++) {
      var pk = pickups[i];
      if (pk.done) continue;
      drawPackageMarker(pk.x, pk.y, pk === t && !carrying, "#ffd76e");
    }
    // дома доставки
    for (var j = 0; j < dropoffs.length; j++) {
      var dr = dropoffs[j];
      if (dr.done) continue;
      drawPackageMarker(dr.x, dr.y, dr === t && carrying, "#8dffb4", true);
    }
    // груз на игроке
  }
  function drawPackageMarker(x, y, isTarget, color, isHouse) {
    if (x < camX - 80 || x > camX + W + 80) return;
    var bob = Math.sin(timeNow * 3) * 5;
    var cy = y + bob;
    // свечение
    var gg = ctx.createRadialGradient(x, cy, 4, x, cy, 56);
    gg.addColorStop(0, (color === "#8dffb4" ? "rgba(140,255,180,.5)" : "rgba(255,215,110,.5)"));
    gg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(x, cy, 56, 0, Math.PI * 2); ctx.fill();
    // коробка
    ctx.fillStyle = "#c98a4a";
    ctx.fillRect(x - 16, cy - 16, 32, 32);
    ctx.strokeStyle = "#8a5a2a"; ctx.lineWidth = 2;
    ctx.strokeRect(x - 16, cy - 16, 32, 32);
    ctx.beginPath();
    ctx.moveTo(x, cy - 16); ctx.lineTo(x, cy + 16);
    ctx.moveTo(x - 16, cy); ctx.lineTo(x + 16, cy);
    ctx.stroke();
    // стрелка цели
    if (isTarget) {
      var b2 = Math.abs(Math.sin(timeNow * 4)) * 10;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x, cy - 40 - b2);
      ctx.lineTo(x - 12, cy - 58 - b2);
      ctx.lineTo(x + 12, cy - 58 - b2);
      ctx.closePath(); ctx.fill();
    }
    // подпись
    ctx.fillStyle = color;
    ctx.font = "800 13px -apple-system, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(isHouse ? "🏠 ДОМ" : "🏭 СКЛАД", x, cy - 70 - (isTarget ? 20 : 0));
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- Паук ---------- */
  function drawSpider() {
    var p = player;

    // трос паутины
    if (p.attached && p.anchor) {
      ctx.strokeStyle = "rgba(240,248,255,.9)";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y - 6);
      ctx.lineTo(p.anchor.x, p.anchor.y);
      ctx.stroke();
      // блик
      ctx.strokeStyle = "rgba(143,224,255,.5)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y - 6);
      ctx.lineTo(p.anchor.x, p.anchor.y);
      ctx.stroke();
    }

    // направление — по скорости
    var face = p.vx < -20 ? -1 : 1;

    // угол наклона в каче
    var tilt = 0;
    if (p.attached && p.anchor) {
      var ang = Math.atan2(p.anchor.y - p.y, p.anchor.x - p.x);
      tilt = (ang + Math.PI / 2) * 0.5;
    } else {
      tilt = clamp(p.vy / 1600, -0.5, 0.5);
    }

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(face, 1);
    ctx.rotate(tilt * 0.6);

    // тень
    ctx.save();
    ctx.globalAlpha = 0.2; ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.ellipse(0, 30, 16, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // рука-паутина тянется вверх при каче
    var armUp = p.attached;
    // тело (красно-синий костюм)
    ctx.fillStyle = "#c0392b";
    ctx.beginPath(); ctx.ellipse(0, 6, 12, 16, 0, 0, Math.PI * 2); ctx.fill();
    // синие ноги
    ctx.strokeStyle = "#2a3a8a"; ctx.lineWidth = 7; ctx.lineCap = "round";
    var legSw = Math.sin(p.anim * 8) * 6;
    ctx.beginPath(); ctx.moveTo(-3, 18); ctx.lineTo(-8 + legSw, 34); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(3, 18); ctx.lineTo(8 - legSw, 34); ctx.stroke();
    // синие руки
    ctx.strokeStyle = "#2a3a8a"; ctx.lineWidth = 6;
    if (armUp) {
      ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(14, -22); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-6, 2); ctx.lineTo(-12, 14); ctx.stroke();
    } else {
      var armSw = Math.sin(p.anim * 8 + 1) * 8;
      ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(14, 6 + armSw); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(-14, 6 - armSw); ctx.stroke();
    }

    // голова (маска)
    ctx.fillStyle = "#d13b2a";
    ctx.beginPath(); ctx.arc(0, -12, 11, 0, Math.PI * 2); ctx.fill();
    // глаза маски
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.ellipse(-4, -13, 5, 6, 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(5, -13, 5, 6, -0.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#1a1a2a";
    ctx.beginPath(); ctx.ellipse(-4, -12, 2, 3, 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(5, -12, 2, 3, -0.2, 0, Math.PI * 2); ctx.fill();
    // паутина на голове (узор)
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-8, -16); ctx.lineTo(0, -8); ctx.lineTo(8, -16);
    ctx.moveTo(-6, -10); ctx.lineTo(0, -6); ctx.lineTo(6, -10);
    ctx.stroke();

    ctx.restore();

    // посылка в руках
    if (carrying) {
      ctx.save();
      ctx.translate(p.x + face * 14, p.y + 4);
      ctx.fillStyle = "#c98a4a";
      ctx.fillRect(-10, -10, 20, 20);
      ctx.strokeStyle = "#8a5a2a"; ctx.lineWidth = 2;
      ctx.strokeRect(-10, -10, 20, 20);
      ctx.beginPath();
      ctx.moveTo(0, -10); ctx.lineTo(0, 10);
      ctx.moveTo(-10, 0); ctx.lineTo(10, 0);
      ctx.stroke();
      ctx.restore();
    }
  }

  /* ---------------------- HUD ---------------------- */
  function updateHUD() {
    deliveredEl.textContent = delivered;
    scoreEl.textContent = score;
    cargoEl.textContent = carrying ? "📦 есть" : "—";
    cargoEl.style.color = carrying ? "#ffd76e" : "#fff";
  }

  /* ---------------------- Экраны ---------------------- */
  function showStart() {
    overlay.classList.remove("hidden");
    var keysHtml = isMobile
      ? '<div class="keys">' +
          '<div><span class="key">🕸️</span> кнопка — бросить паутину (нажми ещё раз — отпустить)</div>' +
          '<div><span class="key">📦</span> кнопка — взять/доставить (или подлетни ближе)</div>' +
          '<div><span class="key">🕹️</span> джойстик — рулить в полёте</div>' +
        '</div>'
      : '<div class="keys">' +
          '<div><span class="key">ПРОБЕЛ</span> — бросить паутину 🕸️</div>' +
          '<div><span class="key">ПРОБЕЛ</span> ещё раз — отпустить и полететь</div>' +
          '<div><span class="key">ЛКМ</span> — тоже работает</div>' +
          '<div><span class="key">W</span><span class="key">S</span> — подтянуть/удлинить трос</div>' +
          '<div><span class="key">A</span><span class="key">D</span> — рулить в полёте</div>' +
          '<div><span class="key">E</span> или <span class="key">ПКМ</span> — взять/доставить посылку</div>' +
        '</div>';
    overlay.innerHTML =
      '<div class="card">' +
        '<h1>🕷️ ПАУК-КУРЬЕР</h1>' +
        '<p>Ты — супергерой-курьер. <b>Стреляй паутиной в небоскрёбы</b> и качайся между ними, как Человек-паук!</p>' +
        '<p>Забери посылку 🏭 и доставь её в дом 🏠. Собирай кольца — паутина у тебя <b>бесконечная</b> 🕸️.</p>' +
        keysHtml +
        '<div class="legend">' +
          '<span>🎯 тянись к ярким точкам — там крепится паутина</span>' +
          '<span>🏭 склад → 🏠 дом</span>' +
        '</div>' +
        '<button id="startBtn">ПОЛЕТЕЛИ!</button>' +
        '<p style="margin-top:12px;font-size:11px;opacity:.55">Стрелка показывает, куда лететь.</p>' +
      '</div>';
  }

  function endGame(reason) {
    running = false;
    if (score > best) { best = score; try { localStorage.setItem("spider_courier_best", String(best)); } catch(e){} }
    bestEl.textContent = best;
    overlay.classList.remove("hidden");
    overlay.innerHTML =
      '<div class="card">' +
        '<h1>🕸️ Полёт завершён</h1>' +
        '<p>' + (reason || "Хорошая работа, паук!") + '</p>' +
        '<div class="big">' + score + '</div>' +
        '<div class="row">' +
          '<div class="col">Доставлено<b>' + delivered + '</b></div>' +
          '<div class="col">Рекорд<b>' + best + '</b></div>' +
        '</div>' +
        '<button id="startBtn">Ещё раз</button>' +
      '</div>';
  }

  function startGame() {
    getAudio();
    if (rafId) cancelAnimationFrame(rafId);
    buildWorld();
    resetPlayer();
    delivered = 0; score = 0; timeNow = 0; combo = 0;
    particles = [];
    taskFlashT = 0;
    updateHUD();
    overlay.classList.add("hidden");
    running = true; paused = false;
    lastTs = 0;
    rafId = requestAnimationFrame(frame);
  }

  overlay.addEventListener("click", function (e) {
    var btn = e.target.closest && e.target.closest("button");
    if (btn) startGame();
  });
  overlay.addEventListener("touchend", function (e) {
    var btn = e.target.closest && e.target.closest("button");
    if (btn) { e.preventDefault(); startGame(); }
  });
  document.addEventListener("keydown", function (e) {
    if (!running && (e.key === " " || e.key === "Enter")) { e.preventDefault(); startGame(); }
  });

  function frame(ts) {
    var dt = lastTs ? Math.min((ts - lastTs) / 1000, 0.033) : 0.016;
    lastTs = ts;
    if (running) {
      var steps = 2, h = dt / steps;
      for (var i = 0; i < steps && running; i++) update(h);
    }
    render();
    rafId = requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);

  resize();
  buildWorld();
  resetPlayer();
  updateHUD();
  showStart();
})();
</script>
</body>
</html>
