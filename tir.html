<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Тир — стрельба по мишеням</title>
<style>
  /* ====== Общий вид ====== */
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b1020;
    color: #eaf0ff;
    -webkit-user-select: none;
    user-select: none;
  }

  #game {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  /* ====== Верхняя панель со счётом ====== */
  #hud {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 10px 16px;
    background: rgba(255, 255, 255, 0.06);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 15px;
    z-index: 5;
  }
  #hud .item { white-space: nowrap; }
  #hud .label { opacity: 0.65; margin-right: 4px; }
  #hud .val { font-weight: 700; font-variant-numeric: tabular-nums; }
  #combo { color: #ffd84d; font-weight: 700; }
  #hud .spacer { flex: 1; }

  /* Полоска оставшегося времени */
  #timebar-wrap {
    height: 6px;
    background: rgba(255, 255, 255, 0.08);
  }
  #timebar {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #35e08a, #ffd84d, #ff5a5a);
    background-size: 300% 100%;
    transition: width 0.1s linear;
  }

  /* ====== Игровое поле ====== */
  #arena {
    position: relative;
    flex: 1;
    overflow: hidden;
    cursor: none;                 /* прячем обычный курсор — вместо него прицел */
    touch-action: none;
    background:
      radial-gradient(circle at 20% 15%, rgba(90, 160, 255, 0.12), transparent 40%),
      radial-gradient(circle at 80% 85%, rgba(255, 90, 120, 0.12), transparent 40%),
      #0b1020;
  }

  /* Кастомный прицел */
  #crosshair {
    position: absolute;
    width: 34px;
    height: 34px;
    margin: -17px 0 0 -17px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 20;
  }
  #crosshair::before,
  #crosshair::after {
    content: "";
    position: absolute;
    background: #ff4d6d;
    box-shadow: 0 0 6px rgba(255, 77, 109, 0.9);
  }
  #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; margin-left: -1px; }
  #crosshair::after  { top: 50%; left: 0; height: 2px; width: 100%; margin-top: -1px; }
  #crosshair .dot {
    position: absolute;
    left: 50%; top: 50%;
    width: 6px; height: 6px;
    margin: -3px 0 0 -3px;
    border-radius: 50%;
    background: #ff4d6d;
  }

  /* ====== Мишень ====== */
  .target {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle,
      #ff3b3b 0 20%,
      #ffffff 20% 40%,
      #ff3b3b 40% 60%,
      #ffffff 60% 80%,
      #ff3b3b 80% 100%);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(0, 0, 0, 0.25);
    animation: pop 0.16s cubic-bezier(.2, 1.6, .5, 1);
    will-change: transform, opacity;
  }
  @keyframes pop {
    from { transform: scale(0.2); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  .target.hit {
    transform: scale(1.35);
    opacity: 0;
    transition: transform 0.18s, opacity 0.18s;
  }
  .target.expire {
    transform: scale(0.4);
    opacity: 0;
    transition: transform 0.25s, opacity 0.25s;
  }

  /* Всплывающие очки при попадании */
  .float {
    position: absolute;
    font-weight: 800;
    font-size: 20px;
    color: #35e08a;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    pointer-events: none;
    animation: floatUp 0.7s ease-out forwards;
    z-index: 15;
  }
  .float.bad { color: #ff5a5a; }
  @keyframes floatUp {
    from { transform: translate(-50%, -50%) scale(0.7); opacity: 1; }
    to   { transform: translate(-50%, -160%) scale(1.1); opacity: 0; }
  }

  /* ====== Экраны (старт / конец игры) ====== */
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(6, 9, 20, 0.82);
    backdrop-filter: blur(4px);
    z-index: 30;
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay .card {
    max-width: 460px;
    padding: 32px 28px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  #overlay h1 { margin: 0 0 10px; font-size: 34px; }
  #overlay p { margin: 10px 0; line-height: 1.55; opacity: 0.85; font-size: 15px; }
  #overlay .big { font-size: 44px; font-weight: 800; color: #ffd84d; margin: 6px 0; }
  #overlay button {
    margin-top: 20px;
    padding: 14px 34px;
    font-size: 18px;
    font-weight: 700;
    color: #08101f;
    background: linear-gradient(180deg, #6ff0a8, #35e08a);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(53, 224, 138, 0.35);
    transition: transform 0.1s, box-shadow 0.15s;
  }
  #overlay button:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(53, 224, 138, 0.45); }
  #overlay button:active { transform: translateY(1px) scale(0.98); }
  #overlay .row { display: flex; justify-content: center; gap: 28px; margin-top: 14px; }
  #overlay .row .col { opacity: 0.9; }
  #overlay .row .col b { display: block; font-size: 24px; margin-top: 4px; color: #fff; }
</style>
</head>
<body>
  <div id="game">
    <!-- Панель со счётом -->
    <div id="hud">
      <div class="item"><span class="label">Очки:</span><span class="val" id="score">0</span></div>
      <div class="item"><span class="label">Время:</span><span class="val" id="time">60</span></div>
      <div class="item"><span class="label">Точность:</span><span class="val" id="acc">—</span></div>
      <div class="item" id="combo"></div>
      <div class="spacer"></div>
      <div class="item"><span class="label">Рекорд:</span><span class="val" id="best">0</span></div>
    </div>
    <div id="timebar-wrap"><div id="timebar"></div></div>

    <!-- Игровое поле -->
    <div id="arena">
      <div id="crosshair"><span class="dot"></span></div>
      <div id="overlay"></div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  /* ===================== Настройки игры =====================
     Меняйте эти числа, чтобы настроить сложность.       */
  var DURATION     = 60;     // сколько длится раунд, секунд
  var START_DELAY  = 900;    // старт: пауза между мишенями, мс (меньше = чаще)
  var MIN_DELAY    = 320;    // самая маленькая пауза к концу игры
  var START_LIFE   = 1700;   // старт: сколько мишень живёт, мс
  var MIN_LIFE     = 650;    // самая короткая жизнь мишени
  /* ========================================================== */

  var arena     = document.getElementById("arena");
  var crosshair = document.getElementById("crosshair");
  var overlay   = document.getElementById("overlay");
  var scoreEl   = document.getElementById("score");
  var timeEl    = document.getElementById("time");
  var accEl     = document.getElementById("acc");
  var bestEl    = document.getElementById("best");
  var comboEl   = document.getElementById("combo");
  var timeBar   = document.getElementById("timebar");

  var running = false;
  var score = 0, shots = 0, hits = 0, combo = 0;
  var timeLeft = DURATION;
  var tickTimer = null, spawnTimer = null;
  var best = parseInt(localStorage.getItem("tir_best") || "0", 10) || 0;
  bestEl.textContent = best;

  /* ---------- Звуки (делаются прямо в браузере) ---------- */
  var audioCtx = null;
  function getAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function soundShot() {
    var ac = getAudio(); if (!ac) return;
    var dur = 0.08;
    var buf = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < data.length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 3);
    }
    var src = ac.createBufferSource(); src.buffer = buf;
    var flt = ac.createBiquadFilter(); flt.type = "lowpass"; flt.frequency.value = 1800;
    var g = ac.createGain(); g.gain.value = 0.35;
    src.connect(flt); flt.connect(g); g.connect(ac.destination);
    src.start();
  }
  function soundHit() {
    var ac = getAudio(); if (!ac) return;
    var t = ac.currentTime;
    var o = ac.createOscillator(); o.type = "triangle";
    o.frequency.setValueAtTime(880, t);
    o.frequency.exponentialRampToValueAtTime(1500, t + 0.08);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.25, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + 0.16);
  }
  function soundMiss() {
    var ac = getAudio(); if (!ac) return;
    var t = ac.currentTime;
    var o = ac.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(180, t);
    o.frequency.exponentialRampToValueAtTime(90, t + 0.12);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.18, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + 0.15);
  }

  /* ---------- Вспомогательные функции ---------- */
  function rand(min, max) { return Math.random() * (max - min) + min; }
  function accuracy() { return shots === 0 ? 0 : Math.round((hits / shots) * 100); }

  function updateHUD() {
    scoreEl.textContent = score;
    timeEl.textContent = Math.max(0, Math.ceil(timeLeft));
    accEl.textContent = shots === 0 ? "—" : accuracy() + "%";
    comboEl.textContent = combo >= 2 ? "🔥 " + combo + " подряд" : "";
    timeBar.style.width = Math.max(0, (timeLeft / DURATION) * 100) + "%";
  }

  function floatText(x, y, text, bad) {
    var el = document.createElement("div");
    el.className = "float" + (bad ? " bad" : "");
    el.textContent = text;
    el.style.left = x + "px";
    el.style.top = y + "px";
    arena.appendChild(el);
    setTimeout(function () { el.remove(); }, 700);
  }

  /* ---------- Создание мишени ---------- */
  function spawnTarget() {
    if (!running) return;

    var elapsed = DURATION - timeLeft;                 // сколько уже прошло
    var progress = elapsed / DURATION;                 // 0 → 1

    // Мишени становятся меньше и живут меньше к концу раунда
    var maxSize = 92 - progress * 36;                  // 92 → 56
    var minSize = 46 - progress * 16;                  // 46 → 30
    var size = rand(minSize, maxSize);

    var pad = 6;
    var maxX = Math.max(pad, arena.clientWidth - size - pad);
    var maxY = Math.max(pad, arena.clientHeight - size - pad);

    // Очки: чем меньше мишень — тем больше очков
    var points = Math.round((120 - size) / 5) * 5;

    var el = document.createElement("div");
    el.className = "target";
    el.style.width = size + "px";
    el.style.height = size + "px";
    el.style.left = rand(pad, maxX) + "px";
    el.style.top = rand(pad, maxY) + "px";
    el.dataset.points = points;

    // Сколько живёт эта мишень
    var life = rand(MIN_LIFE, START_LIFE) * (1 - progress * 0.45);

    el.addEventListener("pointerdown", function (e) {
      e.stopPropagation();
      if (!running || el.dataset.dead) return;
      el.dataset.dead = "1";

      var rect = arena.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var y = e.clientY - rect.top;

      shots++;
      hits++;
      combo++;

      var mult = Math.min(1 + (combo - 1) * 0.1, 3);   // множитель за серию
      var gained = Math.round(parseInt(el.dataset.points, 10) * mult);
      score += gained;

      soundShot();
      soundHit();
      floatText(x, y, "+" + gained + (combo >= 3 ? " x" + mult.toFixed(1) : ""), false);

      el.classList.add("hit");
      setTimeout(function () { el.remove(); }, 200);
      updateHUD();
    });

    arena.appendChild(el);

    // Мишень исчезла сама — серия сбрасывается
    setTimeout(function () {
      if (!running || el.dataset.dead) return;
      el.dataset.dead = "1";
      combo = 0;
      el.classList.add("expire");
      setTimeout(function () { el.remove(); }, 300);
      updateHUD();
    }, life);

    // Планируем следующую мишень
    var delay = Math.max(MIN_DELAY, START_DELAY - progress * (START_DELAY - MIN_DELAY));
    delay *= rand(0.7, 1.3);
    spawnTimer = setTimeout(spawnTarget, delay);
  }

  /* ---------- Промах по полю ---------- */
  arena.addEventListener("pointerdown", function (e) {
    if (!running) return;
    if (e.target.closest && e.target.closest(".target")) return;

    var rect = arena.getBoundingClientRect();
    var x = e.clientX - rect.left;
    var y = e.clientY - rect.top;

    shots++;
    combo = 0;
    soundShot();
    soundMiss();
    floatText(x, y, "мимо", true);
    updateHUD();
  });

  /* ---------- Прицел следует за курсором ---------- */
  arena.addEventListener("pointermove", function (e) {
    var rect = arena.getBoundingClientRect();
    crosshair.style.left = (e.clientX - rect.left) + "px";
    crosshair.style.top = (e.clientY - rect.top) + "px";
    crosshair.style.opacity = running ? "1" : "0";
  });
  arena.addEventListener("pointerleave", function () { crosshair.style.opacity = "0"; });

  /* ---------- Старт / конец игры ---------- */
  function clearTargets() {
    var list = arena.querySelectorAll(".target, .float");
    for (var i = 0; i < list.length; i++) list[i].remove();
  }

  function showStart() {
    overlay.classList.remove("hidden");
    overlay.innerHTML =
      '<div class="card">' +
        '<h1>🎯 Тир</h1>' +
        '<p>Кликай мышкой (или пальцем на телефоне) по мишеням.<br>' +
        'Чем <b>меньше</b> мишень — тем <b>больше очков</b>.<br>' +
        'Попадай подряд — растёт множитель очков!</p>' +
        '<p>У тебя <b>' + DURATION + ' секунд</b>. Вперёд!</p>' +
        '<button>Начать игру</button>' +
      '</div>';
  }

  function showGameOver() {
    var acc = accuracy();
    var isRecord = score > best;
    if (isRecord) {
      best = score;
      localStorage.setItem("tir_best", String(best));
    }
    bestEl.textContent = best;

    overlay.classList.remove("hidden");
    overlay.innerHTML =
      '<div class="card">' +
        '<h1>' + (isRecord ? "🏆 Новый рекорд!" : "Игра окончена") + '</h1>' +
        '<div class="big">' + score + '</div>' +
        '<div class="row">' +
          '<div class="col">Попаданий<b>' + hits + '</b></div>' +
          '<div class="col">Точность<b>' + acc + '%</b></div>' +
          '<div class="col">Рекорд<b>' + best + '</b></div>' +
        '</div>' +
        '<button>Играть снова</button>' +
      '</div>';
  }

  function startGame() {
    getAudio();                 // «разбудить» звук по клику пользователя
    clearTimeout(spawnTimer);
    clearInterval(tickTimer);
    clearTargets();

    running = true;
    score = 0; shots = 0; hits = 0; combo = 0; timeLeft = DURATION;
    overlay.classList.add("hidden");
    updateHUD();

    tickTimer = setInterval(function () {
      timeLeft -= 0.1;
      if (timeLeft <= 0) {
        timeLeft = 0;
        updateHUD();
        endGame();
        return;
      }
      updateHUD();
    }, 100);

    spawnTarget();
  }

  function endGame() {
    running = false;
    clearTimeout(spawnTimer);
    clearInterval(tickTimer);
    crosshair.style.opacity = "0";
    showGameOver();
  }

  // Кнопка в оверлее (старт и «играть снова»)
  overlay.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest("button")) startGame();
  });

  // Пробел / Enter — быстрый старт
  document.addEventListener("keydown", function (e) {
    if (!running && (e.key === " " || e.key === "Enter")) {
      e.preventDefault();
      startGame();
    }
  });

  // При изменении размера окна подчищаем мишени, вышедшие за край
  window.addEventListener("resize", function () {
    var list = arena.querySelectorAll(".target");
    for (var i = 0; i < list.length; i++) {
      var t = list[i];
      var s = t.offsetWidth;
      var l = parseFloat(t.style.left);
      var tp = parseFloat(t.style.top);
      if (l + s > arena.clientWidth) t.style.left = Math.max(6, arena.clientWidth - s - 6) + "px";
      if (tp + s > arena.clientHeight) t.style.top = Math.max(6, arena.clientHeight - s - 6) + "px";
    }
  });

  showStart();
})();
</script>
</body>
</html>
