<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Котики Парижа — 3D</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0b0e1c;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff; -webkit-user-select: none; user-select: none;
  }
  #game { display: flex; flex-direction: column; height: 100%; }

  /* ===== HUD ===== */
  #hud {
    display: flex; align-items: center; gap: 18px; padding: 9px 18px;
    font-size: 14px; z-index: 6; flex-wrap: wrap;
    background: linear-gradient(180deg, rgba(30,26,54,.95), rgba(18,16,36,.9));
    border-bottom: 1px solid rgba(255,190,120,.25);
  }
  #hud .item { white-space: nowrap; }
  #hud .label { opacity: .65; margin-right: 6px; font-size: 12px; }
  #hud .val { font-weight: 800; font-variant-numeric: tabular-nums; }
  #fed { color: #ffd28a; font-size: 17px; }
  #score { color: #8fe0a0; }
  /* Бег (выносливость) */
  #staminaItem { display: inline-flex; align-items: center; }
  #staminaBar { display: inline-block; width: 120px; height: 14px; border-radius: 8px;
    background: rgba(255,255,255,.15); overflow: hidden; vertical-align: middle;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.4); }
  #stamina { display: block; height: 100%; width: 100%; border-radius: 8px;
    background: linear-gradient(90deg,#7fd4ff,#8fe0a0); transition: width .1s linear; }
  #stamina.run { background: linear-gradient(90deg,#8fe0a0,#ffd76e); }
  #stamina.low { background: linear-gradient(90deg,#ff9a5a,#ff5a5a); }
  #hud .spacer { flex: 1; }
  #hint { font-size: 12px; opacity: .6; }

  /* ===== Сцена ===== */
  #arena { position: relative; flex: 1; overflow: hidden; background: #0b0e1c;
    cursor: crosshair; touch-action: none; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* Сердечки-эффект оверлей не нужен — рисуем на canvas */

  /* ===== Плавное затемнение по краям ===== */
  #vig { position: absolute; inset: 0; pointer-events: none; z-index: 4;
    box-shadow: inset 0 0 200px rgba(10,8,26,.75); }

  /* ===== Оверлей ===== */
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(12,10,28,.88); backdrop-filter: blur(6px); z-index: 30;
    text-align: center; padding: 20px; overflow: auto; }
  #overlay.hidden { display: none; }
  #overlay .card { max-width: 560px; width: 100%; padding: 32px 30px; border-radius: 22px;
    background: linear-gradient(180deg, rgba(46,38,80,.9), rgba(30,24,54,.95));
    border: 2px solid rgba(255,190,120,.3);
    box-shadow: 0 24px 70px rgba(0,0,0,.6), 0 0 90px rgba(255,160,80,.1) inset; }
  #overlay h1 { margin: 0 0 8px; font-size: 34px; letter-spacing: .02em;
    background: linear-gradient(90deg,#ffd28a,#ff9f6e,#ff7aa8);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  #overlay p { margin: 10px 0; line-height: 1.6; font-size: 15px; opacity: .92; }
  #overlay .keys { display: flex; flex-direction: column; gap: 7px; margin: 16px auto 0; max-width: 340px; }
  #overlay .keys div { display: flex; align-items: center; gap: 12px; font-size: 14px; justify-content: flex-start; }
  #overlay .key { display: inline-block; min-width: 34px; text-align: center; padding: 5px 10px;
    border-radius: 8px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
    font-weight: 800; font-size: 12px; }
  #overlay button { margin-top: 22px; padding: 15px 40px; font-size: 18px; font-weight: 800;
    color: #241033; background: linear-gradient(180deg,#ffd98a,#ff9b3d);
    border: none; border-radius: 14px; cursor: pointer; letter-spacing: .03em;
    box-shadow: 0 8px 26px rgba(255,150,60,.4); transition: transform .1s, box-shadow .15s; }
  #overlay button:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255,150,60,.55); }
  #overlay button:active { transform: translateY(1px) scale(.98); }
  #overlay .cats { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  #overlay .cats span { display: inline-flex; align-items: center; gap: 6px; font-size: 13px;
    background: rgba(255,255,255,.08); padding: 6px 12px; border-radius: 999px; }
  #overlay .legend { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap;
    margin-top: 16px; font-size: 13px; opacity: .9; }

  /* ===== Мобильное управление ===== */
  #mobile { position: absolute; inset: 0; z-index: 14; pointer-events: none; display: none; }
  #mobile.on { display: block; }
  #joy { position: absolute; left: 22px; bottom: 26px; width: 140px; height: 140px;
    border-radius: 50%; pointer-events: auto;
    background: radial-gradient(circle, rgba(255,255,255,.14), rgba(255,255,255,.05));
    border: 2px solid rgba(255,255,255,.3); touch-action: none; }
  #joyKnob { position: absolute; left: 50%; top: 50%; width: 62px; height: 62px;
    margin: -31px 0 0 -31px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #ffe6c7, #e8a86a);
    box-shadow: 0 4px 12px rgba(0,0,0,.4); }
  .mbtn { position: absolute; pointer-events: auto; width: 76px; height: 76px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 30px;
    background: rgba(255,255,255,.16); border: 2px solid rgba(255,255,255,.35);
    color: #fff; backdrop-filter: blur(3px); touch-action: none;
    box-shadow: 0 4px 12px rgba(0,0,0,.35); user-select: none; }
  .mbtn:active, .mbtn.press { background: rgba(255,180,80,.55); transform: scale(.94); }
  #btnToss { right: 22px; bottom: 30px; }
  #btnFeed { right: 110px; bottom: 96px; }
  #btnRun  { right: 22px; bottom: 120px; width: 64px; height: 64px; font-size: 24px; }
  #lookHint { position: absolute; right: 24px; top: 40%; transform: translateY(-50%);
    font-size: 12px; opacity: .5; color: #fff; text-align: center; width: 120px; }
</style>
</head>
<body>
  <div id="game">
    <div id="hud">
      <div class="item"><span class="label">Покормлено котиков</span><span class="val" id="fed">0</span></div>
      <div class="item"><span class="label">Рыбок брошено</span><span class="val" id="tossed">0</span></div>
      <div class="item"><span class="label">Любовь</span><span class="val" id="score">0</span></div>
      <div class="item" id="staminaItem"><span class="label">Бег</span>
        <span id="staminaBar"><span id="stamina"></span></span></div>
      <div class="spacer"></div>
      <div id="hint">W A S D — идти • мышь — смотреть • ПРОБЕЛ — бросить рыбку • F — покормить • SHIFT — бежать</div>
    </div>

    <div id="arena">
      <canvas id="view"></canvas>
      <div id="vig"></div>
      <div id="mobile">
        <div id="joy"><div id="joyKnob"></div></div>
        <div class="mbtn" id="btnToss">🐟</div>
        <div class="mbtn" id="btnFeed">✋</div>
        <div class="mbtn" id="btnRun">🏃</div>
        <div id="lookHint">проведи пальцем,<br>чтобы осмотреться</div>
      </div>
      <div id="overlay"></div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  /* ======================= НАСТРОЙКИ ======================= */
  var FOCAL_BASE  = 1.05;    // фокус (меньше = шире обзор, больше = крупнее вдали)
  var EYE         = 1.65;    // высота глаз
  var PLAZA       = 42;      // половина Марсова поля (84×84 м)
  var WALK        = 3.6;     // скорость ходьбы
  var RUN         = 7.4;     // бег (Shift)
  var HEAR_RADIUS = 26;      // с какого расстояния котик чует рыбку
  var EAT_RADIUS  = 0.9;     // радиус поедания
  var PET_RADIUS  = 2.6;     // покормить вблизи (F)
  var CAT_COUNT   = 10;
  var STAMINA_MAX = 100;     // запас бега
  var STAMINA_USE = 30;      // расход бега (в секунду)
  var STAMINA_REG = 22;      // восстановление (в секунду)
  /* ========================================================= */

  var arena   = document.getElementById("arena");
  var canvas  = document.getElementById("view");
  var ctx     = canvas.getContext("2d", { alpha: false });
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  var overlay = document.getElementById("overlay");
  var fedEl   = document.getElementById("fed");
  var tossedEl= document.getElementById("tossed");
  var scoreEl = document.getElementById("score");
  var hintEl  = document.getElementById("hint");
  var staminaEl = document.getElementById("stamina");

  var W = 1, H = 1, DPR = 1, FOCAL = 800;
  function resize() {
    var r = arena.getBoundingClientRect();
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    FOCAL = Math.max(520, W * FOCAL_BASE);
  }

  /* ---------------------- Состояние ---------------------- */
  var running = false, paused = false;
  var camX = 0, camZ = 18, camY = EYE;
  var yaw = 0, pitch = 0;
  var keys = {};
  var pointerLocked = false, hasMouse = false, mouseX = 0, mouseY = 0;
  var SENS = 0.0022;
  var bobT = 0, bobAmp = 0, walkPhase = 0;
  var timeNow = 0, lastTs = 0, rafId = null;

  var cats = [], foods = [], hearts = [], buildings = [], props = [];
  var fedCount = 0, tossedCount = 0, loveScore = 0;
  var tossCooldown = 0;
  var feedFlash = 0;
  var stamina = STAMINA_MAX;
  var isRunning = false;
  var eiffel = { x: 0, z: 112, base: 12, h: 62 };   // реальные пропорции (~5.2 к 1)
  var Z_MAX = 78;    // дальше к башне не пускаем (она огромная впереди)

  /* ---------------------- Звук ---------------------- */
  var audioCtx = null;
  function getAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, to, dur, type, vol, delay) {
    var ac = getAudio(); if (!ac) return;
    var t = ac.currentTime + (delay || 0);
    var o = ac.createOscillator(); o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(Math.max(1, to), t + dur);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.06);
  }
  function noise(dur, cutoff, vol) {
    var ac = getAudio(); if (!ac) return;
    var buf = ac.createBuffer(1, Math.max(1, Math.floor(ac.sampleRate * dur)), ac.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 1.6);
    var src = ac.createBufferSource(); src.buffer = buf;
    var f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cutoff || 1200;
    var g = ac.createGain(); g.gain.value = vol || 0.15;
    src.connect(f); f.connect(g); g.connect(ac.destination); src.start();
  }
  function sndMeow() {
    var base = 620 + Math.random() * 240;
    tone(base, base * 1.5, 0.13, "sine", 0.16);
    tone(base * 1.5, base * 0.9, 0.26, "sine", 0.13, 0.13);
  }
  function sndPurr()  { tone(70, 55, 0.5, "sawtooth", 0.06); tone(90, 70, 0.5, "sawtooth", 0.05, 0.05); }
  function sndEat()   { noise(0.08, 900, 0.12); tone(300, 180, 0.08, "triangle", 0.08); }
  function sndToss()  { tone(700, 400, 0.12, "sine", 0.08); }
  function sndHappy() { tone(880, 1200, 0.1, "triangle", 0.14); tone(1200, 1600, 0.12, "triangle", 0.12, 0.09); }

  /* ---------------------- Утилиты ---------------------- */
  function rand(a, b) { return Math.random() * (b - a) + a; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  var TAU = Math.PI * 2;

  /* ============ 3D-проекция ============ */
  function project(x, y, z) {
    var dx = x - camX, dy = y - camY, dz = z - camZ;
    var cy = Math.cos(yaw), sy = Math.sin(yaw);
    var x1 = dx * cy - dz * sy;
    var z1 = dx * sy + dz * cy;
    var cp = Math.cos(pitch), sp = Math.sin(pitch);
    var y2 = dy * cp - z1 * sp;
    var z2 = dy * sp + z1 * cp;
    if (z2 < 0.05) z2 = 0.05;
    var s = FOCAL / z2;
    return { sx: W / 2 + x1 * s, sy: H / 2 - y2 * s, s: s, z: z2 };
  }
  function horizonY() { return H / 2 + FOCAL * Math.tan(pitch); }

  /* ====================== МИР ====================== */
  function buildWorld() {
    buildings = [];
    props = [];

    // --- Марсово поле: трава и дорожки (рисуется в drawGround) ---
    // Дома только далеко ЗА башней (на горизонте)
    var palette = ["#d9c4a1", "#cfb894", "#e0cbaa", "#c9b48f", "#d5bf9c"];
    var roofCol = "#46506b";
    for (var row = 0; row < 2; row++) {
      var zz = eiffel.z + 45 + row * 26;
      for (var jj = -6; jj <= 6; jj++) {
        buildings.push({
          x: jj * 15 + rand(-2, 2), z: zz + rand(-4, 4),
          w: 12, d: 12, h: rand(18, 30),
          col: palette[Math.floor(Math.random() * palette.length)],
          roof: roofCol, seed: Math.random() * 1000, far: true
        });
      }
    }
    // Дома по бокам поля, вдалеке (перспектива улиц)
    for (var side = 0; side < 2; side++) {
      var sx = side === 0 ? -1 : 1;
      for (var k = 0; k < 4; k++) {
        buildings.push({
          x: sx * (PLAZA + 8 + k * 9), z: eiffel.z - 20 + rand(-30, 10),
          w: 9, d: 9, h: rand(16, 26),
          col: palette[Math.floor(Math.random() * palette.length)],
          roof: roofCol, seed: Math.random() * 1000, far: true
        });
      }
    }

    // --- Деревья вдоль поля (аллеи) ---
    for (var z2 = -34; z2 <= Z_MAX - 8; z2 += 9) {
      props.push({ t: "tree", x: -34 + rand(-1.5, 1.5), z: z2, s: rand(0, 6) });
      props.push({ t: "tree", x: 34 + rand(-1.5, 1.5), z: z2, s: rand(0, 6) });
    }
    // немного деревьев ближе к центру
    for (var z3 = -20; z3 <= 34; z3 += 16) {
      props.push({ t: "tree", x: -22 + rand(-2, 2), z: z3, s: rand(0, 6) });
      props.push({ t: "tree", x: 22 + rand(-2, 2), z: z3, s: rand(0, 6) });
    }

    // --- Фонари вдоль центральной аллеи ---
    for (var z4 = -30; z4 <= Z_MAX - 10; z4 += 12) {
      props.push({ t: "lamp", x: -6, z: z4 });
      props.push({ t: "lamp", x: 6, z: z4 });
    }
    // --- Скамейки ---
    for (var z5 = -22; z5 <= 40; z5 += 15) {
      props.push({ t: "bench", x: -13, z: z5 });
      props.push({ t: "bench", x: 13, z: z5 });
    }

    // --- Фонтан на поле ---
    props.push({ t: "fountain", x: 0, z: 24 });

    // --- Кафе-павильон сбоку ---
    props.push({ t: "cafe", x: -30, z: 6 });
    for (var ct = 0; ct < 4; ct++) {
      props.push({ t: "table", x: -30 + (ct % 2) * 3.2, z: 6 + Math.floor(ct / 2) * 3.2 });
    }

    // --- Основание башни: опоры (рисуются в drawEiffel) ---
  }

  /* ---------------------- Коты ---------------------- */
  var CAT_PHRASES = [
    "Мяу!", "Мурр~", "Bonjour!", "Дай ещё 🐟", "Вкусно!",
    "Мррр-мяу!", "Je t'aime!", "Олала!", "Корми меня ещё!",
    "Как в Париже!", "Miaou!", "Кис-кис?", "Прелесть!", "Мяу-мяу!"
  ];

  function catColor(i) {
    var cols = [
      { body: "#e39a4e", belly: "#ffe6c4", name: "рыжий" },
      { body: "#3b3b44", belly: "#6a6a76", name: "чёрный" },
      { body: "#f0ece2", belly: "#ffffff", name: "белый" },
      { body: "#8a8f98", belly: "#dfe3e8", name: "серый" },
      { body: "#c98a4a", belly: "#f2d6a8", name: "полосатый" },
      { body: "#b06a3a", belly: "#e8c59a", name: "калико" },
      { body: "#e6b0c0", belly: "#fff0f4", name: "розовый" }
    ];
    return cols[i % cols.length];
  }

  function spawnCats() {
    cats = [];
    for (var i = 0; i < CAT_COUNT; i++) {
      var x = rand(-PLAZA * 0.55, PLAZA * 0.55);
      var z = rand(-PLAZA * 0.5, Z_MAX - 10);
      var c = makeCat(x, z, i);
      cats.push(c);
    }
  }
  function makeCat(x, z, i) {
    return {
      x: x, z: z, size: 0.5 + Math.random() * 0.12,
      col: catColor(i),
      angle: rand(0, TAU),
      speed: rand(1.1, 1.9),
      state: "wander",                 // wander | goto | eat | chat
      target: { x: x, z: z },
      wanderT: rand(1, 3),
      eatT: 0, chatT: 0,
      bubble: null,
      phase: rand(0, TAU),
      tail: rand(0, TAU),
      fed: false,
      hop: 0,
      bubbleCooldown: rand(3, 9),
      blink: 0
    };
  }

  function pickWander(c) {
    c.target = {
      x: clamp(c.x + rand(-9, 9), -PLAZA * 0.8, PLAZA * 0.8),
      z: clamp(c.z + rand(-9, 9), -PLAZA * 0.8, Z_MAX - 6)
    };
    c.wanderT = rand(2, 5);
    // иногда ускоряется и бежит
    c.speed = Math.random() < 0.35 ? rand(2.6, 3.6) : rand(1.0, 1.7);
  }
  function say(c, text, dur) {
    c.bubble = { text: text, t: dur || 2.5, max: dur || 2.5 };
    c.chatT = Math.max(c.chatT, dur || 2.5);
  }

  /* ====================== ВВОД ====================== */
  document.addEventListener("mousemove", function (e) {
    if (!running || paused) return;
    if (pointerLocked) {
      yaw += e.movementX * SENS;
      pitch -= e.movementY * SENS;
      pitch = clamp(pitch, -0.95, 0.6);
    } else {
      var r = canvas.getBoundingClientRect();
      mouseX = e.clientX - r.left; mouseY = e.clientY - r.top; hasMouse = true;
    }
  });
  window.addEventListener("keydown", function (e) {
    var k = e.key.toLowerCase();
    if (k === "w" || k === "a" || k === "s" || k === "d") keys[k] = true;
    if (k === "shift") keys["shift"] = true;
    // русская раскладка
    if (k === "ц") keys["w"] = true; if (k === "ф") keys["a"] = true;
    if (k === "ы") keys["s"] = true; if (k === "в") keys["d"] = true;
    if (k === " ") { e.preventDefault(); tossFood(); }
    if (k === "f") feedNearby();
    if (!running && (e.key === "Enter")) { e.preventDefault(); startGame(); }
  });
  window.addEventListener("keyup", function (e) {
    var k = e.key.toLowerCase();
    if (k === "w" || k === "a" || k === "s" || k === "d") keys[k] = false;
    if (k === "shift") keys["shift"] = false;
    if (k === "ц") keys["w"] = false; if (k === "ф") keys["a"] = false;
    if (k === "ы") keys["s"] = false; if (k === "в") keys["d"] = false;
  });

  canvas.addEventListener("mousedown", function (e) {
    if (!running) return;
    if (isMobile) { if (e.button === 0) tossFood(); return; }
    if (paused) { requestLock(); return; }
    if (!pointerLocked) { requestLock(); return; }
    if (e.button === 0) tossFood();
  });
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  document.addEventListener("pointerlockchange", function () {
    if (isMobile) return;               // на телефоне захват мыши не нужен
    pointerLocked = (document.pointerLockElement === canvas);
    if (running) {
      paused = !pointerLocked;
      hintEl.textContent = paused
        ? "ПАУЗА — кликни, чтобы продолжить"
        : "W A S D — идти • мышь — смотреть • ПРОБЕЛ — бросить рыбку • F — покормить • SHIFT — бежать";
    }
  });
  function requestLock() {
    if (isMobile) return;               // не захватываем мышь на телефоне
    try { var p = canvas.requestPointerLock(); if (p && p.catch) p.catch(function(){}); } catch (e) {}
  }

  /* ====================== МОБИЛЬНОЕ УПРАВЛЕНИЕ ====================== */
  var isMobile = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
  var mobileEl = document.getElementById("mobile");
  var joyEl = document.getElementById("joy");
  var joyKnob = document.getElementById("joyKnob");
  var joyActive = false, joyId = null, joyCX = 0, joyCY = 0, joyDX = 0, joyDY = 0;
  var runHold = false;
  var lookId = null, lookLastX = 0, lookLastY = 0;

  if (isMobile) {
    mobileEl.classList.add("on");
  }

  // --- Джойстик (ходьба) ---
  joyEl.addEventListener("touchstart", function (e) {
    e.preventDefault();
    var t = e.changedTouches[0];
    joyActive = true; joyId = t.identifier;
    var r = joyEl.getBoundingClientRect();
    joyCX = r.left + r.width / 2; joyCY = r.top + r.height / 2;
    updateJoy(t.clientX, t.clientY);
  }, { passive: false });
  function updateJoy(x, y) {
    var dx = x - joyCX, dy = y - joyCY;
    var max = 56;
    var len = Math.hypot(dx, dy);
    if (len > max) { dx = dx / len * max; dy = dy / len * max; }
    joyKnob.style.transform = "translate(" + dx + "px," + dy + "px)";
    joyDX = dx / max; joyDY = dy / max;
  }
  window.addEventListener("touchmove", function (e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier === joyId) { e.preventDefault(); updateJoy(t.clientX, t.clientY); return; }
    }
  }, { passive: false });
  window.addEventListener("touchend", function (e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joyId) {
        joyActive = false; joyId = null; joyDX = 0; joyDY = 0;
        joyKnob.style.transform = "translate(0,0)";
      }
    }
  });

  // --- Свайп по экрану (обзор) ---
  canvas.addEventListener("touchstart", function (e) {
    if (!running) return;
    var t = e.changedTouches[0];
    lookId = t.identifier; lookLastX = t.clientX; lookLastY = t.clientY;
  }, { passive: true });
  canvas.addEventListener("touchmove", function (e) {
    if (!running || paused) return;
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier !== lookId) continue;
      var dx = t.clientX - lookLastX, dy = t.clientY - lookLastY;
      lookLastX = t.clientX; lookLastY = t.clientY;
      yaw += dx * 0.005;
      pitch -= dy * 0.004;
      pitch = clamp(pitch, -0.95, 0.6);
    }
  }, { passive: true });
  canvas.addEventListener("touchend", function () { lookId = null; }, { passive: true });

  // --- Кнопки действий ---
  function bindBtn(id, down, up) {
    var el = document.getElementById(id);
    if (!el) return;
    el.addEventListener("touchstart", function (e) { e.preventDefault(); el.classList.add("press"); down(); }, { passive: false });
    el.addEventListener("touchend", function (e) { e.preventDefault(); el.classList.remove("press"); if (up) up(); }, { passive: false });
    el.addEventListener("mousedown", function (e) { e.preventDefault(); down(); });
    el.addEventListener("mouseup", function (e) { e.preventDefault(); if (up) up(); });
  }
  bindBtn("btnToss", function () { tossFood(); });
  bindBtn("btnFeed", function () { feedNearby(); });
  bindBtn("btnRun", function () { runHold = true; }, function () { runHold = false; });

  // Автозахват не нужен на мобильном — убираем паузу из-за pointerlock
  
  /* ====================== ДЕЙСТВИЯ ====================== */
  function tossFood() {
    if (!running || paused) return;
    if (tossCooldown > 0) return;
    tossCooldown = 0.28;
    var fx = Math.sin(yaw), fz = Math.cos(yaw);
    var f = {
      x: camX + fx * 0.6, y: 1.3, z: camZ + fz * 0.6,
      vx: fx * 9.5, vy: 4.6, vz: fz * 9.5,
      landed: false, life: 16, spin: 0, eatenBy: null
    };
    foods.push(f);
    tossedCount++;
    tossedEl.textContent = tossedCount;
    sndToss();
  }

  function feedNearby() {
    if (!running || paused) return;
    var best = null, bd = PET_RADIUS;
    for (var i = 0; i < cats.length; i++) {
      var d = Math.hypot(cats[i].x - camX, cats[i].z - camZ);
      if (d < bd) { bd = d; best = cats[i]; }
    }
    if (!best) { hintFlash("Подойди ближе к котику!"); return; }
    best.state = "eat";
    best.eatT = 1.6;
    best.hop = 1;
    sndEat();
    if (!best.fed) { best.fed = true; fedCount++; }
    loveScore += 12;
    say(best, "Мурр! Спасибо! 💛", 2.6);
    popHeart(best.x, best.z);
    updateHUD();
  }
  var hintFlashT = 0;
  function hintFlash(txt) {
    hintEl.textContent = txt;
    hintFlashT = 1.6;
  }

  function popHeart(x, z) {
    for (var i = 0; i < 3; i++) {
      hearts.push({ x: x + rand(-0.5, 0.5), z: z + rand(-0.5, 0.5), y: 0.6 + i * 0.2, t: 1.2, vy: 0.9 });
    }
  }

  /* ====================== ОБНОВЛЕНИЕ ====================== */
  function update(dt) {
    timeNow += dt;
    if (tossCooldown > 0) tossCooldown -= dt;
    if (feedFlash > 0) feedFlash -= dt;
    if (hintFlashT > 0) { hintFlashT -= dt; if (hintFlashT <= 0) hintEl.textContent = "W A S D — идти • мышь — смотреть • ПРОБЕЛ — бросить рыбку • F — покормить • SHIFT — бежать"; }

    // ---- движение игрока ----
    var fwd = (keys["w"] ? 1 : 0) - (keys["s"] ? 1 : 0);
    var strafe = (keys["d"] ? 1 : 0) - (keys["a"] ? 1 : 0);
    // джойстик (мобильный)
    if (joyActive) { fwd += -joyDY * 1.4; strafe += joyDX * 1.4; fwd = clamp(fwd, -1, 1); strafe = clamp(strafe, -1, 1); }
    var moving = (Math.abs(fwd) > 0.06 || Math.abs(strafe) > 0.06);
    // бег: если зажат Shift (или кнопка 🏃) и есть силы
    var wantRun = (keys["shift"] || runHold) && moving && stamina > 1;
    isRunning = wantRun;
    if (wantRun) stamina = Math.max(0, stamina - STAMINA_USE * dt);
    else stamina = Math.min(STAMINA_MAX, stamina + STAMINA_REG * dt);

    var sp = isRunning ? RUN : WALK;
    if (moving) {
      var sy = Math.sin(yaw), cy = Math.cos(yaw);
      var mvx = sy * fwd + cy * strafe;
      var mvz = cy * fwd - sy * strafe;
      var len = Math.hypot(mvx, mvz) || 1;
      mvx /= len; mvz /= len;
      camX += mvx * sp * dt;
      camZ += mvz * sp * dt;
      camX = clamp(camX, -PLAZA, PLAZA);
      camZ = clamp(camZ, -PLAZA, Z_MAX);
      walkPhase += dt * (isRunning ? 14 : 8.5);
      bobAmp += ((isRunning ? 0.07 : 0.035) - bobAmp) * Math.min(1, dt * 6);
    } else {
      bobAmp += (0 - bobAmp) * Math.min(1, dt * 6);
      walkPhase += dt * 1.2;
    }
    camY = EYE + Math.abs(Math.sin(walkPhase)) * bobAmp;
    staminaEl.style.width = stamina + "%";
    staminaEl.className = stamina < 25 ? "low" : (isRunning ? "run" : "");

    // ---- еда (полёт) ----
    for (var fi = foods.length - 1; fi >= 0; fi--) {
      var f = foods[fi];
      if (f.eatenBy) {
        f.life -= dt;
        if (f.life <= 0) foods.splice(fi, 1);
        continue;
      }
      if (!f.landed) {
        f.vy -= 12 * dt;
        f.x += f.vx * dt; f.y += f.vy * dt; f.z += f.vz * dt;
        f.spin += dt * 12;
        if (f.y <= 0.06) { f.y = 0.06; f.landed = true; f.vx = f.vz = f.vy = 0; }
        if (f.x < -PLAZA || f.x > PLAZA || f.z < -PLAZA || f.z > PLAZA) {
          f.x = clamp(f.x, -PLAZA, PLAZA); f.z = clamp(f.z, -PLAZA, PLAZA);
          f.landed = true; f.vx = f.vz = f.vy = 0;
        }
      } else {
        f.life -= dt;
        if (f.life <= 0) { foods.splice(fi, 1); continue; }
      }
    }

    // ---- коты ----
    for (var ci = 0; ci < cats.length; ci++) {
      var c = cats[ci];
      c.phase += dt * (c.state === "goto" ? 12 : 6);
      c.tail += dt * 3;
      if (c.hop > 0) c.hop = Math.max(0, c.hop - dt * 2);
      if (c.blink > 0) c.blink -= dt;
      else if (Math.random() < dt * 0.5) c.blink = 0.14;

      // пузырь
      if (c.bubble) {
        c.bubble.t -= dt;
        if (c.bubble.t <= 0) c.bubble = null;
      }
      // случайные реплики
      c.bubbleCooldown -= dt;
      if (c.bubbleCooldown <= 0 && !c.bubble && c.state !== "eat") {
        c.bubbleCooldown = rand(5, 13);
        say(c, CAT_PHRASES[Math.floor(Math.random() * CAT_PHRASES.length)], rand(1.8, 2.8));
        sndMeow();
      }

      if (c.state === "eat") {
        c.eatT -= dt;
        if (c.eatT <= 0) { c.state = "chat"; c.chatT = rand(1.2, 2.2); }
        continue;
      }
      if (c.state === "chat") {
        c.chatT -= dt;
        if (c.chatT <= 0) c.state = "wander";
        continue;
      }

      // ищем ближайшую еду
      if (c.state !== "goto") {
        var nf = null, nd = HEAR_RADIUS;
        for (var k = 0; k < foods.length; k++) {
          if (foods[k].eatenBy) continue;
          var dd = Math.hypot(foods[k].x - c.x, foods[k].z - c.z);
          if (dd < nd) { nd = dd; nf = foods[k]; }
        }
        if (nf) { c.state = "goto"; c.foodRef = nf; }
      }

      if (c.state === "goto") {
        var tgt = c.foodRef;
        if (!tgt || tgt.eatenBy) { c.state = "wander"; pickWander(c); continue; }
        var dx = tgt.x - c.x, dz = tgt.z - c.z;
        var d = Math.hypot(dx, dz);
        c.angle = Math.atan2(dx, dz);
        var runSp = 4.2;
        if (d > 0.05) {
          c.x += (dx / d) * runSp * dt;
          c.z += (dz / d) * runSp * dt;
        }
        if (d < EAT_RADIUS) {
          // съел!
          tgt.eatenBy = c;
          tgt.life = 0.6;
          c.state = "eat"; c.eatT = 1.6; c.hop = 1;
          sndEat();
          if (!c.fed) { c.fed = true; fedCount++; }
          loveScore += 15;
          say(c, CAT_PHRASES[Math.floor(Math.random() * 5)], 2.4);
          popHeart(c.x, c.z);
          sndHappy();
          updateHUD();
        }
        continue;
      }

      // wander
      c.wanderT -= dt;
      var wdx = c.target.x - c.x, wdz = c.target.z - c.z;
      var wd = Math.hypot(wdx, wdz);
      if (wd < 0.4) {
        if (c.wanderT <= 0) pickWander(c);
        else { c.state = "idle"; }
      } else {
        c.angle = Math.atan2(wdx, wdz);
        c.x += (wdx / wd) * c.speed * dt;
        c.z += (wdz / wd) * c.speed * dt;
      }
      if (c.state === "idle") {
        c.wanderT -= dt;
        if (c.wanderT <= 0) { c.state = "wander"; pickWander(c); }
      }
    }

    // ---- сердечки ----
    for (var hi = hearts.length - 1; hi >= 0; hi--) {
      var h = hearts[hi];
      h.t -= dt; h.y += h.vy * dt; h.vy *= 0.98;
      if (h.t <= 0) hearts.splice(hi, 1);
    }
  }

  function updateHUD() {
    fedEl.textContent = fedCount;
    tossedEl.textContent = tossedCount;
    scoreEl.textContent = loveScore;
  }

  /* ====================== ОТРИСОВКА ====================== */
  function render(ts) {
    drawSky();
    drawGround();
    drawScene();
    drawHearts();
    drawWatermark();
  }

  function drawSky() {
    var hy = horizonY();
    var g = ctx.createLinearGradient(0, 0, 0, Math.max(hy, H * 0.5));
    g.addColorStop(0, "#2f6fd0");
    g.addColorStop(0.45, "#5fa0e8");
    g.addColorStop(0.78, "#a8cff2");
    g.addColorStop(1, "#e8f0f8");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // солнце у горизонта
    var sunX = W / 2 - Math.sin(yaw) * W * 0.8;
    var sunY = hy + 6 - pitch * 60;
    if (sunX > -200 && sunX < W + 200) {
      var sg = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, 150);
      sg.addColorStop(0, "rgba(255,250,225,.95)");
      sg.addColorStop(0.3, "rgba(255,235,180,.5)");
      sg.addColorStop(1, "rgba(255,230,170,0)");
      ctx.fillStyle = sg;
      ctx.beginPath(); ctx.arc(sunX, sunY, 150, 0, TAU); ctx.fill();
    }

    // облака
    for (var i = 0; i < 7; i++) {
      var ang = i * 1.05 + yaw * 0.6;
      var cx = W / 2 + Math.sin(ang) * W * 1.2;
      var cyy = H * 0.16 + Math.cos(ang * 1.7) * H * 0.09 + pitch * 120;
      if (cx < -200 || cx > W + 200) continue;
      var cw = 90 + (i % 3) * 40;
      ctx.fillStyle = "rgba(255,255,255," + (0.5 + (i % 3) * 0.12) + ")";
      ctx.beginPath();
      ctx.ellipse(cx, cyy, cw, cw * 0.32, 0, 0, TAU);
      ctx.ellipse(cx + cw * 0.5, cyy + 4, cw * 0.6, cw * 0.24, 0, 0, TAU);
      ctx.ellipse(cx - cw * 0.5, cyy + 6, cw * 0.55, cw * 0.2, 0, 0, TAU);
      ctx.fill();
    }
  }

  // Профиль Эйфелевой башни: t=0 (низ) → 1 (верх), возвращает половину ширины (долю от base)
  function eiffelWidth(t) {
    var pts = [
      [0.00, 1.00], [0.06, 0.70], [0.18, 0.46], [0.20, 0.44],
      [0.38, 0.235], [0.40, 0.215], [0.55, 0.15], [0.70, 0.10],
      [0.85, 0.058], [1.00, 0.014]
    ];
    for (var i = 0; i < pts.length - 1; i++) {
      if (t <= pts[i + 1][0]) {
        var a = pts[i], b = pts[i + 1];
        var u = (t - a[0]) / (b[0] - a[0]);
        return a[1] + (b[1] - a[1]) * u;
      }
    }
    return 0.014;
  }

  function drawEiffel() {
    var cx = eiffel.x, cz = eiffel.z;
    var base = eiffel.base, Hh = eiffel.h;   // base — половина ширины у земли
    var cyv = Math.cos(yaw), syv = Math.sin(yaw);
    var z1 = (cx - camX) * syv + (cz - camZ) * cyv;
    if (z1 < 8) return;

    function P(ox, oy) { return project(cx + ox, oy, cz); }
    var N = 44;
    var L = [], R = [];
    for (var i = 0; i <= N; i++) {
      var t = i / N;
      var w = eiffelWidth(t) * base, y = Hh * t;
      L.push(P(-w, y)); R.push(P(w, y));
    }

    ctx.save();

    // === Тело башни + арка (even-odd, чтобы арка была «вырезана») ===
    var g = ctx.createLinearGradient(L[0].sx, 0, R[0].sx, 0);
    g.addColorStop(0, "#241f3a");
    g.addColorStop(0.42, "#5c5288");
    g.addColorStop(0.55, "#7970a8");
    g.addColorStop(0.75, "#4a4270");
    g.addColorStop(1, "#211c36");

    ctx.beginPath();
    ctx.moveTo(L[0].sx, L[0].sy);
    for (var a = 1; a <= N; a++) ctx.lineTo(L[a].sx, L[a].sy);
    for (var b = N; b >= 0; b--) ctx.lineTo(R[b].sx, R[b].sy);
    ctx.closePath();
    // арка (дырка): от земли вверх дугой
    var archY = Hh * 0.15;
    var archW = eiffelWidth(0.15) * base * 0.9;
    var aL = P(-archW, 0), aR = P(archW, 0), aT = P(0, archY);
    ctx.moveTo(aL.sx, aL.sy);
    ctx.quadraticCurveTo(aT.sx, aT.sy, aR.sx, aR.sy);
    ctx.closePath();
    ctx.fillStyle = g;
    ctx.fill("evenodd");

    // === Решётка (lattice, крестики) — обрезаем по силуэту башни ===
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(L[0].sx, L[0].sy);
    for (var ca = 1; ca <= N; ca++) ctx.lineTo(L[ca].sx, L[ca].sy);
    for (var cb = N; cb >= 0; cb--) ctx.lineTo(R[cb].sx, R[cb].sy);
    ctx.closePath();
    ctx.clip();

    ctx.lineWidth = Math.max(0.5, (FOCAL / Math.max(z1, 1)) * 0.045);
    ctx.strokeStyle = "rgba(215,208,250,.22)";
    var step = 2;
    for (var k = 0; k < N; k += step) {
      var k2 = Math.min(N, k + step);
      ctx.beginPath();
      ctx.moveTo(L[k].sx, L[k].sy);   ctx.lineTo(R[k2].sx, R[k2].sy);
      ctx.moveTo(R[k].sx, R[k].sy);   ctx.lineTo(L[k2].sx, L[k2].sy);
      ctx.stroke();
    }
    ctx.restore();

    // контуры башни
    ctx.beginPath();
    ctx.moveTo(L[0].sx, L[0].sy);
    for (var c = 1; c <= N; c++) ctx.lineTo(L[c].sx, L[c].sy);
    ctx.strokeStyle = "rgba(180,170,225,.55)";
    ctx.lineWidth = Math.max(0.8, (FOCAL / Math.max(z1, 1)) * 0.06);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(R[0].sx, R[0].sy);
    for (var d = 1; d <= N; d++) ctx.lineTo(R[d].sx, R[d].sy);
    ctx.stroke();

    // === Платформы (1-й и 2-й уровень) ===
    drawEiffelPlatform(P, Hh, base, 0.19, 1.7);
    drawEiffelPlatform(P, Hh, base, 0.39, 1.1);

    // === Верхняя смотровая площадка и шпиль ===
    var topW = eiffelWidth(1.0) * base;
    var platY = Hh * 0.86;
    var tL = P(-base * 0.075, platY), tR = P(base * 0.075, platY);
    ctx.fillStyle = "#3a3358";
    ctx.fillRect(tL.sx, tL.sy - Math.max(1, tL.s * 0.5), tR.sx - tL.sx, Math.max(2, tL.s * 0.9));
    // шпиль
    var spBot = P(0, Hh * 0.86), spTop = P(0, Hh * 1.06);
    ctx.strokeStyle = "#c9c2e6";
    ctx.lineWidth = Math.max(1, (FOCAL / z1) * 0.06);
    ctx.beginPath();
    ctx.moveTo(spBot.sx, spBot.sy); ctx.lineTo(spTop.sx, spTop.sy);
    ctx.stroke();
    ctx.fillStyle = "#fff2c0";
    ctx.beginPath(); ctx.arc(spTop.sx, spTop.sy, Math.max(1.5, spTop.s * 0.5), 0, TAU); ctx.fill();

    // === Прожектор-маяк на верхушке (мигает) ===
    var beacon = 0.55 + 0.45 * Math.sin(timeNow * 3);
    ctx.globalAlpha = beacon;
    var bg = ctx.createRadialGradient(spTop.sx, spTop.sy, 1, spTop.sx, spTop.sy, Math.max(18, spTop.s * 5));
    bg.addColorStop(0, "rgba(255,240,170,.95)");
    bg.addColorStop(1, "rgba(255,210,110,0)");
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(spTop.sx, spTop.sy, Math.max(18, spTop.s * 5), 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;

    // === Вечерняя подсветка башни (тёплое свечение вдоль тела) ===
    ctx.globalCompositeOperation = "lighter";
    var glowG = ctx.createLinearGradient(L[0].sx, 0, R[0].sx, 0);
    glowG.addColorStop(0.35, "rgba(255,180,90,0)");
    glowG.addColorStop(0.5, "rgba(255,190,110,.20)");
    glowG.addColorStop(0.62, "rgba(255,180,90,0)");
    ctx.fillStyle = glowG;
    ctx.beginPath();
    ctx.moveTo(L[0].sx, L[0].sy);
    for (var e = 1; e <= N; e++) ctx.lineTo(L[e].sx, L[e].sy);
    for (var f2 = N; f2 >= 0; f2--) ctx.lineTo(R[f2].sx, R[f2].sy);
    ctx.closePath();
    ctx.fill();
    ctx.globalCompositeOperation = "source-over";

    ctx.restore();

    // === Тень башни на траве ===
    var sh = project(cx, 0.02, cz);
    var shg = ctx.createRadialGradient(sh.sx, sh.sy, 1, sh.sx, sh.sy, Math.max(20, sh.s * base * 0.5));
    shg.addColorStop(0, "rgba(20,30,15,.35)");
    shg.addColorStop(1, "rgba(20,30,15,0)");
    ctx.fillStyle = shg;
    ctx.beginPath(); ctx.ellipse(sh.sx, sh.sy, Math.max(20, sh.s * base * 0.55), Math.max(8, sh.s * base * 0.18), 0, 0, TAU); ctx.fill();
  }

  function drawEiffelPlatform(P, Hh, base, t, thick) {
    var w = eiffelWidth(t) * base;
    var y = Hh * t;
    var l = P(-w * 1.14, y), r = P(w * 1.14, y);
    var th = Math.max(2, l.s * thick * 0.5);
    ctx.fillStyle = "#2c2646";
    ctx.fillRect(l.sx, l.sy, r.sx - l.sx, th);
    ctx.fillStyle = "rgba(255,205,130,.55)";
    ctx.fillRect(l.sx, l.sy, r.sx - l.sx, Math.max(1, th * 0.28));
    // перила
    ctx.strokeStyle = "rgba(210,200,240,.5)";
    ctx.lineWidth = Math.max(0.6, l.s * 0.03);
    ctx.beginPath();
    ctx.moveTo(l.sx, l.sy - th * 0.9); ctx.lineTo(r.sx, r.sy - th * 0.9);
    ctx.stroke();
  }
  function widthAt(t) { return eiffelWidth(t); }

  function drawGround() {
    var hy = horizonY();
    var top = Math.max(0, Math.min(H, hy));

    // Трава Марсова поля
    var g = ctx.createLinearGradient(0, top, 0, H);
    g.addColorStop(0, "#4e6b3c");
    g.addColorStop(0.25, "#5b7a44");
    g.addColorStop(0.6, "#68874d");
    g.addColorStop(1, "#5a7742");
    ctx.fillStyle = g;
    ctx.fillRect(0, top, W, H - top);

    // Центральная песчаная аллея (широкая полоса к башне)
    drawGroundQuad(-9, -PLAZA, 9, Z_MAX + 30, "rgba(206,186,140,.9)");
    // Боковые дорожки
    drawGroundQuad(-PLAZA, -6, PLAZA, 6, "rgba(198,178,132,.55)");

    // Полосы травы (для глубины) — горизонтальные разметки скошенной травы
    for (var z = -PLAZA; z < Z_MAX + 30; z += 7) {
      var a = project(-PLAZA, 0.01, z);
      var b = project(PLAZA, 0.01, z);
      ctx.strokeStyle = "rgba(40,70,30,.12)";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke();
    }

    // Крапинки/травинки
    for (var i = 0; i < 320; i++) {
      var px = ((i * 137.5) % (PLAZA * 2)) - PLAZA;
      var pz = -PLAZA + ((i * 89.3) % (PLAZA + Z_MAX + 30));
      var p = project(px, 0, pz);
      if (p.z < 1.2 || p.sx < -20 || p.sx > W + 20 || p.sy < top) continue;
      var r = Math.max(0.5, p.s * 0.12);
      ctx.fillStyle = (i % 3 === 0) ? "rgba(120,150,80,.35)" : "rgba(50,80,38,.3)";
      ctx.beginPath();
      ctx.ellipse(p.sx, p.sy, r, r * 2.2, 0, 0, TAU);
      ctx.fill();
    }
  }

  // Четырёхугольник на земле (x1,z1)-(x2,z2)
  function drawGroundQuad(x1, z1, x2, z2, color) {
    var c = [project(x1, 0.01, z1), project(x2, 0.01, z1), project(x2, 0.01, z2), project(x1, 0.01, z2)];
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(c[0].sx, c[0].sy);
    for (var i = 1; i < 4; i++) ctx.lineTo(c[i].sx, c[i].sy);
    ctx.closePath(); ctx.fill();
  }

  function drawScene() {
    // Собираем всё для painter's algorithm
    var items = [];
    items.push({ kind: "eiffel", obj: eiffel, d: dist2(eiffel.x, eiffel.z) });
    for (var i = 0; i < buildings.length; i++) {
      var b = buildings[i];
      items.push({ kind: "b", obj: b, d: dist2(b.x, b.z) });
    }
    for (var p = 0; p < props.length; p++) {
      var pr = props[p];
      items.push({ kind: pr.t, obj: pr, d: dist2(pr.x, pr.z) });
    }
    for (var c = 0; c < cats.length; c++) {
      items.push({ kind: "cat", obj: cats[c], d: dist2(cats[c].x, cats[c].z) });
    }
    for (var f = 0; f < foods.length; f++) {
      items.push({ kind: "food", obj: foods[f], d: dist2(foods[f].x, foods[f].z) });
    }
    items.sort(function (a, b) { return b.d - a.d; });

    for (var k = 0; k < items.length; k++) {
      var it = items[k];
      if (it.kind === "eiffel") drawEiffel();
      else if (it.kind === "b") drawBuilding(it.obj);
      else if (it.kind === "lamp") drawLamp(it.obj);
      else if (it.kind === "tree") drawTree(it.obj);
      else if (it.kind === "table") drawTable(it.obj);
      else if (it.kind === "cafe") drawCafe(it.obj);
      else if (it.kind === "bench") drawBench(it.obj);
      else if (it.kind === "fountain") drawFountain(it.obj);
      else if (it.kind === "cat") drawCat(it.obj);
      else if (it.kind === "food") drawFood(it.obj);
    }

    // Пузыри поверх всего (после котов)
    for (var ci = 0; ci < cats.length; ci++) {
      if (cats[ci].bubble) drawBubble(cats[ci]);
    }
  }
  function dist2(x, z) { var dx = x - camX, dz = z - camZ; return dx * dx + dz * dz; }

  /* ---------- Здания ---------- */
  function drawBuilding(b) {
    var hw = b.w / 2, hd = b.d / 2;
    var corners = [
      [b.x - hw, b.z - hd], [b.x + hw, b.z - hd],
      [b.x + hw, b.z + hd], [b.x - hw, b.z + hd]
    ];
    // глубины для проверки видимости граней
    var depths = corners.map(function (c) { return (c[0] - camX) * (c[0] - camX) + (c[1] - camZ) * (c[1] - camZ); });
    var minD = Math.sqrt(Math.min.apply(null, depths));
    if (minD > 150) return;              // слишком далеко
    var detailed = minD < 55;            // окна рисуем только у ближних

    var roofY = b.h;
    // 4 боковые грани: [0-1],[1-2],[2-3],[3-0]
    var faces = [[0, 1], [1, 2], [2, 3], [3, 0]];
    var faceList = [];
    for (var fi = 0; fi < faces.length; fi++) {
      var a = corners[faces[fi][0]], c = corners[faces[fi][1]];
      var mx = (a[0] + c[0]) / 2, mz = (a[1] + c[1]) / 2;
      var faced = ((mx - camX) * (c[1] - a[1]) - (mz - camZ) * (c[0] - a[0])) < 0;
      faceList.push({ a: a, c: c, front: faced, z: (a[1] + c[1]) / 2 });
    }
    faceList.sort(function (p1, p2) { return p2.z - p1.z; });

    for (var f2 = 0; f2 < faceList.length; f2++) {
      if (!faceList[f2].front) continue;
      drawWallFace(faceList[f2].a, faceList[f2].c, b, roofY, detailed);
    }
    // крыша (мансарда)
    var tp = corners.map(function (c) { return project(c[0], roofY, c[1]); });
    ctx.fillStyle = b.roof;
    ctx.beginPath();
    ctx.moveTo(tp[0].sx, tp[0].sy);
    for (var t = 1; t < 4; t++) ctx.lineTo(tp[t].sx, tp[t].sy);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "rgba(255,220,180,.12)";
    ctx.fill();
  }

  function drawWallFace(a, c, b, roofY, detailed) {
    var p00 = project(a[0], roofY, a[1]);
    var p10 = project(c[0], roofY, c[1]);
    var p11 = project(c[0], 0, c[1]);
    var p01 = project(a[0], 0, a[1]);
    var g = ctx.createLinearGradient(0, p00.sy, 0, p01.sy);
    g.addColorStop(0, b.col);
    g.addColorStop(0.6, shade(b.col, 0.86));
    g.addColorStop(1, shade(b.col, 0.7));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(p00.sx, p00.sy); ctx.lineTo(p10.sx, p10.sy);
    ctx.lineTo(p11.sx, p11.sy); ctx.lineTo(p01.sx, p01.sy);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(40,30,20,.25)"; ctx.lineWidth = 1; ctx.stroke();

    if (!detailed) return;               // у дальних окон нет — только силуэт

    // окна
    var cols = 4, rows = Math.max(3, Math.round(b.h / 4));
    var lit = b.seed;
    for (var r = 0; r < rows; r++) {
      for (var cw = 0; cw < cols; cw++) {
        var u = (cw + 0.5) / cols, v = (r + 0.5) / rows;
        var wx = lerp2(p00.sx, p10.sx, p01.sx, p11.sx, u, v);
        var wy = lerp2(p00.sy, p10.sy, p01.sy, p11.sy, u, v);
        var ww = Math.abs(p10.sx - p00.sx) / cols * 0.52;
        var wh = Math.abs(p01.sy - p00.sy) / rows * 0.56;
        if (ww < 1.5 || wh < 1.5) continue;
        var on = ((Math.floor(lit + r * 7 + cw * 13) % 3) === 0);
        ctx.fillStyle = on ? "rgba(255,214,140,.92)" : "rgba(40,35,50,.5)";
        ctx.fillRect(wx - ww / 2, wy - wh / 2, ww, wh);
      }
    }
  }
  function lerp2(a, b, c, d, u, v) {
    // билинейная интерполяция: top-left a, top-right b, bottom-left c, bottom-right d
    var top = a + (b - a) * u;
    var bot = c + (d - c) * u;
    return top + (bot - top) * v;
  }
  function shade(hex, f) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    r = Math.round(r * f); g = Math.round(g * f); b = Math.round(b * f);
    return "rgb(" + r + "," + g + "," + b + ")";
  }

  /* ---------- Фонарь ---------- */
  function drawLamp(p) {
    var p0 = project(p.x, 0, p.z);
    var p1 = project(p.x, 4.2, p.z);
    if (p0.z < 0.3 || p0.z > 90) return;
    var wpx = Math.max(1.2, p0.s * 0.12);
    // столб
    ctx.strokeStyle = "#2e2a26"; ctx.lineWidth = wpx;
    ctx.beginPath(); ctx.moveTo(p0.sx, p0.sy); ctx.lineTo(p1.sx, p1.sy); ctx.stroke();
    // фонарь
    var glow = 0.75 + 0.25 * Math.sin(timeNow * 2 + p.x);
    var lg = ctx.createRadialGradient(p1.sx, p1.sy, 1, p1.sx, p1.sy, p1.s * 1.6);
    lg.addColorStop(0, "rgba(255,235,170," + glow + ")");
    lg.addColorStop(1, "rgba(255,210,120,0)");
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.arc(p1.sx, p1.sy, Math.max(3, p1.s * 1.6), 0, TAU); ctx.fill();
    ctx.fillStyle = "#ffe9b0";
    ctx.beginPath(); ctx.arc(p1.sx, p1.sy, Math.max(1.4, p1.s * 0.22), 0, TAU); ctx.fill();
    // пятно света на земле
    var gp = project(p.x, 0.02, p.z);
    var rg = ctx.createRadialGradient(gp.sx, gp.sy, 1, gp.sx, gp.sy, Math.max(10, gp.s * 3));
    rg.addColorStop(0, "rgba(255,220,150,.22)");
    rg.addColorStop(1, "rgba(255,220,150,0)");
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.ellipse(gp.sx, gp.sy, Math.max(10, gp.s * 3), Math.max(5, gp.s * 1.2), 0, 0, TAU); ctx.fill();
  }

  /* ---------- Дерево ---------- */
  function drawTree(p) {
    var p0 = project(p.x, 0, p.z);
    var p1 = project(p.x, 3.4, p.z);
    if (p0.z < 0.3 || p0.z > 95) return;
    ctx.strokeStyle = "#4a3524";
    ctx.lineWidth = Math.max(1.5, p0.s * 0.2);
    ctx.beginPath(); ctx.moveTo(p0.sx, p0.sy); ctx.lineTo(p1.sx, p1.sy); ctx.stroke();
    var crownR = Math.max(4, p1.s * 1.7);
    var sway = Math.sin(timeNow * 0.8 + p.s) * crownR * 0.05;
    var cg = ctx.createRadialGradient(p1.sx - crownR * .3 + sway, p1.sy - crownR * .3, 1, p1.sx + sway, p1.sy, crownR);
    cg.addColorStop(0, "#4f7a3a");
    cg.addColorStop(1, "#264a1e");
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(p1.sx + sway, p1.sy, crownR, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(p1.sx - crownR * .6 + sway, p1.sy + crownR * .2, crownR * .6, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(p1.sx + crownR * .6 + sway, p1.sy + crownR * .2, crownR * .55, 0, TAU); ctx.fill();
  }

  /* ---------- Столик кафе ---------- */
  function drawTable(p) {
    var p0 = project(p.x, 0, p.z);
    if (p0.z < 0.3 || p0.z > 50) return;
    var ptop = project(p.x, 0.75, p.z);
    ctx.strokeStyle = "#3a2e24";
    ctx.lineWidth = Math.max(1, p0.s * 0.08);
    ctx.beginPath(); ctx.moveTo(p0.sx, p0.sy); ctx.lineTo(ptop.sx, ptop.sy); ctx.stroke();
    var r = Math.max(3, ptop.s * 0.5);
    ctx.fillStyle = "#6b4a34";
    ctx.beginPath(); ctx.ellipse(ptop.sx, ptop.sy, r, r * 0.4, 0, 0, TAU); ctx.fill();
    // зонтик
    var pum = project(p.x, 2.3, p.z);
    ctx.strokeStyle = "#2e2620"; ctx.lineWidth = Math.max(0.8, p0.s * 0.04);
    ctx.beginPath(); ctx.moveTo(ptop.sx, ptop.sy); ctx.lineTo(pum.sx, pum.sy); ctx.stroke();
    var ur = Math.max(6, pum.s * 1.6);
    var stripe = Math.sin(timeNow) * 0;
    for (var s = 0; s < 6; s++) {
      ctx.fillStyle = s % 2 === 0 ? "#e05a5a" : "#f2f2f2";
      ctx.beginPath();
      var a0 = (s / 6) * Math.PI - Math.PI / 2;
      var a1 = ((s + 1) / 6) * Math.PI - Math.PI / 2;
      ctx.moveTo(pum.sx, pum.sy - ur * 0.3);
      ctx.lineTo(pum.sx + Math.cos(a0) * ur, pum.sy + Math.sin(a0) * ur * 0.5 + ur * 0.35);
      ctx.lineTo(pum.sx + Math.cos(a1) * ur, pum.sy + Math.sin(a1) * ur * 0.5 + ur * 0.35);
      ctx.closePath(); ctx.fill();
    }
  }
  function drawCafe(p) {
    var p0 = project(p.x, 0, p.z);
    if (p0.z < 0.3 || p0.z > 60) return;
  }

  /* ---------- Скамейка ---------- */
  function drawBench(p) {
    var a = project(p.x - 0.9, 0.45, p.z);
    var b = project(p.x + 0.9, 0.45, p.z);
    var al = project(p.x - 0.9, 0.45, p.z);
    if (al.z < 0.3 || al.z > 60) return;
    var h = Math.max(1, al.s * 0.07);
    // сиденье
    ctx.strokeStyle = "#6a4a2c";
    ctx.lineWidth = Math.max(2, al.s * 0.1);
    ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke();
    // ножки
    ctx.strokeStyle = "#3a2a1c";
    ctx.lineWidth = Math.max(1, al.s * 0.04);
    var al2 = project(p.x - 0.9, 0, p.z), ar2 = project(p.x + 0.9, 0, p.z);
    ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(al2.sx, al2.sy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(b.sx, b.sy); ctx.lineTo(ar2.sx, ar2.sy); ctx.stroke();
    // спинка
    var c = project(p.x - 0.9, 0.85, p.z), d = project(p.x + 0.9, 0.85, p.z);
    ctx.strokeStyle = "#5a3e26";
    ctx.lineWidth = Math.max(1.5, al.s * 0.07);
    ctx.beginPath(); ctx.moveTo(c.sx, c.sy); ctx.lineTo(d.sx, d.sy); ctx.stroke();
  }

  /* ---------- Фонтан ---------- */
  function drawFountain(p) {
    var base = project(p.x, 0, p.z);
    if (base.z < 0.5 || base.z > 70) return;
    var r = Math.max(8, base.s * 2.6);
    // чаша
    var bg = ctx.createLinearGradient(base.sx, base.sy - r * 0.3, base.sx, base.sy + r * 0.3);
    bg.addColorStop(0, "#c9c2b4"); bg.addColorStop(1, "#9a9286");
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(base.sx, base.sy, r, r * 0.36, 0, 0, TAU); ctx.fill();
    // вода
    ctx.fillStyle = "rgba(90,150,190,.75)";
    ctx.beginPath(); ctx.ellipse(base.sx, base.sy - r * 0.05, r * 0.82, r * 0.28, 0, 0, TAU); ctx.fill();
    // струя
    var top = project(p.x, 2.6, p.z);
    ctx.strokeStyle = "rgba(180,220,255,.7)";
    ctx.lineWidth = Math.max(1.5, base.s * 0.12);
    ctx.beginPath();
    ctx.moveTo(base.sx, base.sy - r * 0.1);
    ctx.quadraticCurveTo(base.sx + Math.sin(timeNow * 2) * 3, top.sy, top.sx, top.sy);
    ctx.stroke();
    var spray = Math.max(3, top.s * 0.6);
    ctx.fillStyle = "rgba(200,235,255,.5)";
    ctx.beginPath(); ctx.arc(top.sx, top.sy, spray, 0, TAU); ctx.fill();
    // статуя-колонна
    ctx.fillStyle = "#b8b0a2";
    ctx.fillRect(top.sx - base.s * 0.12, top.sy, base.s * 0.24, (base.sy - top.sy) * 0.7);
  }

  /* ---------- Кот ---------- */
  function drawCat(c) {
    var p = project(c.x, 0, c.z);
    if (p.z < 0.25 || p.z > 80) return;
    var hpx = c.size * p.s;          // высота в пикселях
    if (hpx < 2) return;
    var bob = Math.sin(c.phase) * hpx * 0.04;
    var legSwing = Math.sin(c.phase) * 0.5;
    var moving = (c.state === "wander" || c.state === "goto");
    var hopY = c.hop * -hpx * 0.25;

    ctx.save();
    ctx.translate(p.sx, p.sy + bob + hopY);

    // тень
    ctx.save();
    var shR = hpx * 0.7;
    var shg = ctx.createRadialGradient(0, 0, 0, 0, 0, shR);
    shg.addColorStop(0, "rgba(20,15,10,.45)");
    shg.addColorStop(1, "rgba(20,15,10,0)");
    ctx.fillStyle = shg;
    ctx.beginPath(); ctx.ellipse(0, hpx * 0.05, shR, shR * 0.32, 0, 0, TAU); ctx.fill();
    ctx.restore();

    var body = c.col.body, belly = c.col.belly;

    // хвост
    var tailAng = Math.sin(c.tail) * 0.35 + (c.state === "goto" ? 0.4 : 0);
    ctx.save();
    ctx.strokeStyle = body;
    ctx.lineWidth = Math.max(1.4, hpx * 0.12);
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-hpx * 0.5, -hpx * 0.35);
    ctx.quadraticCurveTo(-hpx * 1.0, -hpx * (0.5 + tailAng), -hpx * 0.85, -hpx * (0.95 + tailAng * 0.5));
    ctx.stroke();
    ctx.restore();

    // лапки
    ctx.strokeStyle = shade2(body, 0.8);
    ctx.lineWidth = Math.max(1, hpx * 0.1);
    ctx.lineCap = "round";
    var l1 = moving ? legSwing : 0;
    ctx.beginPath(); ctx.moveTo(-hpx * 0.22, -hpx * 0.28); ctx.lineTo(-hpx * 0.22 + l1 * hpx * 0.2, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(hpx * 0.18, -hpx * 0.28); ctx.lineTo(hpx * 0.18 - l1 * hpx * 0.2, 0); ctx.stroke();

    // тело
    var bg = ctx.createRadialGradient(-hpx * 0.2, -hpx * 0.6, hpx * 0.05, 0, -hpx * 0.4, hpx * 0.8);
    bg.addColorStop(0, lighten(body));
    bg.addColorStop(1, body);
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.ellipse(0, -hpx * 0.4, hpx * 0.58, hpx * 0.42, 0, 0, TAU);
    ctx.fill();

    // голова
    var hx = hpx * 0.42, hy = -hpx * 0.85;
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(hx, hy, hpx * 0.32, 0, TAU); ctx.fill();
    // уши
    ctx.beginPath();
    ctx.moveTo(hx - hpx * 0.26, hy - hpx * 0.16);
    ctx.lineTo(hx - hpx * 0.34, hy - hpx * 0.46);
    ctx.lineTo(hx - hpx * 0.06, hy - hpx * 0.28);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(hx + hpx * 0.02, hy - hpx * 0.28);
    ctx.lineTo(hx + hpx * 0.3, hy - hpx * 0.46);
    ctx.lineTo(hx + hpx * 0.24, hy - hpx * 0.16);
    ctx.closePath(); ctx.fill();
    // внутренние ушки
    ctx.fillStyle = "rgba(255,180,170,.6)";
    ctx.beginPath();
    ctx.moveTo(hx - hpx * 0.2, hy - hpx * 0.2);
    ctx.lineTo(hx - hpx * 0.25, hy - hpx * 0.4);
    ctx.lineTo(hx - hpx * 0.09, hy - hpx * 0.27);
    ctx.closePath(); ctx.fill();

    // мордочка
    var eyeOpen = c.blink > 0 ? 0.15 : 1;
    // когда ест — жмурится от удовольствия
    if (c.state === "eat") eyeOpen = 0.2;
    ctx.strokeStyle = "#1a1410"; ctx.lineWidth = Math.max(1, hpx * 0.035);
    if (eyeOpen > 0.5) {
      ctx.fillStyle = "#1a1410";
      ctx.beginPath(); ctx.arc(hx - hpx * 0.11, hy - hpx * 0.02, hpx * 0.045 * eyeOpen, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(hx + hpx * 0.11, hy - hpx * 0.02, hpx * 0.045 * eyeOpen, 0, TAU); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(hx - hpx * 0.1, hy - hpx * 0.035, hpx * 0.016, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(hx + hpx * 0.12, hy - hpx * 0.035, hpx * 0.016, 0, TAU); ctx.fill();
    } else {
      // прищуренные (довольные) глаза
      ctx.beginPath();
      ctx.arc(hx - hpx * 0.11, hy - hpx * 0.02, hpx * 0.05, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(hx + hpx * 0.11, hy - hpx * 0.02, hpx * 0.05, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();
    }
    // нос
    ctx.fillStyle = "#e07b7b";
    ctx.beginPath();
    ctx.moveTo(hx - hpx * 0.03, hy + hpx * 0.09);
    ctx.lineTo(hx + hpx * 0.03, hy + hpx * 0.09);
    ctx.lineTo(hx, hy + hpx * 0.13);
    ctx.closePath(); ctx.fill();
    // усы
    ctx.strokeStyle = "rgba(255,255,255,.7)";
    ctx.lineWidth = Math.max(0.6, hpx * 0.012);
    ctx.beginPath();
    ctx.moveTo(hx - hpx * 0.06, hy + hpx * 0.1); ctx.lineTo(hx - hpx * 0.3, hy + hpx * 0.06);
    ctx.moveTo(hx - hpx * 0.06, hy + hpx * 0.13); ctx.lineTo(hx - hpx * 0.3, hy + hpx * 0.16);
    ctx.moveTo(hx + hpx * 0.06, hy + hpx * 0.1); ctx.lineTo(hx + hpx * 0.3, hy + hpx * 0.06);
    ctx.moveTo(hx + hpx * 0.06, hy + hpx * 0.13); ctx.lineTo(hx + hpx * 0.3, hy + hpx * 0.16);
    ctx.stroke();

    ctx.restore();

    // индикатор «можно покормить» (F)
    var d = Math.hypot(c.x - camX, c.z - camZ);
    if (d < PET_RADIUS && !c.bubble) {
      var ip = project(c.x, c.size + 0.5, c.z);
      ctx.fillStyle = "rgba(255,220,120,.95)";
      ctx.font = "800 14px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("F — покормить", ip.sx, ip.sy);
    }
  }
  function shade2(hex, f) { return shade(hex, f); }
  function lighten(hex) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    r = Math.min(255, r + 40); g = Math.min(255, g + 40); b = Math.min(255, b + 40);
    return "rgb(" + r + "," + g + "," + b + ")";
  }

  /* ---------- Рыбка ---------- */
  function drawFood(f) {
    var p = project(f.x, f.y, f.z);
    if (p.z < 0.2) return;
    if (f.eatenBy) { ctx.globalAlpha = Math.max(0, f.life / 0.6); }
    var r = Math.max(2, p.s * 0.18);
    ctx.save();
    ctx.translate(p.sx, p.sy);
    ctx.rotate(f.landed ? 0 : f.spin * 0.3);
    // рыбка: овальное тело + хвост
    ctx.fillStyle = "#8fc7e8";
    ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#6ba8cf";
    ctx.beginPath();
    ctx.moveTo(-r, 0); ctx.lineTo(-r * 1.6, -r * 0.5); ctx.lineTo(-r * 1.6, r * 0.5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#123";
    ctx.beginPath(); ctx.arc(r * 0.4, -r * 0.1, r * 0.1, 0, TAU); ctx.fill();
    ctx.restore();
    // блик на земле
    if (f.landed) {
      var gp = project(f.x, 0.01, f.z);
      ctx.fillStyle = "rgba(140,200,230,.25)";
      ctx.beginPath(); ctx.ellipse(gp.sx, gp.sy, r * 2, r * 0.7, 0, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- Облачко с текстом ---------- */
  function drawBubble(c) {
    var p = project(c.x, c.size + 0.85, c.z);
    if (p.z < 0.3) return;
    var a = clamp(c.bubble.t / c.bubble.max, 0, 1);
    a = Math.min(1, a * 1.6);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = "700 " + Math.max(11, Math.min(20, p.s * 0.16)) + "px -apple-system, 'Segoe UI', Roboto, sans-serif";
    ctx.textAlign = "center";
    var text = c.bubble.text;
    var tw = ctx.measureText(text).width;
    var pad = 10;
    var bw = tw + pad * 2, bh = 26;
    var bx = p.sx - bw / 2, by = p.sy - bh;
    // облачко
    ctx.fillStyle = "rgba(255,255,255,.95)";
    ctx.strokeStyle = "rgba(120,90,160,.5)";
    ctx.lineWidth = 1.5;
    roundRect(bx, by, bw, bh, 12);
    ctx.fill(); ctx.stroke();
    // хвостик
    ctx.beginPath();
    ctx.moveTo(p.sx - 5, by + bh - 1);
    ctx.lineTo(p.sx, by + bh + 8);
    ctx.lineTo(p.sx + 5, by + bh - 1);
    ctx.closePath();
    ctx.fillStyle = "rgba(255,255,255,.95)";
    ctx.fill();
    // текст
    ctx.fillStyle = "#4a3070";
    ctx.fillText(text, p.sx, by + bh - 8);
    ctx.restore();
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* ---------- Сердечки ---------- */
  function drawHearts() {
    for (var i = 0; i < hearts.length; i++) {
      var h = hearts[i];
      var p = project(h.x, h.y, h.z);
      if (p.z < 0.2) continue;
      ctx.save();
      ctx.globalAlpha = clamp(h.t / 1.2, 0, 1);
      drawHeartShape(p.sx, p.sy, Math.max(6, p.s * 0.28), "#ff5a8a");
      ctx.restore();
    }
  }
  function drawHeartShape(x, y, size, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    var s = size;
    ctx.moveTo(x, y + s * 0.3);
    ctx.bezierCurveTo(x, y, x - s, y, x - s, y + s * 0.35);
    ctx.bezierCurveTo(x - s, y + s * 0.7, x, y + s * 1.0, x, y + s * 1.25);
    ctx.bezierCurveTo(x, y + s * 1.0, x + s, y + s * 0.7, x + s, y + s * 0.35);
    ctx.bezierCurveTo(x + s, y, x, y, x, y + s * 0.3);
    ctx.closePath();
    ctx.fill();
  }

  /* ---------- Прицел-маркер в центре ---------- */
  function drawWatermark() {
    // мягкий прицел
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,.35)";
    ctx.lineWidth = 1.5;
    var cx = W / 2, cy = H / 2;
    ctx.beginPath(); ctx.arc(cx, cy, 5, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - 12, cy); ctx.lineTo(cx - 7, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + 7, cy); ctx.lineTo(cx + 12, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy - 12); ctx.lineTo(cx, cy - 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy + 7); ctx.lineTo(cx, cy + 12); ctx.stroke();
    ctx.restore();

    // подсказка у котика рядом
    var nearest = null, nd = PET_RADIUS;
    for (var i = 0; i < cats.length; i++) {
      var d = Math.hypot(cats[i].x - camX, cats[i].z - camZ);
      if (d < nd) { nd = d; nearest = cats[i]; }
    }
    if (nearest) {
      ctx.save();
      ctx.fillStyle = "rgba(255,225,140,.95)";
      ctx.font = "800 16px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Нажми F, чтобы покормить 🐟", W / 2, H - 40);
      ctx.restore();
    }
  }

  /* ====================== ГЛАВНЫЙ ЦИКЛ ====================== */
  function frame(ts) {
    if (!running) return;
    var dt = lastTs ? Math.min((ts - lastTs) / 1000, 0.05) : 0.016;
    lastTs = ts;
    if (!paused) {
      update(dt);
      render(ts);
    }
    rafId = requestAnimationFrame(frame);
  }

  /* ====================== ЭКРАНЫ ====================== */
  function showStart() {
    overlay.classList.remove("hidden");
    var keysHtml = isMobile
      ? '<div class="keys">' +
          '<div><span class="key">🕹️</span> джойстик — идти</div>' +
          '<div><span class="key">👆</span> свайп по экрану — осмотреться</div>' +
          '<div><span class="key">🐟</span> бросить рыбку</div>' +
          '<div><span class="key">✋</span> покормить котика рядом</div>' +
          '<div><span class="key">🏃</span> бежать (тратит силы)</div>' +
        '</div>'
      : '<div class="keys">' +
          '<div><span class="key">W A S D</span> идти по полю</div>' +
          '<div><span class="key">Shift</span> 🏃 бежать (тратит силы)</div>' +
          '<div><span class="key">Мышь</span> осматриваться</div>' +
          '<div><span class="key">Пробел</span> бросить рыбку</div>' +
          '<div><span class="key">F</span> покормить котика рядом</div>' +
        '</div>';
    overlay.innerHTML =
      '<div class="card">' +
        '<h1>🐱 Котики у Эйфелевой башни</h1>' +
        '<p>День в Париже. Ты гуляешь по <b>Марсову полю прямо у подножия Эйфелевой башни</b>,<br>' +
        'а вокруг бегают котики. <b>Покорми их рыбкой!</b></p>' +
        '<p>Кидай рыбок — котики почуют и прибегут со всех ног. Они едят, мурчат и разговаривают.</p>' +
        keysHtml +
        '<div class="cats">' +
          '<span>🗼 Эйфелева башня рядом</span>' +
          '<span>🐟 Кинь рыбку — бегут со всех ног</span>' +
          '<span>💬 Котики разговаривают</span>' +
        '</div>' +
        '<button id="startBtn">В Париж!</button>' +
        (isMobile ? '' : '<p style="margin-top:14px;font-size:12px;opacity:.55">Мышь захватится для обзора. Esc — пауза.</p>') +
      '</div>';
  }

  function startGame() {
    getAudio();
    if (rafId) cancelAnimationFrame(rafId);
    camX = 0; camZ = 26; camY = EYE; yaw = 0; pitch = 0.02;
    walkPhase = 0; bobAmp = 0; timeNow = 0;
    foods = []; hearts = [];
    fedCount = 0; tossedCount = 0; loveScore = 0;
    tossCooldown = 0;
    stamina = STAMINA_MAX; isRunning = false;
    buildWorld();
    spawnCats();
    updateHUD();
    overlay.classList.add("hidden");
    running = true; paused = false;
    lastTs = 0;
    rafId = requestAnimationFrame(frame);
    requestLock();
  }

  overlay.addEventListener("click", function (e) {
    var btn = e.target.closest && e.target.closest("button");
    if (btn) startGame();
  });
  window.addEventListener("resize", function () { resize(); });

  resize();
  buildWorld();
  spawnCats();
  updateHUD();
  showStart();
})();
</script>
</body>
</html>
