<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Паркур: убеги от монстра 👹🏃</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0a0e1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff; -webkit-user-select: none; user-select: none;
  }
  #game { display: flex; flex-direction: column; height: 100%; }

  /* ===== HUD ===== */
  #hud {
    display: flex; align-items: center; gap: 18px; padding: 8px 18px;
    font-size: 14px; z-index: 6; flex-wrap: wrap;
    background: linear-gradient(180deg, rgba(20,26,46,.95), rgba(12,16,30,.85));
    border-bottom: 1px solid rgba(120,180,255,.2);
  }
  #hud .item { white-space: nowrap; }
  #hud .label { opacity: .6; margin-right: 6px; font-size: 12px; }
  #hud .val { font-weight: 800; font-variant-numeric: tabular-nums; }
  #timer { color: #8fe0ff; }
  #crystals { color: #ff7ad0; }
  #hud .spacer { flex: 1; }
  #best { color: #ffd76e; }

  /* ===== Сцена ===== */
  #arena { position: relative; flex: 1; overflow: hidden; background: #0a0e1a; touch-action: none; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* Подсказка внизу */
  #hint {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    z-index: 7; font-size: 13px; opacity: .65; letter-spacing: .04em;
    text-shadow: 0 2px 8px #000; pointer-events: none; text-align: center;
    background: rgba(10,14,26,.5); padding: 6px 16px; border-radius: 999px;
  }

  /* ===== Оверлей ===== */
  #overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(8,12,24,.88); backdrop-filter: blur(6px); z-index: 30;
    text-align: center; padding: 20px; overflow: auto;
  }
  #overlay.hidden { display: none; }
  #overlay .card {
    max-width: 540px; width: 100%; padding: 32px 30px; border-radius: 22px;
    background: linear-gradient(180deg, rgba(30,40,70,.95), rgba(18,24,44,.98));
    border: 2px solid rgba(120,180,255,.3);
    box-shadow: 0 24px 70px rgba(0,0,0,.7), 0 0 90px rgba(80,140,255,.12) inset;
  }
  #overlay h1 { margin: 0 0 8px; font-size: 34px; letter-spacing: .02em;
    background: linear-gradient(90deg,#8fe0ff,#8dffb4,#ff7ad0);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  #overlay p { margin: 10px 0; line-height: 1.6; font-size: 15px; opacity: .92; }
  #overlay .keys { display: flex; flex-direction: column; gap: 8px; margin: 16px auto 0; max-width: 380px; }
  #overlay .keys div { display: flex; align-items: center; gap: 12px; font-size: 14px; }
  #overlay .key { display: inline-block; min-width: 38px; text-align: center; padding: 5px 10px;
    border-radius: 8px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
    font-weight: 800; font-size: 12px; }
  #overlay button { margin-top: 22px; padding: 15px 40px; font-size: 18px; font-weight: 800;
    color: #08203a; background: linear-gradient(180deg,#8fe0ff,#4aa8e8);
    border: none; border-radius: 14px; cursor: pointer; letter-spacing: .03em;
    box-shadow: 0 8px 26px rgba(80,180,255,.4); transition: transform .1s, box-shadow .15s;
    font-family: inherit; }
  #overlay button:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(80,180,255,.55); }
  #overlay button:active { transform: translateY(1px) scale(.98); }
  #overlay .big { font-size: 46px; font-weight: 800; color: #8fe0ff; margin: 6px 0; }
  #overlay .row { display: flex; justify-content: center; gap: 28px; margin-top: 14px; flex-wrap: wrap; }
  #overlay .row .col { opacity: .9; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  #overlay .row .col b { display: block; font-size: 24px; margin-top: 4px; color: #fff; letter-spacing: 0; }

  /* Экранные кнопки (для телефона) */
  #touch {
    position: absolute; inset: 0; z-index: 8; pointer-events: none; display: none;
  }
  #touch .btn {
    position: absolute; pointer-events: auto; width: 84px; height: 84px; border-radius: 50%;
    background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.3);
    display: flex; align-items: center; justify-content: center; font-size: 34px;
    color: #fff; backdrop-filter: blur(3px);
  }
  #touch .btn:active { background: rgba(255,255,255,.3); }
  #btnLeft { left: 20px; bottom: 24px; }
  #btnRight { left: 120px; bottom: 24px; }
  #btnJump { right: 20px; bottom: 24px; }
  @media (pointer: coarse) { #touch { display: block; } }
</style>
</head>
<body>
  <div id="game">
    <div id="hud">
      <div class="item"><span class="label">Время</span><span class="val" id="timer">0.00</span></div>
      <div class="item"><span class="label">Кристаллы</span><span class="val" id="crystals">0/0</span></div>
      <div class="item"><span class="label">Погоня</span><span class="val" id="chase">👹 далеко</span></div>
      <div class="item"><span class="label">Попытки</span><span class="val" id="deaths">0</span></div>
      <div class="spacer"></div>
      <div class="item"><span class="label">Лучшее</span><span class="val" id="best">—</span></div>
    </div>

    <div id="arena">
      <canvas id="view"></canvas>
      <div id="hint">← → бежать • ПРОБЕЛ прыжок (двойной) • 👹 не дай монстру догнать!</div>
      <div id="touch">
        <div class="btn" id="btnLeft">◀</div>
        <div class="btn" id="btnRight">▶</div>
        <div class="btn" id="btnJump">⤒</div>
      </div>
      <div id="overlay"></div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  /* ===================== НАСТРОЙКИ ===================== */
  var GRAV          = 2200;   // гравитация (px/сек²)
  var JUMP_VEL      = 760;    // сила прыжка
  var MOVE_ACCEL    = 3600;   // ускорение бега
  var MAX_SPEED     = 470;    // максимальная скорость
  var AIR_ACCEL     = 2200;   // ускорение в воздухе
  var FRICTION      = 3200;   // трение на земле
  var AIR_DRAG      = 900;    // сопротивление в воздухе
  var COYOTE        = 0.11;   // время после схода с платформы — ещё можно прыгнуть
  var JUMP_BUFFER   = 0.12;   // буфер нажатия прыжка
  var WALL_SLIDE    = 130;    // скорость скольжения по стене
  var WALL_JUMP_X   = 520;    // отскок от стены по X
  var WALL_JUMP_Y   = 720;    // отскок от стены по Y
  var MAX_FALL      = 1400;
  var PLAYER_W      = 34, PLAYER_H = 48;
  var MONSTER_BASE  = 210;    // базовая скорость монстра
  var MONSTER_CATCH = 46;     // дистанция, на которой монстр ловит
  /* ==================================================== */

  var arena   = document.getElementById("arena");
  var canvas  = document.getElementById("view");
  var ctx     = canvas.getContext("2d");
  var overlay = document.getElementById("overlay");
  var timerEl = document.getElementById("timer");
  var crystalsEl = document.getElementById("crystals");
  var deathsEl = document.getElementById("deaths");
  var bestEl  = document.getElementById("best");
  var chaseEl = document.getElementById("chase");

  var W = 1, H = 1, DPR = 1;

  // Запасной roundRect для старых браузеров
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      if (typeof r === "number") r = { tl: r, tr: r, br: r, bl: r };
      else r = r || {};
      var tl = r.tl || 0, tr = r.tr || 0, br = r.br || 0, bl = r.bl || 0;
      this.moveTo(x + tl, y);
      this.lineTo(x + w - tr, y);
      this.arcTo(x + w, y, x + w, y + tr, tr);
      this.lineTo(x + w, y + h - br);
      this.arcTo(x + w, y + h, x + w - br, y + h, br);
      this.lineTo(x + bl, y + h);
      this.arcTo(x, y + h, x, y + h - bl, bl);
      this.lineTo(x, y + tl);
      this.arcTo(x, y, x + tl, y, tl);
      return this;
    };
  }

  /* ---------------------- Уровни ---------------------- */
  // Координаты в «мировых» пикселях. Ground = y=0 это низ платформы.
  // platform: {x,y,w,h,type}  y — верхняя грань
  var LEVELS = [
    {
      name: "Разминка на крышах",
      spawn: { x: 80, y: 300 },
      platforms: [
        { x: 0, y: 380, w: 360, h: 300 },          // стартовая крыша
        { x: 440, y: 360, w: 180, h: 320 },
        { x: 700, y: 320, w: 160, h: 360 },
        { x: 940, y: 280, w: 140, h: 400 },
        { x: 1150, y: 360, w: 200, h: 320 },
        { x: 1440, y: 320, w: 160, h: 360 },
        { x: 1660, y: 250, w: 140, h: 430 },
        { x: 1860, y: 340, w: 240, h: 340 },
        { x: 2160, y: 300, w: 180, h: 380 },
        { x: 2400, y: 220, w: 300, h: 460 }        // финиш
      ],
      crystals: [
        { x: 500, y: 320 }, { x: 760, y: 280 }, { x: 980, y: 240 },
        { x: 1500, y: 280 }, { x: 1700, y: 210 }, { x: 2220, y: 260 }
      ],
      moving: [
        { x: 1180, y: 250, w: 110, h: 24, axis: "x", range: 150, speed: 90 }
      ],
      hazards: [],
      goal: { x: 2560, y: 150 }                    // флаг финиша
    },
    {
      name: "Высотный забег",
      spawn: { x: 80, y: 320 },
      platforms: [
        { x: 0, y: 400, w: 300, h: 280 },
        { x: 380, y: 400, w: 120, h: 280 },
        { x: 560, y: 350, w: 120, h: 330 },
        { x: 740, y: 300, w: 120, h: 380 },
        { x: 920, y: 250, w: 120, h: 430 },
        { x: 1100, y: 300, w: 140, h: 380 },
        { x: 1320, y: 220, w: 140, h: 460 },
        { x: 1560, y: 300, w: 130, h: 380 },
        { x: 1760, y: 180, w: 130, h: 500 },
        { x: 1960, y: 260, w: 150, h: 420 },
        { x: 2180, y: 200, w: 320, h: 480 }
      ],
      crystals: [
        { x: 440, y: 350 }, { x: 800, y: 250 }, { x: 1160, y: 250 },
        { x: 1380, y: 170 }, { x: 1820, y: 130 }, { x: 2240, y: 150 }
      ],
      moving: [
        { x: 1480, y: 240, w: 100, h: 24, axis: "y", range: 120, speed: 110 }
      ],
      hazards: [],
      goal: { x: 2400, y: 130 }
    }
  ];

  /* ---------------------- Состояние ---------------------- */
  var level = null, levelIdx = 0;
  var running = false, paused = false, won = false;
  var time = 0, deaths = 0, collected = 0;
  var player = {};
  var camX = 0, camY = 0;
  var keys = {};
  var particles = [];
  var lastTs = 0, rafId = null;
  var shakeT = 0, shakeMag = 0;
  var bgStars = [];
  var clouds = [];
  var monster = null;
  var caught = false;
  var monsterCloseT = 0;      // сколько времени монстр держится вплотную
  var roarT = 0;

  function loadBest() {
    try { return JSON.parse(localStorage.getItem("parkour_best") || "null"); }
    catch (e) { return null; }
  }
  var best = loadBest();     // {levelIdx, time}

  /* ---------------------- Звук ---------------------- */
  var audioCtx = null;
  function getAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, to, dur, type, vol, delay) {
    var ac = getAudio(); if (!ac) return;
    var t = ac.currentTime + (delay || 0);
    var o = ac.createOscillator(); o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(Math.max(1, to), t + dur);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.06);
  }
  function noise(dur, cutoff, vol) {
    var ac = getAudio(); if (!ac) return;
    var buf = ac.createBuffer(1, Math.max(1, Math.floor(ac.sampleRate * dur)), ac.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, 1.5);
    var src = ac.createBufferSource(); src.buffer = buf;
    var f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cutoff || 900;
    var g = ac.createGain(); g.gain.value = vol || 0.12;
    src.connect(f); f.connect(g); g.connect(ac.destination); src.start();
  }
  function sndJump()  { tone(520, 900, 0.1, "square", 0.09); }
  function sndDouble(){ tone(700, 1200, 0.1, "square", 0.08); }
  function sndLand()  { noise(0.06, 700, 0.08); }
  function sndCrystal(){ tone(1000, 1600, 0.09, "triangle", 0.12); tone(1400, 2000, 0.1, "triangle", 0.1, 0.07); }
  function sndWall()  { tone(420, 700, 0.08, "square", 0.08); }
  function sndDie()   { tone(300, 70, 0.4, "sawtooth", 0.22); noise(0.3, 500, 0.15); }
  function sndWin()   { [600,800,1000,1300].forEach(function (f,i){ tone(f, f*1.2, 0.16, "triangle", 0.14, i*0.12); }); }
  function sndRoar() {
    tone(rand(70,110), rand(40,60), 0.7, "sawtooth", 0.22);
    noise(0.6, 400, 0.22);
    tone(160, 60, 0.6, "square", 0.1, 0.05);
  }
  function sndGrowl() { tone(rand(90,130), rand(55,75), 0.4, "sawtooth", 0.12); noise(0.35, 350, 0.1); }
  function sndCaught() {
    tone(200, 50, 0.7, "sawtooth", 0.3);
    noise(0.7, 600, 0.3);
    tone(500, 100, 0.5, "square", 0.18, 0.05);
  }

  /* ---------------------- Утилиты ---------------------- */
  function rand(a, b) { return Math.random() * (b - a) + a; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function aabb(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function resize() {
    var r = arena.getBoundingClientRect();
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildBackground();
  }

  function buildBackground() {
    bgStars = [];
    for (var i = 0; i < 90; i++) {
      bgStars.push({ x: Math.random() * 3000, y: Math.random() * H * 0.7, r: Math.random() * 1.6 + 0.4, p: Math.random() * 0.4 + 0.1 });
    }
    clouds = [];
    for (var c = 0; c < 6; c++) {
      clouds.push({ x: Math.random() * 3000, y: H * (0.1 + Math.random() * 0.3), s: rand(60, 140), p: Math.random() * 0.25 + 0.08 });
    }
  }

  /* ---------------------- Загрузка уровня ---------------------- */
  function loadLevel(idx) {
    levelIdx = clamp(idx, 0, LEVELS.length - 1);
    var L = LEVELS[levelIdx];
    level = {
      name: L.name,
      platforms: L.platforms.map(function (p) { return { x: p.x, y: p.y, w: p.w, h: p.h }; }),
      moving: (L.moving || []).map(function (m) {
        return { x0: m.x, y0: m.y, x: m.x, y: m.y, w: m.w, h: m.h, axis: m.axis, range: m.range, speed: m.speed, t: Math.random() * 6.28, prevX: m.x, prevY: m.y };
      }),
      crystals: L.crystals.map(function (c) { return { x: c.x, y: c.y, got: false }; }),
      hazards: (L.hazards || []).map(function (h) { return { x: h.x, y: h.y, w: h.w, h: h.h }; }),
      goal: { x: L.goal.x, y: L.goal.y, w: 40, h: 70 },
      spawn: L.spawn,
      totalCrystals: L.crystals.length
    };
    respawn(true);
    time = 0; collected = 0; deaths = 0; won = false;
    caught = false; monsterCloseT = 0;
    spawnMonster(true);
    updateHUD();
  }

  function spawnMonster(far) {
    // монстр появляется позади игрока (или на старте)
    var backX = level.spawn.x - (far ? 620 : 0);
    monster = {
      x: backX, y: level.spawn.y, w: 46, h: 70,
      vx: 0, vy: 0, onGround: false, facing: 1, anim: 0,
      active: far, growlT: rand(1, 2), t: Math.random() * 6.28
    };
  }

  function respawn(full) {
    player = {
      x: level.spawn.x, y: level.spawn.y, w: PLAYER_W, h: PLAYER_H,
      vx: 0, vy: 0, onGround: false, onWall: 0, coyote: 0, jumps: 0,
      facing: 1, anim: 0, landT: 0, wallCoyote: 0, dead: false, deadT: 0
    };
    if (!full) { deaths++; updateHUD(); }
    camX = player.x - W / 2;
    camY = player.y - H / 2;
    // монстр отступает назад, давая фору
    if (monster && !full) {
      monster.x = player.x - rand(500, 700);
      monster.y = player.y;
      monster.vy = 0;
      monster.active = true;
    }
    // сброс кристаллов при смерти? нет — оставляем собранные
    if (full) {
      level.crystals.forEach(function (c) { c.got = false; });
    }
  }

  /* ---------------------- Ввод ---------------------- */
  window.addEventListener("keydown", function (e) {
    var k = e.key.toLowerCase();
    if (k === "arrowleft" || k === "a" || k === "ф") keys.left = true;
    if (k === "arrowright" || k === "d" || k === "в") keys.right = true;
    if (k === "arrowup" || k === "w" || k === " " || k === "ц" || e.key === " ") { e.preventDefault(); pressJump(); }
    if (k === "r" && running) respawn(false);
    if (!running && (e.key === " " || e.key === "Enter")) { e.preventDefault(); startGame(); }
  });
  window.addEventListener("keyup", function (e) {
    var k = e.key.toLowerCase();
    if (k === "arrowleft" || k === "a" || k === "ф") keys.left = false;
    if (k === "arrowright" || k === "d" || k === "в") keys.right = false;
    if (k === "arrowup" || k === "w" || " " || e.key === " ") keys.jumpHeld = false;
  });

  var jumpBufferT = 0;
  function pressJump() {
    if (!running) return;
    jumpBufferT = JUMP_BUFFER;
  }

  // Тач
  var btnLeft = document.getElementById("btnLeft");
  var btnRight = document.getElementById("btnRight");
  var btnJump = document.getElementById("btnJump");
  function bindHold(el, on, off) {
    el.addEventListener("touchstart", function (e) { e.preventDefault(); on(); }, { passive: false });
    el.addEventListener("touchend", function (e) { e.preventDefault(); off(); }, { passive: false });
    el.addEventListener("mousedown", function (e) { e.preventDefault(); on(); });
    el.addEventListener("mouseup", function (e) { e.preventDefault(); off(); });
  }
  bindHold(btnLeft, function () { keys.left = true; }, function () { keys.left = false; });
  bindHold(btnRight, function () { keys.right = true; }, function () { keys.right = false; });
  btnJump.addEventListener("touchstart", function (e) { e.preventDefault(); pressJump(); }, { passive: false });
  btnJump.addEventListener("mousedown", function (e) { e.preventDefault(); pressJump(); });

  /* ---------------------- Физика ---------------------- */
  function update(dt) {
    if (won) { updateParticles(dt); return; }
    var p = player;
    time += dt;

    // --- горизонтальное движение ---
    var dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    var accel = p.onGround ? MOVE_ACCEL : AIR_ACCEL;
    if (dir !== 0) {
      p.vx += dir * accel * dt;
      p.facing = dir;
    } else {
      var fr = (p.onGround ? FRICTION : AIR_DRAG) * dt;
      if (Math.abs(p.vx) <= fr) p.vx = 0;
      else p.vx -= Math.sign(p.vx) * fr;
    }
    p.vx = clamp(p.vx, -MAX_SPEED, MAX_SPEED);
    // если прижат к стене — ограничим скольжение
    if (p.onWall !== 0 && !p.onGround && ((p.onWall === 1 && p.vx > 0) || (p.onWall === -1 && p.vx < 0))) {
      p.vx *= 0.6;
    }

    // --- гравитация ---
    p.vy += GRAV * dt;
    // скольжение по стене
    if (p.onWall !== 0 && p.vy > WALL_SLIDE && !p.onGround) p.vy = WALL_SLIDE;
    p.vy = clamp(p.vy, -2000, MAX_FALL);

    // --- прыжок ---
    jumpBufferT -= dt;
    if (jumpBufferT > 0) {
      if (p.onWall !== 0 && !p.onGround) {
        // отскок от стены
        p.vx = -p.onWall * WALL_JUMP_X;
        p.vy = -WALL_JUMP_Y;
        p.jumps = 1;
        jumpBufferT = 0;
        sndWall();
        burst(p.x + p.w / 2, p.y + p.h / 2, "#8fe0ff", 8);
      } else if (p.onGround || p.coyote > 0) {
        p.vy = -JUMP_VEL;
        p.onGround = false; p.coyote = 0; p.jumps = 1;
        jumpBufferT = 0;
        sndJump();
        burst(p.x + p.w / 2, p.y + p.h, "#cfe8ff", 6);
      } else if (p.jumps < 2) {
        p.vy = -JUMP_VEL * 0.92;
        p.jumps = 2;
        jumpBufferT = 0;
        sndDouble();
        burst(p.x + p.w / 2, p.y + p.h, "#ffd76e", 8);
      }
    }
    if (p.coyote > 0) p.coyote -= dt;

    // --- перемещение по X с коллизиями ---
    p.x += p.vx * dt;
    p.onWall = 0;
    var solids = level.platforms.concat(level.moving);
    for (var i = 0; i < solids.length; i++) {
      var s = solids[i];
      if (aabb(p, s)) {
        if (p.vx > 0) { p.x = s.x - p.w; p.onWall = 1; }
        else if (p.vx < 0) { p.x = s.x + s.w; p.onWall = -1; }
        p.vx = 0;
      }
    }

    // --- перемещение по Y с коллизиями ---
    var wasGround = p.onGround;
    var wasVy = p.vy;
    p.y += p.vy * dt;
    p.onGround = false;
    for (var j = 0; j < solids.length; j++) {
      var s2 = solids[j];
      if (aabb(p, s2)) {
        if (p.vy > 0) { p.y = s2.y - p.h; p.onGround = true; }
        else if (p.vy < 0) { p.y = s2.y + s2.h; }
        p.vy = 0;
      }
    }

    if (p.onGround) {
      p.coyote = COYOTE;
      p.jumps = 0;
      if (!wasGround && wasVy > 300) {
        p.landT = 0.14;
        sndLand();
        burst(p.x + p.w / 2, p.y + p.h, "#a8c0d8", 6);
      }
    }
    if (p.landT > 0) p.landT -= dt;

    // --- движение платформ ---
    var riding = null;
    for (var m = 0; m < level.moving.length; m++) {
      var mv = level.moving[m];
      mv.prevX = mv.x; mv.prevY = mv.y;
      mv.t += dt * (mv.speed / 60);
      var off = Math.sin(mv.t) * mv.range;
      if (mv.axis === "x") { mv.x = mv.x0 + off; mv.y = mv.y0; }
      else { mv.y = mv.y0 + off; mv.x = mv.x0; }
      // если игрок стоит на платформе — везём его
      if (aabb(p, mv) && p.vy >= 0 && p.y + p.h <= mv.y + 20) {
        p.x += mv.x - mv.prevX;
        p.y += mv.y - mv.prevY;
      }
    }

    // --- анимация ---
    if (p.onGround && Math.abs(p.vx) > 20) p.anim += dt * (Math.abs(p.vx) / 60);
    else if (!p.onGround) p.anim += dt * 3;

    // --- МОНСТР (погоня) ---
    updateMonster(dt);

    // --- камера ---
    var targetX = p.x + p.w / 2 - W / 2 + p.vx * 0.18;
    var targetY = p.y + p.h / 2 - H / 2 + p.vy * 0.06;
    camX += (targetX - camX) * Math.min(1, dt * 6);
    camY += (targetY - camY) * Math.min(1, dt * 6);
    camX = clamp(camX, -200, 3000 - W);
    camY = clamp(camY, -600, 400);

    // --- кристаллы ---
    for (var c = 0; c < level.crystals.length; c++) {
      var cr = level.crystals[c];
      if (cr.got) continue;
      var box = { x: cr.x - 16, y: cr.y - 16, w: 32, h: 32 };
      if (aabb(p, box)) {
        cr.got = true; collected++;
        sndCrystal();
        burst(cr.x, cr.y, "#ff7ad0", 14);
        updateHUD();
      }
    }

    // --- финиш ---
    if (aabb(p, level.goal)) { winLevel(); return; }

    // --- падение в пропасть ---
    if (p.y > 1400) { sndDie(); triggerShake(0.4, 14); respawn(false); return; }

    // --- шипы ---
    for (var h = 0; h < level.hazards.length; h++) {
      if (aabb(p, level.hazards[h])) { sndDie(); triggerShake(0.4, 14); respawn(false); return; }
    }

    updateParticles(dt);
    if (shakeT > 0) shakeT -= dt;
  }

  function triggerShake(t, m) { shakeT = t; shakeMag = m; }

  /* ---------------------- Погоня монстра ---------------------- */
  function updateMonster(dt) {
    var m = monster;
    if (!m) return;
    var p = player;

    // насколько монстр далеко
    var dx = p.x - m.x;
    var dist = Math.abs(dx);
    m.facing = dx < 0 ? -1 : 1;

    // если очень далеко убежал — монстр «догоняет» из-за края экрана
    if (!m.active && dist > 720) m.active = true;

    // скорость: тем быстрее, чем ближе, но чуть медленнее игрока max
    var speed = MONSTER_BASE + levelIdx * 45;
    // немного ускоряется, если игрок стоит
    if (Math.abs(p.vx) < 40) speed *= 1.5;
    // ускоряется со временем, чтобы не затягивать
    speed += Math.min(time * 6, 160);
    if (dist > 700) speed *= 1.5;        // если далеко — ломится быстрее
    m.vx = clamp(dx, -1, 1) * speed;

    m.anim += dt * (Math.abs(m.vx) / 40 + 4);

    // --- движение монстра: парящий демон, летит за игроком ---
    // скорость тем быстрее, чем ближе и чем дольше идёт погоня
    var speed = MONSTER_BASE + levelIdx * 45;
    speed *= clamp(time / 3, 0.3, 1);              // разгон в первые секунды — фора игроку
    if (Math.abs(p.vx) < 40) speed *= 1.5;          // стоящего догоняет быстрее
    speed += Math.min(time * 6, 160);               // ускоряется со временем
    if (dist > 700) speed *= 1.4;                   // далеко — ломится

    // плавное приближение по X
    var targetVx = clamp(dx, -1, 1) * speed;
    m.vx += (targetVx - m.vx) * Math.min(1, dt * 4);
    m.x += m.vx * dt;

    // по Y держится на уровне чуть выше игрока (парит, покачиваясь)
    var targetY = p.y - 10 + Math.sin(time * 3) * 18;
    m.y += (targetY - m.y) * Math.min(1, dt * 3);
    m.anim += dt * (Math.abs(m.vx) / 40 + 4);

    // рычание
    m.growlT -= dt;
    if (m.growlT <= 0) {
      m.growlT = rand(1.4, 3.2);
      if (dist < 900) { sndGrowl(); roarT = 0.15; }
    }
    if (roarT > 0) roarT -= dt;

    // --- поймал игрока? ---
    if (monsterCloseT > 0) monsterCloseT -= dt;
    var catchDist = Math.abs((p.x + p.w / 2) - (m.x + m.w / 2));
    if (catchDist < MONSTER_CATCH && Math.abs(p.y - m.y) < 90 && !won) {
      monsterCloseT += dt * 1.5;
      triggerShake(0.15, 4);
      if (!caught && Math.random() < dt * 6) burst(p.x, p.y + p.h / 2, "#ff3a3a", 4);
      if (monsterCloseT > 0.5) { caughtByMonster(); }
    } else {
      monsterCloseT = Math.max(0, monsterCloseT - dt);
    }
  }

  function caughtByMonster() {
    caught = true;
    sndCaught();
    triggerShake(0.7, 20);
    // разлёт частиц
    for (var i = 0; i < 30; i++) burst(player.x + player.w / 2, player.y + player.h / 2, "#ff3a3a", 2);
    respawn(false);
    caught = false;
    monsterCloseT = 0;
  }

  /* ---------------------- Частицы ---------------------- */
  function burst(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      particles.push({
        x: x, y: y, vx: rand(-160, 160), vy: rand(-220, 40),
        life: rand(0.3, 0.7), max: 0.7, color: color, r: rand(2, 5)
      });
    }
  }
  function updateParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var pt = particles[i];
      pt.vy += 900 * dt;
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.life -= dt;
      if (pt.life <= 0) particles.splice(i, 1);
    }
  }

  /* ---------------------- Отрисовка ---------------------- */
  function render() {
    var sx = 0, sy = 0;
    if (shakeT > 0) { sx = rand(-shakeMag, shakeMag); sy = rand(-shakeMag, shakeMag); }

    drawSky();

    ctx.save();
    ctx.translate(sx, sy);

    // дальний фон (город)
    drawCity(0.25, "#15203a", 0.55);
    drawCity(0.5, "#1d2c4e", 0.7);

    // мир
    ctx.save();
    ctx.translate(-camX, -camY);
    drawPlatforms();
    drawHazards();
    drawCrystals();
    drawGoal();
    drawParticles();
    drawMonster();
    drawPlayer();
    ctx.restore();

    ctx.restore();

    drawSpeedLines();
    drawDanger();      // красная рамка/индикатор погони
  }

  function drawSky() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0a0e22");
    g.addColorStop(0.4, "#1a2a52");
    g.addColorStop(0.72, "#3a4a80");
    g.addColorStop(1, "#c86a7a");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // звёзды
    for (var i = 0; i < bgStars.length; i++) {
      var st = bgStars[i];
      var x = ((st.x - camX * st.p) % 3000 + 3000) % 3000;
      if (x > W + 10) continue;
      ctx.globalAlpha = 0.5 + 0.5 * Math.sin(time * 2 + i);
      ctx.fillStyle = "#dbe9ff";
      ctx.fillRect(x, st.y - camY * st.p * 0.3, st.r, st.r);
    }
    ctx.globalAlpha = 1;

    // луна
    var mx = W * 0.78 - camX * 0.05;
    var my = H * 0.2 - camY * 0.03;
    var mg = ctx.createRadialGradient(mx, my, 6, mx, my, 90);
    mg.addColorStop(0, "rgba(255,250,220,.95)");
    mg.addColorStop(0.25, "rgba(255,245,200,.35)");
    mg.addColorStop(1, "rgba(255,240,180,0)");
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(mx, my, 90, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fdf6dc";
    ctx.beginPath(); ctx.arc(mx, my, 34, 0, Math.PI * 2); ctx.fill();

    // облака
    for (var c = 0; c < clouds.length; c++) {
      var cl = clouds[c];
      var cx = ((cl.x - camX * cl.p) % 3000 + 3000) % 3000;
      if (cx > W + 200) continue;
      ctx.fillStyle = "rgba(200,170,200,.25)";
      ctx.beginPath();
      ctx.ellipse(cx, cl.y - camY * cl.p * 0.2, cl.s, cl.s * 0.32, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + cl.s * 0.5, cl.y + 4 - camY * cl.p * 0.2, cl.s * 0.6, cl.s * 0.22, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawCity(parallax, color, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    var offset = -camX * parallax;
    var baseY = H - (H * 0.1) - camY * parallax * 0.2;
    var spacing = 120;
    var startI = Math.floor((-offset) / spacing) - 1;
    for (var i = startI; i < startI + Math.ceil(W / spacing) + 3; i++) {
      var bx = offset + i * spacing;
      var seed = (i * 9301 + 49297) % 233280 / 233280;
      var bh = 120 + seed * 260;
      ctx.fillRect(bx, baseY - bh, spacing * 0.8, bh + H);
      // окна
      ctx.save();
      ctx.globalAlpha = alpha * 0.7;
      ctx.fillStyle = seed > 0.5 ? "rgba(255,220,140,.5)" : "rgba(150,200,255,.35)";
      for (var wy = 0; wy < Math.floor(bh / 40); wy++) {
        for (var wx = 0; wx < 3; wx++) {
          if ((seed * 100 + wx * 7 + wy * 13) % 3 < 1.5) continue;
          ctx.fillRect(bx + 14 + wx * 26, baseY - bh + 20 + wy * 40, 12, 16);
        }
      }
      ctx.restore();
    }
    ctx.restore();
  }

  function drawPlatforms() {
    var all = level.platforms.concat(level.moving);
    for (var i = 0; i < all.length; i++) {
      var s = all[i];
      if (s.x + s.w < camX - 50 || s.x > camX + W + 50) continue;
      var isMoving = level.moving.indexOf(s) >= 0;
      // тень
      ctx.fillStyle = "rgba(0,0,0,.25)";
      ctx.fillRect(s.x + 4, s.y + 8, s.w, s.h);
      // тело платформы
      var g = ctx.createLinearGradient(0, s.y, 0, s.y + Math.min(s.h, 80));
      if (isMoving) {
        g.addColorStop(0, "#5a9ad8"); g.addColorStop(1, "#2a4a78");
      } else {
        g.addColorStop(0, "#4a5a7a"); g.addColorStop(0.15, "#35435e"); g.addColorStop(1, "#1e2637");
      }
      ctx.fillStyle = g;
      ctx.fillRect(s.x, s.y, s.w, s.h);
      // верхняя светлая грань
      ctx.fillStyle = isMoving ? "#8fd0ff" : "#6a7d9e";
      ctx.fillRect(s.x, s.y, s.w, 5);
      // неоновая полоска
      ctx.fillStyle = isMoving ? "rgba(140,220,255,.9)" : "rgba(120,180,255,.5)";
      ctx.fillRect(s.x, s.y + 5, s.w, 2);
      // детали: антенны/трубы на больших платформах
      if (s.h > 100 && s.w > 100) {
        ctx.fillStyle = "#2a3348";
        ctx.fillRect(s.x + s.w * 0.2, s.y + 30, 10, 40);
        ctx.fillRect(s.x + s.w * 0.7, s.y + 50, 8, 30);
      }
    }
  }

  function drawHazards() {
    for (var i = 0; i < level.hazards.length; i++) {
      var h = level.hazards[i];
      ctx.fillStyle = "#8a2020";
      ctx.fillRect(h.x, h.y + h.h - 8, h.w, 8);
      ctx.fillStyle = "#ff5a5a";
      var spikes = Math.floor(h.w / 14);
      for (var s = 0; s < spikes; s++) {
        var px = h.x + s * 14;
        ctx.beginPath();
        ctx.moveTo(px, h.y + h.h);
        ctx.lineTo(px + 7, h.y);
        ctx.lineTo(px + 14, h.y + h.h);
        ctx.closePath(); ctx.fill();
      }
    }
  }

  function drawCrystals() {
    for (var i = 0; i < level.crystals.length; i++) {
      var c = level.crystals[i];
      if (c.got) continue;
      if (c.x < camX - 40 || c.x > camX + W + 40) continue;
      var bob = Math.sin(time * 3 + i) * 6;
      var cy = c.y + bob;
      ctx.save();
      ctx.translate(c.x, cy);
      ctx.rotate(Math.sin(time * 1.5 + i) * 0.2);
      // свечение
      var gg = ctx.createRadialGradient(0, 0, 1, 0, 0, 26);
      gg.addColorStop(0, "rgba(255,140,220,.6)");
      gg.addColorStop(1, "rgba(255,140,220,0)");
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.fill();
      // сам кристалл
      ctx.fillStyle = "#ff7ad0";
      ctx.beginPath();
      ctx.moveTo(0, -15); ctx.lineTo(11, 0); ctx.lineTo(0, 15); ctx.lineTo(-11, 0);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#ffc4ec";
      ctx.beginPath();
      ctx.moveTo(0, -15); ctx.lineTo(11, 0); ctx.lineTo(0, 0);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  function drawGoal() {
    var g = level.goal;
    if (g.x < camX - 100 || g.x > camX + W + 100) return;
    // флагшток
    ctx.fillStyle = "#cfd8e8";
    ctx.fillRect(g.x + g.w / 2 - 3, g.y, 6, g.h);
    // флаг (развевается)
    var wav = Math.sin(time * 6) * 6;
    ctx.fillStyle = "#8dffb4";
    ctx.beginPath();
    ctx.moveTo(g.x + g.w / 2 + 3, g.y + 4);
    ctx.quadraticCurveTo(g.x + g.w / 2 + 30 + wav, g.y + 16, g.x + g.w / 2 + 3, g.y + 32);
    ctx.closePath(); ctx.fill();
    // свечение
    var gg = ctx.createRadialGradient(g.x + g.w / 2, g.y + g.h / 2, 4, g.x + g.w / 2, g.y + g.h / 2, 80);
    gg.addColorStop(0, "rgba(140,255,180,.35)");
    gg.addColorStop(1, "rgba(140,255,180,0)");
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(g.x + g.w / 2, g.y + g.h / 2, 80, 0, Math.PI * 2); ctx.fill();
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- Монстр-преследователь ---------- */
  function drawMonster() {
    var m = monster;
    if (!m) return;
    if (m.x + m.w < camX - 120 || m.x > camX + W + 120) {
      // монстр за экраном — не рисуем, но покажем индикатор направления
      return;
    }
    var cx = m.x + m.w / 2, cy = m.y + m.h / 2;
    var ang = Math.sin(m.anim) * 0.9;
    var breathe = Math.sin(time * 6) * 0.05;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(m.facing, 1);
    ctx.scale(1 + breathe, 1 - breathe);

    // зловещее свечение
    var glow = ctx.createRadialGradient(0, 0, 4, 0, 0, m.w * 1.6);
    glow.addColorStop(0, "rgba(180,20,40,.5)");
    glow.addColorStop(1, "rgba(180,20,40,0)");
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0, 0, m.w * 1.6, 0, Math.PI * 2); ctx.fill();

    // тень
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.ellipse(0, m.h / 2 + 4, m.w * 0.6, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    // ноги (быстро перебирает)
    ctx.strokeStyle = "#1a0a10";
    ctx.lineWidth = 8; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-m.w * 0.2, m.h * 0.2); ctx.lineTo(-m.w * 0.2 + ang * 14, m.h * 0.5);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(m.w * 0.2, m.h * 0.2); ctx.lineTo(m.w * 0.2 - ang * 14, m.h * 0.5);
    ctx.stroke();

    // тело (тёмное, мохнатое)
    var bg = ctx.createLinearGradient(0, -m.h / 2, 0, m.h / 2);
    bg.addColorStop(0, "#3a1020");
    bg.addColorStop(1, "#14060c");

    // КРЫЛЬЯ (взмахивают)
    var flap = Math.sin(m.anim * 2.5) * 0.5;
    ctx.fillStyle = "rgba(30,8,18,.92)";
    // левое крыло
    ctx.save();
    ctx.translate(-m.w * 0.4, -m.h * 0.1);
    ctx.rotate(-0.5 + flap);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-m.w * 1.4, -m.h * 0.5, -m.w * 1.8, m.h * 0.2);
    ctx.quadraticCurveTo(-m.w * 1.0, m.h * 0.1, 0, m.h * 0.15);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    // правое крыло
    ctx.save();
    ctx.translate(m.w * 0.4, -m.h * 0.1);
    ctx.rotate(0.5 - flap);
    ctx.scale(-1, 1);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-m.w * 1.4, -m.h * 0.5, -m.w * 1.8, m.h * 0.2);
    ctx.quadraticCurveTo(-m.w * 1.0, m.h * 0.1, 0, m.h * 0.15);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.ellipse(0, 0, m.w * 0.52, m.h * 0.42, 0, 0, Math.PI * 2);
    ctx.fill();

    // взъерошенная шерсть
    ctx.strokeStyle = "#2a0a14"; ctx.lineWidth = 3;
    for (var s = 0; s < 9; s++) {
      var a = (s / 9) * Math.PI * 2 + time * 3;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * m.w * 0.4, Math.sin(a) * m.h * 0.32);
      ctx.lineTo(Math.cos(a) * m.w * 0.62, Math.sin(a) * m.h * 0.5);
      ctx.stroke();
    }

    // рука-коготь тянется вперёд
    ctx.strokeStyle = "#1a0a10"; ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(m.w * 0.3, -m.h * 0.1);
    ctx.lineTo(m.w * 0.75, -m.h * 0.05 + Math.sin(m.anim * 2) * 8);
    ctx.stroke();
    ctx.fillStyle = "#e0d0c0";
    for (var c = -1; c <= 1; c++) {
      ctx.beginPath();
      ctx.moveTo(m.w * 0.75, -m.h * 0.05);
      ctx.lineTo(m.w * 0.75 + 8, -m.h * 0.05 + c * 6);
      ctx.lineTo(m.w * 0.75 + 2, -m.h * 0.05 + c * 7);
      ctx.closePath(); ctx.fill();
    }

    // голова
    ctx.fillStyle = "#1a0810";
    ctx.beginPath(); ctx.arc(0, -m.h * 0.42, m.w * 0.36, 0, Math.PI * 2); ctx.fill();
    // уши/рога
    ctx.beginPath();
    ctx.moveTo(-m.w * 0.28, -m.h * 0.6); ctx.lineTo(-m.w * 0.5, -m.h * 0.95); ctx.lineTo(-m.w * 0.1, -m.h * 0.66);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(m.w * 0.28, -m.h * 0.6); ctx.lineTo(m.w * 0.5, -m.h * 0.95); ctx.lineTo(m.w * 0.1, -m.h * 0.66);
    ctx.closePath(); ctx.fill();

    // СВЕТЯЩИЕСЯ КРАСНЫЕ ГЛАЗА
    var eyeGlow = 0.7 + 0.3 * Math.sin(time * 8) + (roarT > 0 ? 0.5 : 0);
    ctx.save();
    ctx.shadowColor = "rgba(255,30,30," + eyeGlow + ")";
    ctx.shadowBlur = 16;
    ctx.fillStyle = "#ff2a2a";
    ctx.beginPath(); ctx.ellipse(-m.w * 0.13, -m.h * 0.44, 5, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(m.w * 0.13, -m.h * 0.44, 5, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(-m.w * 0.12, -m.h * 0.45, 1.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(m.w * 0.14, -m.h * 0.45, 1.4, 0, Math.PI * 2); ctx.fill();

    // зубастая пасть
    ctx.fillStyle = "#3a0008";
    ctx.beginPath(); ctx.ellipse(0, -m.h * 0.28, m.w * 0.22, m.h * 0.09, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#e8e0d0";
    for (var t = 0; t < 5; t++) {
      var tx = -m.w * 0.18 + t * m.w * 0.09;
      ctx.beginPath();
      ctx.moveTo(tx, -m.h * 0.28 - m.h * 0.03);
      ctx.lineTo(tx + m.w * 0.05, -m.h * 0.28 - m.h * 0.03);
      ctx.lineTo(tx + m.w * 0.025, -m.h * 0.28 + m.h * 0.05);
      ctx.closePath(); ctx.fill();
    }

    ctx.restore();
  }

  /* ---------- Индикатор погони и опасности ---------- */
  function drawDanger() {
    var m = monster;
    if (!m) return;
    var p = player;
    var dist = Math.abs((p.x + p.w / 2) - (m.x + m.w / 2));
    var near = clamp(1 - dist / 600, 0, 1);

    // красная виньетка, когда монстр близко
    if (near > 0.05) {
      var g = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.85);
      g.addColorStop(0, "rgba(180,0,0,0)");
      g.addColorStop(1, "rgba(180,0,0," + (near * 0.55) + ")");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    // индикатор направления монстра (если за экраном)
    var offscreen = (m.x + m.w < camX || m.x > camX + W);
    if (offscreen) {
      var toRight = m.x > camX + W;
      var ix = toRight ? W - 40 : 40;
      var iy = H / 2;
      ctx.save();
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = "rgba(200,20,40,.9)";
      ctx.beginPath();
      if (toRight) { ctx.moveTo(ix + 16, iy); ctx.lineTo(ix - 10, iy - 18); ctx.lineTo(ix - 10, iy + 18); }
      else { ctx.moveTo(ix - 16, iy); ctx.lineTo(ix + 10, iy - 18); ctx.lineTo(ix + 10, iy + 18); }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "800 12px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("👹", ix, iy + 4);
      ctx.restore();
    }

    // предупреждение "ОН РЯДОМ!"
    if (near > 0.6) {
      ctx.save();
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(time * 14);
      ctx.fillStyle = "#ff2a2a";
      ctx.font = "800 " + Math.round(H * 0.05) + "px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("⚠ ОН РЯДОМ! БЕГИ!", W / 2, H * 0.16);
      ctx.restore();
    }
  }

  function drawPlayer() {
    var p = player;
    var cx = p.x + p.w / 2, cy = p.y + p.h / 2;
    var squash = p.landT > 0 ? 1 - p.landT * 1.5 : 1;
    var legAng = Math.sin(p.anim) * (p.onGround ? 0.5 : 0.2);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(p.facing, 1);
    ctx.scale(1, squash);

    // тень на земле
    ctx.save();
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.ellipse(0, p.h / 2 + 4, p.w * 0.5, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // тело (куртка)
    var grad = ctx.createLinearGradient(0, -p.h / 2, 0, p.h / 2);
    grad.addColorStop(0, "#4aa8e8");
    grad.addColorStop(1, "#2560a0");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(-p.w * 0.42, -p.h * 0.28, p.w * 0.84, p.h * 0.62, 6);
    ctx.fill();

    // голова
    ctx.fillStyle = "#e8b894";
    ctx.beginPath();
    ctx.arc(0, -p.h * 0.42, p.w * 0.34, 0, Math.PI * 2);
    ctx.fill();
    // шапка/волосы
    ctx.fillStyle = "#2a3350";
    ctx.beginPath();
    ctx.arc(0, -p.h * 0.46, p.w * 0.36, Math.PI, Math.PI * 1.85);
    ctx.fill();
    // глаз
    ctx.fillStyle = "#1a1f2e";
    ctx.beginPath(); ctx.arc(p.w * 0.12, -p.h * 0.42, 3, 0, Math.PI * 2); ctx.fill();

    // ноги
    ctx.strokeStyle = "#1e3350";
    ctx.lineWidth = 6;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-p.w * 0.15, p.h * 0.32);
    ctx.lineTo(-p.w * 0.15 + legAng * 10, p.h * 0.5);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(p.w * 0.15, p.h * 0.32);
    ctx.lineTo(p.w * 0.15 - legAng * 10, p.h * 0.5);
    ctx.stroke();

    // рука (в воздухе — вверх)
    ctx.strokeStyle = "#e8b894";
    ctx.lineWidth = 5;
    var armAng = p.onGround ? legAng * 0.8 : -1.2;
    ctx.beginPath();
    ctx.moveTo(p.w * 0.3, -p.h * 0.12);
    ctx.lineTo(p.w * 0.5, -p.h * 0.12 + armAng * 14);
    ctx.stroke();

    ctx.restore();

    // индикатор двойного прыжка
    if (!p.onGround && p.jumps < 2 && !p.onWall) {
      ctx.globalAlpha = 0.8;
      ctx.fillStyle = p.jumps < 1 ? "#8fe0ff" : "#ffd76e";
      ctx.beginPath(); ctx.arc(cx, cy - p.h * 0.8, 3, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function drawSpeedLines() {
    var p = player;
    if (Math.abs(p.vx) > MAX_SPEED * 0.85 || Math.abs(p.vy) > 900) {
      ctx.save();
      ctx.globalAlpha = 0.25;
      ctx.strokeStyle = "#cfe8ff";
      ctx.lineWidth = 1.5;
      for (var i = 0; i < 12; i++) {
        var y = Math.random() * H;
        var len = 40 + Math.random() * 80;
        var x = p.facing > 0 ? W - Math.random() * 200 : Math.random() * 200;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - p.facing * len, y);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  /* ---------------------- HUD / Экраны ---------------------- */
  function updateHUD() {
    timerEl.textContent = time.toFixed(2);
    crystalsEl.textContent = collected + "/" + level.totalCrystals;
    deathsEl.textContent = deaths;
    if (best) bestEl.textContent = best.time.toFixed(2);
    // индикатор погони
    if (monster && chaseEl) {
      var dist = Math.abs((player.x + player.w / 2) - (monster.x + monster.w / 2));
      if (dist > 700) chaseEl.textContent = "👹 далеко";
      else if (dist > 400) chaseEl.textContent = "👹 близко";
      else if (dist > 200) chaseEl.textContent = "👹 ОЧЕНЬ близко";
      else chaseEl.textContent = "👹 ХВАТАЕТ!";
      chaseEl.style.color = dist > 400 ? "#8fe0a0" : (dist > 200 ? "#ffd76e" : "#ff5a5a");
    }
  }

  function winLevel() {
    won = true;
    running = false;
    sndWin();
    for (var i = 0; i < 30; i++) {
      (function (k) {
        setTimeout(function () {
          burst(player.x + player.w / 2, player.y + player.h / 2,
                ["#8dffb4","#8fe0ff","#ffd76e","#ff7ad0"][Math.floor(Math.random()*4)], 7);
          render();
        }, k * 40);
      })(i);
    }

    // рекорд для этого уровня
    var isRecord = !best || (best.levelIdx === levelIdx && time < best.time);
    if (isRecord) {
      best = { levelIdx: levelIdx, time: time };
      try { localStorage.setItem("parkour_best", JSON.stringify(best)); } catch (e) {}
    }
    bestEl.textContent = best ? best.time.toFixed(2) : "—";

    setTimeout(function () {
      overlay.classList.remove("hidden");
      var nextBtn = levelIdx < LEVELS.length - 1
        ? '<button id="nextBtn">Следующий уровень →</button>' : '';
      overlay.innerHTML =
        '<div class="card">' +
          '<h1>🏁 Уровень пройден!</h1>' +
          '<div class="big">' + time.toFixed(2) + ' сек</div>' +
          '<div class="row">' +
            '<div class="col">Кристаллы<b>' + collected + '/' + level.totalCrystals + '</b></div>' +
            '<div class="col">Попытки<b>' + deaths + '</b></div>' +
            '<div class="col">Лучшее<b>' + (best ? best.time.toFixed(2) : "—") + '</b></div>' +
          '</div>' +
          (isRecord ? '<p style="color:#ffd76e;font-weight:800">🏆 Новый рекорд времени!</p>' : '') +
          nextBtn +
          '<button id="retryBtn" style="' + (nextBtn ? 'background:rgba(255,255,255,.12);color:#cfe0ff;box-shadow:none;' : '') + 'margin-top:10px">Ещё раз</button>' +
        '</div>';
      document.getElementById("retryBtn").addEventListener("click", function () { startLevel(levelIdx); });
      var nb = document.getElementById("nextBtn");
      if (nb) nb.addEventListener("click", function () { startLevel(levelIdx + 1); });
    }, 1200);
  }

  function showStart() {
    overlay.classList.remove("hidden");
    overlay.innerHTML =
      '<div class="card">' +
        '<h1>👹 ПАРКУР: УБЕГИ ОТ МОНСТРА</h1>' +
        '<p>Ночной город. По крышам <b>за тобой гонится монстр</b>!<br>' +
        'Беги, прыгай через пропасти и доберись до финиша, пока он тебя не поймал.</p>' +
        '<div class="keys">' +
          '<div><span class="key">A</span><span class="key">D</span> или <span class="key">←</span><span class="key">→</span> &nbsp;бежать</div>' +
          '<div><span class="key">ПРОБЕЛ</span> прыжок (нажми дважды — двойной)</div>' +
          '<div><span class="key">R</span> заново с последнего места</div>' +
        '</div>' +
        '<p style="margin-top:14px;font-size:13px;opacity:.85">👹 Монстр ускоряется, если стоишь на месте!<br>💎 Собирай кристаллы · от стен можно <b>отпрыгивать</b> · скользи по стенам</p>' +
        '<button id="startBtn">БЕЖАТЬ!</button>' +
      '</div>';
  }

  overlay.addEventListener("click", function (e) {
    var btn = e.target.closest && e.target.closest("button");
    if (btn && btn.id === "startBtn") startGame();
  });

  /* ---------------------- Запуск ---------------------- */
  function startLevel(idx) {
    loadLevel(idx);
    overlay.classList.add("hidden");
    running = true; paused = false;
    lastTs = 0;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(frame);
  }
  function startGame() { getAudio(); startLevel(0); }

  function frame(ts) {
    var dt = lastTs ? Math.min((ts - lastTs) / 1000, 0.033) : 0.016;
    lastTs = ts;
    if (running) {
      // под-шаги для точности
      var steps = 2, h = dt / steps;
      for (var i = 0; i < steps && running; i++) update(h);
      if (won) updateParticles(dt);
    } else {
      updateParticles(dt);
    }
    render();
    if (running) updateHUD();
    rafId = requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);

  resize();
  loadLevel(0);
  updateHUD();
  showStart();
})();
</script>
</body>
</html>
