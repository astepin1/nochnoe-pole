<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Остров Мечты: убеги от монстра 🎡👹</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #06070f;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff; -webkit-user-select: none; user-select: none;
  }
  #game { display: flex; flex-direction: column; height: 100%; }

  /* ===== HUD ===== */
  #hud {
    display: flex; align-items: center; gap: 16px; padding: 8px 16px;
    font-size: 14px; z-index: 6; flex-wrap: wrap;
    background: linear-gradient(180deg, rgba(22,18,42,.96), rgba(12,10,26,.9));
    border-bottom: 1px solid rgba(255,120,180,.25);
  }
  #hud .item { white-space: nowrap; }
  #hud .label { opacity: .6; margin-right: 5px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  #hud .val { font-weight: 800; font-variant-numeric: tabular-nums; }
  #tickets { color: #ffd76e; font-size: 17px; }
  #hearts { font-size: 18px; letter-spacing: 2px; }
  #zone { color: #ffb0e0; font-weight: 700; }
  #hud .spacer { flex: 1; }

  /* ===== Сцена ===== */
  #arena { position: relative; flex: 1; overflow: hidden; background: #0a1020; touch-action: none; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  #compass {
    position: absolute; z-index: 7; font-size: 30px; pointer-events: none;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.6)); transition: opacity .2s;
  }
  #danger { position: absolute; inset: 0; pointer-events: none; z-index: 4; opacity: 0;
    box-shadow: inset 0 0 170px rgba(220,20,20,.85); transition: opacity .18s; }
  #dmg { position: absolute; inset: 0; pointer-events: none; z-index: 5; opacity: 0;
    background: radial-gradient(circle, transparent 35%, rgba(220,20,20,.65)); }
  #dmg.on { animation: dmgf .5s; }
  @keyframes dmgf { 0% { opacity: 1; } 100% { opacity: 0; } }

  #chaseWrap { position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
    z-index: 7; width: min(70%, 380px); pointer-events: none; text-align: center; }
  #chaseBar { position: relative; height: 14px; border-radius: 9px;
    background: rgba(10,10,20,.6); box-shadow: inset 0 1px 4px rgba(0,0,0,.5);
    border: 1px solid rgba(255,90,90,.35); overflow: hidden; }
  #chaseFill { position: absolute; right: 0; top: 0; height: 100%; width: 100%;
    background: linear-gradient(90deg,#ff3a3a,#ff8a3a); transition: width .12s linear; }
  #chaseTxt { font-size: 12px; margin-top: 4px; opacity: .9; text-shadow: 0 2px 6px #000; }

  #stamWrap { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    z-index: 7; width: min(50%, 260px); pointer-events: none; }
  #stamBar { height: 10px; border-radius: 6px; background: rgba(10,10,20,.55);
    border: 1px solid rgba(140,200,255,.3); overflow: hidden; }
  #stamFill { height: 100%; width: 100%; border-radius: 6px;
    background: linear-gradient(90deg,#8fd0ff,#8dffb4); transition: width .1s linear; }

  /* ===== Мини-карта ===== */
  #minimap {
    position: absolute; right: 12px; top: 12px; z-index: 8;
    width: 150px; height: 150px; border-radius: 12px;
    background: rgba(10,12,24,.7); border: 2px solid rgba(255,140,190,.4);
    box-shadow: 0 6px 20px rgba(0,0,0,.5);
  }
  @media (max-width: 700px) { #minimap { width: 110px; height: 110px; } }

  /* ===== Оверлей ===== */
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(8,10,20,.9); backdrop-filter: blur(6px); z-index: 30;
    text-align: center; padding: 20px; overflow: auto; }
  #overlay.hidden { display: none; }
  #overlay .card { max-width: 600px; width: 100%; padding: 30px 28px; border-radius: 24px;
    background: linear-gradient(180deg, rgba(40,30,60,.97), rgba(22,16,36,.99));
    border: 2px solid rgba(255,140,190,.4);
    box-shadow: 0 24px 70px rgba(0,0,0,.8), 0 0 90px rgba(180,80,255,.12) inset; }
  #overlay h1 { margin: 0 0 8px; font-size: 31px; letter-spacing: .01em;
    background: linear-gradient(90deg,#ffd76e,#ff7ad0,#8fe0ff);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  #overlay p { margin: 10px 0; line-height: 1.6; font-size: 15px; opacity: .93; }
  #overlay .keys { display: flex; flex-direction: column; gap: 8px; margin: 16px auto 0; max-width: 430px; }
  #overlay .keys div { display: flex; align-items: center; gap: 12px; font-size: 14px; }
  #overlay .key { display: inline-block; min-width: 36px; text-align: center; padding: 5px 10px;
    border-radius: 8px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
    font-weight: 800; font-size: 12px; }
  #overlay button { margin-top: 20px; padding: 15px 40px; font-size: 18px; font-weight: 800;
    color: #2a0820; background: linear-gradient(180deg,#ffb0d8,#ff5aa8);
    border: none; border-radius: 14px; cursor: pointer; letter-spacing: .03em;
    box-shadow: 0 8px 26px rgba(255,80,170,.4); transition: transform .1s, box-shadow .15s;
    font-family: inherit; }
  #overlay button:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255,80,170,.55); }
  #overlay button:active { transform: translateY(1px) scale(.98); }
  #overlay .big { font-size: 44px; font-weight: 800; color: #ffd76e; margin: 6px 0; }
  #overlay .row { display: flex; justify-content: center; gap: 26px; margin-top: 14px; flex-wrap: wrap; }
  #overlay .row .col { opacity: .9; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  #overlay .row .col b { display: block; font-size: 23px; margin-top: 4px; color: #fff; letter-spacing: 0; }
  #overlay .legend { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
    margin-top: 16px; font-size: 13px; opacity: .9; }
  #overlay .legend span { display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.08); padding: 6px 12px; border-radius: 999px; }

  /* ===== Мобильное управление ===== */
  #mobile { position: absolute; inset: 0; z-index: 14; pointer-events: none; display: none; }
  #mobile.on { display: block; }
  #joy { position: absolute; left: 20px; bottom: 26px; width: 138px; height: 138px;
    border-radius: 50%; pointer-events: auto;
    background: radial-gradient(circle, rgba(255,255,255,.16), rgba(255,255,255,.05));
    border: 2px solid rgba(255,255,255,.35); touch-action: none; }
  #joyKnob { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px;
    margin: -30px 0 0 -30px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #ffd0e8, #d13a8a);
    box-shadow: 0 4px 12px rgba(0,0,0,.4); }
  .mbtn { position: absolute; pointer-events: auto; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.16); border: 2px solid rgba(255,255,255,.36);
    color: #fff; backdrop-filter: blur(3px); touch-action: none;
    box-shadow: 0 4px 12px rgba(0,0,0,.4); user-select: none; }
  .mbtn.press { background: rgba(255,110,180,.6); transform: scale(.94); }
  #btnSprint { right: 24px; bottom: 118px; width: 70px; height: 70px; font-size: 28px; }
  #btnRide { right: 108px; bottom: 40px; width: 70px; height: 70px; font-size: 28px; }
  #lookZone { position: absolute; right: 0; top: 0; width: 55%; height: 100%;
    pointer-events: auto; touch-action: none; }
  /* Подсказка «покататься» */
  #ridePrompt {
    position: absolute; left: 50%; bottom: 100px; transform: translateX(-50%);
    z-index: 9; padding: 10px 22px; border-radius: 999px; white-space: nowrap;
    background: rgba(20,14,40,.85); border: 2px solid rgba(255,215,110,.6);
    font-size: 15px; font-weight: 800; color: #ffd76e; pointer-events: none;
    opacity: 0; transition: opacity .2s; box-shadow: 0 6px 20px rgba(0,0,0,.5);
  }
  #ridePrompt.on { opacity: 1; animation: rpPulse .8s infinite alternate; }
  @keyframes rpPulse { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.05); } }
  /* Сообщение о катании */
  #rideMsg {
    position: absolute; left: 50%; top: 30%; transform: translateX(-50%);
    z-index: 10; padding: 12px 26px; border-radius: 16px; white-space: nowrap;
    background: rgba(255,120,200,.9); color: #fff; font-size: 17px; font-weight: 800;
    pointer-events: none; opacity: 0; box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  #rideMsg.on { opacity: 1; animation: rmIn .3s; }
  @keyframes rmIn { from { transform: translateX(-50%) scale(.7); } to { transform: translateX(-50%) scale(1); } }
</style>
</head>
<body>
  <div id="game">
    <div id="hud">
      <div class="item"><span class="label">Билеты</span><span class="val" id="tickets">0/10</span></div>
      <div class="item"><span class="label">Жизни</span><span id="hearts">❤️❤️❤️</span></div>
      <div class="item" id="zoneItem"><span class="label">Зона</span><span id="zone">—</span></div>
      <div class="spacer"></div>
      <div class="item"><span class="label">Время</span><span class="val" id="time">0:00</span></div>
    </div>

    <div id="arena">
      <canvas id="view"></canvas>
      <div id="danger"></div>
      <div id="dmg"></div>
      <div id="compass">➡️</div>
      <div id="ridePrompt">🎢 ПРОБЕЛ — покататься</div>
      <div id="rideMsg"></div>
      <canvas id="minimap"></canvas>
      <div id="chaseWrap">
        <div id="chaseBar"><span id="chaseFill"></span></div>
        <div id="chaseTxt">👹 монстр</div>
      </div>
      <div id="stamWrap"><div id="stamBar"><span id="stamFill"></span></div></div>
      <div id="mobile">
        <div id="joy"><div id="joyKnob"></div></div>
        <div class="mbtn" id="btnSprint">🏃</div>
        <div class="mbtn" id="btnRide">🎢</div>
        <div id="lookZone"></div>
      </div>
      <div id="overlay"></div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  /* ======================= НАСТРОЙКИ ======================= */
  var PARK        = 210;     // половина размера парка (420×420 — большой!)
  var WALK        = 14;
  var RUN         = 24;
  var STAM_MAX    = 100;
  var STAM_USE    = 20;
  var STAM_REGEN  = 15;
  var CAM_DIST    = 0;       // от первого лица — камера в глазах
  var CAM_HEIGHT  = 3.2;     // высота глаз
  var CAM_TARGET  = 3.2;
  var CAM_PITCH   = 0.06;    // лёгкий наклон вниз
  var ROOF_H      = 95;      // высота крыши (крытый парк!)
  var MON_BASE    = 13;
  var MON_RAMP    = 0.12;
  var MON_MAX     = 22;
  var CATCH       = 2.8;
  var TICKETS_TOTAL = 10;
  var FOG         = 420;     // дальность прорисовки
  /* ========================================================= */

  var arena   = document.getElementById("arena");
  var canvas  = document.getElementById("view");
  var ctx     = canvas.getContext("2d");
  var overlay = document.getElementById("overlay");
  var ticketsEl = document.getElementById("tickets");
  var heartsEl  = document.getElementById("hearts");
  var timeEl    = document.getElementById("time");
  var zoneEl    = document.getElementById("zone");
  var compassEl = document.getElementById("compass");
  var dangerEl  = document.getElementById("danger");
  var dmgEl     = document.getElementById("dmg");
  var chaseFill = document.getElementById("chaseFill");
  var chaseTxt  = document.getElementById("chaseTxt");
  var stamFill  = document.getElementById("stamFill");
  var mobileEl  = document.getElementById("mobile");
  var minimap   = document.getElementById("minimap");
  var mm = minimap.getContext("2d");
  var ridePromptEl = document.getElementById("ridePrompt");
  var rideMsgEl = document.getElementById("rideMsg");

  var W = 1, H = 1, DPR = 1, FOCAL = 700;

  function resize() {
    var r = arena.getBoundingClientRect();
    var w = r.width, h = r.height;
    // запасные варианты, если layout ещё не готов
    if (w < 10 || h < 10) w = arena.clientWidth;
    if (w < 10 || h < 10) h = arena.clientHeight;
    if (w < 10 || h < 10) { w = window.innerWidth; h = Math.max(200, window.innerHeight - 60); }
    W = Math.max(1, w); H = Math.max(1, h);
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    FOCAL = H * 0.9;
  }

  var isMobile = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
  if (isMobile) mobileEl.classList.add("on");

  /* ---------------------- Состояние ---------------------- */
  var cam = { x: 0, y: CAM_HEIGHT, z: 0, yaw: 0, pitch: CAM_PITCH };
  var player = { x: 0, z: 180, y: 0, facing: 0, walk: 0 };
  var monster = { x: 0, z: -180, anim: 0, lunge: 0 };
  var boxes = [], solids = [], bills = [], tickets = [], particles = [], clouds = [], lamps = [];
  var gate = { x: 0, z: PARK - 3, w: 22, open: false };

  var hearts = 3, got = 0, timeNow = 0, running = false, won = false;
  var stamina = STAM_MAX, runHold = false;
  var invuln = 0, catchT = 0, growlT = 1, shakeT = 0, shakeMag = 0;
  var lastTs = 0, rafId = null, camYaw = 0;
  var lastFrameDt = 0.016;
  var mousePitch = 0;      // наклон камеры мышью (от первого лица)
  var keys = {};
  var riding = null, rideT = 0, nearRide = null;   // катание на аттракционах
  var rides = [];          // список доступных аттракционов

  function loadBest() {
    try { return parseInt(localStorage.getItem("dreamisland_best") || "0", 10) || 0; }
    catch (e) { return 0; }
  }

  /* ---------------------- Звук ---------------------- */
  var audioCtx = null;
  function getAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function tone(f, to, dur, type, vol, delay) {
    var ac = getAudio(); if (!ac) return;
    var t = ac.currentTime + (delay || 0);
    var o = ac.createOscillator(); o.type = type || "sine";
    o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(Math.max(1, to), t + dur);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.14, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, cut, vol) {
    var ac = getAudio(); if (!ac) return;
    var buf = ac.createBuffer(1, Math.max(1, Math.floor(ac.sampleRate * dur)), ac.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, 1.5);
    var src = ac.createBufferSource(); src.buffer = buf;
    var f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cut || 900;
    var g = ac.createGain(); g.gain.value = vol || 0.1;
    src.connect(f); f.connect(g); g.connect(ac.destination); src.start();
  }
  function sndTicket() { [900,1200,1600].forEach(function (f,i){ tone(f, f*1.3, 0.1, "triangle", 0.14, i*0.07); }); }
  function sndHit()    { noise(0.25, 700, 0.25); tone(180, 70, 0.28, "sawtooth", 0.2); }
  function sndGrowl()  { tone(rand(80,120), rand(50,70), 0.5, "sawtooth", 0.12); noise(0.4, 380, 0.1); }
  function sndStep()   { noise(0.04, 500, 0.05); }
  function sndWin()    { [600,800,1000,1300,1600].forEach(function (f,i){ tone(f, f*1.25, 0.16, "triangle", 0.16, i*0.12); }); }
  function sndLose()   { tone(300, 60, 0.9, "sawtooth", 0.28); noise(0.8, 600, 0.25); }

  function rand(a, b) { return Math.random() * (b - a) + a; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function hash(n) { var s = Math.sin(n * 12.9898) * 43758.5453; return s - Math.floor(s); }

  /* ======================= МИР ======================= */
  function addBox(x, z, w, d, h, col, y0, solid) {
    var b = { x: x, z: z, w: w, d: d, h: h, col: col, y0: y0 || 0 };
    boxes.push(b);
    if (solid !== false) solids.push({ x: x, z: z, w: w, d: d });
  }

  /* ======================= ЗОНЫ ПАРКА ======================= */
  /* 4 тематические зоны (как в Замании): у каждой свой цвет и декор */
  var ZONES = [
    { name: "🚀 Космос",       col: "#1a1030", col2: "#241848", x0: -PARK, x1: 0, z0: -PARK, z1: 0, theme: "space" },
    { name: "🌿 Джунгли",      col: "#0e2010", col2: "#16301a", x0: 0, x1: PARK, z0: -PARK, z1: 0, theme: "jungle" },
    { name: "🤖 Город роботов", col: "#101826", col2: "#1a2438", x0: -PARK, x1: 0, z0: 0, z1: PARK, theme: "city" },
    { name: "🏰 Сказка",       col: "#20102a", col2: "#2e1840", x0: 0, x1: PARK, z0: 0, z1: PARK, theme: "fairy" }
  ];
  function zoneAt(x, z) {
    for (var i = 0; i < ZONES.length; i++) {
      var zn = ZONES[i];
      if (x >= zn.x0 && x < zn.x1 && z >= zn.z0 && z < zn.z1) return zn;
    }
    return ZONES[3];
  }

  function buildPark() {
    boxes = []; solids = []; bills = []; tickets = []; particles = []; clouds = []; lamps = [];
    gate = { x: 0, z: PARK - 3, w: 22, open: false };

    // ---- Забор по периметру (ворота на юге) ----
    var fc = "#c94a7a", step = 14;
    for (var x = -PARK; x < PARK; x += step) {
      addBox(x + step/2, -PARK, step, 1.6, 5, fc);
      if (Math.abs(x + step/2) > gate.w/2) addBox(x + step/2, PARK, step, 1.6, 5, fc);
    }
    for (var z = -PARK + step; z < PARK - step; z += step) {
      addBox(-PARK, z + step/2, 1.6, step, 5, fc);
      addBox(PARK, z + step/2, 1.6, step, 5, fc);
    }
    // ворота
    addBox(-gate.w/2 - 1.5, PARK, 4, 5, 12, "#8a5a2a");
    addBox(gate.w/2 + 1.5, PARK, 4, 5, 12, "#8a5a2a");
    addBox(0, PARK, gate.w + 8, 3, 2, "#ffd76e", 12);

    // ================= АТТРАКЦИОНЫ (можно кататься!) =================
    rides = [];

    // --- 1. ЗАМОК (центр, как визитная карточка) ---
    bills.push({ type: "castle", x: 0, z: -95, s: 1.0 });
    solids.push({ x: 0, z: -95, w: 60, d: 40 });

    // --- 2. ОГРОМНОЕ КОЛЕСО ОБОЗРЕНИЯ ---
    bills.push({ type: "ferris", x: -135, z: -40, r: 40, spin: 0 });
    bills.push({ type: "ferris", x: 140, z: 30, r: 30, spin: 1.5 });
    rides.push({ kind: "ferris", name: "Колесо обозрения", x: -135, z: -40, r: 40, price: 0, dur: 9 });
    rides.push({ kind: "ferris", name: "Колесо обозрения", x: 140, z: 30, r: 30, price: 0, dur: 9 });

    // --- 3. АМЕРИКАНСКИЕ ГОРКИ ---
    bills.push({ type: "coaster", x: -90, z: 120, w: 160, h: 34 });
    bills.push({ type: "coaster", x: 110, z: -130, w: 140, h: 30 });
    rides.push({ kind: "coaster", name: "Американские горки", x: -90, z: 120, w: 160, h: 34, price: 0, dur: 8 });
    rides.push({ kind: "coaster", name: "Американские горки", x: 110, z: -130, w: 140, h: 30, price: 0, dur: 8 });

    // --- 4. КАРУСЕЛИ ---
    bills.push({ type: "carousel", x: 95, z: 100, r: 24, spin: 0 });
    bills.push({ type: "carousel", x: -120, z: 60, r: 20, spin: 2 });
    bills.push({ type: "teacups", x: 60, z: 30, r: 18, spin: 0 });
    rides.push({ kind: "carousel", name: "Карусель", x: 95, z: 100, r: 24, price: 0, dur: 7 });
    rides.push({ kind: "carousel", name: "Карусель", x: -120, z: 60, r: 20, price: 0, dur: 7 });
    rides.push({ kind: "teacups", name: "Чайные чашки", x: 60, z: 30, r: 18, price: 0, dur: 6 });

    // --- 5. БАШНЯ СВОБОДНОГО ПАДЕНИЯ ---
    bills.push({ type: "drop", x: -60, z: 20, h: 70 });
    solids.push({ x: -60, z: 20, w: 16, d: 16 });
    rides.push({ kind: "drop", name: "Башня падения", x: -60, z: 20, h: 70, price: 0, dur: 7 });

    // --- 6. ВОДНЫЕ ГОРКИ ---
    bills.push({ type: "water", x: 150, z: -60, w: 70, h: 36 });
    rides.push({ kind: "water", name: "Водные горки", x: 150, z: -60, w: 70, h: 36, price: 0, dur: 7 });

    // --- 7. КОЛЕСО-ЧАСЫ / АРКА ---
    bills.push({ type: "arch", x: 0, z: 60, w: 40, h: 26 });

    // ================= ЗДАНИЯ И КИОСКИ =================
    var standCols = ["#e05a5a", "#5aa8e0", "#7ad05a", "#e0a53c", "#b06bd8", "#e07a5a"];
    var stands = [
      [-70, 150], [70, 150], [-160, -120], [160, 130], [-150, 20], [150, -150],
      [-40, -160], [50, -150], [0, 130]
    ];
    for (var i = 0; i < stands.length; i++) {
      addBox(stands[i][0], stands[i][1], 18, 14, 10, standCols[i % standCols.length]);
    }
    // маленькие полосатые палатки
    bills.push({ type: "stall", x: -90, z: 90, col: "#e05a5a" });
    bills.push({ type: "stall", x: 90, z: -60, col: "#5aa8e0" });
    bills.push({ type: "stall", x: -170, z: -60, col: "#7ad05a" });
    bills.push({ type: "stall", x: 170, z: 100, col: "#e0a53c" });

    // ================= ДЕРЕВЬЯ / ФОНАРИ / ЛАВОЧКИ =================
    for (var t = 0; t < 70; t++) {
      var tx = rand(-PARK + 14, PARK - 14), tz = rand(-PARK + 14, PARK - 14);
      if (Math.hypot(tx - player.x, tz - player.z) < 16) continue;
      if (nearAny(tx, tz, 9)) continue;
      bills.push({ type: "tree", x: tx, z: tz, h: rand(10, 18), seed: Math.random() * 100 });
    }
    for (var l = 0; l < 55; l++) {
      var lx = rand(-PARK + 8, PARK - 8), lz = rand(-PARK + 8, PARK - 8);
      if (nearAny(lx, lz, 5)) continue;
      lamps.push({ x: lx, z: lz, h: 13 });
    }
    for (var b = 0; b < 30; b++) {
      bills.push({ type: "bench", x: rand(-PARK+20, PARK-20), z: rand(-PARK+20, PARK-20) });
    }

    // ================= БИЛЕТЫ (по всему парку) =================
    var spots = [
      [-135, -40], [140, 30], [-90, 120], [-60, 20], [95, 100],
      [150, -60], [-170, 100], [170, -120], [-30, -180], [120, 170]
    ];
    for (var k = 0; k < TICKETS_TOTAL; k++) {
      tickets.push({ x: spots[k][0], z: spots[k][1], got: false, t: Math.random() * 6.28 });
    }
    // корректируем число билетов
    tickets = tickets.slice(0, TICKETS_TOTAL);

    // ================= КОЛОННЫ КРЫШИ =================
    var pillars = [];
    for (var px = -PARK + 30; px <= PARK - 30; px += 60) {
      for (var pz = -PARK + 30; pz <= PARK - 30; pz += 60) {
        if (nearAny(px, pz, 8)) continue;
        if (Math.abs(px) < 20 && Math.abs(pz) < 20) continue;
        addBox(px, pz, 8, 8, ROOF_H, "#3a3050");
      }
    }

    // облака
    for (var c = 0; c < 40; c++) clouds.push({ x: rand(-PARK*2, PARK*2), z: rand(-PARK*2, PARK*2), y: rand(80, 150), s: rand(22, 42) });
  }

  function nearAny(x, z, pad) {
    for (var i = 0; i < solids.length; i++) {
      var s = solids[i];
      if (Math.abs(x - s.x) < s.w/2 + pad && Math.abs(z - s.z) < s.d/2 + pad) return true;
    }
    return false;
  }

  /* ======================= ПРОЕКЦИЯ ======================= */
  function proj(x, y, z) {
    var dx = x - cam.x, dy = y - cam.y, dz = z - cam.z;
    var cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
    var x1 = dx * cy - dz * sy;
    var z1 = dx * sy + dz * cy;
    var cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    var y2 = dy * cp + z1 * sp;
    var z2 = -dy * sp + z1 * cp;
    if (z2 < 0.5) return null;
    var s = FOCAL / z2;
    return { x: W/2 + x1 * s, y: H/2 - y2 * s, s: s, z: z2 };
  }
  function horizonY() { return H/2 - FOCAL * Math.tan(cam.pitch); }

  function shade(hex, f) {
    var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    r = Math.min(255, Math.round(r*f)); g = Math.min(255, Math.round(g*f)); b = Math.min(255, Math.round(b*f));
    return "rgb(" + r + "," + g + "," + b + ")";
  }
  function poly(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
  }
  function fade(z) { return clamp(1 - (z - 20) / 230, 0.015, 1); }   // тьма съедает даль

  /* ======================= ОТРИСОВКА ======================= */
  function drawSky() {
    var hy = horizonY();
    // ===== ТЁМНЫЙ купол закрытого парка (ночь) =====
    var g = ctx.createLinearGradient(0, 0, 0, Math.max(hy + 40, H*0.6));
    g.addColorStop(0, "#05030c");
    g.addColorStop(0.4, "#0c0820");
    g.addColorStop(0.75, "#1a0f2e");
    g.addColorStop(1, "#2a1535");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, Math.max(hy + 60, 0));

    // рёбра купола (радиальные балки)
    var cx = W/2 - Math.sin(cam.yaw) * W * 0.3;
    var cy = hy - H * 0.5;
    var ribs = 26;
    for (var i = 0; i < ribs; i++) {
      var a = (i / ribs) * Math.PI * 2 + cam.yaw;
      var ex = W/2 + Math.sin(a) * W * 1.6;
      var ey = hy + 30 - Math.abs(Math.cos(a)) * H * 0.06;
      ctx.strokeStyle = "rgba(90,110,170,.08)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(ex, ey);
      ctx.stroke();
    }
    // кольца купола
    for (var r = 1; r <= 5; r++) {
      var rr = r / 5;
      ctx.strokeStyle = "rgba(100,120,190,.06)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(cx, cy, W * rr * 0.9, H * rr * 0.5, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    // тусклые потолочные лампы (в темноте еле светят)
    for (var s = -4; s <= 4; s++) {
      var lx = W/2 + s * W * 0.11 - Math.sin(cam.yaw) * W * 0.25;
      var ly = H * 0.06 + Math.abs(s) * H * 0.012;
      var flick = 0.4 + 0.25 * Math.sin(timeNow * 3 + s * 2);   // мерцают
      ctx.save();
      ctx.shadowColor = "rgba(255,220,150," + flick + ")";
      ctx.shadowBlur = 16;
      ctx.fillStyle = "rgba(255,230,180,.5)";
      ctx.beginPath(); ctx.ellipse(lx, ly, W*0.035, H*0.009, 0, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    // цветные витражи-окна тускло светятся в темноте
    for (var wI = -6; wI <= 6; wI++) {
      var wx = W/2 + wI * W * 0.13 - Math.sin(cam.yaw) * W * 0.5;
      var wy = hy - H * 0.22;
      var warm = (wI % 3 === 0);
      var pulse = 0.5 + 0.5 * Math.sin(timeNow * 1.2 + wI);
      ctx.globalAlpha = 0.14 + pulse * 0.12;
      ctx.fillStyle = warm ? "#ffb060" : "#6090ff";
      ctx.beginPath();
      ctx.moveTo(wx - W*0.045, hy + 10);
      ctx.lineTo(wx - W*0.03, wy);
      ctx.lineTo(wx + W*0.03, wy);
      ctx.lineTo(wx + W*0.045, hy + 10);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function drawGround() {
    var hy = horizonY();
    var top = Math.max(0, Math.min(H, hy));
    ctx.fillStyle = "#08080c";
    ctx.fillRect(0, top, W, H - top);

    // === земля по зонам (только вокруг игрока — для скорости) ===
    var step = 20;
    var range = 220;
    var gx0 = Math.floor((cam.x - range) / step) * step;
    var gz0 = Math.floor((cam.z - range) / step) * step;
    for (var gx = gx0; gx < cam.x + range; gx += step) {
      for (var gz = gz0; gz < cam.z + range; gz += step) {
        if (gx < -PARK || gx >= PARK || gz < -PARK || gz >= PARK) continue;
        var zn = zoneAt(gx + step/2, gz + step/2);
        var q = groundQuad([[gx, gz], [gx+step, gz], [gx+step, gz+step], [gx, gz+step]]);
        if (!q) continue;
        var alt = (((gx/step) + (gz/step)) % 2 === 0);
        ctx.fillStyle = alt ? zn.col : zn.col2;
        poly(q); ctx.fill();
      }
    }

    // === декор каждой зоны ===
    for (var di = 0; di < ZONES.length; di++) drawZoneDecor(ZONES[di]);

    // центральные дорожки (тусклые)
    for (var z = -PARK; z < PARK; z += 10) {
      var q2 = groundQuad([[-9, z], [9, z], [9, z+10], [-9, z+10]]);
      if (q2) { ctx.fillStyle = "rgba(60,55,45,.5)"; poly(q2); ctx.fill(); }
    }
    for (var x = -PARK; x < PARK; x += 10) {
      var q3 = groundQuad([[x, -6], [x+10, -6], [x+10, 6], [x, 6]]);
      if (q3) { ctx.fillStyle = "rgba(60,55,45,.5)"; poly(q3); ctx.fill(); }
    }
  }

  // декор каждой зоны: звёзды/лианы/неон/свечи
  function drawZoneDecor(zn) {
    var t = zn.theme;
    var count = 26;
    for (var i = 0; i < count; i++) {
      var px = zn.x0 + (zn.x1 - zn.x0) * hash(i * 3.7 + zn.x0) ;
      var pz = zn.z0 + (zn.z1 - zn.z0) * hash(i * 5.1 + zn.z0 * 2) ;
      if (Math.hypot(px - player.x, pz - player.z) < 8) continue;
      var d = Math.hypot(px - cam.x, pz - cam.z);
      if (d > 260) continue;
      var p = proj(px, 0.1, pz);
      if (!p) continue;
      var al = fade(p.z);
      ctx.globalAlpha = al;
      if (t === "space") {
        // звёздочки-наклейки на полу
        var tw = 0.5 + 0.5 * Math.sin(timeNow * 3 + i);
        ctx.fillStyle = "rgba(180,210,255," + tw + ")";
        ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(1, 0.06*p.s), 0, Math.PI*2); ctx.fill();
      } else if (t === "jungle") {
        // лианы/кусты
        var hh = (1.2 + hash(i)*1.5) * p.s;
        ctx.strokeStyle = "rgba(50,120,50,.8)";
        ctx.lineWidth = Math.max(1.5, 0.08*p.s);
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y - hh); ctx.stroke();
        ctx.fillStyle = "rgba(40,150,60,.7)";
        ctx.beginPath(); ctx.ellipse(p.x, p.y - hh, hh*0.35, hh*0.22, 0, 0, Math.PI*2); ctx.fill();
      } else if (t === "city") {
        // неоновые огоньки на полу
        var pulse = 0.4 + 0.6 * Math.abs(Math.sin(timeNow * 2 + i));
        ctx.fillStyle = "rgba(80,220,255," + pulse + ")";
        ctx.fillRect(p.x - 0.04*p.s, p.y - 0.04*p.s, 0.08*p.s, 0.08*p.s);
      } else {
        // свечи/фонарики сказки
        var fl = 0.5 + 0.5 * Math.sin(timeNow * 4 + i);
        ctx.fillStyle = "rgba(255,180,240," + fl + ")";
        ctx.beginPath(); ctx.arc(p.x, p.y - 0.15*p.s, Math.max(1, 0.05*p.s), 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // светящееся название зоны в воздухе (по центру)
    var cxz = (zn.x0 + zn.x1) / 2, czz = (zn.z0 + zn.z1) / 2;
    var lbl = proj(cxz, 16, czz);
    if (lbl && lbl.z > 10 && lbl.z < 400) {
      ctx.save();
      ctx.globalAlpha = fade(lbl.z) * 0.9;
      ctx.font = "800 " + Math.round(clamp(lbl.s*2, 14, 46)) + "px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.fillStyle = zn.col2;
      ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 2;
      ctx.strokeText(zn.name, lbl.x, lbl.y);
      ctx.fillText(zn.name, lbl.x, lbl.y);
      ctx.restore();
    }
  }
  function groundQuad(pts) {
    var out = [];
    for (var i = 0; i < pts.length; i++) {
      var p = proj(pts[i][0], 0.02, pts[i][1]);
      if (!p) return null;
      out.push(p);
    }
    return out;
  }

  function drawBox(b) {
    var x0 = b.x - b.w/2, x1 = b.x + b.w/2, z0 = b.z - b.d/2, z1 = b.z + b.d/2;
    var y0 = b.y0, y1 = b.y0 + b.h;
    var faces = [];
    function add(pts, sh) {
      var ps = [], depth = 0;
      for (var i = 0; i < pts.length; i++) {
        var p = proj(pts[i][0], pts[i][1], pts[i][2]);
        if (!p) return;
        ps.push(p); depth += p.z;
      }
      faces.push({ pts: ps, sh: sh, depth: depth / pts.length });
    }
    if (cam.y > y1) add([[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]], 1.18);
    if (cam.z < z0) add([[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]], 0.88);
    if (cam.z > z1) add([[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]], 0.72);
    if (cam.x < x0) add([[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]], 0.8);
    if (cam.x > x1) add([[x1,y0,z0],[x1,y0,z1],[x1,y1,z1],[x1,y1,z0]], 0.66);
    faces.sort(function (a, c) { return c.depth - a.depth; });
    for (var f = 0; f < faces.length; f++) {
      var fz = faces[f].depth;
      var al = fade(fz);
      ctx.globalAlpha = al;
      ctx.fillStyle = shade(b.col, faces[f].sh);
      poly(faces[f].pts); ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,.18)"; ctx.lineWidth = 1; ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- ЗАМОК ---------- */
  function drawCastle(o) {
    var p = proj(o.x, 0, o.z);
    if (!p) return;
    var s = p.s;
    var baseH = 30 * s, baseW = 62 * s;
    // главный корпус
    ctx.fillStyle = "#d8c8e8";
    ctx.fillRect(p.x - baseW/2, p.y - baseH, baseW, baseH);
    // окна
    ctx.fillStyle = "#5a4a7a";
    for (var r = 0; r < 3; r++)
      for (var c = 0; c < 6; c++) {
        if ((r+c) % 3 === 0) continue;
        ctx.fillRect(p.x - baseW/2 + baseW*0.08 + c*baseW*0.14, p.y - baseH + baseH*0.12 + r*baseH*0.24, baseW*0.08, baseH*0.14);
      }
    // башни
    var towers = [-baseW*0.42, baseW*0.42];
    for (var t = 0; t < towers.length; t++) {
      var tx = p.x + towers[t];
      var th = baseH * 1.5, tw = baseW * 0.22;
      ctx.fillStyle = "#c8b8dc";
      ctx.fillRect(tx - tw/2, p.y - th, tw, th);
      // остроконечная крыша
      ctx.fillStyle = "#e05a9a";
      ctx.beginPath();
      ctx.moveTo(tx - tw*0.7, p.y - th);
      ctx.lineTo(tx, p.y - th - th*0.35);
      ctx.lineTo(tx + tw*0.7, p.y - th);
      ctx.closePath(); ctx.fill();
      // флажок
      ctx.fillStyle = "#ffd76e";
      ctx.fillRect(tx - 0.06*s, p.y - th - th*0.45, 0.12*s, th*0.12);
    }
    // центральная башня (выше)
    var cw = baseW * 0.2, ch = baseH * 1.85;
    ctx.fillStyle = "#d8c8e8";
    ctx.fillRect(p.x - cw/2, p.y - ch, cw, ch);
    ctx.fillStyle = "#b06bd8";
    ctx.beginPath();
    ctx.moveTo(p.x - cw*0.8, p.y - ch);
    ctx.lineTo(p.x, p.y - ch - ch*0.28);
    ctx.lineTo(p.x + cw*0.8, p.y - ch);
    ctx.closePath(); ctx.fill();
    // ворота замка
    ctx.fillStyle = "#3a2a4a";
    ctx.beginPath();
    ctx.moveTo(p.x - baseW*0.12, p.y);
    ctx.lineTo(p.x - baseW*0.12, p.y - baseH*0.4);
    ctx.quadraticCurveTo(p.x, p.y - baseH*0.58, p.x + baseW*0.12, p.y - baseH*0.4);
    ctx.lineTo(p.x + baseW*0.12, p.y);
    ctx.closePath(); ctx.fill();
  }

  /* ---------- БАШНЯ ПАДЕНИЯ ---------- */
  function drawDrop(o) {
    var p = proj(o.x, 0, o.z);
    if (!p) return;
    var s = p.s, hh = o.h * s;
    // шахта
    ctx.fillStyle = "#8a8aa0";
    ctx.fillRect(p.x - 0.5*s, p.y - hh, 1.0*s, hh);
    ctx.strokeStyle = "#6a6a80"; ctx.lineWidth = 1;
    for (var i = 0; i < 8; i++) ctx.strokeRect(p.x - 0.5*s, p.y - hh + i*hh/8, 1.0*s, hh/8);
    // кабинка ездит
    var pos = (Math.sin(timeNow * 0.8) * 0.5 + 0.5);
    var cy = p.y - hh * 0.15 - pos * hh * 0.6;
    ctx.fillStyle = "#e05a5a";
    ctx.fillRect(p.x - 1.1*s, cy, 2.2*s, 1.2*s);
    ctx.fillStyle = "#ffd76e";
    ctx.fillRect(p.x - 1.1*s, cy, 2.2*s, 0.25*s);
    // верхушка
    ctx.fillStyle = "#ffd76e";
    ctx.beginPath(); ctx.arc(p.x, p.y - hh - 0.4*s, 0.5*s, 0, Math.PI*2); ctx.fill();
  }

  /* ---------- ВОДНЫЕ ГОРКИ ---------- */
  function drawWater(o) {
    // платформа с водой
    var x0 = o.x - o.w/2, x1 = o.x + o.w/2;
    for (var i = 0; i <= 12; i++) {
      var xA = x0 + i/12 * o.w, xB = x0 + (i+1)/12 * o.w;
      var hA = o.h * (0.4 + Math.abs(Math.sin(i/12*Math.PI)) * 0.6);
      var hB = o.h * (0.4 + Math.abs(Math.sin((i+1)/12*Math.PI)) * 0.6);
      var a = proj(xA, hA, o.z - 6), b = proj(xB, hB, o.z - 6);
      var c = proj(xB, hB, o.z + 6), d = proj(xA, hA, o.z + 6);
      if (a && b && c && d) {
        ctx.fillStyle = i % 2 ? "#5bc0eb" : "#7fd4ff";
        poly([a, b, c, d]); ctx.fill();
      }
    }
    // вода внизу
    var wp = proj(o.x, 0.5, o.z + 14);
    if (wp) {
      ctx.fillStyle = "rgba(90,180,230,.7)";
      ctx.beginPath(); ctx.ellipse(wp.x, wp.y, 16*wp.s, 5*wp.s, 0, 0, Math.PI*2); ctx.fill();
    }
    // опоры
    for (var k = 0; k <= 6; k++) {
      var xx = x0 + k/6 * o.w;
      var base = proj(xx, 0, o.z);
      var top = proj(xx, o.h, o.z);
      if (base && top) {
        ctx.strokeStyle = "#9aa0b0"; ctx.lineWidth = Math.max(1.5, 0.2*base.s);
        ctx.beginPath(); ctx.moveTo(base.x, base.y); ctx.lineTo(top.x, top.y); ctx.stroke();
      }
    }
  }

  /* ---------- АРКА ---------- */
  function drawArch(o) {
    var p = proj(o.x, 0, o.z);
    if (!p) return;
    var s = p.s, w = o.w * s, hh = o.h * s;
    ctx.strokeStyle = "#ffd76e"; ctx.lineWidth = Math.max(3, 0.9*s);
    ctx.beginPath();
    ctx.moveTo(p.x - w/2, p.y);
    ctx.lineTo(p.x - w/2, p.y - hh*0.6);
    ctx.quadraticCurveTo(p.x, p.y - hh*1.3, p.x + w/2, p.y - hh*0.6);
    ctx.lineTo(p.x + w/2, p.y);
    ctx.stroke();
    // огоньки
    ctx.fillStyle = "#ff7ad0";
    for (var i = 0; i <= 8; i++) {
      var t = i/8;
      var ax = p.x - w/2 + w*t;
      var ay = p.y - hh*0.6 - Math.sin(t*Math.PI)*hh*0.7;
      ctx.beginPath(); ctx.arc(ax, ay, Math.max(1.5, 0.18*s*(1 + Math.sin(timeNow*4+i))), 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = "#8fe0ff";
    ctx.font = "800 " + Math.round(1.6*s) + "px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("ОСТРОВ МЕЧТЫ", p.x, p.y - hh*1.35);
  }

  /* ---------- ЧАЙНЫЕ ЧАШКИ ---------- */
  function drawTeacups(o) {
    var p = proj(o.x, 0, o.z);
    if (!p) return;
    var s = p.s, R = o.r * s;
    ctx.fillStyle = "#d8c8f0";
    ctx.beginPath(); ctx.ellipse(p.x, p.y, R, R*0.35, 0, 0, Math.PI*2); ctx.fill();
    for (var i = 0; i < 6; i++) {
      var a = o.spin + i/6*Math.PI*2;
      var cx = p.x + Math.cos(a)*R*0.66, cy = p.y + Math.sin(a)*R*0.24 - 0.8*s;

  function drawBench(o) {

  function drawStall(o) {
    var p = proj(o.x, 0, o.z);
    if (!p) return;
    ctx.globalAlpha = fade(p.z);
    var s = p.s, w = 5*s, h = 4*s;
    ctx.fillStyle = "#8a6a4a";
    ctx.fillRect(p.x - w/2, p.y - h, w, h);

    for (var i = 0; i < 6; i++) {
      ctx.fillStyle = i % 2 ? "#ffffff" : o.col;
      ctx.beginPath();
      ctx.moveTo(p.x - r/2 + i*(r/6), p.y - h - r*0.35);
      ctx.lineTo(p.x - r/2 + (i+1)*(r/6), p.y - h - r*0.35);
      ctx.lineTo(p.x - r/2 + (i+1)*(r/6) - 4, p.y - h);
      ctx.lineTo(p.x - r/2 + i*(r/6) + 4, p.y - h);

    }
    ctx.globalAlpha = 1;
  }
  function drawFerris(o) {
    var p = proj(o.x, 0, o.z);

    var cx = p.x, cy = p.y - R - 1.6*s;

    ctx.beginPath();
    ctx.moveTo(cx - R*0.7, p.y); ctx.lineTo(cx, cy);
    ctx.moveTo(cx + R*0.7, p.y); ctx.lineTo(cx, cy);

    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = "#e05a9a"; ctx.lineWidth = Math.max(1.5, 0.2*s);
    ctx.beginPath(); ctx.arc(cx, cy, R*0.92, 0, Math.PI*2); ctx.stroke();

      var a = o.spin + i/12*Math.PI*2;

      ctx.fillStyle = ["#e05a5a","#5aa8e0","#7ad05a","#e0a53c","#b06bd8"][i%5];

  }
  function drawCarousel(o) {
    var p = proj(o.x, 0, o.z);

    var s = p.s, R = o.r * s;
    ctx.fillStyle = "#d8c8a0";
    ctx.beginPath(); ctx.ellipse(p.x, p.y, R, R*0.34, 0, 0, Math.PI*2); ctx.fill();

      var a = o.spin + i/8*Math.PI*2;

  function drawCoaster(o) {

  }
  function drawTicket(o) {
    if (o.got) return;

    var p = proj(o.x, 3.5 + bob, o.z);

  /* ---------- Маркеры аттракционов ---------- */
  function drawRideMarkers() {
    for (var i = 0; i < rides.length; i++) {
      var r = rides[i];
      var d = Math.hypot(r.x - player.x, r.z - player.z);
      if (d > 90) continue;
      var base = proj(r.x, r.kind === "drop" ? r.h + 8 : (r.kind === "ferris" ? r.r * 2 + 6 : 16), r.z);
      if (!base) continue;
      var bob = Math.sin(timeNow * 3 + i) * 0.1;
      var p = proj(r.x, (r.kind === "drop" ? r.h + 8 : (r.kind === "ferris" ? r.r * 2 + 6 : 16)) + bob, r.z);
      if (!p) continue;
      ctx.save();
      ctx.globalAlpha = fade(p.z) * 0.95;
      // пузырь с иконкой

      ctx.strokeStyle = "rgba(255,215,110,.8)"; ctx.lineWidth = 2; ctx.stroke();

  function drawGate() {

  /* ---------- Roblox-персонаж ---------- */
  function drawBlockGuy(p, opts) {

  /* ---------- МОНСТР (по-настоящему страшный) ---------- */
  function drawMonsterBill(p, mon) {
    var gap = Math.hypot(player.x - mon.x, player.z - mon.z);
    var loom = 1 + clamp(1 - gap/16, 0, 1) * 0.35;   // раздувается, когда близко
    var s = p.s * 1.9 * loom;                          // больше прежнего
    ctx.save();
    ctx.translate(p.x, p.y);

    var walk = mon.anim;
    var legH = 2.1*s, torsoH = 2.6*s, torsoW = 2.1*s, armW = 0.7*s, headS = 2.0*s;

    // === зловещая тёмно-багровая аура ===
    var gg = ctx.createRadialGradient(0, -legH - torsoH, 2, 0, -legH - torsoH, 5*s);
    gg.addColorStop(0, "rgba(120,0,10,.55)");
    gg.addColorStop(0.5, "rgba(80,0,0,.25)");
    gg.addColorStop(1, "rgba(80,0,0,0)");
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(0, -legH - torsoH, 5*s, 0, Math.PI*2); ctx.fill();

    // длинная чёрная тень-копна под ногами (тянется в стороны как щупальца)
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.ellipse(0, 0.2*s, 2.0*s, 0.5*s, 0, 0, Math.PI*2); ctx.fill();
    for (var tb = 0; tb < 6; tb++) {
      var ta = tb/6*Math.PI*2 + Math.sin(timeNow*2 + tb)*0.3;
      ctx.beginPath();
      ctx.ellipse(Math.cos(ta)*1.6*s, 0.3*s + Math.sin(ta)*0.4*s, 0.4*s, 0.15*s, ta, 0, Math.PI*2);
      ctx.fill();
    }

    // === ноги (тонкие, кривые) ===
    ctx.strokeStyle = "#0a0508"; ctx.lineWidth = 0.26*s; ctx.lineCap = "round";
    var legA = Math.sin(walk) * 0.5;
    ctx.beginPath(); ctx.moveTo(-0.35*s, -legH); ctx.quadraticCurveTo(-0.6*s, -legH*0.5, -0.4*s + legA*s*0.4, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0.35*s, -legH); ctx.quadraticCurveTo(0.6*s, -legH*0.5, 0.4*s - legA*s*0.4, 0); ctx.stroke();

    // === руки (длинные, с когтями, тянутся к игроку) ===
    var armA = -Math.sin(walk) * 0.7 * s;
    ctx.strokeStyle = "#12080c"; ctx.lineWidth = 0.22*s;
    ctx.beginPath(); ctx.moveTo(-torsoW*0.5, -legH - torsoH*0.85); ctx.quadraticCurveTo(-1.5*s, -legH - torsoH*0.4, -1.2*s, -legH - torsoH*0.9 + armA); ctx.stroke();
    // правая рука — тянется вперёд
    var reach = (0.9 + Math.max(0, mon.lunge) * 0.6) * s;
    ctx.beginPath(); ctx.moveTo(torsoW*0.5, -legH - torsoH*0.85); ctx.quadraticCurveTo(1.4*s, -legH - torsoH*0.5, 1.2*s + reach, -legH - torsoH*0.35); ctx.stroke();
    // ДЛИННЫЕ КОГТИ
    ctx.fillStyle = "#d8c8b8";
    var clawX = 1.2*s + reach, clawY = -legH - torsoH*0.35;
    for (var c = 0; c < 4; c++) {
      ctx.beginPath();
      ctx.moveTo(clawX, clawY + c*0.22*s - 0.2*s);
      ctx.lineTo(clawX + (0.55 - c*0.08)*s, clawY + c*0.22*s - 0.35*s);

    }

    // === торс: худой, бледный, с рёбрами ===
    var tg = ctx.createLinearGradient(0, -legH - torsoH, 0, -legH);
    tg.addColorStop(0, "#5a5a66");
    tg.addColorStop(0.5, "#34343e");
    tg.addColorStop(1, "#16161c");
    ctx.fillStyle = tg;
    ctx.beginPath();
    ctx.moveTo(-torsoW*0.55, -legH - torsoH*0.05);
    ctx.quadraticCurveTo(-torsoW*0.7, -legH - torsoH*0.9, -torsoW*0.35, -legH - torsoH);
    ctx.lineTo(torsoW*0.35, -legH - torsoH);
    ctx.quadraticCurveTo(torsoW*0.7, -legH - torsoH*0.9, torsoW*0.55, -legH - torsoH*0.05);

    ctx.strokeStyle = "rgba(0,0,0,.55)"; ctx.lineWidth = Math.max(1, 0.04*s);

      ctx.moveTo(-torsoW*0.4, ry);
      ctx.quadraticCurveTo(0, ry + 0.12*s, torsoW*0.4, ry);
      ctx.stroke();

    var hy = -legH - torsoH - headS*0.82;

    hg.addColorStop(0.6, "#3a3a44");
    hg.addColorStop(1, "#15151a");

    ctx.beginPath();
    ctx.moveTo(-headS*0.45, hy - headS*0.1);
    ctx.quadraticCurveTo(-headS*0.5, hy + headS*0.55, 0, hy + headS*0.7);
    ctx.quadraticCurveTo(headS*0.5, hy + headS*0.55, headS*0.45, hy - headS*0.1);
    ctx.quadraticCurveTo(headS*0.55, hy - headS*0.6, 0, hy - headS*0.62);
    ctx.quadraticCurveTo(-headS*0.55, hy - headS*0.6, -headS*0.45, hy - headS*0.1);
    ctx.closePath(); ctx.fill();

    // рога (костяные, изогнутые)
    ctx.fillStyle = "#2a2a30";
    ctx.beginPath();
    ctx.moveTo(-headS*0.4, hy - headS*0.35);
    ctx.quadraticCurveTo(-headS*0.95, hy - headS*0.75, -headS*0.7, hy - headS*1.25);

    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(headS*0.4, hy - headS*0.35);
    ctx.quadraticCurveTo(headS*0.95, hy - headS*0.75, headS*0.7, hy - headS*1.25);
    ctx.quadraticCurveTo(headS*0.6, hy - headS*0.8, headS*0.22, hy - headS*0.5);
    ctx.closePath(); ctx.fill();

    // === ЧЁРНЫЕ ГЛАЗНИЦЫ + светящиеся красные зрачки ===
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.ellipse(-headS*0.2, hy - headS*0.02, headS*0.19, headS*0.26, -0.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(headS*0.2, hy - headS*0.02, headS*0.19, headS*0.26, 0.2, 0, Math.PI*2); ctx.fill();
    var eg = 0.65 + 0.35*Math.sin(timeNow*9) + clamp(1 - gap/25, 0, 1)*0.4;
    ctx.save();
    ctx.shadowColor = "rgba(255,10,10," + Math.min(1, eg) + ")";
    ctx.shadowBlur = 22;
    ctx.fillStyle = "#ff1010";
    ctx.beginPath(); ctx.arc(-headS*0.2, hy, headS*0.075, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(headS*0.2, hy, headS*0.075, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    // === пасть, усеянная кривыми зубами ===
    ctx.fillStyle = "#1a0004";
    ctx.beginPath();
    ctx.ellipse(0, hy + headS*0.42, headS*0.34, headS*0.2, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = "#e8e0d0";
    for (var t = 0; t < 7; t++) {
      var tx = -headS*0.3 + t*headS*0.1;
      ctx.beginPath();
      ctx.moveTo(tx, hy + headS*0.28);
      ctx.lineTo(tx + headS*0.06, hy + headS*0.28);
      ctx.lineTo(tx + headS*0.03, hy + headS*0.44 + (t%2)*headS*0.08);
      ctx.closePath(); ctx.fill();
      // нижние зубы
      ctx.beginPath();
      ctx.moveTo(tx, hy + headS*0.56);
      ctx.lineTo(tx + headS*0.06, hy + headS*0.56);
      ctx.lineTo(tx + headS*0.03, hy + headS*0.42 - (t%2)*headS*0.06);
      ctx.closePath(); ctx.fill();
    }

    // === когда близко — белые всполохи ярости ===
    if (gap < 12) {
      ctx.globalAlpha = clamp(1 - gap/12, 0, 1) * 0.6;
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(-headS*0.2, hy - headS*0.02, headS*0.09, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(headS*0.2, hy - headS*0.02, headS*0.09, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  /* ======================= ОБНОВЛЕНИЕ ======================= */
  function update(dt) {
    timeNow += dt;
    var p = player;

    if (invuln > 0) invuln -= dt;
    if (shakeT > 0) shakeT -= dt;
    if (catchT > 0) catchT -= dt;

    // ===== КАТАНИЕ НА АТТРАКЦИОНЕ =====
    if (riding) {
      rideT += dt;
      updateRideCamera(dt);
      // монстр не может схватить, пока катаешься, но приближается
      var rmd = Math.hypot(riding.x - monster.x, riding.z - monster.z);
      monster.x += (p.x - monster.x) * Math.min(1, dt * 0.6);
      monster.z += (p.z - monster.z) * Math.min(1, dt * 0.6);
      monster.anim += dt * 5;
      if (rideT >= riding.dur) { endRide(); }
      updateHUD();
      // частицы/облака продолжают жить
      for (var f = particles.length - 1; f >= 0; f--) {
        var pt = particles[f];
        pt.x += pt.vx*dt; pt.z += pt.vz*dt; pt.y += pt.vy*dt; pt.vy -= 30*dt; pt.life -= dt;
        if (pt.life <= 0) particles.splice(f, 1);
      }
      for (var c = 0; c < clouds.length; c++) clouds[c].x += dt * 1.2;
      timeNow += 0; // уже добавлено
      return;
    }

    // ищем ближайший аттракцион
    nearRide = null;
    var nrd = 12;
    for (var ri = 0; ri < rides.length; ri++) {
      var r = rides[ri];
      if (r.used) continue;
      var rd = Math.hypot(r.x - p.x, r.z - p.z);
      if (rd < nrd) { nrd = rd; nearRide = r; }
    }

    var mvF = 0, mvR = 0;
    if (keys.w) mvF += 1;
    if (keys.s) mvF -= 1;
    if (keys.d) mvR += 1;
    if (keys.a) mvR -= 1;
    if (joyActive) { mvF += -joyDY; mvR += joyDX; }
    var len = Math.hypot(mvF, mvR);
    var moving = len > 0.15;
    if (len > 1) { mvF /= len; mvR /= len; }

    var sprinting = (keys.shift || runHold) && moving && stamina > 1;
    if (sprinting) stamina = Math.max(0, stamina - STAM_USE * dt);
    else stamina = Math.min(STAM_MAX, stamina + STAM_REGEN * dt);
    var spd = sprinting ? RUN : WALK;

    if (moving) {
      var fx = Math.sin(cam.yaw), fz = Math.cos(cam.yaw);
      var rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);
      var dx = fx * mvF + rx * mvR, dz = fz * mvF + rz * mvR;
      var dl = Math.hypot(dx, dz) || 1;
      dx /= dl; dz /= dl;
      p.x += dx * spd * dt; p.z += dz * spd * dt;
      p.facing = Math.atan2(dx, dz);
      p.walk += dt * (sprinting ? 13 : 9);
      if (Math.random() < dt * (sprinting ? 6 : 3.5)) sndStep();
    } else p.walk += dt * 1.5;

    // коллизии
    for (var i = 0; i < solids.length; i++) {
      var s = solids[i];
      var cx = clamp(p.x, s.x - s.w/2, s.x + s.w/2);
      var cz = clamp(p.z, s.z - s.d/2, s.z + s.d/2);
      var ddx = p.x - cx, ddz = p.z - cz;
      var dd = Math.hypot(ddx, ddz);
      if (dd < 1.4) {
        if (dd < 0.001) { ddx = 1; ddz = 0; dd = 1; }
        p.x = cx + ddx/dd * 1.4;
        p.z = cz + ddz/dd * 1.4;
      }
    }
    p.x = clamp(p.x, -PARK + 3, PARK - 3);
    p.z = clamp(p.z, -PARK + 3, PARK - 3);

    // билеты
    for (var t = 0; t < tickets.length; t++) {
      var tk = tickets[t];
      tk.t += dt * 2;
      if (tk.got) continue;
      if (Math.hypot(tk.x - p.x, tk.z - p.z) < 3) {
        tk.got = true; got++;
        sndTicket(); burst(tk.x, tk.z, "#ffd76e", 20);
        updateHUD();
      }
    }
    gate.open = (got >= tickets.length);

    // монстр
    var m = monster;
    var speed = Math.min(MON_MAX, MON_BASE + timeNow * MON_RAMP);
    var mdx = p.x - m.x, mdz = p.z - m.z;
    var md = Math.hypot(mdx, mdz) || 1;
    if (md > 0.1) { m.x += mdx/md * speed * dt; m.z += mdz/md * speed * dt; }
    m.anim += dt * (6 + speed * 0.3);
    if (m.lunge > 0) m.lunge -= dt;
    growlT -= dt;
    if (growlT <= 0) { growlT = rand(1.6, 3.2); sndGrowl(); }

    if (md < CATCH && invuln <= 0) {
      hearts--; invuln = 2.2; catchT = 1.2;
      sndHit(); shakeT = 0.6; shakeMag = 20;
      dmgEl.classList.remove("on"); void dmgEl.offsetWidth; dmgEl.classList.add("on");
      burst(p.x, p.z, "#ff3a3a", 26);
      m.x = p.x - mdx/md * 18; m.z = p.z - mdz/md * 18; m.lunge = 0;
      updateHUD();
      if (hearts <= 0) { endGame(false); return; }
    }

    if (gate.open && Math.abs(p.x - gate.x) < gate.w/2 && p.z > gate.z - 6) { endGame(true); return; }

    // камера — ОТ ПЕРВОГО ЛИЦА (из глаз игрока)
    camYaw = cam.yaw;
    cam.x = p.x;
    cam.z = p.z;
    cam.y = CAM_HEIGHT;
    cam.pitch = 0.06 + (isMobile ? 0 : mousePitch);   // чуть вниз, можно смотреть мышью

    // зона
    zoneEl.textContent = zoneName(p.x, p.z);

    // частицы
    for (var f = particles.length - 1; f >= 0; f--) {
      var pt = particles[f];
      pt.x += pt.vx*dt; pt.z += pt.vz*dt; pt.y += pt.vy*dt;
      pt.vy -= 30*dt; pt.life -= dt;
      if (pt.life <= 0) particles.splice(f, 1);
    }
    for (var c = 0; c < clouds.length; c++) clouds[c].x += dt * 1.2;

    updateChase(md);
  }

  function zoneName(x, z) {
    var zn = zoneAt(x, z);
    // плюс уточнение по конкретному месту
    if (z < -60 && x < 0) return "🚀 Космос · Замок-ракета";
    if (z < -60 && x >= 0) return "🌿 Джунгли · водопад";
    if (x < -80 && z > 0) return "🤖 Город роботов · колесо";
    if (x > 80 && z > 0) return "🏰 Сказка · карусель";
    return zn.name;
  }

  /* ======================= КАТАНИЕ ======================= */
  function tryStartRide() {
    if (!running || riding) return;
    nearRide = null;
    var nrd = 13;
    for (var i = 0; i < rides.length; i++) {
      var r = rides[i];
      var d = Math.hypot(r.x - player.x, r.z - player.z);
      if (d < nrd) { nrd = d; nearRide = r; }
    }
    if (!nearRide) return;
    startRide(nearRide);
  }

  function startRide(r) {
    riding = r; rideT = 0;
    sndTicket();
    burst(r.x, r.z, "#ffd76e", 18);
    updateHUD();
    rideMsg("🎢 " + r.name + " — катаемся!");
  }

  function endRide() {
    var r = riding;
    riding = null; rideT = 0;
    player.x = r.x; player.z = r.z + (r.kind === "ferris" ? 14 : 16);
    player.x = clamp(player.x, -PARK + 4, PARK - 4);
    player.z = clamp(player.z, -PARK + 4, PARK - 4);
    rideMsg("Понравилось кататься! 🎠");
  }

  function updateRideCamera(dt) {
    var r = riding;
    var t = rideT / r.dur;
    var ease = Math.min(1, rideT * 1.5) * Math.min(1, (r.dur - rideT) * 1.5);
    if (r.kind === "ferris" || r.kind === "carousel" || r.kind === "teacups") {
      // кружимся по кругу
      var ang = rideT * (r.kind === "teacups" ? 1.6 : 0.9);
      var rr = (r.r || 20) * 0.7;
      player.x = r.x + Math.cos(ang) * rr;
      player.z = r.z + Math.sin(ang) * rr;
      player.y = (r.kind === "ferris") ? (r.r) * (0.5 + 0.5 * Math.sin(t * Math.PI)) : 0;
      cam.yaw = ang + Math.PI;
      cam.pitch = r.kind === "ferris" ? -0.15 - ease * 0.2 : 0.2;
    } else if (r.kind === "drop") {
      // взлёт и падение
      var ph = rideT / r.dur;
      var hgt;
      if (ph < 0.5) hgt = (ph / 0.5) * r.h * 0.9;          // подъём
      else hgt = r.h * 0.9 * Math.max(0, 1 - (ph - 0.5) / 0.35); // резкое падение
      player.y = hgt;
      player.x = r.x; player.z = r.z + 6;
      cam.pitch = ph < 0.5 ? -0.35 : 0.45;
      if (ph > 0.5 && Math.random() < 0.5) burst(r.x, r.z + 6, "#8fe0ff", 2);
    } else if (r.kind === "coaster") {
      // едем вдоль горок
      var cx = r.x - r.w/2 + t * r.w;
      var cy = 10 + Math.sin(t * Math.PI) * r.h;
      player.x = cx; player.z = r.z; player.y = cy;
      cam.yaw = Math.PI / 2;  // смотрим вдоль пути
      cam.pitch = Math.cos(t * Math.PI) * 0.4;
      if (Math.random() < 0.4) burst(cx, r.z, "#ff7ad0", 1);
    } else if (r.kind === "water") {
      // спуск по воде
      var wx = r.x - r.w/2 + t * r.w;
      player.x = wx; player.z = r.z; player.y = r.h * (1 - t);
      cam.yaw = Math.PI / 2;
      cam.pitch = 0.2;
      if (Math.random() < 0.5) burst(wx, r.z + 12, "#7fd4ff", 2);
    }
    cam.x = player.x; cam.z = player.z; cam.y = player.y + CAM_HEIGHT;
  }

  var rideMsgT = 0, rideMsgTxt = "";
  function rideMsg(t) { rideMsgT = 2.5; rideMsgTxt = t; }

  var joyActive = false, joyId = null, joyCX = 0, joyCY = 0, joyDX = 0, joyDY = 0;
  function burst(x, z, color, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random()*Math.PI*2, sp = rand(3, 13);
      particles.push({ x: x, y: rand(0.5, 3), z: z, vx: Math.cos(a)*sp, vz: Math.sin(a)*sp, vy: rand(2, 10), life: rand(0.4, 0.9), max: 0.9, color: color, r: rand(0.1, 0.3) });
    }
  }

  function updateChase(md) {
    var f = clamp(md / 45, 0, 1);
    chaseFill.style.width = (f * 100) + "%";
    if (md > 28) { chaseTxt.textContent = "👹 монстр далеко"; chaseTxt.style.color = "#8fe0a0"; }
    else if (md > 15) { chaseTxt.textContent = "👹 монстр близко"; chaseTxt.style.color = "#ffd76e"; }
    else { chaseTxt.textContent = "👹 ОН РЯДОМ! УБЕГАЙ!"; chaseTxt.style.color = "#ff5a5a"; }
    var dng = clamp(1 - md/22, 0, 1);
    dangerEl.style.opacity = (dng*dng*0.9).toFixed(2);
  }

  /* ======================= ОТРИСОВКА КАДРА ======================= */
  function render() {
    var sx = 0, sy = 0;
    if (shakeT > 0) { sx = rand(-shakeMag, shakeMag); sy = rand(-shakeMag, shakeMag); }
    drawSky();
    ctx.save();
    ctx.translate(sx, sy);
    drawGround();

    var items = [];
    var cxd = cam.x, czd = cam.z;
    for (var i = 0; i < boxes.length; i++) {
      var b = boxes[i];
      items.push({ kind: "box", o: b, d: (b.x-cxd)*(b.x-cxd) + (b.z-czd)*(b.z-czd) });
    }
    for (var j = 0; j < bills.length; j++) {
      var bl = bills[j];
      items.push({ kind: bl.type, o: bl, d: (bl.x-cxd)*(bl.x-cxd) + (bl.z-czd)*(bl.z-czd) });
    }
    for (var l = 0; l < lamps.length; l++) {
      var lp = lamps[l];
      items.push({ kind: "lamp", o: lp, d: (lp.x-cxd)*(lp.x-cxd) + (lp.z-czd)*(lp.z-czd) });
    }
    for (var t = 0; t < tickets.length; t++) {
      var tk = tickets[t];
      if (tk.got) continue;
      items.push({ kind: "ticket", o: tk, d: (tk.x-cxd)*(tk.x-cxd) + (tk.z-czd)*(tk.z-czd) });
    }
    items.push({ kind: "gate", o: gate, d: (gate.x-cxd)*(gate.x-cxd) + (gate.z-czd)*(gate.z-czd) });
    items.push({ kind: "player", o: player, d: (player.x-cxd)*(player.x-cxd) + (player.z-czd)*(player.z-czd) });
    items.push({ kind: "monster", o: monster, d: (monster.x-cxd)*(monster.x-cxd) + (monster.z-czd)*(monster.z-czd) });
    items.sort(function (a, c) { return c.d - a.d; });

    for (var k = 0; k < items.length; k++) {
      var it = items[k], type = it.kind;
      if (it.d > FOG*FOG) continue;
      if (type === "box") drawBox(it.o);
      else if (type === "tree") drawTree(it.o);
      else if (type === "lamp") drawLamp(it.o);
      else if (type === "bench") drawBench(it.o);
      else if (type === "stall") drawStall(it.o);
      else if (type === "ferris") drawFerris(it.o);
      else if (type === "carousel") drawCarousel(it.o);
      else if (type === "coaster") drawCoaster(it.o);
      else if (type === "castle") drawCastle(it.o);
      else if (type === "drop") drawDrop(it.o);
      else if (type === "water") drawWater(it.o);
      else if (type === "teacups") drawTeacups(it.o);
      else if (type === "arch") drawArch(it.o);
      else if (type === "ticket") drawTicket(it.o);
      else if (type === "gate") drawGate();
      else if (type === "player") {
        // От первого лица — себя не рисуем
      } else if (type === "monster") {
        var mp = proj(monster.x, 0, monster.z);
        if (mp) drawMonsterBill(mp, monster);
      }
    }

    for (var f = 0; f < particles.length; f++) {
      var pt = particles[f];
      var pj = proj(pt.x, pt.y, pt.z);
      if (!pj) continue;
      ctx.globalAlpha = clamp(pt.life/pt.max, 0, 1);
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pj.x, pj.y, Math.max(1, pt.r*pj.s), 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    drawRideMarkers();
    drawFirstPersonHands();
    drawCompass();
    drawMinimap(lastFrameDt);
  }

  // Руки игрока от первого лица (+ мигающий фонарик)
  function drawFirstPersonHands() {
    if (!running) return;
    var W2 = W, H2 = H;
    var sway = Math.sin(player.walk) * 6;
    ctx.save();
    // левая рука
    ctx.fillStyle = "#e8b894";
    ctx.fillRect(W2*0.16 + sway, H2 - 70 + Math.abs(sway)*0.3, 44, 110);
    ctx.fillStyle = "#3a5a9a";
    ctx.fillRect(W2*0.16 + sway, H2 - 70 + Math.abs(sway)*0.3, 44, 26);
    // правая рука + фонарик
    ctx.fillStyle = "#e8b894";
    ctx.fillRect(W2*0.80 - sway, H2 - 80 - Math.abs(sway)*0.3, 44, 120);
    ctx.fillStyle = "#3a5a9a";
    ctx.fillRect(W2*0.80 - sway, H2 - 80 - Math.abs(sway)*0.3, 44, 26);
    // фонарик
    var flick = 0.75 + 0.25 * Math.sin(timeNow * 12);
    ctx.save();
    ctx.shadowColor = "rgba(255,240,180," + flick + ")";
    ctx.shadowBlur = 14;
    ctx.fillStyle = "rgba(255,248,220,.95)";
    ctx.beginPath(); ctx.arc(W2*0.80 - sway + 22, H2 - 84, 9, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.restore();
  }

  function drawCompass() {
    if (!running) { compassEl.style.opacity = "0"; return; }
    var tx, tz;
    if (got < tickets.length) {
      var best = null, bd = Infinity;
      for (var i = 0; i < tickets.length; i++) {
        if (tickets[i].got) continue;
        var d = Math.hypot(tickets[i].x - player.x, tickets[i].z - player.z);
        if (d < bd) { bd = d; best = tickets[i]; }
      }
      if (!best) { compassEl.style.opacity = "0"; return; }
      tx = best.x; tz = best.z;
    } else { tx = gate.x; tz = gate.z; }
    var ang = Math.atan2(tx - player.x, tz - player.z) - cam.yaw;
    var radius = Math.min(W, H) * 0.35;
    var cx = W/2 + Math.sin(ang) * radius * 0.9;
    var cy = H/2 - Math.cos(ang) * radius * 0.5;
    compassEl.style.opacity = "0.95";
    compassEl.style.left = (cx - 16) + "px";
    compassEl.style.top = (cy - 16) + "px";
    compassEl.style.transform = "rotate(" + (ang * 180 / Math.PI) + "deg)";
  }

  var mmTimer = 0;
  function drawMinimap(dt) {
    // обновляем реже — раз в 0.1 сек (для скорости)
    mmTimer -= (dt || 0.016);
    if (mmTimer > 0) return;
    mmTimer = 0.1;
    var M = minimap.width / DPR;
    mm.setTransform(DPR, 0, 0, DPR, 0, 0);
    mm.clearRect(0, 0, M, M);
    mm.fillStyle = "rgba(10,14,26,.85)";
    mm.fillRect(0, 0, M, M);
    var scale = M / (PARK * 2);
    function mx(x) { return (x + PARK) * scale; }
    function mz(z) { return (z + PARK) * scale; }
    // забор
    mm.strokeStyle = "rgba(255,120,180,.5)"; mm.lineWidth = 2;
    mm.strokeRect(mx(-PARK), mz(-PARK), PARK*2*scale, PARK*2*scale);
    // билеты
    for (var i = 0; i < tickets.length; i++) {
      var tk = tickets[i];
      mm.fillStyle = tk.got ? "rgba(120,120,120,.5)" : "#ffd76e";
      mm.beginPath(); mm.arc(mx(tk.x), mz(tk.z), 3, 0, Math.PI*2); mm.fill();
    }
    // ворота
    mm.fillStyle = gate.open ? "#8dffb4" : "#8a5a2a";
    mm.fillRect(mx(gate.x) - 5, mz(gate.z) - 3, 10, 6);
    // монстр
    mm.fillStyle = "#ff3a3a";
    mm.beginPath(); mm.arc(mx(monster.x), mz(monster.z), 4, 0, Math.PI*2); mm.fill();
    // игрок
    mm.fillStyle = "#8fe0ff";
    mm.beginPath(); mm.arc(mx(player.x), mz(player.z), 4, 0, Math.PI*2); mm.fill();
    mm.strokeStyle = "#fff"; mm.lineWidth = 1.5; mm.stroke();
  }

  /* ======================= HUD ======================= */
  function updateHUD() {
    ticketsEl.textContent = got + "/" + tickets.length;
    var h = "";
    for (var i = 0; i < 3; i++) h += (i < hearts ? "❤️" : "🖤");
    heartsEl.textContent = h;
    stamFill.style.width = stamina + "%";
  }
  function fmtTime(s) { var m = Math.floor(s/60), ss = Math.floor(s%60); return m + ":" + (ss<10?"0":"") + ss; }

  /* ======================= ВВОД ======================= */
  window.addEventListener("keydown", function (e) {
    var k = e.key.toLowerCase();
    if (k === "w" || k === "arrowup" || k === "ц") keys.w = true;
    if (k === "s" || k === "arrowdown" || k === "ы") keys.s = true;
    if (k === "a" || k === "arrowleft" || k === "ф") keys.a = true;
    if (k === "d" || k === "arrowright" || k === "в") keys.d = true;
    if (k === "shift") keys.shift = true;
    if (k === " " && running) { e.preventDefault(); if (riding) endRide(); else tryStartRide(); }
    if (!running && (e.key === " " || e.key === "Enter")) { e.preventDefault(); startGame(); }
  });
  window.addEventListener("keyup", function (e) {
    var k = e.key.toLowerCase();
    if (k === "w" || k === "arrowup" || k === "ц") keys.w = false;
    if (k === "s" || k === "arrowdown" || k === "ы") keys.s = false;
    if (k === "a" || k === "arrowleft" || k === "ф") keys.a = false;
    if (k === "d" || k === "arrowright" || k === "в") keys.d = false;
    if (k === "shift") keys.shift = false;
  });

  var dragging = false, lastMX = 0, lastMY = 0;
  canvas.addEventListener("mousedown", function (e) { dragging = true; lastMX = e.clientX; lastMY = e.clientY; });
  window.addEventListener("mouseup", function () { dragging = false; });
  window.addEventListener("mousemove", function (e) {
    if (!dragging || !running) return;
    cam.yaw -= (e.clientX - lastMX) * 0.006;
    mousePitch = clamp(mousePitch + (e.clientY - lastMY) * 0.004, -0.5, 0.7);
    lastMX = e.clientX; lastMY = e.clientY;
  });
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  var joyEl = document.getElementById("joy");
  var joyKnob = document.getElementById("joyKnob");
  joyEl.addEventListener("touchstart", function (e) {
    e.preventDefault();
    var t = e.changedTouches[0];
    joyActive = true; joyId = t.identifier;
    var r = joyEl.getBoundingClientRect();
    joyCX = r.left + r.width/2; joyCY = r.top + r.height/2;
    updateJoy(t.clientX, t.clientY);
  }, { passive: false });
  function updateJoy(x, y) {
    var dx = x - joyCX, dy = y - joyCY, max = 54, l = Math.hypot(dx, dy);
    if (l > max) { dx = dx/l*max; dy = dy/l*max; }
    joyKnob.style.transform = "translate(" + dx + "px," + dy + "px)";
    joyDX = dx/max; joyDY = dy/max;
  }
  window.addEventListener("touchmove", function (e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier === joyId) { e.preventDefault(); updateJoy(t.clientX, t.clientY); return; }
    }
  }, { passive: false });
  window.addEventListener("touchend", function (e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joyId) {
        joyActive = false; joyId = null; joyDX = 0; joyDY = 0;
        joyKnob.style.transform = "translate(0,0)";
      }
    }
  });

  var lookZone = document.getElementById("lookZone");
  var lookId = null, lookLastX = 0;
  lookZone.addEventListener("touchstart", function (e) {
    e.preventDefault();
    var t = e.changedTouches[0]; lookId = t.identifier; lookLastX = t.clientX;
  }, { passive: false });
  lookZone.addEventListener("touchmove", function (e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier !== lookId) continue;
      e.preventDefault();
      cam.yaw -= (t.clientX - lookLastX) * 0.008; lookLastX = t.clientX;
    }
  }, { passive: false });

  function bindBtn(id, down, up) {
    var el = document.getElementById(id);
    el.addEventListener("touchstart", function (e) { e.preventDefault(); el.classList.add("press"); down(); }, { passive: false });
    el.addEventListener("touchend", function (e) { e.preventDefault(); el.classList.remove("press"); if (up) up(); }, { passive: false });
    el.addEventListener("mousedown", function (e) { if (isMobile) return; e.preventDefault(); down(); });
    el.addEventListener("mouseup", function (e) { if (isMobile) return; e.preventDefault(); if (up) up(); });
  }
  bindBtn("btnSprint", function () { runHold = true; }, function () { runHold = false; });
  bindBtn("btnRide", function () { if (riding) endRide(); else tryStartRide(); });

  /* ======================= ЭКРАНЫ ======================= */
  function showStart() {
    overlay.classList.remove("hidden");
    var keysHtml = isMobile
      ? '<div class="keys">' +
          '<div><span class="key">🕹️</span> джойстик — идти</div>' +
          '<div><span class="key">👆</span> свайп справа — смотреть вокруг</div>' +
          '<div><span class="key">🏃</span> кнопка — бежать</div>' +
          '<div><span class="key">🎢</span> кнопка — покататься на аттракционе</div>' +
        '</div>'
      : '<div class="keys">' +
          '<div><span class="key">W A S D</span> — идти (куда смотришь)</div>' +
          '<div><span class="key">Мышь</span> (зажать и вести) — смотреть вокруг</div>' +
          '<div><span class="key">Shift</span> — 🏃 бежать</div>' +
        '</div>';
    overlay.innerHTML =
      '<div class="card">' +
        '<h1>🏰 Остров Мечты</h1>' +
        '<p><b>Огромный крытый парк развлечений</b> — под гигантским куполом!<br>' +
        'Замок, колесо обозрения, горки, карусели… Но за тобой гонится <b>монстр</b>!</p>' +
        '<p>Собери <b>' + TICKETS_TOTAL + ' билетов</b> 🎫 — и ворота откроются. Всё <b>от первого лица</b>!</p>' +
        '<p style="color:#ffd76e">🎢 Подойди к аттракциону и нажми <b>ПРОБЕЛ</b> — покатаешься!</p>' +
        '<p style="font-size:13px;opacity:.85">❤️ 3 жизни · 🏃 бег тратит силы · 🗺️ мини-карта справа · 🔦 фонарик в руке</p>' +
        keysHtml +
        '<div class="legend">' +
          '<span>🏰 Замок Дракона</span>' +
          '<span>🎡 Колесо обозрения</span>' +
          '<span>🎢 Горки</span>' +
          '<span>🗼 Башня падения</span>' +
        '</div>' +
        '<button id="startBtn">В ОСТРОВ МЕЧТЫ! 🎡</button>' +
      '</div>';
  }

  function endGame(w) {
    running = false; won = w;
    if (w) sndWin(); else sndLose();
    var t = Math.floor(timeNow);
    var best = loadBest();
    if (w && (best === 0 || t < best)) { try { localStorage.setItem("dreamisland_best", String(t)); } catch (e) {} }
    setTimeout(function () {
      overlay.classList.remove("hidden");
      overlay.innerHTML =
        '<div class="card">' +
          '<h1>' + (w ? "🎉 Ты сбежал с Острова Мечты!" : "👹 Монстр тебя поймал…") + '</h1>' +
          '<p>' + (w ? "Все билеты собраны, ты выбрался через ворота!" : "Собери билеты быстрее в следующий раз!") + '</p>' +
          '<div class="big">' + fmtTime(timeNow) + '</div>' +
          '<div class="row">' +
            '<div class="col">Билеты<b>' + got + '/' + tickets.length + '</b></div>' +
            '<div class="col">Жизни<b>' + Math.max(0, hearts) + '</b></div>' +
            (best ? '<div class="col">Рекорд<b>' + fmtTime(best) + '</b></div>' : '') +
          '</div>' +
          '<button id="startBtn">' + (w ? "Ещё раз! 🎡" : "Попробовать снова 👹") + '</button>' +
        '</div>';
    }, 900);
  }

  function startGame() {
    getAudio();
    hearts = 3; got = 0; timeNow = 0; stamina = STAM_MAX;
    player = { x: 0, z: 180, y: 0, facing: 0, walk: 0 };
    monster = { x: 0, z: -180, anim: 0, lunge: 0 };
    cam.yaw = Math.PI; camYaw = cam.yaw;
    invuln = 0; catchT = 0; growlT = 1.5;
    buildPark();
    updateHUD();
    overlay.classList.add("hidden");
    running = true;
    lastTs = 0;
    if (!rafId) rafId = requestAnimationFrame(frame);
  }

  overlay.addEventListener("click", function (e) {
    var btn = e.target.closest && e.target.closest("button");
    if (btn) startGame();
  });
  overlay.addEventListener("touchend", function (e) {
    var btn = e.target.closest && e.target.closest("button");
    if (btn) { e.preventDefault(); startGame(); }
  });

  var frameErrShown = false;
  function frame(ts) {
    var dt = lastTs ? Math.min((ts - lastTs)/1000, 0.033) : 0.016;
    lastTs = ts;
    lastFrameDt = dt;

    // --- обновление (ошибка не должна убивать цикл) ---
    try {
      if (W < 10 || H < 10) resize();
      if (running) {
        var steps = 2, h = dt / steps;
        for (var i = 0; i < steps && running; i++) update(h);
        timeEl.textContent = fmtTime(timeNow);
        stamFill.style.width = stamina + "%";
      }
      if (rideMsgT > 0) {
        rideMsgT -= dt;
        rideMsgEl.textContent = rideMsgTxt;
        rideMsgEl.classList.add("on");
        if (rideMsgT <= 0) rideMsgEl.classList.remove("on");
      }
      if (running && !riding && nearRide) {
        ridePromptEl.innerHTML = "🎢 ПРОБЕЛ — покататься";
        ridePromptEl.classList.add("on");
      } else if (running && riding) {
        ridePromptEl.innerHTML = "⏹️ ПРОБЕЛ — слезть";
        ridePromptEl.classList.add("on");
      } else {
        ridePromptEl.classList.remove("on");
      }
    } catch (err) {
      showFrameError(err);
    }

    // --- отрисовка (тоже не должна убивать цикл) ---
    try {
      render();
    } catch (err) {
      showFrameError(err);
    }

    rafId = requestAnimationFrame(frame);
  }

  function showFrameError(err) {
    if (frameErrShown) return;
    frameErrShown = true;
    var msg = (err && err.message) ? err.message : String(err);
    overlay.classList.remove("hidden");
    overlay.innerHTML = '<div class="card"><h1>Ошибка 😔</h1>' +
      '<p style="font-size:13px;word-break:break-word">' + msg + '</p>' +
      '<p style="font-size:12px;opacity:.7">Сделай скриншот — я исправлю.</p></div>';
  }

  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 300); });

  resize();
  buildPark();
  updateHUD();
  showStart();
  setTimeout(resize, 50);
  setTimeout(resize, 400);
  if (!rafId) rafId = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
