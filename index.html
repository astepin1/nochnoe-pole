<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Моя игра 👹</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 0%, #2a1030, #14061a 55%, #0a0410 100%);
    color: #eef0ff; padding: 40px 18px 60px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  h1 {
    text-align: center; margin: 0 0 6px; font-size: 40px; letter-spacing: .02em;
    background: linear-gradient(90deg,#ff6b6b,#ffd76e,#8fe0ff);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .sub { text-align: center; opacity: .6; margin: 0 0 30px; font-size: 15px; }
  .card {
    display: block; text-decoration: none; color: inherit;
    width: min(100%, 520px);
    background: linear-gradient(160deg, rgba(255,255,255,.1), rgba(255,255,255,.03));
    border: 2px solid rgba(255,90,90,.4); border-radius: 24px;
    padding: 26px 26px 22px; transition: transform .14s, box-shadow .18s, border-color .18s;
    position: relative; overflow: hidden; text-align: center;
  }
  .card:hover {
    transform: translateY(-4px); border-color: rgba(255,150,120,.8);
    box-shadow: 0 20px 50px rgba(200,50,50,.4);
  }
  .emoji { font-size: 64px; line-height: 1; }
  .name { font-size: 26px; font-weight: 800; margin: 14px 0 6px; }
  .desc { font-size: 14px; opacity: .75; line-height: 1.5; }
  .play {
    display: inline-block; margin-top: 18px; padding: 14px 40px; font-size: 18px; font-weight: 800;
    color: #2a0808; background: linear-gradient(180deg,#ff9a8a,#ff5a4a);
    border-radius: 14px; box-shadow: 0 7px 0 #c23a2a, 0 12px 24px rgba(0,0,0,.25);
  }
  .tags { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  .tag {
    font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 999px;
    background: rgba(255,140,120,.18); border: 1px solid rgba(255,150,130,.35);
  }
  .url {
    display: block; margin-top: 14px; font-size: 11px; opacity: .4;
    font-family: ui-monospace, Menlo, monospace; word-break: break-all;
  }
</style>
</head>
<body>
  <h1>👹 Моя игра</h1>
  <p class="sub">Нажми, чтобы играть</p>

  <a class="card" href="parkur-3d.html">
    <div class="emoji">👹🌃</div>
    <div class="name">Паркур 3D: убеги от монстра</div>
    <div class="desc">
      3D-город в перспективе. Беги по крышам, прыгай через пропасти и барьеры —
      за тобой гонится монстр! Собирай кристаллы, открывай новые уровни.
    </div>
    <div class="tags">
      <span class="tag">🌃 3D</span>
      <span class="tag">👹 8 монстров + босс</span>
      <span class="tag">⬆️ уровни</span>
      <span class="tag">📱 телефон и ПК</span>
    </div>
    <div class="play">ИГРАТЬ ▶</div>
    <span class="url">parkur-3d.html</span>
  </a>
</body>
</html>
