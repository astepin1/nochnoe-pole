<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>НОЧНОЕ ПОЛЕ — не оглядывайся</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #e8ecf2; -webkit-user-select: none; user-select: none;
  }
  #game { display: flex; flex-direction: column; height: 100%; }

  /* ===== HUD ===== */
  #hud {
    display: flex; align-items: center; gap: 18px; padding: 8px 16px;
    font-size: 12px; z-index: 6; background: rgba(4,5,8,.94);
    border-bottom: 1px solid rgba(180,60,60,.18);
    text-transform: uppercase; letter-spacing: .08em; flex-wrap: wrap;
  }
  #hud .item { white-space: nowrap; }
  #hud .label { opacity: .4; margin-right: 5px; font-size: 10px; }
  #hud .val { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 14px; }
  #hud .spacer { flex: 1; }
  #wave { color: #ff8a6b; font-weight: 800; font-size: 14px; }
  #score { color: #ffd88a; }
  #timer { color: #cfe0ff; }

  /* Здоровье */
  #hpbar { position: relative; width: 140px; height: 12px; border-radius: 3px;
    background: rgba(255,255,255,.1); overflow: hidden; }
  #hpfill { height: 100%; width: 100%; border-radius: 3px;
    background: linear-gradient(90deg,#c22b2b,#ff5a5a); transition: width .25s; }
  #hpbar.low #hpfill { animation: hppulse .7s infinite alternate; }
  @keyframes hppulse { from { opacity: .55; } to { opacity: 1; } }

  /* Патроны */
  #ammo { font-weight: 800; font-size: 15px; color: #ffe9b0; letter-spacing: 1px; }
  #ammo.empty { color: #ff6a6a; animation: hppulse .5s infinite alternate; }

  /* Оружие внизу экрана */
  #wbar { position: absolute; right: 16px; bottom: 14px; z-index: 13;
    display: flex; flex-direction: column; gap: 5px; pointer-events: none; }
  #wbar .slot {
    display: flex; align-items: center; gap: 8px; padding: 5px 10px;
    border-radius: 7px; font-size: 12px; letter-spacing: .04em;
    background: rgba(8,10,14,.55); border: 1px solid rgba(255,255,255,.1);
    opacity: .5; transition: all .15s; min-width: 150px;
  }
  #wbar .slot .n { width: 14px; font-weight: 800; opacity: .8; }
  #wbar .slot .nm { flex: 1; text-transform: uppercase; }
  #wbar .slot .am { font-weight: 800; color: #ffe9b0; font-variant-numeric: tabular-nums; }
  #wbar .slot.active {
    opacity: 1; background: rgba(255,180,60,.16);
    border-color: rgba(255,200,90,.5); box-shadow: 0 0 16px rgba(255,170,50,.2);
  }
  #wbar .slot.active .nm { color: #ffd88a; font-weight: 800; }
  #wbar .slot.reloading .am { color: #ff6a6a; }

  /* ===== Мир ===== */
  #arena { position: relative; flex: 1; overflow: hidden; background: #000; touch-action: none; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* Виньетка страха */
  #fear { position: absolute; inset: 0; pointer-events: none; z-index: 3; opacity: 0;
    background: radial-gradient(circle, transparent 25%, rgba(20,0,0,.9));
    transition: opacity .3s; }
  #fear.on { opacity: 1; }
  #fear.panic { animation: fearpulse .9s infinite alternate; }
  @keyframes fearpulse { from { opacity: .45; } to { opacity: 1; } }

  /* Кровавый урон */
  #dmg { position: absolute; inset: 0; pointer-events: none; z-index: 4; opacity: 0;
    background: radial-gradient(circle, transparent 15%, rgba(170,0,0,.85)); }
  #dmg.on { animation: dmgFlash .7s; }
  @keyframes dmgFlash { 0% { opacity: 1; } 100% { opacity: 0; } }

  /* Jumpscare */
  #scare { position: absolute; inset: 0; pointer-events: none; z-index: 20; opacity: 0;
    background: #000; display: flex; align-items: center; justify-content: center; }
  #scare.on { animation: scareFlash .7s; }
  @keyframes scareFlash {
    0% { opacity: 0; }
    6% { opacity: 1; }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }
  #scare img, #scare svg { width: min(85vmin, 700px); height: min(85vmin, 700px);
    filter: contrast(1.3) brightness(1.05); animation: scareShake .06s infinite; }
  @keyframes scareShake {
    0% { transform: translate(0,0) scale(1.0); }
    50% { transform: translate(3px,-4px) scale(1.03); }
    100% { transform: translate(-3px,2px) scale(1.0); }
  }

  /* Прицел */
  #crosshair { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px;
    pointer-events: none; opacity: 0; z-index: 12; }
  #crosshair .h, #crosshair .v { position: absolute; background: rgba(235,240,250,.9);
    box-shadow: 0 0 5px rgba(0,0,0,1); }
  #crosshair .h { left: 0; top: 50%; width: 100%; height: 1.5px; margin-top: -.75px; }
  #crosshair .v { top: 0; left: 50%; height: 100%; width: 1.5px; margin-left: -.75px; }
  #crosshair .gap { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px;
    margin: -4px 0 0 -4px; border-radius: 50%; box-shadow: 0 0 0 1.5px rgba(235,240,250,.55) inset; }
  #crosshair.hot .h, #crosshair.hot .v { background: #ff3b3b; }

  /* Подсказка управления */
  #hint { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
    z-index: 13; font-size: 12px; opacity: .55; letter-spacing: .06em; text-transform: uppercase;
    pointer-events: none; text-align: center; text-shadow: 0 2px 8px #000; }

  /* ===== Оверлей ===== */
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.92); backdrop-filter: blur(4px); z-index: 30; text-align: center;
    padding: 20px; overflow: auto; }
  #overlay.hidden { display: none; }
  #overlay .card { max-width: 580px; width: 100%; padding: 32px 28px; border-radius: 14px;
    background: rgba(16,12,12,.75); border: 1px solid rgba(180,60,60,.25);
    box-shadow: 0 20px 80px rgba(0,0,0,.9), 0 0 90px rgba(160,20,20,.12) inset; }
  #overlay h1 { margin: 0 0 8px; font-size: 36px; letter-spacing: .12em;
    color: #ff6b5a; text-shadow: 0 0 24px rgba(255,60,40,.6); }
  #overlay h2 { margin: 20px 0 8px; font-size: 15px; opacity: .9;
    text-transform: uppercase; letter-spacing: .1em; color: #ffb08a; }
  #overlay p { margin: 8px 0; line-height: 1.65; opacity: .85; font-size: 14px; }
  #overlay .big { font-size: 46px; font-weight: 800; color: #ffd88a; margin: 4px 0; }
  #overlay button { margin: 6px; padding: 15px 36px; font-size: 16px; font-weight: 800;
    color: #180404; background: linear-gradient(180deg,#ff8a6b,#d13b2a); border: none;
    border-radius: 9px; cursor: pointer; letter-spacing: .1em;
    box-shadow: 0 8px 26px rgba(210,50,30,.4); transition: transform .1s, box-shadow .15s; }
  #overlay button:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(210,50,30,.55); }
  #overlay button:active { transform: translateY(1px) scale(.98); }
  #overlay button.ghost { background: rgba(255,255,255,.07); color: #e8ecf2; box-shadow: none;
    border: 1px solid rgba(255,255,255,.16); }
  #overlay .keys { display: inline-flex; flex-direction: column; gap: 7px; margin: 14px 0; font-size: 13px; }
  #overlay .keys div { display: flex; align-items: center; gap: 10px; justify-content: center; }
  #overlay .key { display: inline-block; min-width: 30px; padding: 4px 9px; border-radius: 6px;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2);
    font-weight: 800; font-size: 12px; }
  #overlay .row { display: flex; justify-content: center; gap: 24px; margin-top: 14px; flex-wrap: wrap; }
  #overlay .row .col { opacity: .9; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; }
  #overlay .row .col b { display: block; font-size: 23px; margin-top: 4px; color: #fff; letter-spacing: 0; }

  /* ===== Мобильное управление ===== */
  #mobile { position: absolute; inset: 0; z-index: 16; pointer-events: none; display: none; }
  #mobile.on { display: block; }
  #joy { position: absolute; left: 20px; bottom: 24px; width: 140px; height: 140px;
    border-radius: 50%; pointer-events: auto;
    background: radial-gradient(circle, rgba(255,255,255,.12), rgba(255,255,255,.04));
    border: 2px solid rgba(255,255,255,.28); touch-action: none; }
  #joyKnob { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px;
    margin: -30px 0 0 -30px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #ffd0b0, #c86a4a);
    box-shadow: 0 4px 12px rgba(0,0,0,.5); }
  .mbtn { position: absolute; pointer-events: auto; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.32);
    color: #fff; backdrop-filter: blur(3px); touch-action: none;
    box-shadow: 0 4px 12px rgba(0,0,0,.4); user-select: none; }
  .mbtn.press { background: rgba(255,90,60,.55); transform: scale(.94); }
  #btnFire { right: 22px; bottom: 34px; width: 96px; height: 96px; font-size: 40px; }
  #btnRun  { right: 128px; bottom: 40px; width: 66px; height: 66px; font-size: 26px; }
  #btnReload { right: 30px; bottom: 142px; width: 60px; height: 60px; font-size: 24px; }
  #btnSwap { right: 128px; bottom: 120px; width: 56px; height: 56px; font-size: 20px; }
  #lookHint { position: absolute; left: 50%; top: 42%; transform: translateX(-50%);
    font-size: 12px; opacity: .45; color: #fff; text-align: center; pointer-events: none; }
</style>
</head>
<body>
  <div id="game">
    <div id="hud">
      <div class="item"><span class="label">Выжил</span><span class="val" id="timer">00:00</span></div>
      <div class="item"><span class="label">Волна</span><span id="wave">1</span></div>
      <div class="item"><span class="label">Жизнь</span><span id="hpbar"><span id="hpfill"></span></span></div>
      <div class="item"><span class="label">Патроны</span><span id="ammo">15/15</span></div>
      <div class="item"><span class="label">Оружие</span><span id="weapon">ПИСТОЛЕТ</span><span id="wslot"></span></div>
      <div class="item" id="killedItem"><span class="label">Убито</span><span class="val" id="killed">0</span></div>
      <div class="spacer"></div>
      <div class="item"><span class="label">Очки</span><span id="score">0</span></div>
    </div>

    <div id="arena">
      <canvas id="view"></canvas>
      <div id="fear"></div>
      <div id="dmg"></div>
      <div id="crosshair"><span class="h"></span><span class="v"></span><span class="gap"></span></div>
      <div id="scare"></div>
      <div id="wbar"></div>
      <div id="hint">W A S D — бежать &nbsp;•&nbsp; Мышь — осмотреться &nbsp;•&nbsp; ЛКМ — выстрел &nbsp;•&nbsp; 1-5 / колесо — оружие</div>
      <div id="mobile">
        <div id="joy"><div id="joyKnob"></div></div>
        <div class="mbtn" id="btnFire">🔥</div>
        <div class="mbtn" id="btnRun">🏃</div>
        <div class="mbtn" id="btnReload">↻</div>
        <div class="mbtn" id="btnSwap">🔫</div>
        <div id="lookHint">проведи пальцем, чтобы осмотреться</div>
      </div>
      <div id="overlay"></div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  /* ======================= НАСТРОЙКИ ======================= */
  var MAX_HP       = 100;
  var WALK_SPEED   = 300;    // скорость шага
  var RUN_SPEED    = 620;    // скорость бега (Shift)
  var EYE          = 95;     // высота глаз
  var FIELD        = 3600;   // половина размера поля
  var VIEW_DIST    = 2200;   // дальность прорисовки
  var ALIEN_HIT    = 22;     // урон пришельца
  var FEAR_DIST    = 420;    // с какого расстояния начинается страх
  var SCARE_DIST   = 78;     // расстояние для удара вблизи
  /* ========================================================= */

  /* Уровень страха: true — жутко, false — спокойно.
     Переключается на экране старта, сохраняется в браузере. */
  var SCARY = false;
  try { SCARY = localStorage.getItem("nightfield_scary") === "1"; } catch (e) {}

  /* ======================= ОРУЖИЕ ===========================
     Меняйте характеристики прямо здесь.                        */
  var WEAPONS = [
    { id: "pistol", name: "ПИСТОЛЕТ",
      mag: 12, reload: 1000, dmg: 45,  rpm: 280, auto: false,
      pellets: 1, spread: 0.007, recoil: 0.7, muzzle: 0.40, shake: 3.0,
      range: 0.9, tracer: 1, muzzleOff: { x: 4, y: -118 },
      desc: "Надёжный, точный" },
    { id: "smg", name: "ПП «ОСА»",
      mag: 30, reload: 1400, dmg: 26,  rpm: 720, auto: true,
      pellets: 1, spread: 0.021, recoil: 0.45, muzzle: 0.30, shake: 2.2,
      range: 0.82, tracer: 1, muzzleOff: { x: 5, y: -128 },
      desc: "Автоматический, быстрый" },
    { id: "shotgun", name: "ДРОБОВИК",
      mag: 6,  reload: 2000, dmg: 24,  rpm: 85, auto: false,
      pellets: 8, spread: 0.060, recoil: 1.4, muzzle: 0.95, shake: 8.5,
      range: 0.5, tracer: 3, muzzleOff: { x: -3, y: -190 },
      desc: "Разносит вблизи" },
    { id: "rifle", name: "ВИНТОВКА",
      mag: 5,  reload: 2300, dmg: 165, rpm: 52, auto: false,
      pellets: 1, spread: 0.0015, recoil: 1.6, muzzle: 1.05, shake: 9.0,
      range: 1.0, tracer: 1, muzzleOff: { x: 0, y: -250 },
      desc: "Один выстрел — один труп" },
    { id: "flame", name: "ОГНЕМЁТ",
      mag: 90, reload: 2600, dmg: 15,  rpm: 900, auto: true,
      pellets: 1, spread: 0.05, recoil: 0.3, muzzle: 0.5, shake: 1.6,
      range: 0.4, tracer: 0, flame: true, muzzleOff: { x: 9, y: -110 },
      desc: "Жжёт издалека" }
  ];
  /* ========================================================= */

  var arena     = document.getElementById("arena");
  var canvas    = document.getElementById("view");
  var ctx       = canvas.getContext("2d");
  var overlay   = document.getElementById("overlay");
  var fearEl    = document.getElementById("fear");
  var dmgEl     = document.getElementById("dmg");
  var scareEl   = document.getElementById("scare");
  var crosshair = document.getElementById("crosshair");
  var hintEl    = document.getElementById("hint");
  var timerEl   = document.getElementById("timer");
  var waveEl    = document.getElementById("wave");
  var hpFill    = document.getElementById("hpfill");
  var hpBar     = document.getElementById("hpbar");
  var ammoEl    = document.getElementById("ammo");
  var weaponEl  = document.getElementById("weapon");
  var wslotEl   = document.getElementById("wslot");
  var wbarEl    = document.getElementById("wbar");
  var killedEl  = document.getElementById("killed");
  var scoreEl   = document.getElementById("score");

  var W = 1, H = 1, DPR = 1, FOCAL = 800;

  function resize() {
    var r = arena.getBoundingClientRect();
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    FOCAL = Math.max(520, W * 1.05);
  }

  /* ---------------------- Состояние ---------------------- */
  var running = false, paused = false;
  var weaponIdx = 0;                 // текущее оружие
  var mags = [];                     // патроны в магазине каждого оружия
  function initMags() { mags = WEAPONS.map(function (w) { return w.mag; }); }
  initMags();
  var reloading = false, reloadT = 0, reloadEnd = 0;
  var nextShotAt = 0;                // темп стрельбы
  var switchT = 0;                   // анимация смены оружия
  var firing = false, lastFire = 0;  // стрельба (в т.ч. авто)
  var hp = MAX_HP;
  var score = 0, killed = 0, wave = 1;
  var survived = 0;             // секунд выживания
  var camX = 0, camZ = 0, camY = EYE;
  var yaw = 0, pitch = 0;
  var bobT = 0, bobAmp = 0, walkPhase = 0;
  var recoil = 0, muzzleT = 0, shakeUntil = 0, shakeMag = 0;
  var timeNow = 0;
  var aliens = [], field = [], fx = [], floats = [], stars = [];
  var spawnTimer = null, rafId = null, lastTs = 0;
  var pointerLocked = false;
  var flashAngle = 0;           // мерцание фонаря
  var lastFootstep = 0;

  function loadBoard() {
    try { return JSON.parse(localStorage.getItem("nightfield_board") || "[]"); }
    catch (e) { return []; }
  }
  function saveBoard(b) { try { localStorage.setItem("nightfield_board", JSON.stringify(b)); } catch (e) {} }
  var best = loadBoard().length ? loadBoard()[0].score : 0;

  /* ---------------------- Звук ---------------------- */
  var audioCtx = null, ambient = null, heart = null;
  function getAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, to, dur, type, vol, delay) {
    var ac = getAudio(); if (!ac) return;
    var t = ac.currentTime + (delay || 0);
    var o = ac.createOscillator(); o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(Math.max(1, to), t + dur);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.06);
  }
  function noise(dur, cutoff, vol, delay, q) {
    var ac = getAudio(); if (!ac) return;
    var t = ac.currentTime + (delay || 0);
    var buf = ac.createBuffer(1, Math.max(1, Math.floor(ac.sampleRate * dur)), ac.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 1.8);
    var src = ac.createBufferSource(); src.buffer = buf;
    var flt = ac.createBiquadFilter(); flt.type = "lowpass"; flt.frequency.value = cutoff || 1000;
    if (q) flt.Q.value = q;
    var g = ac.createGain(); g.gain.value = vol || 0.2;
    src.connect(flt); flt.connect(g); g.connect(ac.destination); src.start(t);
  }
  function sndShot(wi) {
    wi = wi || 0;
    if (wi === 0) { noise(0.08, 3400, 0.24); tone(220, 80, 0.09, "square", 0.12); }        // пистолет
    else if (wi === 1) { noise(0.06, 3800, 0.2); tone(240, 110, 0.06, "square", 0.1); }     // ПП
    else if (wi === 2) { noise(0.2, 2200, 0.42); tone(110, 45, 0.22, "square", 0.2); }      // дробовик
    else if (wi === 3) { noise(0.26, 1800, 0.46); tone(90, 35, 0.3, "sawtooth", 0.24); }    // винтовка
    else { noise(0.12, 900, 0.22); tone(150, 90, 0.16, "sawtooth", 0.1); }                  // огнемёт
  }
  function sndEmpty()  { tone(150, 110, 0.06, "square", 0.14); }
  function sndReload(){ noise(0.06, 2000, 0.14); tone(320, 500, 0.05, "square", 0.08, 0.0); tone(260, 400, 0.06, "square", 0.08, 0.75); }
  function sndSwitch(){ noise(0.05, 2400, 0.1); tone(420, 300, 0.07, "square", 0.08); }
  function sndAlienHit(){ noise(0.14, 700, 0.2); tone(200, 90, 0.18, "sawtooth", 0.16); }
  function sndAlienDie(){ tone(300, 60, 0.5, "sawtooth", 0.22); noise(0.4, 500, 0.2); }
  function sndGrowl(vol) {
    var ac = getAudio(); if (!ac) return;
    var t = ac.currentTime;
    var o = ac.createOscillator(); o.type = "sawtooth";
    o.frequency.setValueAtTime(rand(70, 110), t);
    o.frequency.exponentialRampToValueAtTime(rand(45, 70), t + 0.6);
    var f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 500;
    var g = ac.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.08);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
    o.connect(f); f.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + 0.75);
  }
  function sndScream() {
    var ac = getAudio(); if (!ac) return;
    var t = ac.currentTime;
    var o = ac.createOscillator(); o.type = "sawtooth";
    o.frequency.setValueAtTime(900, t);
    o.frequency.exponentialRampToValueAtTime(180, t + 0.6);
    var o2 = ac.createOscillator(); o2.type = "square";
    o2.frequency.setValueAtTime(1400, t);
    o2.frequency.exponentialRampToValueAtTime(300, t + 0.5);
    var g = ac.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
    var g2 = ac.createGain(); g2.gain.value = 0.15;
    o.connect(g); o2.connect(g2); g2.connect(g);
    g.connect(ac.destination);
    o.start(t); o.stop(t + 0.75); o2.start(t); o2.stop(t + 0.75);
    noise(0.5, 3000, 0.3);
  }
  function sndFoot(vol) { noise(0.07, 400, vol || 0.09); }
  function sndWave() { tone(300, 90, 0.9, "sawtooth", 0.18); tone(180, 70, 1.1, "sawtooth", 0.14, 0.2); }

  function startAmbient() {
    var ac = getAudio(); if (!ac || ambient) return;
    // ветер
    var buf = ac.createBuffer(1, ac.sampleRate * 3, ac.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * 0.4;
    var wind = ac.createBufferSource(); wind.buffer = buf; wind.loop = true;
    var wf = ac.createBiquadFilter(); wf.type = "lowpass"; wf.frequency.value = 420;
    var wg = ac.createGain(); wg.gain.value = 0.05;
    // пульсация ветра
    var lfo = ac.createOscillator(); lfo.frequency.value = 0.07;
    var lg = ac.createGain(); lg.gain.value = 0.035;
    lfo.connect(lg); lg.connect(wg.gain);
    // низкий гул тревоги (в спокойном режиме — тише)
    var o1 = ac.createOscillator(); o1.type = "sine"; o1.frequency.value = 48;
    var o2 = ac.createOscillator(); o2.type = "sine"; o2.frequency.value = 72.5; o2.detune.value = 8;
    var og = ac.createGain(); og.gain.value = SCARY ? 0.03 : 0.012;
    wind.connect(wf); wf.connect(wg); wg.connect(ac.destination);
    o1.connect(og); o2.connect(og); og.connect(ac.destination);
    wind.start(); lfo.start(); o1.start(); o2.start();
    ambient = { wind: wind, lfo: lfo, o1: o1, o2: o2, wg: wg, og: og };
  }
  function stopAmbient() {
    if (!ambient) return;
    try {
      var ac = getAudio();
      ambient.wg.gain.cancelScheduledValues(ac.currentTime);
      ambient.og.gain.cancelScheduledValues(ac.currentTime);
      ambient.wg.gain.linearRampToValueAtTime(0, ac.currentTime + 0.5);
      ambient.og.gain.linearRampToValueAtTime(0, ac.currentTime + 0.5);
      ambient.wind.stop(ac.currentTime + 0.6);
      ambient.lfo.stop(ac.currentTime + 0.6);
      ambient.o1.stop(ac.currentTime + 0.6);
      ambient.o2.stop(ac.currentTime + 0.6);
    } catch (e) {}
    ambient = null;
  }
  function startHeart() {
    var ac = getAudio(); if (!ac || heart) return;
    var o = ac.createOscillator(); o.type = "sine"; o.frequency.value = 58;
    var g = ac.createGain(); g.gain.value = 0;
    o.connect(g); g.connect(ac.destination); o.start();
    heart = { o: o, g: g };
  }
  function setHeartbeat(intensity) {
    if (!heart) return;
    var ac = getAudio();
    var beat = 0.02 + intensity * 0.16;
    var now = ac.currentTime;
    heart.g.gain.cancelScheduledValues(now);
    heart.g.gain.setValueAtTime(beat, now);
    heart.g.gain.exponentialRampToValueAtTime(0.001, now + Math.max(0.12, 0.5 - intensity * 0.35));
    tone(50 + intensity * 20, 30, Math.max(0.12, 0.4 - intensity * 0.28), "sine", 0.04 + intensity * 0.12, 0.18);
  }

  /* ---------------------- Утилиты ---------------------- */
  function rand(a, b) { return Math.random() * (b - a) + a; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function dist2d(ax, az, bx, bz) { var dx = ax - bx, dz = az - bz; return Math.sqrt(dx * dx + dz * dz); }

  /* ---------- 3D-проекция относительно камеры ---------- */
  function project(x, y, z) {
    var dx = x - camX, dy = y - camY, dz = z - camZ;
    var cy = Math.cos(yaw), sy = Math.sin(yaw);
    var x1 = dx * cy - dz * sy;
    var z1 = dx * sy + dz * cy;
    var cp = Math.cos(pitch), sp = Math.sin(pitch);
    var y2 = dy * cp - z1 * sp;
    var z2 = dy * sp + z1 * cp;
    if (z2 < 2) z2 = 2;
    var s = FOCAL / z2;
    return { sx: W / 2 + x1 * s, sy: H / 2 - y2 * s, s: s, z: z2, x1: x1 };
  }
  function horizonY() { return H / 2 + FOCAL * Math.tan(pitch); }

  /* ---------------------- Поле: трава, камни, деревья ---------------------- */
  function buildField() {
    field = [];
    var i;
    // трава
    for (i = 0; i < 1500; i++) {
      field.push({ t: "grass", x: rand(-FIELD, FIELD), z: rand(-FIELD, FIELD), h: rand(28, 70), s: rand(0, 6.28) });
    }
    // сорняки/кусты
    for (i = 0; i < 160; i++) {
      field.push({ t: "bush", x: rand(-FIELD, FIELD), z: rand(-FIELD, FIELD), h: rand(70, 130) });
    }
    // камни
    for (i = 0; i < 130; i++) {
      field.push({ t: "rock", x: rand(-FIELD, FIELD), z: rand(-FIELD, FIELD), s: rand(20, 70) });
    }
    // сухие деревья
    for (i = 0; i < 46; i++) {
      field.push({ t: "tree", x: rand(-FIELD, FIELD), z: rand(-FIELD, FIELD), h: rand(320, 520), seed: rand(0, 1) });
    }
    // стога/пугала
    for (i = 0; i < 14; i++) {
      field.push({ t: "scare", x: rand(-FIELD, FIELD), z: rand(-FIELD, FIELD), h: rand(180, 230) });
    }
  }
  function buildStars() {
    stars = [];
    for (var i = 0; i < 260; i++) {
      stars.push({ ax: rand(0, 6.283), ay: rand(-0.15, 1.2), b: rand(0.2, 1), tw: rand(0, 6.28) });
    }
  }

  /* ---------------------- Пришельцы ---------------------- */
  function spawnAlien() {
    if (!running) return;
    var ang = rand(0, Math.PI * 2);
    var d = rand(1300, 1900);
    var x = camX + Math.cos(ang) * d;
    var z = camZ + Math.sin(ang) * d;
    x = clamp(x, -FIELD, FIELD); z = clamp(z, -FIELD, FIELD);

    var kind = "stalker";
    var r = Math.random();
    if (wave >= 2 && r < 0.28) kind = "runner";
    if (wave >= 3 && r > 0.82) kind = "giant";

    var a = {
      x: x, z: z, kind: kind,
      hp: kind === "giant" ? 120 : (kind === "runner" ? 45 : 70),
      maxHp: kind === "giant" ? 120 : (kind === "runner" ? 45 : 70),
      speed: ((kind === "runner" ? rand(150, 200) : kind === "giant" ? rand(70, 95) : rand(95, 135)) + wave * 6) * (SCARY ? 1 : 0.72),
      height: kind === "giant" ? rand(250, 300) : (kind === "runner" ? rand(150, 180) : rand(190, 230)),
      phase: rand(0, 6.28), phaseSpeed: rand(4, 9),
      sway: rand(0, 6.28), dead: false, dying: 0, hitFlash: 0,
      growlAt: 0, lunge: 0
    };
    aliens.push(a);

    var delay = Math.max(700, 2600 - wave * 180) * rand(0.7, 1.4) * (SCARY ? 1 : 1.5);
    spawnTimer = setTimeout(spawnAlien, delay);
  }

  /* ---------------------- Рисование неба ---------------------- */
  function drawSky() {
    var hy = horizonY();
    var g = ctx.createLinearGradient(0, 0, 0, Math.max(hy, H * 0.6));
    if (SCARY) {
      g.addColorStop(0, "#01020a");
      g.addColorStop(0.5, "#050a1c");
      g.addColorStop(1, "#101a34");
    } else {
      g.addColorStop(0, "#0a1230");
      g.addColorStop(0.5, "#16244a");
      g.addColorStop(1, "#2a3a64");
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Луна
    var moonAng = yaw + 0.9;
    var mx = W / 2 - Math.sin(moonAng) * W * 0.9;
    var my = H * 0.16 + pitch * 120;
    if (mx > -200 && mx < W + 200) {
      var mg = ctx.createRadialGradient(mx, my, 6, mx, my, 92);
      mg.addColorStop(0, "rgba(230,235,255,.55)");
      mg.addColorStop(0.25, "rgba(180,200,255,.18)");
      mg.addColorStop(1, "rgba(120,150,255,0)");
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.arc(mx, my, 92, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#e8ecf8";
      ctx.beginPath(); ctx.arc(mx, my, 30, 0, Math.PI * 2); ctx.fill();
      // кратеры
      ctx.fillStyle = "rgba(180,190,215,.55)";
      ctx.beginPath(); ctx.arc(mx - 9, my - 6, 6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(mx + 8, my + 7, 4.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(mx + 2, my - 13, 3.2, 0, Math.PI * 2); ctx.fill();
    }

    // Звёзды
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      var sx = W / 2 + Math.sin(st.ax - yaw) * W * 1.1;
      var sy = (H * 0.5) - st.ay * H * 0.85 + pitch * 200;
      if (sx < -10 || sx > W + 10 || sy < -10 || sy > hy) continue;
      var tw = 0.6 + 0.4 * Math.sin(timeNow * 1.8 + st.tw);
      ctx.globalAlpha = st.b * tw * 0.85;
      ctx.fillStyle = "#cfe0ff";
      var sz = 0.8 + st.b * 1.6;
      ctx.fillRect(sx, sy, sz, sz);
    }
    ctx.globalAlpha = 1;
  }

  /* ---------------------- Рисование земли ---------------------- */
  function drawGround() {
    var hy = horizonY();
    var top = Math.max(0, hy);
    var g = ctx.createLinearGradient(0, top, 0, H);
    g.addColorStop(0, "#1a2416");
    g.addColorStop(0.18, "#141c12");
    g.addColorStop(0.6, "#0c120b");
    g.addColorStop(1, "#050805");
    ctx.fillStyle = g;
    ctx.fillRect(0, top, W, H - top);

    // Тёмная полоса у горизонта (лес/туман)
    var hz = ctx.createLinearGradient(0, top - 4, 0, top + 90);
    hz.addColorStop(0, "rgba(30,45,60,.85)");
    hz.addColorStop(1, "rgba(30,45,60,0)");
    ctx.fillStyle = hz;
    ctx.fillRect(0, top - 4, W, 96);

    // Силуэты дальнего леса
    ctx.save();
    ctx.beginPath(); ctx.rect(0, Math.max(0, top - 170), W, 200); ctx.clip();
    for (var m = 0; m < 22; m++) {
      var treeX = ((m * 260 + 120) - yaw * 1100) % (W + 520);
      if (treeX < -260) treeX += W + 520;
      var th = 50 + ((m * 37) % 70);
      ctx.fillStyle = "rgba(8,14,12,.9)";
      ctx.beginPath();
      ctx.moveTo(treeX - 30, top + 4);
      ctx.lineTo(treeX, top - th);
      ctx.lineTo(treeX + 30, top + 4);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();

    ctx.globalAlpha = 1;
  }

  /* ---------------------- Объекты поля ---------------------- */
  function drawFieldObject(o) {
    var d = dist2d(o.x, o.z, camX, camZ);
    if (d > VIEW_DIST) return;
    var p = project(o.x, 0, o.z);
    if (p.z < 30 || p.sx < -80 || p.sx > W + 80) return;
    var fog = clamp(1 - d / VIEW_DIST, 0.06, 1);

    if (o.t === "grass") {
      var h = o.h * p.s;
      if (h < 0.8) return;
      var base = project(o.x, 0, o.z);
      var topP = project(o.x, o.h, o.z);
      ctx.globalAlpha = fog * 0.85;
      ctx.strokeStyle = "rgba(48,72,40,.95)";
      ctx.lineWidth = Math.max(0.7, p.s * 3);
      for (var b = -1; b <= 1; b++) {
        var swing = Math.sin(timeNow * 1.6 + o.s) * o.h * 0.12;
        ctx.beginPath();
        ctx.moveTo(base.sx + b * p.s * 3, base.sy);
        ctx.quadraticCurveTo(base.sx + b * p.s * 5, topP.sy + h * 0.3,
                             topP.sx + b * p.s * 4 + swing * p.s, topP.sy + swing * p.s);
        ctx.stroke();
      }
    } else if (o.t === "bush") {
      var r = o.h * p.s * 0.55;
      if (r < 1) return;
      ctx.globalAlpha = fog * 0.9;
      var bg = ctx.createRadialGradient(p.sx - r * 0.3, p.sy - r * 0.8, r * 0.1, p.sx, p.sy - r * 0.5, r * 1.3);
      bg.addColorStop(0, "rgba(38,60,36,.95)");
      bg.addColorStop(1, "rgba(10,18,10,.95)");
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.ellipse(p.sx, p.sy - r * 0.5, r, r * 0.8, 0, 0, Math.PI * 2); ctx.fill();
    } else if (o.t === "rock") {
      var rr = o.s * p.s;
      if (rr < 1) return;
      ctx.globalAlpha = fog;
      var rg = ctx.createLinearGradient(p.sx, p.sy - rr, p.sx, p.sy + rr * 0.3);
      rg.addColorStop(0, "#4a4a52");
      rg.addColorStop(1, "#141418");
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.ellipse(p.sx, p.sy - rr * 0.35, rr, rr * 0.65, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (o.t === "tree") {
      var hp2 = o.h * p.s;
      if (hp2 < 2) return;
      ctx.globalAlpha = fog;
      var wTrunk = Math.max(1, p.s * 14);
      ctx.strokeStyle = "#171310";
      ctx.lineWidth = wTrunk;
      ctx.beginPath();
      ctx.moveTo(p.sx, p.sy);
      ctx.lineTo(p.sx + Math.sin(o.seed * 10) * wTrunk * 1.4, p.sy - hp2);
      ctx.stroke();
      // ветки
      ctx.lineWidth = Math.max(0.8, wTrunk * 0.5);
      for (var br = 0; br < 4; br++) {
        var by = p.sy - hp2 * (0.45 + br * 0.14);
        var dir = br % 2 === 0 ? 1 : -1;
        ctx.beginPath();
        ctx.moveTo(p.sx, by);
        ctx.lineTo(p.sx + dir * hp2 * 0.16, by - hp2 * 0.13);
        ctx.stroke();
      }
    } else if (o.t === "scare") {
      var hs = o.h * p.s;
      if (hs < 2) return;
      ctx.globalAlpha = fog;
      // столб
      ctx.fillStyle = "#151210";
      ctx.fillRect(p.sx - p.s * 5, p.sy - hs, p.s * 10, hs);
      // перекладина
      ctx.fillRect(p.sx - hs * 0.28, p.sy - hs * 0.78, hs * 0.56, p.s * 7);
      // голова
      ctx.fillStyle = "#2a2418";
      ctx.beginPath(); ctx.arc(p.sx, p.sy - hs * 0.92, p.s * 20, 0, Math.PI * 2); ctx.fill();
      // глаза-точки
      ctx.fillStyle = "rgba(255,120,60,.8)";
      ctx.beginPath(); ctx.arc(p.sx - p.s * 6, p.sy - hs * 0.94, p.s * 2.6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(p.sx + p.s * 6, p.sy - hs * 0.94, p.s * 2.6, 0, Math.PI * 2); ctx.fill();
      // ткань
      ctx.fillStyle = "rgba(60,55,45,.75)";
      ctx.beginPath();
      ctx.moveTo(p.sx - hs * 0.24, p.sy - hs * 0.76);
      ctx.lineTo(p.sx + hs * 0.24, p.sy - hs * 0.76);
      ctx.lineTo(p.sx + hs * 0.16, p.sy - hs * 0.3);
      ctx.lineTo(p.sx - hs * 0.16, p.sy - hs * 0.3);
      ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---------------------- Страшный пришелец ---------------------- */
  function drawAlien(a) {
    var p = project(a.x, 0, a.z);
    var d = dist2d(a.x, a.z, camX, camZ);
    if (p.z < 20) return;

    var hpx = a.height * p.s;          // рост в пикселях
    if (hpx < 3) return;
    if (p.sx < -hpx || p.sx > W + hpx) return;

    var closeFactor = clamp(1 - d / VIEW_DIST, 0, 1);
    var fog = clamp(1 - d / VIEW_DIST, 0.12, 1);
    var fearFactor = clamp(1 - d / FEAR_DIST, 0, 1);   // 0 далеко → 1 вплотную

    // ---- тень ----
    var shR = hpx * 0.42;
    if (shR > 1 && a.dying <= 0) {
      var sg = ctx.createRadialGradient(p.sx, p.sy, 0, p.sx, p.sy, shR);
      sg.addColorStop(0, "rgba(0,0,0,.75)");
      sg.addColorStop(1, "rgba(0,0,0,0)");
      ctx.globalAlpha = fog * 0.85;
      ctx.fillStyle = sg;
      ctx.beginPath(); ctx.ellipse(p.sx, p.sy, shR, shR * 0.28, 0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    var alpha = fog;
    var scale = 1;
    if (a.dying > 0) { alpha *= clamp(a.dying / 0.4, 0, 1); scale = 1 + (0.4 - a.dying) * 1.2; }

    // ---- тело через billboard ----
    ctx.save();
    ctx.translate(p.sx, p.sy);
    ctx.scale(p.s, p.s);       // теперь рисуем в «мировых единицах»
    ctx.scale(scale, scale);
    ctx.globalAlpha = alpha;

    var Hgt = a.height;
    var step = Math.sin(a.phase) * Hgt * 0.05;

    // цвет тела: жуткий серый или дружелюбный зелёный
    var hue;
    if (SCARY) {
      hue = a.kind === "giant" ? ["#5a5f66", "#2b2f34", "#12141a"] :
            a.kind === "runner" ? ["#4a4a52", "#25262c", "#0e0f13"] :
                                  ["#54585e", "#282b30", "#101216"];
    } else {
      hue = a.kind === "giant" ? ["#7fae6a", "#4e7d3f", "#294a20"] :
            a.kind === "runner" ? ["#6fc0d8", "#3f8fb0", "#1e5470"] :
                                  ["#72c47a", "#3f9448", "#1e5c26"];
    }

    // ноги (длинные, тонкие)
    ctx.strokeStyle = hue[2];
    ctx.lineCap = "round";
    ctx.lineWidth = Hgt * 0.055;
    ctx.beginPath();
    ctx.moveTo(0, -Hgt * 0.5);
    ctx.lineTo(-Hgt * 0.13 + step, 0);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, -Hgt * 0.5);
    ctx.lineTo(Hgt * 0.13 - step, 0);
    ctx.stroke();

    // корпус
    var bodyGrad = ctx.createLinearGradient(-Hgt * 0.2, -Hgt * 0.85, Hgt * 0.2, -Hgt * 0.3);
    bodyGrad.addColorStop(0, hue[0]);
    bodyGrad.addColorStop(0.55, hue[1]);
    bodyGrad.addColorStop(1, hue[2]);
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.moveTo(-Hgt * 0.15, -Hgt * 0.5);
    ctx.quadraticCurveTo(-Hgt * 0.24, -Hgt * 0.7, -Hgt * 0.2, -Hgt * 0.86);
    ctx.quadraticCurveTo(0, -Hgt * 0.94, Hgt * 0.2, -Hgt * 0.86);
    ctx.quadraticCurveTo(Hgt * 0.24, -Hgt * 0.7, Hgt * 0.15, -Hgt * 0.5);
    ctx.closePath();
    ctx.fill();

    // рёбра (выступающие, жутко)
    ctx.strokeStyle = "rgba(0,0,0,.5)";
    ctx.lineWidth = Hgt * 0.012;
    for (var rb = 0; rb < 4; rb++) {
      var ry = -Hgt * (0.62 + rb * 0.06);
      ctx.beginPath();
      ctx.moveTo(-Hgt * 0.15, ry);
      ctx.quadraticCurveTo(0, ry + Hgt * 0.03, Hgt * 0.15, ry);
      ctx.stroke();
    }

    // длинные руки (до колен)
    ctx.strokeStyle = hue[1];
    ctx.lineWidth = Hgt * 0.045;
    var armSwing = Math.sin(a.phase + 1.2) * Hgt * 0.06;
    ctx.beginPath();
    ctx.moveTo(-Hgt * 0.19, -Hgt * 0.82);
    ctx.quadraticCurveTo(-Hgt * 0.42, -Hgt * 0.6, -Hgt * 0.3 + armSwing, -Hgt * 0.18);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(Hgt * 0.19, -Hgt * 0.82);
    ctx.quadraticCurveTo(Hgt * 0.42, -Hgt * 0.6, Hgt * 0.3 - armSwing, -Hgt * 0.18);
    ctx.stroke();
    // когти
    ctx.fillStyle = "#0a0b0d";
    ctx.beginPath(); ctx.arc(-Hgt * 0.3 + armSwing, -Hgt * 0.18, Hgt * 0.03, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(Hgt * 0.3 - armSwing, -Hgt * 0.18, Hgt * 0.03, 0, Math.PI * 2); ctx.fill();

    // шея
    ctx.strokeStyle = hue[1];
    ctx.lineWidth = Hgt * 0.05;
    ctx.beginPath();
    ctx.moveTo(0, -Hgt * 0.86);
    ctx.lineTo(0, -Hgt * 0.94);
    ctx.stroke();

    // --- ГОЛОВА (вытянутая, жуткая) ---
    var hw = Hgt * 0.15, hh = Hgt * 0.16;
    var hy = -Hgt * 1.02;
    var headGrad = ctx.createRadialGradient(-hw * 0.3, hy - hh * 0.3, hw * 0.1, 0, hy, hw * 1.3);
    headGrad.addColorStop(0, hue[0]);
    headGrad.addColorStop(0.6, hue[1]);
    headGrad.addColorStop(1, hue[2]);
    ctx.fillStyle = headGrad;
    ctx.beginPath();
    ctx.ellipse(0, hy, hw, hh, 0, 0, Math.PI * 2);
    ctx.fill();

    // глаза — большие; злобные светящиеся или добрые
    var eyeGlow = SCARY ? (0.55 + fearFactor * 0.45 + (a.hitFlash > 0 ? 0.5 : 0)) : (0.7 + (a.hitFlash > 0 ? 0.3 : 0));
    var eyeCol = a.kind === "giant" ? (SCARY ? "255,60,50" : "120,140,255") : (SCARY ? "190,255,190" : "255,255,255");
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.ellipse(-hw * 0.42, hy - hh * 0.06, hw * 0.34, hh * 0.42, -0.25, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(hw * 0.42, hy - hh * 0.06, hw * 0.34, hh * 0.42, 0.25, 0, Math.PI * 2); ctx.fill();
    // зрачки
    ctx.save();
    ctx.shadowColor = "rgba(" + eyeCol + "," + eyeGlow + ")";
    ctx.shadowBlur = hw * (SCARY ? (0.9 + fearFactor * 1.4) : 0.5);
    ctx.fillStyle = "rgba(" + eyeCol + "," + eyeGlow + ")";
    ctx.beginPath(); ctx.arc(-hw * 0.42, hy - hh * 0.06, hw * 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(hw * 0.42, hy - hh * 0.06, hw * 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    var mouthW = hw * 1.1;
    if (SCARY) {
      // злобный рот с зубами
      ctx.fillStyle = "#050506";
      ctx.beginPath();
      ctx.moveTo(-mouthW / 2, hy + hh * 0.45);
      ctx.quadraticCurveTo(0, hy + hh * (0.45 + 0.32), mouthW / 2, hy + hh * 0.45);
      ctx.quadraticCurveTo(0, hy + hh * 0.3, -mouthW / 2, hy + hh * 0.45);
      ctx.closePath(); ctx.fill();
      // зубы
      ctx.fillStyle = "#cfcbb8";
      for (var t = 0; t < 5; t++) {
        var tx = -mouthW / 2 + (t + 0.5) * (mouthW / 5);
        var tw = mouthW / 5 * 0.5, th = hh * (0.14 + (t % 2) * 0.06);
        ctx.beginPath();
        ctx.moveTo(tx - tw / 2, hy + hh * 0.45);
        ctx.lineTo(tx + tw / 2, hy + hh * 0.45);
        ctx.lineTo(tx, hy + hh * 0.45 + th);
        ctx.closePath(); ctx.fill();
      }
    } else {
      // дружелюбная улыбка
      ctx.strokeStyle = "#0a1a0c";
      ctx.lineWidth = hh * 0.1;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(0, hy + hh * 0.22, hw * 0.42, 0.18 * Math.PI, 0.82 * Math.PI);
      ctx.stroke();
    }

    // вспышка попадания
    if (a.hitFlash > 0) {
      ctx.globalAlpha = alpha * a.hitFlash * 0.8;
      ctx.fillStyle = "#ffdddd";
      ctx.beginPath();
      ctx.ellipse(0, hy, hw * 1.3, hh * 1.3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = alpha;
    }

    // полоска здоровья
    if (a.dying <= 0 && a.hp < a.maxHp) {
      var bw = Hgt * 0.35, bh = Math.max(2, Hgt * 0.02);
      ctx.fillStyle = "rgba(0,0,0,.7)";
      ctx.fillRect(-bw / 2 - Hgt * 0.005, -Hgt * 1.22, bw + Hgt * 0.01, bh + Hgt * 0.01);
      ctx.fillStyle = "#c0392b";
      ctx.fillRect(-bw / 2, -Hgt * 1.22, bw * (a.hp / a.maxHp), bh);
    }

    ctx.restore();
    ctx.globalAlpha = 1;
  }

  /* ---------------------- Фонарь и темнота ---------------------- */
  function drawDarkness() {
    // Мерцание
    flashAngle += 0.05;
    var flick = 0.94 + Math.sin(flashAngle) * 0.03 + Math.sin(flashAngle * 3.7) * 0.015;

    // Световое пятно фонаря (следует за прицелом)
    var lx = W / 2, ly = H * 0.52;
    if (hasMouse) { lx = mouseX; ly = mouseY; }

    // В спокойном режиме фонарь светит ярче и шире, тьма слабее
    var radius = Math.min(W, H) * (SCARY ? 0.62 * flick : 0.95 * flick);
    var darkEdge = SCARY ? 0.94 : 0.62;
    var darkMid  = SCARY ? 0.62 : 0.3;
    var darkLow  = SCARY ? 0.15 : 0.06;

    ctx.save();
    var grad = ctx.createRadialGradient(lx, ly, radius * 0.06, lx, ly, radius);
    grad.addColorStop(0, "rgba(0,0,0,0)");
    grad.addColorStop(0.45, "rgba(0,0,0," + darkLow + ")");
    grad.addColorStop(0.72, "rgba(0,0,0," + darkMid + ")");
    grad.addColorStop(1, "rgba(0,0,0," + darkEdge + ")");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // лёгкий тёплый оттенок света
    var warm = ctx.createRadialGradient(lx, ly, 0, lx, ly, radius * 0.55);
    warm.addColorStop(0, SCARY ? "rgba(255,240,200,.09)" : "rgba(255,244,215,.16)");
    warm.addColorStop(1, "rgba(255,240,200,0)");
    ctx.fillStyle = warm;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  /* ---------------------- Оружие: отрисовка ---------------------- */
  function gunPose() {
    var t = timeNow;
    var w = curW();
    var swayAmp = w.id === "rifle" ? 0.6 : (w.id === "shotgun" ? 0.8 : 1);
    var swayX = Math.sin(t * 1.1) * 5 * swayAmp + yaw * 30;
    var swayY = Math.sin(t * 1.9) * 4 * swayAmp + Math.abs(yaw) * 8 - pitch * 24;
    var b = bobAmp;
    // анимация смены: оружие уходит вниз и возвращается
    var sw = 0;
    if (switchT > 0) sw = Math.sin(clamp(switchT / 0.3, 0, 1) * Math.PI) * 150;
    var bx = W * 0.68 + swayX + Math.sin(walkPhase) * b * 10;
    var by = H * 0.93 + swayY + Math.abs(Math.cos(walkPhase)) * b * 8 + recoil * 26 + sw;
    return { x: bx, y: by };
  }

  function drawArms() {
    // руки в перчатках
    ctx.fillStyle = "#20242a";
    ctx.beginPath(); ctx.ellipse(-96, 150, 48, 34, 0.18, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(66, 168, 44, 30, -0.15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#2d3239";
    ctx.beginPath(); ctx.ellipse(-96, 140, 42, 22, 0.18, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(66, 158, 38, 18, -0.15, 0, Math.PI * 2); ctx.fill();
  }

      ctx.fillStyle = g;

      ctx.fillStyle = g3;

      // два ствола
      ctx.fillStyle = "#33373d";
      ctx.fillRect(-30, -190, 24, 200);
      ctx.fillRect(0, -190, 24, 200);
      ctx.fillStyle = "#0a0c0e";
      ctx.beginPath(); ctx.ellipse(-18, -190, 11, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(12, -190, 11, 6, 0, 0, Math.PI * 2); ctx.fill();
      // цевьё
      ctx.fillStyle = "#3a2f26";

    } else if (w.id === "rifle") {
      var g4 = ctx.createLinearGradient(-70, -10, 40, 150);
      g4.addColorStop(0, "#3f4650"); g4.addColorStop(0.5, "#242a31"); g4.addColorStop(1, "#101317");
      ctx.fillStyle = g4;
      ctx.beginPath();

      ctx.lineTo(96, 54); ctx.lineTo(80, 164); ctx.lineTo(-134, 176);
      ctx.closePath(); ctx.fill();
      // длинный ствол
      ctx.fillStyle = "#2b3139";
      ctx.fillRect(-10, -250, 20, 248);

      ctx.fillStyle = "#0b0d10";
      ctx.fillRect(-24, -80, 70, 26);
      ctx.fillStyle = "#16202a";
      ctx.beginPath(); ctx.ellipse(10, -67, 10, 16, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(120,220,255,.25)";
      ctx.beginPath(); ctx.ellipse(10, -67, 6, 10, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#08090b";
      ctx.beginPath(); ctx.ellipse(0, -250, 10, 5, 0, 0, Math.PI * 2); ctx.fill();
    } else {
      // огнемёт: бак + сопло
      ctx.fillStyle = "#2a3a2e";
      ctx.beginPath();
      ctx.moveTo(-120, 50); ctx.lineTo(-60, -20); ctx.lineTo(50, -12);
      ctx.lineTo(84, 50); ctx.lineTo(66, 168); ctx.lineTo(-104, 176);
      ctx.closePath(); ctx.fill();
      // бак
      var tank = ctx.createRadialGradient(-70, 90, 8, -70, 90, 60);
      tank.addColorStop(0, "#4e6a50"); tank.addColorStop(0.7, "#25321f"); tank.addColorStop(1, "#141a10");
      ctx.fillStyle = tank;
      ctx.beginPath(); ctx.ellipse(-72, 96, 42, 58, 0, 0, Math.PI * 2); ctx.fill();
      // сопло
      ctx.fillStyle = "#3a3f45";
      ctx.fillRect(-4, -110, 26, 100);
      ctx.fillStyle = "#0a0c0e";
      ctx.beginPath(); ctx.ellipse(9, -110, 16, 8, 0, 0, Math.PI * 2); ctx.fill();
    }
    // подствольный фонарь (у всех)
    var flick = 0.8 + Math.sin(flashAngle * 2.3) * 0.1;
    ctx.shadowColor = "rgba(255,240,190," + flick + ")";
    ctx.shadowBlur = 24;
    ctx.fillStyle = "rgba(255,248,220,.95)";
    ctx.beginPath(); ctx.arc(-18, -54, 7, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawGun() {
    var g = gunPose();
    var sc = clamp(W / 1280, 0.72, 1.3);
    var w = curW();
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.rotate(-recoil * 0.14 + yaw * 0.1);
    ctx.scale(sc, sc);
    drawWeaponBody(w);
    drawArms();
    ctx.restore();

    // вспышка у дула
    if (muzzleT > 0) {
      var m = muzzleScreen();
      var fr = 46 * sc * w.muzzle * (0.7 + Math.random() * 0.6);
      if (w.flame) {
        // огненный язык
        ctx.globalAlpha = clamp(muzzleT / 0.2, 0, 1);
        for (var f = 0; f < 6; f++) {
          var frx = m.x + rand(-30, 30), fry = m.y + rand(-40, 20);
          var fg2 = ctx.createRadialGradient(frx, fry, 0, frx, fry, 60 * sc);
          fg2.addColorStop(0, "rgba(255,240,160,.95)");
          fg2.addColorStop(0.4, "rgba(255,140,40,.8)");
          fg2.addColorStop(1, "rgba(200,40,0,0)");
          ctx.fillStyle = fg2;
          ctx.beginPath(); ctx.arc(frx, fry, 60 * sc, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
      } else if (fr > 2) {
        ctx.globalAlpha = clamp(muzzleT / 0.1, 0, 1);
        var fg = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, fr);
        fg.addColorStop(0, "rgba(255,255,235,.98)");
        fg.addColorStop(0.3, "rgba(255,225,140,.9)");
        fg.addColorStop(1, "rgba(255,150,40,0)");
        ctx.fillStyle = fg;
        ctx.beginPath(); ctx.arc(m.x, m.y, fr, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "rgba(255,235,170,.9)";
        ctx.lineWidth = 2 * sc;
        var rays = w.id === "shotgun" ? 9 : 6;
        for (var k = 0; k < rays; k++) {
          var ang = Math.random() * Math.PI * 2;
          ctx.beginPath(); ctx.moveTo(m.x, m.y);
          ctx.lineTo(m.x + Math.cos(ang) * fr * 1.4, m.y + Math.sin(ang) * fr * 1.4);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
    }
  }
  function muzzleScreen() {
    var g = gunPose();
    var sc = clamp(W / 1280, 0.72, 1.3);
    var off = curW().muzzleOff || { x: 0, y: -120 };
    return { x: g.x + off.x * sc, y: g.y + off.y * sc };
  }

  /* ---------------------- Обновление ---------------------- */
  function update(dt) {
    timeNow += dt;
    if (recoil > 0) recoil = Math.max(0, recoil - dt * 5);
    if (muzzleT > 0) muzzleT = Math.max(0, muzzleT - dt);
    if (switchT > 0) switchT = Math.max(0, switchT - dt);
    flashAngle += dt * 2;

    // перезарядка
    if (reloading) {
      reloadT -= dt * 1000;
      if (reloadT <= 0) {
        reloading = false;
        mags[weaponIdx] = curW().mag;
        updateHUD();
      }
    }

    // стрельба (автоогонь для ПП/огнемёта, одиночные для остальных)
    if (firing && running && !paused) {
      var w0 = curW();
      lastFire -= dt;
      if (lastFire <= 0) {
        shoot(W / 2, H / 2);
        lastFire = w0.auto ? 0.055 : 999999;   // одиночные — один выстрел до отпускания
      }
    }

    // ==== Движение ====
    var fwd = (keys["w"] ? 1 : 0) - (keys["s"] ? 1 : 0);
    var strafe = (keys["d"] ? 1 : 0) - (keys["a"] ? 1 : 0);
    if (joyActive) { fwd += -joyDY * 1.4; strafe += joyDX * 1.4; fwd = clamp(fwd, -1, 1); strafe = clamp(strafe, -1, 1); }
    var moving = (Math.abs(fwd) > 0.06 || Math.abs(strafe) > 0.06);
    var sprinting = (keys["shift"] || runHold) && fwd > 0.1;
    var speed = sprinting ? RUN_SPEED : WALK_SPEED;

    if (moving) {
      var sinY = Math.sin(yaw), cosY = Math.cos(yaw);
      // forward = (sinY, cosY), right = (cosY, -sinY)
      var mvx = sinY * fwd + cosY * strafe;
      var mvz = cosY * fwd - sinY * strafe;
      var len = Math.sqrt(mvx * mvx + mvz * mvz) || 1;
      mvx /= len; mvz /= len;
      camX += mvx * speed * dt;
      camZ += mvz * speed * dt;
      camX = clamp(camX, -FIELD, FIELD);
      camZ = clamp(camZ, -FIELD, FIELD);

      walkPhase += dt * (sprinting ? 14 : 9);
      bobAmp = sprinting ? 5.5 : 3.4;

      // шаги
      if (timeNow - lastFootstep > (sprinting ? 0.3 : 0.45)) {
        lastFootstep = timeNow;
        sndFoot(sprinting ? 0.13 : 0.08);
      }
    } else {
      bobAmp += (0 - bobAmp) * Math.min(1, dt * 5);
      walkPhase += dt * 1.5;
    }

    // покачивание головы
    camY = EYE + Math.abs(Math.sin(walkPhase)) * bobAmp * 1.6;

    // ==== Пришельцы ====
    var nearest = Infinity;
    for (var i = aliens.length - 1; i >= 0; i--) {
      var a = aliens[i];

      if (a.dying > 0) {
        a.dying -= dt;
        if (a.dying <= 0) aliens.splice(i, 1);
        continue;
      }
      if (a.dead) continue;

      var dx = camX - a.x, dz = camZ - a.z;
      var d = Math.sqrt(dx * dx + dz * dz) || 1;
      if (d < nearest) nearest = d;

      // бег к игроку
      var move = a.speed * dt;
      a.x += (dx / d) * move;
      a.z += (dz / d) * move;
      a.phase += dt * a.phaseSpeed;
      a.sway += dt * 2;

      // рычание
      if (timeNow > a.growlAt && d < 900) {
        a.growlAt = timeNow + rand(1.5, 4);
        sndGrowl(clamp(0.16 - d / 9000, 0.03, 0.16));
      }

      // удар
      if (d < SCARE_DIST && a.lunge <= 0) {
        a.lunge = 1;
        jumpscare(a);
      }

      if (a.hitFlash > 0) a.hitFlash = Math.max(0, a.hitFlash - dt * 4);
    }

    // страх / пульс (в спокойном режиме — мягче и тише)
    if (nearest < FEAR_DIST) {
      var intensity = clamp(1 - nearest / FEAR_DIST, 0, 1);
      if (SCARY) {
        fearEl.classList.add("on");
        if (intensity > 0.55) fearEl.classList.add("panic"); else fearEl.classList.remove("panic");
      } else {
        fearEl.classList.remove("on");
        fearEl.classList.remove("panic");
      }
      setHeartbeat(intensity * (SCARY ? 1 : 0.5));
      var chance = (SCARY ? 0.6 + intensity * 2.5 : 0.25 + intensity * 0.9);
      if (Math.random() < dt * chance) sndGrowl(clamp((SCARY ? 0.16 : 0.07) - nearest / 99999, 0.02, SCARY ? 0.24 : 0.1));
    } else {
      fearEl.classList.remove("on");
      fearEl.classList.remove("panic");
    }

    // ==== Волны / время ====
    survived += dt;
    var w = 1 + Math.floor(survived / 35);
    if (w > wave) { wave = w; sndWave(); addFloat(W / 2, H * 0.42, "ВОЛНА " + wave, "#ff8a6b", 30); }

    // ==== Эффекты ====
    for (var f = fx.length - 1; f >= 0; f--) { fx[f].life -= dt; if (fx[f].life <= 0) fx.splice(f, 1); }
    for (var q = floats.length - 1; q >= 0; q--) { floats[q].life -= dt; floats[q].y -= dt * 45; if (floats[q].life <= 0) floats.splice(q, 1); }
  }

  /* ---------------------- Удар вблизи ---------------------- */
  function jumpscare(a) {
    if (SCARY) {
      sndScream();
      triggerShake(700, 16);
    } else {
      // мягко: глухой удар и лёгкое дрожание
      tone(140, 70, 0.35, "sawtooth", 0.2);
      noise(0.25, 700, 0.18);
      triggerShake(320, 7);
    }
    dmgEl.classList.remove("on"); void dmgEl.offsetWidth; dmgEl.classList.add("on");

    // Жуткий режим — страшное лицо на весь экран
    if (SCARY) {
      scareEl.innerHTML = scaryFaceSVG();
      scareEl.classList.remove("on"); void scareEl.offsetWidth; scareEl.classList.add("on");
      setTimeout(function () { scareEl.innerHTML = ""; }, 750);
    }

    hp -= ALIEN_HIT;
    updateHUD();
    if (hp <= 0) { hp = 0; updateHUD(); endGame(); return; }

    // отбросить пришельца назад
    var dx = a.x - camX, dz = a.z - camZ;
    var d = Math.sqrt(dx * dx + dz * dz) || 1;
    a.x += (dx / d) * 420;
    a.z += (dz / d) * 420;
  }
  function scaryFaceSVG() {
    return '<svg viewBox="0 0 400 400">' +
      '<rect width="400" height="400" fill="#050608"/>' +

      '<ellipse cx="145" cy="180" rx="48" ry="62" fill="#000"/>' +
      '<ellipse cx="255" cy="180" rx="48" ry="62" fill="#000"/>' +
      '<circle cx="148" cy="182" r="15" fill="#d8ffe0"/>' +
      '<circle cx="252" cy="182" r="15" fill="#d8ffe0"/>' +
      '<circle cx="148" cy="182" r="11" fill="#0a0a0a"/>' +
      '<circle cx="252" cy="182" r="11" fill="#0a0a0a"/>' +
      '<circle cx="152" cy="176" r="3.5" fill="#fff"/>' +
      '<circle cx="256" cy="176" r="3.5" fill="#fff"/>' +
      '<path d="M110 268 Q200 340 290 268 Q200 306 110 268 Z" fill="#000"/>' +
      '<path d="M122 272 L138 300 L152 274 L168 302 L184 276 L200 304 L216 276 L232 302 L248 274 L262 300 L278 272" ' +
        'stroke="#e8e2cc" stroke-width="7" fill="none" stroke-linejoin="round"/>' +
      '<path d="M96 130 Q120 96 150 122" stroke="#1a1c20" stroke-width="9" fill="none"/>' +
      '<path d="M304 130 Q280 96 250 122" stroke="#1a1c20" stroke-width="9" fill="none"/>' +

    '</svg>';
  }

  function triggerShake(ms, mag) { shakeUntil = performance.now() + ms; shakeMag = mag || 8; }

  /* ---------------------- Отрисовка кадра ---------------------- */
  function render(ts) {
    var sx = 0, sy = 0;
    if (ts < shakeUntil) { sx = rand(-shakeMag, shakeMag); sy = rand(-shakeMag, shakeMag); }

    ctx.save();
    ctx.translate(sx, sy);

    drawSky();
    drawGround();

    // объекты поля (сортируем по глубине, дальние первыми)
    var vis = [];
    for (var i = 0; i < field.length; i++) {
      var o = field[i];
      var dd = (o.x - camX) * (o.x - camX) + (o.z - camZ) * (o.z - camZ);
      if (dd < VIEW_DIST * VIEW_DIST) vis.push(o);
    }
    for (var j = 0; j < aliens.length; j++) vis.push(aliens[j]);

    vis.sort(function (a, b) {
      var da = (a.x - camX) * (a.x - camX) + (a.z - camZ) * (a.z - camZ);
      var db = (b.x - camX) * (b.x - camX) + (b.z - camZ) * (b.z - camZ);
      return db - da;
    });

    for (var k = 0; k < vis.length; k++) {
      var it = vis[k];
      if (it.height !== undefined && (it.hp !== undefined || it.kind)) drawAlien(it);
      else drawFieldObject(it);
    }

    // эффекты (трассеры, кровь, огонь)
    for (var f = 0; f < fx.length; f++) {
      var e = fx[f];

      if (e.tracer) {
        // трассер от дула к точке
        var mx0 = e.tx, my0 = e.ty, mx1 = e.x, my1 = e.y;
        ctx.globalAlpha = clamp(e.life / e.max, 0, 1);
        ctx.save();
        ctx.strokeStyle = e.color || "rgba(180,255,220,.9)";
        ctx.lineWidth = 2.4;
        ctx.shadowColor = "#8dffc4"; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.moveTo(mx0, my0); ctx.lineTo(mx1, my1); ctx.stroke();
        ctx.restore();
        continue;
      }
      if (e.fire) {
        var frr = e.r * (1.6 - e.life / e.max);
        ctx.globalAlpha = clamp(e.life / e.max, 0, 1) * 0.9;
        var fgrad = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, frr);
        fgrad.addColorStop(0, "rgba(255,240,160,.95)");
        fgrad.addColorStop(0.4, "rgba(255,140,40,.75)");
        fgrad.addColorStop(1, "rgba(190,30,0,0)");
        ctx.fillStyle = fgrad;
        ctx.beginPath(); ctx.arc(e.x, e.y, frr, 0, Math.PI * 2); ctx.fill();
        continue;
      }
      // вспышка (кровь/урон)
      var rr = e.r * (1.7 - e.life / e.max);
      ctx.globalAlpha = clamp(e.life / e.max, 0, 1);
      var rg = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, rr);
      if (e.blood) {
        rg.addColorStop(0, "rgba(150,15,15,.95)");
        rg.addColorStop(0.5, "rgba(110,10,10,.6)");
        rg.addColorStop(1, "rgba(80,0,0,0)");
      } else {
        rg.addColorStop(0, "rgba(255,220,180,.9)");
        rg.addColorStop(1, "rgba(255,140,40,0)");
      }
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(e.x, e.y, rr, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // фонарь / темнота
    drawDarkness();

    // всплывающий текст
    ctx.textAlign = "center";
    for (var q = 0; q < floats.length; q++) {
      var fl = floats[q];
      ctx.globalAlpha = clamp(fl.life / fl.max, 0, 1);
      ctx.font = "800 " + fl.size + "px -apple-system, Segoe UI, Roboto, sans-serif";
      ctx.fillStyle = "rgba(0,0,0,.7)";
      ctx.fillText(fl.text, fl.x + 1.5, fl.y + 1.5);
      ctx.fillStyle = fl.color;
      ctx.fillText(fl.text, fl.x, fl.y);
    }
    ctx.globalAlpha = 1;

    // оружие
    drawGun();

    ctx.restore();
  }

  /* ---------------------- Стрельба ---------------------- */
  function shoot(mx, my) {
    if (paused) return;
    var w = curW();
    if (reloading) { sndEmpty(); return; }
    if (performance.now() < nextShotAt) return;         // темп стрельбы
    if (mags[weaponIdx] <= 0) { sndEmpty(); startReload(); return; }

    mags[weaponIdx]--;
    shotsFired++;
    nextShotAt = performance.now() + (60000 / w.rpm);
    sndShot(weaponIdx);
    recoil = w.recoil;
    muzzleT = 0.1 * w.muzzle + 0.05;
    triggerShake(110, w.shake);
    updateHUD();

    var m = muzzleScreen();

    // трассеры к точке попадания
    if (w.flame) {
      addFlame(mx, my, w);
    } else {
      for (var tr = 0; tr < (w.tracer || 1); tr++) {
        fx.push({ x: mx + rand(-6, 6), y: my + rand(-6, 6), r: 18, life: 0.14, max: 0.14,
                  tracer: true, tx: m.x, ty: m.y, color: "rgba(180,255,220,.9)" });
      }
    }

    // дробь/очередь: несколько попаданий
    var anyHit = false, killedNow = 0;
    for (var s = 0; s < (w.pellets || 1); s++) {
      var jx = mx + rand(-1, 1) * w.spread * 1400;
      var jy = my + rand(-1, 1) * w.spread * 1400;
      var target = findTarget(jx, jy);
      if (target) {
        anyHit = true;
        // урон падает с расстоянием (дальность оружия)
        var tp = project(target.x, 0, target.z);
        var df = clamp(1 - (tp.z / VIEW_DIST) * (1 - w.range), 0.18, 1);
        damageAlien(target, Math.max(4, Math.round(w.dmg * df)), jx, jy);
        if (target.dead) killedNow++;
      }
    }

    if (anyHit) {
      crosshair.classList.add("hot");
      setTimeout(function () { crosshair.classList.remove("hot"); }, 90);
    } else {
      addFloat(mx, my, "МИМО", "#8a8f98", 13);
      if (w.id === "shotgun") sndShot(weaponIdx);
    }
  }

  function findTarget(mx, my) {
    var target = null, bestZ = Infinity;
    for (var i = 0; i < aliens.length; i++) {
      var a = aliens[i];
      if (a.dead || a.dying > 0) continue;
      var p = project(a.x, a.y || 0, a.z);
      var bodyTop = p.sy - a.height * p.s;
      var bodyBot = p.sy;
      var bodyW = a.height * p.s * 0.34;
      if (mx > p.sx - bodyW && mx < p.sx + bodyW && my > bodyTop && my < bodyBot) {
        if (p.z < bestZ) { bestZ = p.z; target = a; }
      }
    }
    return target;
  }

  function damageAlien(target, dmg, hx, hy) {
    target.hp -= dmg;
    target.hitFlash = 1;
    var pp = project(target.x, 0, target.z);
    // брызги крови
    fx.push({ x: hx || pp.sx, y: hy || pp.sy - target.height * pp.s * 0.5,
              r: 26, life: 0.3, max: 0.3, blood: true });

    if (target.hp > 0) {
      sndAlienHit();
      addFloat(pp.sx, pp.sy - target.height * pp.s * 0.9, "-" + dmg, "#ffb0a0", 14);
      return;
    }

    // убит
    sndAlienDie();
    fx.push({ x: pp.sx, y: pp.sy - target.height * pp.s * 0.6, r: 100, life: 0.45, max: 0.45, blood: true });
    target.dying = 0.4;
    target.dead = true;
    killed++;
    var pts = (target.kind === "giant" ? 300 : target.kind === "runner" ? 180 : 120);
    score += pts;
    addFloat(pp.sx, pp.sy - target.height * pp.s * 0.9, "+" + pts, "#ffd88a", 20);
    updateHUD();
  }

  function addFlame(mx, my, w) {
    for (var i = 0; i < 5; i++) {
      fx.push({
        x: mx + rand(-40, 40), y: my + rand(-40, 40),
        r: rand(34, 74), life: rand(0.18, 0.32), max: 0.32,
        fire: true
      });
    }
  }
  var shotsFired = 0;

  /* ---------------------- HUD ---------------------- */
  function updateHUD() {
    timerEl.textContent = fmtTime(survived);
    waveEl.textContent = wave;
    killedEl.textContent = killed;
    scoreEl.textContent = score;
    hpFill.style.width = clamp(hp / MAX_HP * 100, 0, 100) + "%";
    hpBar.classList.toggle("low", hp <= 35);
    var w = curW();
    if (reloading) ammoEl.textContent = "ПЕРЕЗАРЯДКА";
    else ammoEl.textContent = curAmmo() + "/" + w.mag;
    ammoEl.classList.toggle("empty", curAmmo() === 0 && !reloading);
    weaponEl.textContent = w.name;
    renderWeaponBar();
  }

  function renderWeaponBar() {
    var html = "";
    for (var i = 0; i < WEAPONS.length; i++) {
      var w = WEAPONS[i];
      var act = i === weaponIdx ? " active" : "";
      var rl = (i === weaponIdx && reloading) ? " reloading" : "";
      var am = (i === weaponIdx && reloading) ? "…" : (mags[i] + "/" + w.mag);
      html += '<div class="slot' + act + rl + '">' +
                '<span class="n">' + (i + 1) + '</span>' +
                '<span class="nm">' + w.name + '</span>' +
                '<span class="am">' + am + '</span>' +
              '</div>';
    }
    wbarEl.innerHTML = html;
  }
  function fmtTime(s) {
    var m = Math.floor(s / 60), ss = Math.floor(s % 60);
    return (m < 10 ? "0" : "") + m + ":" + (ss < 10 ? "0" : "") + ss;
  }

  /* ---------------------- Оружие: помощники ---------------------- */
  function curW() { return WEAPONS[weaponIdx]; }
  function curAmmo() { return mags[weaponIdx]; }

  function switchWeapon(i) {
    if (i < 0 || i >= WEAPONS.length || i === weaponIdx) return;
    if (reloading) { reloading = false; reloadT = 0; }   // отменяем перезарядку
    weaponIdx = i;
    switchT = 0.3;                 // анимация опускания/подъёма
    nextShotAt = 0;
    sndSwitch();
    updateHUD();
  }
  function cycleWeapon(dir) {
    var n = WEAPONS.length;
    switchWeapon(((weaponIdx + dir) % n + n) % n);
  }

  function startReload() {
    var w = curW();
    if (reloading || mags[weaponIdx] >= w.mag) return;
    reloading = true;
    reloadT = w.reload;
    reloadEnd = performance.now() + w.reload;
    sndReload();
    updateHUD();
  }

  /* ---------------------- Главный цикл ---------------------- */
  function frame(ts) {
    if (!running) return;
    var dt = lastTs ? Math.min((ts - lastTs) / 1000, 0.05) : 0.016;
    lastTs = ts;

    if (!paused) {
      update(dt);
      render(ts);
      updateHUD();
    }
    rafId = requestAnimationFrame(frame);
  }

  /* ---------------------- Конец игры ---------------------- */
  function showGameOver() {
    var board = loadBoard();
    var entry = { score: score, time: survived, date: Date.now() };
    board.push(entry);
    board.sort(function (a, c) { return c.score - a.score; });
    board = board.slice(0, 10);
    saveBoard(board);
    var isRecord = board.length && board[0].date === entry.date;

    overlay.classList.remove("hidden");
    overlay.innerHTML =
      '<div class="card">' +
        '<h1>' + (isRecord ? "НОВЫЙ РЕКОРД" : "ОНИ ДОБРАЛИСЬ") + '</h1>' +
        '<p style="opacity:.7;margin-top:-2px">' + (isRecord ? "Ты выжила дольше всех!" : "Не оглядывайся в следующий раз") + '</p>' +
        '<div class="big">' + fmtTime(survived) + '</div>' +
        '<div class="row">' +
          '<div class="col">Очки<b>' + score + '</b></div>' +
          '<div class="col">Убито<b>' + killed + '</b></div>' +
          '<div class="col">Волна<b>' + wave + '</b></div>' +
          '<div class="col">Выстрелов<b>' + shotsFired + '</b></div>' +
        '</div>' +
        '<div style="margin-top:18px">' +
          '<button data-action="again">ЕЩЁ РАЗ</button>' +
          '<button class="ghost" data-action="menu">В МЕНЮ</button>' +
        '</div>' +
      '</div>';
  }

  /* ---------------------- Старт / стоп ---------------------- */
  var keys = {};
  var mouseX = 0, mouseY = 0, hasMouse = false;
  var SENS = 0.0022;

  function startGame() {
    getAudio();
    startAmbient();
    clearTimeout(spawnTimer);
    cancelAnimationFrame(rafId);

    aliens = []; fx = []; floats = [];
    hp = MAX_HP; initMags(); reloading = false; reloadT = 0; weaponIdx = 0;
    nextShotAt = 0; switchT = 0;
    score = 0; killed = 0; wave = 1; survived = 0; shotsFired = 0;
    camX = 0; camZ = 0; camY = EYE; yaw = 0; pitch = 0;
    bobT = 0; bobAmp = 0; walkPhase = 0; recoil = 0; muzzleT = 0;
    timeNow = 0; shakeUntil = 0;
    paused = false;

    buildField(); buildStars(); startHeart();

    running = true;
    overlay.classList.add("hidden");
    updateHUD();
    lastTs = 0;
    rafId = requestAnimationFrame(frame);
    spawnAlien();

    requestLock();
  }

  function endGame() {
    running = false;
    clearTimeout(spawnTimer);
    cancelAnimationFrame(rafId);
    stopAmbient();
    if (heart) { try { heart.o.stop(); } catch (e) {} heart = null; }
    fearEl.classList.remove("on"); fearEl.classList.remove("panic");
    sndWave();
    showGameOver();
    if (document.exitPointerLock) document.exitPointerLock();
  }

  function requestLock() {
    if (isMobile) return;
    try {
      var p = canvas.requestPointerLock();
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
  }

  /* ====================== МОБИЛЬНОЕ УПРАВЛЕНИЕ ====================== */
  var isMobile = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
  var mobileEl = document.getElementById("mobile");
  var joyEl = document.getElementById("joy");
  var joyKnob = document.getElementById("joyKnob");
  var joyActive = false, joyId = null, joyCX = 0, joyCY = 0, joyDX = 0, joyDY = 0;
  var runHold = false;
  var lookId = null, lookLastX = 0, lookLastY = 0;
  if (isMobile) mobileEl.classList.add("on");

  joyEl.addEventListener("touchstart", function (e) {
    e.preventDefault();
    var t = e.changedTouches[0];
    joyActive = true; joyId = t.identifier;
    var r = joyEl.getBoundingClientRect();
    joyCX = r.left + r.width / 2; joyCY = r.top + r.height / 2;
    updateJoy(t.clientX, t.clientY);
  }, { passive: false });
  function updateJoy(x, y) {
    var dx = x - joyCX, dy = y - joyCY, max = 56, len = Math.hypot(dx, dy);
    if (len > max) { dx = dx / len * max; dy = dy / len * max; }
    joyKnob.style.transform = "translate(" + dx + "px," + dy + "px)";
    joyDX = dx / max; joyDY = dy / max;
  }
  window.addEventListener("touchmove", function (e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier === joyId) { e.preventDefault(); updateJoy(t.clientX, t.clientY); return; }
    }
  }, { passive: false });
  window.addEventListener("touchend", function (e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joyId) {
        joyActive = false; joyId = null; joyDX = 0; joyDY = 0;
        joyKnob.style.transform = "translate(0,0)";
      }
    }
  });

  // свайп-обзор
  canvas.addEventListener("touchstart", function (e) {
    if (!running || paused) return;
    var t = e.changedTouches[0];
    lookId = t.identifier; lookLastX = t.clientX; lookLastY = t.clientY;
  }, { passive: true });
  canvas.addEventListener("touchmove", function (e) {
    if (!running || paused) return;
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier !== lookId) continue;
      var dx = t.clientX - lookLastX, dy = t.clientY - lookLastY;
      lookLastX = t.clientX; lookLastY = t.clientY;
      yaw += dx * 0.005;
      pitch -= dy * 0.004;
      pitch = clamp(pitch, -0.85, 0.7);
    }
  }, { passive: true });
  canvas.addEventListener("touchend", function () { lookId = null; }, { passive: true });

  function bindBtn(id, down, up) {
    var el = document.getElementById(id);
    if (!el) return;
    el.addEventListener("touchstart", function (e) { e.preventDefault(); el.classList.add("press"); down(); }, { passive: false });
    el.addEventListener("touchend", function (e) { e.preventDefault(); el.classList.remove("press"); if (up) up(); }, { passive: false });
    el.addEventListener("mousedown", function (e) { if (isMobile) return; e.preventDefault(); down(); });
    el.addEventListener("mouseup", function (e) { if (isMobile) return; e.preventDefault(); if (up) up(); });
  }
  bindBtn("btnFire", function () { firing = true; lastFire = 0; }, function () { firing = false; });
  bindBtn("btnRun", function () { runHold = true; }, function () { runHold = false; });
  bindBtn("btnReload", function () { startReload(); });
  bindBtn("btnSwap", function () { cycleWeapon(1); });

  document.addEventListener("pointerlockchange", function () {
    if (isMobile) return;
    pointerLocked = (document.pointerLockElement === canvas);
    if (running) {
      paused = !pointerLocked;
      if (paused) {
        hintEl.textContent = "ПАУЗА — кликни, чтобы продолжить";
        hintEl.style.opacity = ".9";
      } else {
        hintEl.textContent = "W A S D — бежать • Мышь — осмотреться • ЛКМ — выстрел • Shift — бег";
        hintEl.style.opacity = ".55";
        // при захвате прицел всегда в центре
        crosshair.style.left = "50%";
        crosshair.style.top = "50%";
        crosshair.style.opacity = "1";
      }
    }
  });

  document.addEventListener("mousemove", function (e) {
    if (!running || paused) return;
    if (pointerLocked) {
      yaw += e.movementX * SENS;
      pitch -= e.movementY * SENS;
      pitch = clamp(pitch, -0.85, 0.7);
    } else {
      var r = canvas.getBoundingClientRect();
      mouseX = e.clientX - r.left;
      mouseY = e.clientY - r.top;
      hasMouse = true;
      // мягкий поворот к курсору (если захват не сработал)
      yaw += ((mouseX / W) - 0.5) * 0.03;
      pitch += ((mouseY / H) - 0.5) * 0.02;
      pitch = clamp(pitch, -0.85, 0.7);
    }
  });

  canvas.addEventListener("mousedown", function (e) {
    if (!running) return;
    if (paused) { requestLock(); return; }
    if (e.button === 0) {
      if (!pointerLocked) { requestLock(); return; }
      firing = true;
      lastFire = 0;               // выстрелить немедленно
    }
    if (e.button === 2) startReload();
  });
  document.addEventListener("mouseup", function (e) {
    if (e.button === 0) firing = false;
  });
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  // Смена оружия колесом мыши
  document.addEventListener("wheel", function (e) {
    if (!running || paused) return;
    cycleWeapon(e.deltaY > 0 ? 1 : -1);
    e.preventDefault();
  }, { passive: false });

  window.addEventListener("keydown", function (e) {
    var k = e.key.toLowerCase();
    if (k === "w" || k === "a" || k === "s" || k === "d") keys[k] = true;
    if (k === "shift") keys["shift"] = true;
    if (k === "ц") keys["w"] = true;
    if (k === "ф") keys["a"] = true;
    if (k === "ы") keys["s"] = true;
    if (k === "в") keys["d"] = true;
    if (k === "r") startReload();
    if (k === "e") cycleWeapon(1);
    if (k === "q") cycleWeapon(-1);
    // цифры 1-5 — прямое переключение
    if (k >= "1" && k <= "5") switchWeapon(parseInt(k, 10) - 1);
    if (!running && (e.key === " " || e.key === "Enter")) { e.preventDefault(); startGame(); }
  });
  window.addEventListener("keyup", function (e) {
    var k = e.key.toLowerCase();
    if (k === "w" || k === "a" || k === "s" || k === "d") keys[k] = false;
    if (k === "shift") keys["shift"] = false;
    if (k === "ц") keys["w"] = false;
    if (k === "ф") keys["a"] = false;
    if (k === "ы") keys["s"] = false;
    if (k === "в") keys["d"] = false;
  });

  overlay.addEventListener("click", function (e) {
    var btn = e.target.closest && e.target.closest("button");
    if (!btn) return;
    if (btn.dataset.fear !== undefined) {
      SCARY = btn.dataset.fear === "1";
      try { localStorage.setItem("nightfield_scary", SCARY ? "1" : "0"); } catch (er) {}
      showStart();
      return;
    }
    if (btn.dataset.action === "menu") showStart();
    else startGame();
  });
  overlay.addEventListener("touchend", function (e) {
    var btn = e.target.closest && e.target.closest("button");
    if (!btn) return;
    e.preventDefault();
    if (btn.dataset.fear !== undefined) { SCARY = btn.dataset.fear === "1"; try { localStorage.setItem("nightfield_scary", SCARY ? "1" : "0"); } catch (er) {} showStart(); return; }
    if (btn.dataset.action === "menu") showStart();
    else startGame();
  });

  window.addEventListener("resize", function () { resize(); buildStars(); });

  resize(); buildField(); buildStars();
  updateHUD();
  showStart();
})();
</script>
</body>
