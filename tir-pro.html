<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Тир PRO — стрельба по мишеням</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b1020; color: #eaf0ff;
    -webkit-user-select: none; user-select: none;
  }
  #game { display: flex; flex-direction: column; height: 100%; }

  /* ====== Панель ====== */
  #hud {
    display: flex; align-items: center; gap: 16px;
    padding: 9px 16px; font-size: 14px; z-index: 5;
    background: rgba(255,255,255,.06);
    border-bottom: 1px solid rgba(255,255,255,.1);
    flex-wrap: wrap;
  }
  #hud .item { white-space: nowrap; }
  #hud .label { opacity: .6; margin-right: 4px; }
  #hud .val { font-weight: 700; font-variant-numeric: tabular-nums; }
  #combo { color: #ffd84d; font-weight: 700; }
  #lvl { color: #6ff0a8; font-weight: 700; }
  #ammo { color: #7fd4ff; font-weight: 700; letter-spacing: 2px; }
  #hud .spacer { flex: 1; }
  #timebar-wrap { height: 6px; background: rgba(255,255,255,.08); }
  #timebar { height: 100%; width: 100%;
    background: linear-gradient(90deg,#35e08a,#ffd84d,#ff5a5a);
    transition: width .1s linear; }

  /* ====== Поле ====== */
  #arena {
    position: relative; flex: 1; overflow: hidden;
    cursor: none; touch-action: none;
    background:
      radial-gradient(circle at 20% 15%, rgba(90,160,255,.12), transparent 40%),
      radial-gradient(circle at 80% 85%, rgba(255,90,120,.12), transparent 40%),
      #0b1020;
  }
  #arena.sniper {
    background:
      radial-gradient(circle at 50% 50%, rgba(120,200,255,.10), transparent 60%),
      #060a16;
  }
  #arena.shake { animation: shake .3s; }
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    20% { transform: translate(-6px,3px); }
    40% { transform: translate(6px,-3px); }
    60% { transform: translate(-4px,-2px); }
    80% { transform: translate(4px,2px); }
  }

  /* ====== Прицел ====== */
  #crosshair {
    position: absolute; width: 34px; height: 34px;
    margin: -17px 0 0 -17px; pointer-events: none;
    opacity: 0; transition: opacity .15s; z-index: 20;
  }
  #crosshair::before, #crosshair::after {
    content: ""; position: absolute; background: #ff4d6d;
    box-shadow: 0 0 6px rgba(255,77,109,.9);
  }
  #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; margin-left: -1px; }
  #crosshair::after  { top: 50%; left: 0; height: 2px; width: 100%; margin-top: -1px; }
  #crosshair .dot {
    position: absolute; left: 50%; top: 50%;
    width: 6px; height: 6px; margin: -3px 0 0 -3px;
    border-radius: 50%; background: #ff4d6d;
  }
  /* Снайперский прицел */
  #crosshair.sniper { width: 90px; height: 90px; margin: -45px 0 0 -45px; }
  #crosshair.sniper::before, #crosshair.sniper::after { background: #7fd4ff; box-shadow: 0 0 8px rgba(127,212,255,.9); }
  #crosshair.sniper .dot { background: #7fd4ff; width: 8px; height: 8px; margin: -4px 0 0 -4px; }
  #crosshair .ring {
    position: absolute; inset: 8px; border: 2px solid rgba(127,212,255,.85);
    border-radius: 50%; box-shadow: 0 0 10px rgba(127,212,255,.6) inset;
    display: none;
  }
  #crosshair.sniper .ring { display: block; }

  /* ====== Мишени ====== */
  .target {
    position: absolute; border-radius: 50%;
    box-shadow: 0 6px 16px rgba(0,0,0,.5), inset 0 0 10px rgba(0,0,0,.25);
    animation: pop .16s cubic-bezier(.2,1.6,.5,1);
    will-change: transform;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }
  .target.normal {
    background: radial-gradient(circle,#ff3b3b 0 20%,#fff 20% 40%,#ff3b3b 40% 60%,#fff 60% 80%,#ff3b3b 80% 100%);
  }
  .target.gold {
    background: radial-gradient(circle,#fff2b0 0 22%,#ffcc33 22% 44%,#fff2b0 44% 66%,#ffcc33 66% 100%);
    box-shadow: 0 0 18px rgba(255,204,51,.9), 0 6px 16px rgba(0,0,0,.5);
  }
  .target.bomb {
    background: radial-gradient(circle,#4a4a4a 0 55%,#111 55% 100%);
    box-shadow: 0 0 16px rgba(255,60,60,.7), 0 6px 16px rgba(0,0,0,.5);
  }
  .target.freeze {
    background: radial-gradient(circle,#bff0ff 0 35%,#3fa9f5 35% 100%);
    box-shadow: 0 0 18px rgba(63,169,245,.9), 0 6px 16px rgba(0,0,0,.5);
  }
  .target.bonus {
    background: radial-gradient(circle,#c9ffd8 0 35%,#2ecc71 35% 100%);
    box-shadow: 0 0 18px rgba(46,204,113,.9), 0 6px 16px rgba(0,0,0,.5);
  }
  .target .icon { font-size: 60%; line-height: 1; }
  @keyframes pop { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .target.hit { transition: transform .18s, opacity .18s; opacity: 0; }
  .target.hit.normal { transform: scale(1.35); }
  .target.hit.gold   { transform: scale(1.7); }
  .target.hit.bomb   { transform: scale(1.8); }
  .target.hit.freeze { transform: scale(1.5); }
  .target.hit.bonus  { transform: scale(1.5); }
  .target.expire { transition: transform .25s, opacity .25s; transform: scale(.4); opacity: 0; }

  /* Всплывающий текст */
  .float {
    position: absolute; font-weight: 800; font-size: 20px;
    text-shadow: 0 2px 8px rgba(0,0,0,.7); pointer-events: none;
    animation: floatUp .75s ease-out forwards; z-index: 15; white-space: nowrap;
  }
  .float.good { color: #35e08a; }
  .float.bad  { color: #ff5a5a; }
  .float.gold { color: #ffd84d; }
  .float.info { color: #7fd4ff; }
  @keyframes floatUp {
    from { transform: translate(-50%,-50%) scale(.7); opacity: 1; }
    to   { transform: translate(-50%,-170%) scale(1.15); opacity: 0; }
  }

  /* Вспышка выстрела */
  .flash {
    position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px;
    border-radius: 50%; pointer-events: none; z-index: 14;
    background: radial-gradient(circle, rgba(255,230,150,.9), rgba(255,150,50,0) 70%);
    animation: flash .3s ease-out forwards;
  }
  @keyframes flash { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }

  /* ====== Оверлей / экраны ====== */
  #overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(6,9,20,.85); backdrop-filter: blur(5px); z-index: 30;
    text-align: center; padding: 20px; overflow: auto;
  }
  #overlay.hidden { display: none; }
  #overlay .card {
    max-width: 520px; width: 100%; padding: 30px 28px; border-radius: 20px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  #overlay h1 { margin: 0 0 8px; font-size: 34px; }
  #overlay h2 { margin: 22px 0 8px; font-size: 18px; opacity: .9; }
  #overlay p { margin: 8px 0; line-height: 1.55; opacity: .85; font-size: 14px; }
  #overlay .big { font-size: 46px; font-weight: 800; color: #ffd84d; margin: 4px 0; }
  #overlay button {
    margin: 6px; padding: 13px 26px; font-size: 16px; font-weight: 700;
    color: #08101f; background: linear-gradient(180deg,#6ff0a8,#35e08a);
    border: none; border-radius: 12px; cursor: pointer;
    box-shadow: 0 8px 22px rgba(53,224,138,.3);
    transition: transform .1s, box-shadow .15s;
  }
  #overlay button:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(53,224,138,.45); }
  #overlay button:active { transform: translateY(1px) scale(.98); }
  #overlay button.sniperBtn {
    background: linear-gradient(180deg,#8fe0ff,#3fa9f5); color: #041420;
    box-shadow: 0 8px 22px rgba(63,169,245,.3);
  }
  #overlay button.ghost {
    background: rgba(255,255,255,.08); color: #eaf0ff; box-shadow: none;
    border: 1px solid rgba(255,255,255,.15);
  }
  #overlay .row { display: flex; justify-content: center; gap: 22px; margin-top: 14px; flex-wrap: wrap; }
  #overlay .row .col { opacity: .9; font-size: 13px; }
  #overlay .row .col b { display: block; font-size: 24px; margin-top: 4px; color: #fff; }

  /* Таблица рекордов */
  .board { margin: 10px auto 0; max-width: 380px; }
  .board .line {
    display: flex; align-items: center; gap: 10px; padding: 7px 12px;
    border-radius: 10px; font-size: 14px; margin-bottom: 5px;
    background: rgba(255,255,255,.05);
  }
  .board .line.me { background: rgba(53,224,138,.18); border: 1px solid rgba(53,224,138,.4); }
  .board .rank { width: 22px; text-align: center; opacity: .8; font-weight: 700; }
  .board .m { flex: 1; text-align: left; opacity: .75; font-size: 12px; }
  .board .s { font-weight: 800; color: #ffd84d; }
  .legend { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin-top: 14px; font-size: 12px; opacity: .85; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
  <div id="game">
    <div id="hud">
      <div class="item"><span class="label">Очки:</span><span class="val" id="score">0</span></div>
      <div class="item"><span class="label">Время:</span><span class="val" id="time">60</span></div>
      <div class="item"><span class="label">Точность:</span><span class="val" id="acc">—</span></div>
      <div class="item" id="lvlItem"><span class="label">Уровень:</span><span id="lvl">1</span></div>
      <div class="item" id="ammoItem" style="display:none"><span class="label">Патроны:</span><span id="ammo">●●●●●</span></div>
      <div class="item" id="combo"></div>
      <div class="spacer"></div>
      <div class="item"><span class="label">Рекорд:</span><span class="val" id="best">0</span></div>
    </div>
    <div id="timebar-wrap"><div id="timebar"></div></div>

    <div id="arena">
      <div id="crosshair"><span class="ring"></span><span class="dot"></span></div>
      <div id="overlay"></div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  /* ===================== БАЗОВЫЕ НАСТРОЙКИ =====================
     Меняйте числа — игра подстроится.                            */
  var CLASSIC_TIME = 60;    // длительность классики, сек
  var SNIPER_TIME  = 45;    // длительность снайпера, сек
  var SNIPER_AMMO  = 5;     // патронов в обойме снайпера
  var RELOAD_MS    = 1400;  // перезарядка, мс
  var LEVEL_SCORE  = 700;   // сколько очков до нового уровня
  /* =========================================================== */

  var arena     = document.getElementById("arena");
  var crosshair = document.getElementById("crosshair");
  var overlay   = document.getElementById("overlay");
  var scoreEl   = document.getElementById("score");
  var timeEl    = document.getElementById("time");
  var accEl     = document.getElementById("acc");
  var bestEl    = document.getElementById("best");
  var comboEl   = document.getElementById("combo");
  var lvlEl     = document.getElementById("lvl");
  var lvlItem   = document.getElementById("lvlItem");
  var ammoEl    = document.getElementById("ammo");
  var ammoItem  = document.getElementById("ammoItem");
  var timeBar   = document.getElementById("timebar");

  /* -------------------- Состояние игры -------------------- */
  var running = false;
  var mode = "classic";              // "classic" | "sniper"
  var score = 0, shots = 0, hits = 0, combo = 0, maxCombo = 0;
  var timeLeft = CLASSIC_TIME, level = 1;
  var duration = CLASSIC_TIME;
  var ammo = SNIPER_AMMO, reloading = false;
  var tickTimer = null, spawnTimer = null, rafId = null, lastTs = 0;
  var targets = [];                  // живые мишени
  var slowUntil = 0;                 // заморозка времени (бонус)

  function loadBoard() {
    try { return JSON.parse(localStorage.getItem("tir_board") || "[]"); }
    catch (e) { return []; }
  }
  function saveBoard(b) { localStorage.setItem("tir_board", JSON.stringify(b)); }
  function bestOf(m) {
    var b = loadBoard(), best = 0;
    for (var i = 0; i < b.length; i++) if (b[i].mode === m && b[i].score > best) best = b[i].score;
    return best;
  }
  var best = bestOf("classic");
  bestEl.textContent = best;

  /* -------------------- Звуки -------------------- */
  var audioCtx = null;
  function getAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, to, dur, type, vol) {
    var ac = getAudio(); if (!ac) return;
    var t = ac.currentTime;
    var o = ac.createOscillator(); o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    var g = ac.createGain();
    g.gain.setValueAtTime(vol || 0.2, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur * 1.1);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur * 1.2);
  }
  function soundShot() {
    var ac = getAudio(); if (!ac) return;
    var dur = 0.08;
    var buf = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/d.length,3);
    var src = ac.createBufferSource(); src.buffer = buf;
    var flt = ac.createBiquadFilter(); flt.type = "lowpass";
    flt.frequency.value = mode === "sniper" ? 900 : 1800;
    var g = ac.createGain(); g.gain.value = 0.32;
    src.connect(flt); flt.connect(g); g.connect(ac.destination); src.start();
  }
  function soundHit()  { tone(880, 1500, 0.08, "triangle", 0.22); }
  function soundMiss() { tone(180, 90, 0.12, "sine", 0.16); }
  function soundGold() { tone(1200, 2000, 0.10, "square", 0.15); setTimeout(function(){ tone(1600,2400,.1,"square",.12); }, 90); }
  function soundBomb() { tone(220, 60, 0.35, "sawtooth", 0.28); }
  function soundFreeze(){ tone(1600, 600, 0.25, "sine", 0.18); }
  function soundLevel() { tone(600, 1200, 0.15, "triangle", 0.2); }
  function soundEmpty() { tone(120, 80, 0.08, "square", 0.15); }

  /* -------------------- Утилиты -------------------- */
  function rand(a, b) { return Math.random() * (b - a) + a; }
  function accuracy() { return shots === 0 ? 0 : Math.round((hits / shots) * 100); }
  function arenaW() { return arena.clientWidth; }
  function arenaH() { return arena.clientHeight; }

  function updateHUD() {
    scoreEl.textContent = score;
    timeEl.textContent = Math.max(0, Math.ceil(timeLeft));
    accEl.textContent = shots === 0 ? "—" : accuracy() + "%";
    lvlEl.textContent = level;
    comboEl.textContent = combo >= 2 ? "🔥 " + combo + " подряд" : "";
    timeBar.style.width = Math.max(0, (timeLeft / duration) * 100) + "%";
    if (mode === "sniper") {
      var s = "";
      for (var i = 0; i < SNIPER_AMMO; i++) s += i < ammo ? "●" : "○";
      ammoEl.textContent = reloading ? "перезарядка…" : s;
    }
  }

  function floatText(x, y, text, cls) {
    var el = document.createElement("div");
    el.className = "float " + (cls || "good");
    el.textContent = text;
    el.style.left = x + "px"; el.style.top = y + "px";
    arena.appendChild(el);
    setTimeout(function () { el.remove(); }, 760);
  }
  function flashAt(x, y) {
    var el = document.createElement("div");
    el.className = "flash";
    el.style.left = x + "px"; el.style.top = y + "px";
    arena.appendChild(el);
    setTimeout(function () { el.remove(); }, 320);
  }

  /* -------------------- Типы мишеней -------------------- */
  // Возвращает {cls, icon, pointsMult, kind}
  function chooseType(progress) {
    var r = Math.random();
    // Чем дальше, тем чаще спец-мишени
    var goldChance   = 0.10 + progress * 0.06;
    var bombChance   = 0.08 + progress * 0.10;
    var freezeChance = 0.06;
    var bonusChance  = 0.05;
    if (r < goldChance)   return { cls: "gold",   icon: "★", kind: "gold" };
    if (r < goldChance + bombChance) return { cls: "bomb", icon: "✖", kind: "bomb" };
    if (r < goldChance + bombChance + freezeChance) return { cls: "freeze", icon: "❄", kind: "freeze" };
    if (r < goldChance + bombChance + freezeChance + bonusChance) return { cls: "bonus", icon: "＋", kind: "bonus" };
    return { cls: "normal", icon: "", kind: "normal" };
  }

  /* -------------------- Создание мишени -------------------- */
  function spawnTarget() {
    if (!running) return;

    var prog = (duration - timeLeft) / duration;   // 0 → 1
    var lvlBonus = (level - 1);                    // усложнение по уровням

    var maxSize = Math.max(34, 94 - prog * 34 - lvlBonus * 4);
    var minSize = Math.max(24, 46 - prog * 14 - lvlBonus * 3);
    var size = rand(minSize, maxSize);

    var type = chooseType(prog);

    var pad = 6;
    var x = rand(pad, Math.max(pad, arenaW() - size - pad));
    var y = rand(pad, Math.max(pad, arenaH() - size - pad));

    // Скорость движения: растёт с прогрессом и уровнем
    var moving = Math.random() < (0.35 + prog * 0.45);
    var spd = (0.5 + prog * 1.2 + lvlBonus * 0.15) * rand(0.6, 1.3);
    if (mode === "sniper") spd *= 0.55;             // снайпер: мишени медленнее
    var ang = rand(0, Math.PI * 2);
    var vx = moving ? Math.cos(ang) * spd * 60 : 0;
    var vy = moving ? Math.sin(ang) * spd * 60 : 0;

    // Жизнь мишени
    var base = mode === "sniper" ? 2600 : 1700;
    var life = rand(0.6, 1) * base * (1 - prog * 0.4) * (1 - Math.min(lvlBonus, 6) * 0.05);
    if (type.kind === "bomb") life *= 1.3;          // бомбы живут дольше

    var el = document.createElement("div");
    el.className = "target " + type.cls;
    el.style.width = size + "px";
    el.style.height = size + "px";
    el.style.left = x + "px";
    el.style.top = y + "px";
    if (type.icon) el.innerHTML = '<span class="icon">' + type.icon + "</span>";

    var basePts = Math.round((120 - size) / 5) * 5;  // меньше мишень = больше очков
    var pointsMult = type.kind === "gold" ? 2.5 : (mode === "sniper" ? 1.8 : 1);

    var t = {
      el: el, x: x, y: y, size: size, vx: vx, vy: vy,
      kind: type.kind, basePts: basePts, mult: pointsMult,
      dieAt: performance.now() + life, dead: false
    };
    el.__target = t;

    el.addEventListener("pointerdown", function (e) {
      e.stopPropagation();
      if (!running || t.dead) return;
      hitTarget(t, e.clientX, e.clientY);
    });

    arena.appendChild(el);
    targets.push(t);

    // Следующая мишень
    var delay = Math.max(260, (mode === "sniper" ? 1100 : 900) - prog * 500 - lvlBonus * 20);
    delay *= rand(0.7, 1.35);
    spawnTimer = setTimeout(spawnTarget, delay);
  }

  /* -------------------- Попадание -------------------- */
  function hitTarget(t, clientX, clientY) {
    if (mode === "sniper" && (reloading || ammo <= 0)) return;
    var rect = arena.getBoundingClientRect();
    var px = clientX - rect.left, py = clientY - rect.top;
    t.dead = true;
    shots++;
    combo++;
    if (combo > maxCombo) maxCombo = combo;

    if (mode === "sniper") {
      ammo = Math.max(0, ammo - 1);
      if (ammo <= 0) startReload();
    }

    soundShot();
    flashAt(px, py);

    if (t.kind === "bomb") {
      // Бомба: штраф и сброс серии
      score = Math.max(0, score - 40);
      combo = 0;
      soundBomb();
      floatText(px, py, "-40", "bad");
      arena.classList.add("shake");
      setTimeout(function () { arena.classList.remove("shake"); }, 320);
      removeTarget(t, "hit");
    } else if (t.kind === "freeze") {
      hits++;
      slowUntil = performance.now() + 3000;   // 3 сек время идёт медленнее
      soundFreeze();
      floatText(px, py, "❄ Время замедлено!", "info");
      removeTarget(t, "hit");
    } else {
      hits++;
      var mult = Math.min(1 + (combo - 1) * 0.1, 3);
      var gained = Math.round(t.basePts * t.mult * mult);
      score += gained;
      if (t.kind === "gold") { soundGold(); floatText(px, py, "+" + gained + " ★ ЗОЛОТО", "gold"); }
      else if (t.kind === "bonus") { gained = Math.round(t.basePts * 3); score += gained; soundGold(); floatText(px, py, "+" + gained + " бонус", "info"); }
      else { soundHit(); floatText(px, py, "+" + gained + (combo >= 3 ? " x" + mult.toFixed(1) : ""), "good"); }
      removeTarget(t, "hit");
    }

    var newLevel = 1 + Math.floor(score / LEVEL_SCORE);
    if (newLevel > level) {
      level = newLevel;
      soundLevel();
      floatText(arenaW() / 2, arenaH() / 2, "Уровень " + level + "!", "gold");
    }
    updateHUD();
  }

  function removeTarget(t, cls) {
    t.dead = true;
    t.el.classList.add(cls || "hit");
    var el = t.el;
    setTimeout(function () { el.remove(); }, 320);
    var i = targets.indexOf(t); if (i >= 0) targets.splice(i, 1);
  }

  /* -------------------- Промах по полю -------------------- */
  arena.addEventListener("pointerdown", function (e) {
    if (!running) return;
    if (e.target.closest && e.target.closest(".target")) return;

    var rect = arena.getBoundingClientRect();
    var px = e.clientX - rect.left, py = e.clientY - rect.top;

    if (mode === "sniper") {
      if (reloading) return;
      if (ammo <= 0) { soundEmpty(); return; }
      ammo--; updateHUD();
      if (ammo <= 0) startReload();
    }
    shots++;
    combo = 0;
    soundShot(); soundMiss();
    flashAt(px, py);
    floatText(px, py, "мимо", "bad");
    updateHUD();
  });

  function startReload() {
    reloading = true; updateHUD();
    setTimeout(function () {
      reloading = false; ammo = SNIPER_AMMO; updateHUD();
    }, RELOAD_MS);
  }

  /* -------------------- Прицел -------------------- */
  arena.addEventListener("pointermove", function (e) {
    var rect = arena.getBoundingClientRect();
    crosshair.style.left = (e.clientX - rect.left) + "px";
    crosshair.style.top = (e.clientY - rect.top) + "px";
    crosshair.style.opacity = running ? "1" : "0";
  });
  arena.addEventListener("pointerleave", function () { crosshair.style.opacity = "0"; });

  /* -------------------- Движение мишеней (анимация) -------------------- */
  function loop(ts) {
    if (!running) return;
    var dt = lastTs ? Math.min((ts - lastTs) / 1000, 0.05) : 0;
    lastTs = ts;
    var now = ts;
    var w = arenaW(), h = arenaH();
    var frozen = now < slowUntil;

    for (var i = targets.length - 1; i >= 0; i--) {
      var t = targets[i];
      if (t.dead) continue;

      var f = frozen ? 0.25 : 1;    // при заморозке всё замедляется
      if (t.vx || t.vy) {
        t.x += t.vx * dt * f;
        t.y += t.vy * dt * f;
        var pad = 4;
        if (t.x < pad) { t.x = pad; t.vx = Math.abs(t.vx); }
        if (t.x > w - t.size - pad) { t.x = w - t.size - pad; t.vx = -Math.abs(t.vx); }
        if (t.y < pad) { t.y = pad; t.vy = Math.abs(t.vy); }
        if (t.y > h - t.size - pad) { t.y = h - t.size - pad; t.vy = -Math.abs(t.vy); }
        t.el.style.left = t.x + "px";
        t.el.style.top = t.y + "px";
      }

      if (now >= t.dieAt) {
        if (t.kind !== "bomb") combo = 0;   // упущенная мишень сбрасывает серию
        removeTarget(t, "expire");
        updateHUD();
      }
    }
    rafId = requestAnimationFrame(loop);
  }

  /* -------------------- Экран старта -------------------- */
  function showStart() {
    overlay.classList.remove("hidden");
    var b = loadBoard().slice(0, 5);
    var boardHtml = "";
    if (b.length) {
      boardHtml = '<h2>🏆 Рекорды</h2><div class="board">';
      for (var i = 0; i < b.length; i++) {
        var m = b[i].mode === "sniper" ? "Снайпер" : "Классика";
        boardHtml += '<div class="line"><span class="rank">' + (i + 1) + '</span>' +
                     '<span class="m">' + m + '</span>' +
                     '<span class="s">' + b[i].score + '</span></div>';
      }
      boardHtml += "</div>";
    }
    overlay.innerHTML =
      '<div class="card">' +
        '<h1>🎯 Тир PRO</h1>' +
        '<p>Выбери режим и стреляй по мишеням. Чем меньше мишень — тем больше очков!</p>' +
        '<div style="margin-top:16px">' +
          '<button data-mode="classic">Классика (60 сек)</button>' +
          '<button class="sniperBtn" data-mode="sniper">🔭 Снайпер (45 сек)</button>' +
        '</div>' +
        '<div class="legend">' +
          '<span><i style="background:radial-gradient(circle,#ff3b3b,#fff)"></i>обычная</span>' +
          '<span><i style="background:#ffcc33"></i>★ золото ×2.5</span>' +
          '<span><i style="background:#2ecc71"></i>＋ бонус</span>' +
          '<span><i style="background:#3fa9f5"></i>❄ замедление</span>' +
          '<span><i style="background:#111"></i>✖ бомба −40</span>' +
        '</div>' +
        boardHtml +
        '<p style="margin-top:16px;font-size:12px;opacity:.6">Движущиеся мишени • Уровни • Бонусы</p>' +
      '</div>';
  }

  /* -------------------- Экран конца игры -------------------- */
  function showGameOver() {
    var acc = accuracy();
    var board = loadBoard();
    board.push({ score: score, mode: mode, acc: acc, date: Date.now() });
    board.sort(function (a, c) { return c.score - a.score; });
    board = board.slice(0, 10);
    saveBoard(board);

    best = bestOf(mode);
    bestEl.textContent = best;
    var isRecord = board.length && board[0].score === score && board[0].mode === mode && board[0].acc === acc;

    var html = '<div class="board">';
    for (var i = 0; i < Math.min(board.length, 5); i++) {
      var m = board[i].mode === "sniper" ? "Снайпер" : "Классика";
      var me = (board[i].score === score && board[i].mode === mode && board[i].acc === acc) ? " me" : "";
      html += '<div class="line' + me + '"><span class="rank">' + (i + 1) + '</span>' +
              '<span class="m">' + m + '</span><span class="s">' + board[i].score + '</span></div>';
    }
    html += "</div>";

    overlay.classList.remove("hidden");
    overlay.innerHTML =
      '<div class="card">' +
        '<h1>' + (isRecord ? "🏆 Новый рекорд!" : "Игра окончена") + '</h1>' +
        '<p style="opacity:.7;margin-top:-2px">' + (mode === "sniper" ? "🔭 Снайпер" : "Классика") + '</p>' +
        '<div class="big">' + score + '</div>' +
        '<div class="row">' +
          '<div class="col">Попаданий<b>' + hits + '</b></div>' +
          '<div class="col">Точность<b>' + acc + '%</b></div>' +
          '<div class="col">Уровень<b>' + level + '</b></div>' +
          '<div class="col">Макс. серия<b>' + maxCombo + '</b></div>' +
        '</div>' +
        '<h2>🏆 Рекорды</h2>' + html +
        '<div style="margin-top:16px">' +
          '<button data-action="again">Играть снова</button>' +
          '<button class="ghost" data-action="menu">В меню</button>' +
        '</div>' +
      '</div>';
  }

  /* -------------------- Старт / конец -------------------- */
  function clearTargets() {
    for (var i = 0; i < targets.length; i++) targets[i].el.remove();
    targets = [];
    var list = arena.querySelectorAll(".target, .float, .flash");
    for (var j = 0; j < list.length; j++) list[j].remove();
  }

  function startGame(m) {
    mode = m || mode;
    getAudio();
    clearTimeout(spawnTimer);
    clearInterval(tickTimer);
    cancelAnimationFrame(rafId);
    clearTargets();

    running = true;
    score = 0; shots = 0; hits = 0; combo = 0; maxCombo = 0;
    level = 1; slowUntil = 0;
    duration = mode === "sniper" ? SNIPER_TIME : CLASSIC_TIME;
    timeLeft = duration;
    ammo = SNIPER_AMMO; reloading = false;

    arena.classList.toggle("sniper", mode === "sniper");
    crosshair.classList.toggle("sniper", mode === "sniper");
    ammoItem.style.display = mode === "sniper" ? "" : "none";
    lvlItem.style.display = "";

    overlay.classList.add("hidden");
    updateHUD();
    lastTs = 0;
    rafId = requestAnimationFrame(loop);

    tickTimer = setInterval(function () {
      var frozen = performance.now() < slowUntil;
      timeLeft -= frozen ? 0.03 : 0.1;      // при заморозке время почти стоит
      if (timeLeft <= 0) { timeLeft = 0; updateHUD(); endGame(); return; }
      updateHUD();
    }, 100);

    spawnTarget();
  }

  function endGame() {
    running = false;
    clearTimeout(spawnTimer);
    clearInterval(tickTimer);
    cancelAnimationFrame(rafId);
    crosshair.style.opacity = "0";
    showGameOver();
  }

  /* -------------------- Кнопки -------------------- */
  overlay.addEventListener("click", function (e) {
    var btn = e.target.closest && e.target.closest("button");
    if (!btn) return;
    if (btn.dataset.mode) startGame(btn.dataset.mode);
    else if (btn.dataset.action === "again") startGame(mode);
    else if (btn.dataset.action === "menu") { showStart(); }
  });

  /* Быстрый старт пробелом/Enter */
  document.addEventListener("keydown", function (e) {
    if (!running && (e.key === " " || e.key === "Enter")) {
      e.preventDefault();
      startGame(mode);
    }
  });

  /* Пересчёт при изменении размера */
  window.addEventListener("resize", function () {
    for (var i = 0; i < targets.length; i++) {
      var t = targets[i];
      if (t.x + t.size > arenaW()) { t.x = Math.max(4, arenaW() - t.size - 4); t.el.style.left = t.x + "px"; }
      if (t.y + t.size > arenaH()) { t.y = Math.max(4, arenaH() - t.size - 4); t.el.style.top = t.y + "px"; }
    }
  });

  showStart();
})();
</script>
</body>
</html>
