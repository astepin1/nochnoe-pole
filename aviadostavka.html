<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Авиадоставка ✈️📦</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0a0e1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff; -webkit-user-select: none; user-select: none;
  }
  #game { display: flex; flex-direction: column; height: 100%; }

  /* ===== HUD ===== */
  #hud {
    display: flex; align-items: center; gap: 16px; padding: 8px 16px;
    font-size: 14px; z-index: 6; flex-wrap: wrap;
    background: linear-gradient(180deg, rgba(24,32,52,.95), rgba(14,20,36,.85));
    border-bottom: 1px solid rgba(120,180,255,.2);
  }
  #hud .item { white-space: nowrap; }
  #hud .label { opacity: .6; margin-right: 5px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  #hud .val { font-weight: 800; font-variant-numeric: tabular-nums; }
  #delivered { color: #8dffb4; }
  #hud .spacer { flex: 1; }

  /* Топливо */
  #fuelWrap { display: flex; align-items: center; gap: 8px; }
  #fuelBar { width: 130px; height: 14px; border-radius: 8px; background: rgba(255,255,255,.15);
    overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,.4); }
  #fuelFill { height: 100%; width: 100%; border-radius: 8px;
    background: linear-gradient(90deg,#ff9a3c,#ffd76e); transition: width .15s linear; }
  #fuelFill.low { background: linear-gradient(90deg,#ff5a5a,#ff9a3c); animation: pulse .6s infinite alternate; }
  @keyframes pulse { from { opacity: .5; } to { opacity: 1; } }

  /* ===== Сцена ===== */
  #arena { position: relative; flex: 1; overflow: hidden; background: #9fd4ff; touch-action: none; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* Подсказка сверху */
  #task {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    z-index: 7; font-size: 14px; font-weight: 700; padding: 8px 18px; border-radius: 999px;
    background: rgba(10,16,30,.72); backdrop-filter: blur(4px);
    box-shadow: 0 4px 16px rgba(0,0,0,.35); pointer-events: none; white-space: nowrap;
    border: 1px solid rgba(140,200,255,.35);
  }
  #task .hl { color: #ffd76e; }

  /* Стрелка-указатель */
  #arrow { position: absolute; z-index: 6; font-size: 34px; pointer-events: none;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.5)); transition: opacity .2s; }

  /* Красная вспышка урона */
  #dmg { position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(circle, transparent 40%, rgba(255,40,40,.55)); opacity: 0; }
  #dmg.on { animation: dmgf .4s; }
  @keyframes dmgf { 0% { opacity: 1; } 100% { opacity: 0; } }

  /* ===== Оверлей ===== */
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(8,14,28,.88); backdrop-filter: blur(6px); z-index: 30;
    text-align: center; padding: 20px; overflow: auto; }
  #overlay.hidden { display: none; }
  #overlay .card { max-width: 540px; width: 100%; padding: 32px 30px; border-radius: 22px;
    background: linear-gradient(180deg, rgba(30,42,72,.96), rgba(18,26,46,.98));
    border: 2px solid rgba(120,180,255,.32);
    box-shadow: 0 24px 70px rgba(0,0,0,.7), 0 0 90px rgba(80,140,255,.12) inset; }
  #overlay h1 { margin: 0 0 8px; font-size: 33px; letter-spacing: .01em;
    background: linear-gradient(90deg,#8fe0ff,#8dffb4,#ffd76e);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  #overlay p { margin: 10px 0; line-height: 1.6; font-size: 15px; opacity: .92; }
  #overlay .keys { display: flex; flex-direction: column; gap: 8px; margin: 16px auto 0; max-width: 400px; }
  #overlay .keys div { display: flex; align-items: center; gap: 12px; font-size: 14px; }
  #overlay .key { display: inline-block; min-width: 38px; text-align: center; padding: 5px 10px;
    border-radius: 8px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
    font-weight: 800; font-size: 12px; }
  #overlay button { margin-top: 22px; padding: 15px 40px; font-size: 18px; font-weight: 800;
    color: #08203a; background: linear-gradient(180deg,#8fe0ff,#4aa8e8);
    border: none; border-radius: 14px; cursor: pointer; letter-spacing: .03em;
    box-shadow: 0 8px 26px rgba(80,180,255,.4); transition: transform .1s, box-shadow .15s;
    font-family: inherit; }
  #overlay button:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(80,180,255,.55); }
  #overlay button:active { transform: translateY(1px) scale(.98); }
  #overlay .big { font-size: 46px; font-weight: 800; color: #8dffb4; margin: 6px 0; }
  #overlay .row { display: flex; justify-content: center; gap: 28px; margin-top: 14px; flex-wrap: wrap; }
  #overlay .row .col { opacity: .9; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  #overlay .row .col b { display: block; font-size: 24px; margin-top: 4px; color: #fff; letter-spacing: 0; }
  #overlay .legend { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap;
    margin-top: 16px; font-size: 13px; opacity: .9; }
  #overlay .legend span { display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.08); padding: 6px 12px; border-radius: 999px; }

  /* ===== Мобильное управление ===== */
  #mobile { position: absolute; inset: 0; z-index: 14; pointer-events: none; display: none; }
  #mobile.on { display: block; }
  #joy { position: absolute; left: 20px; bottom: 24px; width: 140px; height: 140px;
    border-radius: 50%; pointer-events: auto;
    background: radial-gradient(circle, rgba(255,255,255,.16), rgba(255,255,255,.05));
    border: 2px solid rgba(255,255,255,.35); touch-action: none; }
  #joyKnob { position: absolute; left: 50%; top: 50%; width: 62px; height: 62px;
    margin: -31px 0 0 -31px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #ffe6c7, #e8a86a);
    box-shadow: 0 4px 12px rgba(0,0,0,.4); }
  .mbtn { position: absolute; pointer-events: auto; width: 92px; height: 92px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 38px;
    background: rgba(255,255,255,.18); border: 2px solid rgba(255,255,255,.4);
    color: #fff; backdrop-filter: blur(3px); touch-action: none;
    box-shadow: 0 4px 12px rgba(0,0,0,.35); user-select: none; }
  .mbtn:active, .mbtn.press { background: rgba(120,220,255,.6); transform: scale(.94); }
  #btnDrop { right: 24px; bottom: 34px; }
</style>
</head>
<body>
  <div id="game">
    <div id="hud">
      <div class="item"><span class="label">Доставлено</span><span class="val" id="delivered">0</span></div>
      <div class="item"><span class="label">Посылка</span><span class="val" id="cargo">—</span></div>
      <div class="item" id="fuelWrap"><span class="label">Топливо</span>
        <span id="fuelBar"><span id="fuelFill"></span></span></div>
      <div class="spacer"></div>
      <div class="item"><span class="label">Очки</span><span class="val" id="score">0</span></div>
      <div class="item"><span class="label">Рекорд</span><span class="val" id="best">0</span></div>
    </div>

    <div id="arena">
      <canvas id="view"></canvas>
      <div id="task">Забери посылку со склада 🏭</div>
      <div id="arrow">➡️</div>
      <div id="dmg"></div>
      <div id="mobile">
        <div id="joy"><div id="joyKnob"></div></div>
        <div class="mbtn" id="btnDrop">📦</div>
      </div>
      <div id="overlay"></div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  /* ===================== НАСТРОЙКИ ===================== */
  var GRAVITY     = 240;     // самолётик слегка падает
  var THRUST      = 620;     // тяга вверх
  var MOVE_ACCEL  = 900;
  var MAX_SPEED_X = 460;
  var MAX_SPEED_Y = 520;
  var DRAG        = 1.6;
  var FUEL_MAX    = 100;
  var FUEL_USE    = 3.2;     // расход в секунду
  var FUEL_IDLE   = 1.1;     // расход даже без газа
  var WORLD_W     = 4200;    // ширина мира
  var WORLD_H     = 1500;    // высота мира
  /* ==================================================== */

  var arena   = document.getElementById("arena");
  var canvas  = document.getElementById("view");
  var ctx     = canvas.getContext("2d");
  var overlay = document.getElementById("overlay");
  var deliveredEl = document.getElementById("delivered");
  var cargoEl = document.getElementById("cargo");
  var scoreEl = document.getElementById("score");
  var bestEl  = document.getElementById("best");
  var fuelFill = document.getElementById("fuelFill");
  var taskEl = document.getElementById("task");
  var arrowEl = document.getElementById("arrow");
  var dmgEl = document.getElementById("dmg");
  var mobileEl = document.getElementById("mobile");

  var W = 1, H = 1, DPR = 1;
  function resize() {
    var r = arena.getBoundingClientRect();
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  var isMobile = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
  if (isMobile) mobileEl.classList.add("on");

  /* ---------------------- Состояние ---------------------- */
  var running = false, paused = false;
  var plane = null;
  var camX = 0, camY = 0;
  var keys = {};
  var obstacles = [];        // птицы, облака-препятствия, воздушные шары
  var houses = [];           // дома для доставки
  var depots = [];           // склады, где брать посылку
  var rings = [];            // кольца-бонусы
  var particles = [];
  var clouds = [];
  var mountains = [];

  var delivered = 0, score = 0, carrying = false;
  var curTarget = null;
  var fuel = FUEL_MAX;
  var timeNow = 0, lastTs = 0, rafId = null;
  var shakeT = 0, shakeMag = 0;
  var wind = 0;

  function loadBest() {
    try { return parseInt(localStorage.getItem("airdeliver_best") || "0", 10) || 0; }
    catch (e) { return 0; }
  }
  var best = loadBest();
  bestEl.textContent = best;

  /* ---------------------- Звук ---------------------- */
  var audioCtx = null, engine = null;
  function getAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, to, dur, type, vol, delay) {
    var ac = getAudio(); if (!ac) return;
    var t = ac.currentTime + (delay || 0);
    var o = ac.createOscillator(); o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(Math.max(1, to), t + dur);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.06);
  }
  function noise(dur, cutoff, vol) {
    var ac = getAudio(); if (!ac) return;
    var buf = ac.createBuffer(1, Math.max(1, Math.floor(ac.sampleRate * dur)), ac.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, 1.5);
    var src = ac.createBufferSource(); src.buffer = buf;
    var f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cutoff || 900;
    var g = ac.createGain(); g.gain.value = vol || 0.12;
    src.connect(f); f.connect(g); g.connect(ac.destination); src.start();
  }
  function sndPickup() { tone(600, 1000, 0.1, "triangle", 0.16); tone(900, 1300, 0.1, "triangle", 0.13, 0.08); }
  function sndDrop()   { tone(700, 1200, 0.12, "sine", 0.16); tone(1100, 1600, 0.12, "sine", 0.13, 0.09); }
  function sndDeliver(){ [700,900,1200].forEach(function (f,i){ tone(f, f*1.3, 0.14, "triangle", 0.16, i*0.1); }); }
  function sndHit()    { noise(0.3, 800, 0.28); tone(180, 70, 0.3, "sawtooth", 0.2); }
  function sndRing()   { tone(1200, 1800, 0.1, "square", 0.12); }
  function sndEmpty()  { tone(160, 100, 0.12, "square", 0.12); }

  function startEngine() {
    var ac = getAudio(); if (!ac || engine) return;
    var o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = 90;
    var f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 500;
    var g = ac.createGain(); g.gain.value = 0.0;
    g.gain.linearRampToValueAtTime(0.045, ac.currentTime + 0.5);
    // вибрация двигателя
    var lfo = ac.createOscillator(); lfo.frequency.value = 28;
    var lg = ac.createGain(); lg.gain.value = 0.02;
    lfo.connect(lg); lg.connect(g.gain);
    o.connect(f); f.connect(g); g.connect(ac.destination);
    o.start(); lfo.start();
    engine = { o: o, lfo: lfo, g: g, f: f };
  }
  function stopEngine() {
    if (!engine) return;
    var ac = getAudio();
    try {
      engine.g.gain.cancelScheduledValues(ac.currentTime);
      engine.g.gain.linearRampToValueAtTime(0, ac.currentTime + 0.3);
      engine.o.stop(ac.currentTime + 0.4); engine.lfo.stop(ac.currentTime + 0.4);
    } catch (e) {}
    engine = null;
  }
  function revEngine(thrust) {
    if (!engine) return;
    var ac = getAudio();
    engine.o.frequency.setTargetAtTime(80 + thrust * 90, ac.currentTime, 0.1);
    engine.f.frequency.setTargetAtTime(400 + thrust * 900, ac.currentTime, 0.1);
  }

  /* ---------------------- Утилиты ---------------------- */
  function rand(a, b) { return Math.random() * (b - a) + a; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }

  /* ---------------------- Мир ---------------------- */
  function buildWorld() {
    houses = [];
    depots = [];
    obstacles = [];
    rings = [];

    // Склады (3 штуки)
    var depotX = [600, 1800, 3100];
    depotX.forEach(function (x) {
      depots.push({ x: x, y: WORLD_H - 120, w: 170, h: 120 });
    });

    // Дома (много, разной высоты, по всей карте)
    var hx = 380;
    while (hx < WORLD_W - 200) {
      hx += rand(240, 420);
      var h = rand(90, 200);
      houses.push({
        x: hx, y: WORLD_H - h - 40, w: rand(90, 130), h: h,
        roofCol: ["#c0392b", "#8e6b3a", "#4a6fa5", "#7a4a8f", "#3f8a5c"][Math.floor(Math.random()*5)],
        got: false, window: Math.random()
      });
    }

    // Кольца-бонусы (в воздухе)
    for (var i = 0; i < 9; i++) {
      rings.push({ x: 500 + i * 380 + rand(-60, 60), y: rand(200, WORLD_H - 400), w: 46, h: 46, got: false, t: Math.random()*6.28 });
    }

    // Птицы и шары (препятствия)
    for (var b = 0; b < 14; b++) {
      obstacles.push(makeBird());
    }
    for (var bl = 0; bl < 6; bl++) {
      obstacles.push({
        t: "balloon", x: rand(300, WORLD_W-300), y: rand(150, WORLD_H - 350),
        r: rand(22, 34), vy: rand(-25, 25), vx: rand(-15, 15), wob: Math.random()*6.28
      });
    }
    // Облака-препятствия (можно влететь)
    for (var c = 0; c < 10; c++) {
      obstacles.push({
        t: "storm", x: rand(300, WORLD_W-300), y: rand(120, WORLD_H - 400),
        r: rand(60, 100), vx: rand(-30, 30)
      });
    }

    // Декоративные облака
    clouds = [];
    for (var cc = 0; cc < 30; cc++) {
      clouds.push({ x: rand(0, WORLD_W), y: rand(80, WORLD_H - 200), s: rand(60, 150), p: rand(0.2, 0.5), spd: rand(5, 18) });
    }
    // Горы на фоне
    mountains = [];
    for (var m = 0; m < 40; m++) {
      mountains.push({ x: m * 320 + rand(-80, 80), h: rand(260, 520), w: rand(360, 560) });
    }
  }

  function makeBird() {
    return {
      t: "bird", x: rand(300, WORLD_W-300), y: rand(150, WORLD_H - 300),
      vx: rand(-60, -20) * (Math.random() < 0.5 ? 1 : -1), vy: rand(-10, 10),
      r: 18, flap: Math.random() * 6.28
    };
  }

  /* ---------------------- Самолётик ---------------------- */
  function resetPlane() {
    plane = {
      x: 300, y: WORLD_H - 500, vx: 0, vy: 0,
      angle: 0, w: 54, h: 26, alive: true, thrust: 0
    };
    fuel = FUEL_MAX;
    carrying = false;
    camX = plane.x - W / 2; camY = plane.y - H / 2;
  }

  // Ближайшая невыполненная цель
  function nextTarget() {
    if (!carrying) {
      // летим на ближайший склад
      var bestD = null, bd = Infinity;
      for (var i = 0; i < depots.length; i++) {
        var d = dist(plane.x, plane.y, depots[i].x + depots[i].w/2, depots[i].y);
        if (d < bd) { bd = d; bestD = depots[i]; }
      }
      return bestD;
    } else {
      // летим на ближайший невыполненный дом
      var bestH = null, bhd = Infinity;
      for (var j = 0; j < houses.length; j++) {
        if (houses[j].got) continue;
        var dh = dist(plane.x, plane.y, houses[j].x + houses[j].w/2, houses[j].y);
        if (dh < bhd) { bhd = dh; bestH = houses[j]; }
      }
      return bestH;
    }
  }

  /* ---------------------- Ввод ---------------------- */
  window.addEventListener("keydown", function (e) {
    var k = e.key.toLowerCase();
    if (k === "arrowup" || k === "w" || k === "ц") keys.up = true;
    if (k === "arrowdown" || k === "s" || k === "ы") keys.down = true;
    if (k === "arrowleft" || k === "a" || k === "ф") keys.left = true;
    if (k === "arrowright" || k === "d" || k === "в") keys.right = true;
    if (k === " ") { e.preventDefault(); tryDrop(); }
    if (!running && (e.key === " " || e.key === "Enter")) { e.preventDefault(); startGame(); }
  });
  window.addEventListener("keyup", function (e) {
    var k = e.key.toLowerCase();
    if (k === "arrowup" || k === "w" || k === "ц") keys.up = false;
    if (k === "arrowdown" || k === "s" || k === "ы") keys.down = false;
    if (k === "arrowleft" || k === "a" || k === "ф") keys.left = false;
    if (k === "arrowright" || k === "d" || k === "в") keys.right = false;
  });

  /* ---------------------- Мобильное управление ---------------------- */
  var joyEl = document.getElementById("joy");
  var joyKnob = document.getElementById("joyKnob");
  var joyActive = false, joyId = null, joyCX = 0, joyCY = 0, joyDX = 0, joyDY = 0;
  joyEl.addEventListener("touchstart", function (e) {
    e.preventDefault();
    var t = e.changedTouches[0];
    joyActive = true; joyId = t.identifier;
    var r = joyEl.getBoundingClientRect();
    joyCX = r.left + r.width / 2; joyCY = r.top + r.height / 2;
    updateJoy(t.clientX, t.clientY);
  }, { passive: false });
  function updateJoy(x, y) {
    var dx = x - joyCX, dy = y - joyCY, max = 56, len = Math.hypot(dx, dy);
    if (len > max) { dx = dx / len * max; dy = dy / len * max; }
    joyKnob.style.transform = "translate(" + dx + "px," + dy + "px)";
    joyDX = dx / max; joyDY = dy / max;
  }
  window.addEventListener("touchmove", function (e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier === joyId) { e.preventDefault(); updateJoy(t.clientX, t.clientY); return; }
    }
  }, { passive: false });
  window.addEventListener("touchend", function (e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joyId) {
        joyActive = false; joyId = null; joyDX = 0; joyDY = 0;
        joyKnob.style.transform = "translate(0,0)";
      }
    }
  });
  var dropBtn = document.getElementById("btnDrop");
  dropBtn.addEventListener("touchstart", function (e) { e.preventDefault(); dropBtn.classList.add("press"); tryDrop(); }, { passive: false });
  dropBtn.addEventListener("touchend", function (e) { e.preventDefault(); dropBtn.classList.remove("press"); }, { passive: false });
  dropBtn.addEventListener("mousedown", function (e) { if (isMobile) return; e.preventDefault(); tryDrop(); });

  /* ---------------------- Действия ---------------------- */
  function tryDrop() {
    if (!running || paused) return;
    if (!carrying) {
      var p = nextTarget();
      if (p) {
        var d = dist(plane.x, plane.y, p.x + p.w/2, p.y);
        if (d < 130) { pickup(); }
        else { flashTask("Сначала подлети к складу 🏭"); sndEmpty(); }
      }
      return;
    }
    // есть посылка — сбросить над домом
    var p2 = nextTarget();
    if (p2) {
      var near = dist(plane.x, plane.y, p2.x + p2.w/2, p2.y - 20);
      if (near < 120) { dropAt(p2); }
      else { flashTask("Подлети ближе к дому 🏠"); sndEmpty(); }
    }
  }

  function pickup() {
    carrying = true;
    sndPickup();
    burst(plane.x, plane.y, "#ffd76e", 12);
    flashTask("Посылка взята! Доставь её в дом 🏠");
    updateHUD();
  }

  function dropAt(house) {
    // посылка падает на дом
    carrying = false;
    house.got = true;
    delivered++;
    score += 100;
    sndDeliver();
    burst(house.x + house.w/2, house.y - 10, "#8dffb4", 18);
    // бонус за точность времени? просто очки
    flashTask("Доставлено! +100 ✨");
    // пополним немного топлива за доставку
    fuel = Math.min(FUEL_MAX, fuel + 18);
    if (delivered % 3 === 0) { score += 50; flashTask("Бонус серии! +150 ✨"); }
    updateHUD();
    if (houses.every(function (h) { return h.got; })) { winGame(); }
  }

  var taskFlashT = 0;
  function flashTask(txt) { taskEl.innerHTML = txt; taskFlashT = 2.2; }
  function updateTask() {
    var p = nextTarget();
    if (taskFlashT > 0) return;
    if (!p) { taskEl.innerHTML = "Все посылки доставлены! 🎉"; return; }
    var d = Math.round(dist(plane.x, plane.y, p.x + p.w/2, p.y) / 10);
    if (!carrying) {
      taskEl.innerHTML = "🏭 Лети на склад · <span class='hl'>" + d + " м</span>";
    } else {
      taskEl.innerHTML = "🏠 Доставь в дом · <span class='hl'>" + d + " м</span>";
    }
  }

  /* ---------------------- Эффекты ---------------------- */
  function burst(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      particles.push({
        x: x, y: y, vx: rand(-160, 160), vy: rand(-160, 160),
        life: rand(0.4, 0.9), max: 0.9, color: color, r: rand(2, 6)
      });
    }
  }
  function triggerShake(t, m) { shakeT = t; shakeMag = m; }

  /* ---------------------- Обновление ---------------------- */
  function update(dt) {
    timeNow += dt;
    var p = plane;

    // ветер
    wind += Math.sin(timeNow * 0.3) * dt * 20;
    wind = clamp(wind, -40, 40);

    // ==== управление ====
    var thrust = 0;
    if (keys.up || joyDY < -0.2) thrust = 1;
    if (keys.down || joyDY > 0.2) thrust = -0.4;
    p.thrust = thrust;
    revEngine(Math.abs(thrust));

    var accX = 0;
    if (keys.right || joyDX > 0.2) accX += 1;
    if (keys.left || joyDX < -0.2) accX -= 1;

    // физика
    p.vy += GRAVITY * dt;
    p.vy -= thrust * THRUST * dt;
    p.vx += accX * MOVE_ACCEL * dt;
    p.vx += wind * dt;

    // сопротивление
    p.vx -= p.vx * DRAG * dt * 0.5;
    p.vy -= p.vy * DRAG * dt * 0.3;

    p.vx = clamp(p.vx, -MAX_SPEED_X, MAX_SPEED_X);
    p.vy = clamp(p.vy, -MAX_SPEED_Y, MAX_SPEED_Y);

    p.x += p.vx * dt;
    p.y += p.vy * dt;

    // границы мира
    if (p.x < 20) { p.x = 20; p.vx = Math.abs(p.vx) * 0.3; }
    if (p.x > WORLD_W - 20) { p.x = WORLD_W - 20; p.vx = -Math.abs(p.vx) * 0.3; }
    if (p.y < 30) { p.y = 30; p.vy = Math.abs(p.vy) * 0.3; }
    if (p.y > WORLD_H - 20) { p.y = WORLD_H - 20; p.vy = -Math.abs(p.vy) * 0.4; }

    // наклон самолётика
    var targetAngle = clamp(p.vy / 400, -0.5, 0.5) + clamp(p.vx / 900, -0.3, 0.3);
    p.angle += (targetAngle - p.angle) * Math.min(1, dt * 6);

    // топливо
    fuel -= (FUEL_IDLE + Math.abs(thrust) * FUEL_USE) * dt;
    if (fuel <= 0) { fuel = 0; endGame("Кончилось топливо! ⛽"); return; }

    // ==== камера (следим за самолётом, немного впереди) ====
    var tx = p.x + p.vx * 0.25 - W / 2;
    var ty = p.y + p.vy * 0.15 - H / 2;
    camX += (tx - camX) * Math.min(1, dt * 5);
    camY += (ty - camY) * Math.min(1, dt * 5);
    camX = clamp(camX, -100, WORLD_W - W + 100);
    camY = clamp(camY, -100, WORLD_H - H + 100);

    // ==== препятствия ====
    for (var i = obstacles.length - 1; i >= 0; i--) {
      var o = obstacles[i];
      if (o.t === "bird") {
        o.x += o.vx * dt; o.y += o.vy * dt; o.flap += dt * 12;
        if (o.x < 100 || o.x > WORLD_W - 100) o.vx *= -1;
      } else if (o.t === "balloon" || o.t === "storm") {
        o.x += (o.vx || 0) * dt;
        o.y += (o.vy || 0) * dt;
        o.wob = (o.wob || 0) + dt;
        if (o.x < 100 || o.x > WORLD_W - 100) o.vx = -(o.vx || 0);
        if (o.t === "balloon" && (o.y < 150 || o.y > WORLD_H - 200)) o.vy = -(o.vy || 0);
      }
      // столкновение
      var od = dist(p.x, p.y, o.x, o.y);
      if (od < o.r + 22) {
        if (o.t === "storm") {
          // гроза — урон и тряска
          if (!o.hitT || timeNow - o.hitT > 1) {
            o.hitT = timeNow;
            fuel = Math.max(0, fuel - 12);
            score = Math.max(0, score - 20);
            sndHit(); triggerShake(0.4, 12);
            dmgEl.classList.remove("on"); void dmgEl.offsetWidth; dmgEl.classList.add("on");
            burst(p.x, p.y, "#aaccee", 14);
            updateHUD();
          }
        } else {
          if (!o.hitT || timeNow - o.hitT > 0.8) {
            o.hitT = timeNow;
            fuel = Math.max(0, fuel - 8);
            sndHit(); triggerShake(0.3, 9);
            dmgEl.classList.remove("on"); void dmgEl.offsetWidth; dmgEl.classList.add("on");
            burst(p.x, p.y, "#ff8a8a", 10);
            updateHUD();
          }
        }
      }
    }

    // ==== кольца ====
    for (var r = 0; r < rings.length; r++) {
      var rg = rings[r];
      rg.t += dt * 2;
      if (rg.got) continue;
      if (dist(p.x, p.y, rg.x, rg.y) < 46) {
        rg.got = true;
        score += 40; fuel = Math.min(FUEL_MAX, fuel + 6);
        sndRing(); burst(rg.x, rg.y, "#8fe0ff", 10);
        flashTask("Кольцо! +40 · топливо +6 ⛽");
        updateHUD();
      }
    }

    // ==== частицы ====
    for (var f = particles.length - 1; f >= 0; f--) {
      var pt = particles[f];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vy += 100 * dt;
      pt.vx *= 0.98;
      pt.life -= dt;
      if (pt.life <= 0) particles.splice(f, 1);
    }

    if (shakeT > 0) shakeT -= dt;
    if (taskFlashT > 0) taskFlashT -= dt;

    updateTask();
    updateArrow();
    updateHUD();
  }

  /* ---------------------- Отрисовка ---------------------- */
  function render() {
    var sx = 0, sy = 0;
    if (shakeT > 0) { sx = rand(-shakeMag, shakeMag); sy = rand(-shakeMag, shakeMag); }

    drawSky();
    drawMountains();

    ctx.save();
    ctx.translate(sx, sy);

    // параллакс-облака
    for (var i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      var cx = c.x - camX * c.p - wind * 10;
      var cy = c.y - camY * c.p;
      if (cx < -300 || cx > W + 300) continue;
      drawCloud(cx, cy, c.s);
    }

    // мир
    ctx.save();
    ctx.translate(-camX, -camY);
    drawDepots();
    drawHouses();
    drawRings();
    drawObstacles();
    drawParticles();
    drawPlane();
    ctx.restore();

    ctx.restore();
  }

  function drawSky() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#3d8fd8");
    g.addColorStop(0.45, "#7fc0f0");
    g.addColorStop(0.8, "#bfe4ff");
    g.addColorStop(1, "#e8f4ff");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // солнце
    var sunX = W * 0.8 - camX * 0.05;
    var sunY = H * 0.18 - camY * 0.05;
    var sg = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, 120);
    sg.addColorStop(0, "rgba(255,250,210,.95)");
    sg.addColorStop(0.3, "rgba(255,240,150,.4)");
    sg.addColorStop(1, "rgba(255,240,150,0)");
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(sunX, sunY, 120, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff8d0";
    ctx.beginPath(); ctx.arc(sunX, sunY, 44, 0, Math.PI * 2); ctx.fill();
  }

  function drawMountains() {
    ctx.fillStyle = "#6a8ab0";
    for (var i = 0; i < mountains.length; i++) {
      var m = mountains[i];
      var mx = m.x - camX * 0.25;
      var my = (WORLD_H - 40) - camY * 0.25;
      if (mx < -m.w || mx > W + m.w) continue;
      ctx.globalAlpha = 0.4;
      ctx.beginPath();
      ctx.moveTo(mx - m.w / 2, my);
      ctx.lineTo(mx, my - m.h);
      ctx.lineTo(mx + m.w / 2, my);
      ctx.closePath(); ctx.fill();
      // снежная вершина
      ctx.globalAlpha = 0.6;
      ctx.fillStyle = "#e8f0ff";
      ctx.beginPath();
      ctx.moveTo(mx - m.w * 0.12, my - m.h * 0.7);
      ctx.lineTo(mx, my - m.h);
      ctx.lineTo(mx + m.w * 0.12, my - m.h * 0.7);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#6a8ab0";
    }
    ctx.globalAlpha = 1;
  }

  function drawCloud(x, y, s) {
    ctx.fillStyle = "rgba(255,255,255,.8)";
    ctx.beginPath();
    ctx.ellipse(x, y, s, s * 0.5, 0, 0, Math.PI * 2);
    ctx.ellipse(x + s * 0.6, y + s * 0.1, s * 0.7, s * 0.4, 0, 0, Math.PI * 2);
    ctx.ellipse(x - s * 0.6, y + s * 0.1, s * 0.6, s * 0.35, 0, 0, Math.PI * 2);
    ctx.ellipse(x + s * 0.2, y - s * 0.4, s * 0.6, s * 0.45, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawDepots() {
    for (var i = 0; i < depots.length; i++) {
      var d = depots[i];
      // здание склада
      var g = ctx.createLinearGradient(0, d.y, 0, d.y + d.h);
      g.addColorStop(0, "#8a6a4a");
      g.addColorStop(1, "#5a4030");
      ctx.fillStyle = g;
      ctx.fillRect(d.x, d.y, d.w, d.h);
      // крыша-двускат
      ctx.fillStyle = "#4a3524";
      ctx.beginPath();
      ctx.moveTo(d.x - 8, d.y);
      ctx.lineTo(d.x + d.w / 2, d.y - 40);
      ctx.lineTo(d.x + d.w + 8, d.y);
      ctx.closePath(); ctx.fill();
      // ворота
      ctx.fillStyle = "#2a1f14";
      ctx.fillRect(d.x + d.w * 0.3, d.y + d.h * 0.4, d.w * 0.4, d.h * 0.6);
      // вывеска "СКЛАД"
      ctx.fillStyle = "#ffd76e";
      ctx.font = "800 16px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("СКЛАД", d.x + d.w / 2, d.y - 48);
      // стрелка вниз мигает, если это цель
      if (!carrying) {
        var isTarget = (nextTarget() === d);
        if (isTarget) {
          var bounce = Math.abs(Math.sin(timeNow * 4)) * 10;
          ctx.fillStyle = "#8dffb4";
          ctx.beginPath();
          ctx.moveTo(d.x + d.w/2, d.y - 70 - bounce);
          ctx.lineTo(d.x + d.w/2 - 12, d.y - 90 - bounce);
          ctx.lineTo(d.x + d.w/2 + 12, d.y - 90 - bounce);
          ctx.closePath(); ctx.fill();
        }
      }
    }
  }

  function drawHouses() {
    for (var i = 0; i < houses.length; i++) {
      var h = houses[i];
      if (h.x + h.w < camX - 100 || h.x > camX + W + 100) continue;
      // стены
      var g = ctx.createLinearGradient(0, h.y, 0, h.y + h.h);
      g.addColorStop(0, "#e8d8c0");
      g.addColorStop(1, "#c8b498");
      ctx.fillStyle = g;
      ctx.fillRect(h.x, h.y, h.w, h.h);
      // крыша
      ctx.fillStyle = h.got ? "#8dffb4" : h.roofCol;
      ctx.beginPath();
      ctx.moveTo(h.x - 10, h.y);
      ctx.lineTo(h.x + h.w / 2, h.y - h.w * 0.4);
      ctx.lineTo(h.x + h.w + 10, h.y);
      ctx.closePath(); ctx.fill();
      // окна
      ctx.fillStyle = h.got ? "rgba(140,255,180,.9)" : "rgba(255,220,140,.85)";
      for (var wy = 0; wy < 2; wy++) {
        for (var wx = 0; wx < 2; wx++) {
          if (((h.window * 100 + wx * 3 + wy * 7) % 3) < 1) continue;
          ctx.fillRect(h.x + h.w * (0.2 + wx * 0.4), h.y + h.h * (0.2 + wy * 0.4), h.w * 0.22, h.h * 0.2);
        }
      }
      // дверь
      ctx.fillStyle = "#6a4a30";
      ctx.fillRect(h.x + h.w * 0.42, h.y + h.h * 0.72, h.w * 0.16, h.h * 0.28);
      // галочка, если доставлено
      if (h.got) {
        ctx.fillStyle = "#2a8a4a";
        ctx.font = "800 30px -apple-system, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("✓", h.x + h.w / 2, h.y + h.h * 0.5);
      } else {
        // метка цели
        var isTarget = carrying && (nextTarget() === h);
        if (isTarget) {
          var bounce = Math.abs(Math.sin(timeNow * 4)) * 10;
          ctx.fillStyle = "#8dffb4";
          ctx.beginPath();
          ctx.moveTo(h.x + h.w/2, h.y - h.w*0.55 - bounce);
          ctx.lineTo(h.x + h.w/2 - 12, h.y - h.w*0.55 - 20 - bounce);
          ctx.lineTo(h.x + h.w/2 + 12, h.y - h.w*0.55 - 20 - bounce);
          ctx.closePath(); ctx.fill();
        }
      }
    }
  }

  function drawRings() {
    for (var i = 0; i < rings.length; i++) {
      var r = rings[i];
      if (r.got) continue;
      if (r.x < camX - 80 || r.x > camX + W + 80) continue;
      var bob = Math.sin(r.t) * 5;
      ctx.save();
      ctx.translate(r.x, r.y + bob);
      ctx.rotate(Math.sin(r.t * 0.5) * 0.15);
      // свечение
      var gg = ctx.createRadialGradient(0, 0, 4, 0, 0, 40);
      gg.addColorStop(0, "rgba(140,224,255,.5)");
      gg.addColorStop(1, "rgba(140,224,255,0)");
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI * 2); ctx.fill();
      // кольцо
      ctx.strokeStyle = "#8fe0ff";
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255,.8)";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  }

  function drawObstacles() {
    for (var i = 0; i < obstacles.length; i++) {
      var o = obstacles[i];
      if (o.x < camX - 200 || o.x > camX + W + 200) continue;
      if (o.t === "bird") {
        // птица
        ctx.save();
        ctx.translate(o.x, o.y);
        ctx.fillStyle = "#2a2a38";
        ctx.beginPath(); ctx.ellipse(0, 0, 12, 7, 0, 0, Math.PI * 2); ctx.fill();
        var wing = Math.sin(o.flap) * 10;
        ctx.beginPath();
        ctx.moveTo(-6, 0); ctx.lineTo(-18, -wing); ctx.lineTo(-4, -2); ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(6, 0); ctx.lineTo(18, -wing); ctx.lineTo(4, -2); ctx.closePath(); ctx.fill();
        // клюв
        ctx.fillStyle = "#ff9a3c";
        ctx.beginPath(); ctx.moveTo(11, 0); ctx.lineTo(18, -3); ctx.lineTo(18, 3); ctx.closePath(); ctx.fill();
        ctx.restore();
      } else if (o.t === "balloon") {
        var bob = Math.sin((o.wob || 0)) * 6;
        ctx.save();
        ctx.translate(o.x, o.y + bob);
        ctx.fillStyle = ["#e0575a","#e0a53c","#7a5ce0"][i % 3];
        ctx.beginPath(); ctx.ellipse(0, 0, o.r, o.r * 1.2, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,.5)";
        ctx.beginPath(); ctx.ellipse(-o.r*0.3, -o.r*0.4, o.r*0.2, o.r*0.3, 0, 0, Math.PI * 2); ctx.fill();
        // верёвка и корзина
        ctx.strokeStyle = "#5a4a3a"; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(-o.r*0.4, o.r*1.1); ctx.lineTo(-6, o.r*1.6); ctx.moveTo(o.r*0.4, o.r*1.1); ctx.lineTo(6, o.r*1.6); ctx.stroke();
        ctx.fillStyle = "#8a6a4a"; ctx.fillRect(-9, o.r*1.6, 18, 12);
        ctx.restore();
      } else if (o.t === "storm") {
        // тёмное грозовое облако
        ctx.save();
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = "#50506a";
        ctx.beginPath();
        ctx.ellipse(o.x, o.y, o.r, o.r * 0.6, 0, 0, Math.PI * 2);
        ctx.ellipse(o.x + o.r*0.5, o.y + o.r*0.1, o.r*0.7, o.r*0.45, 0, 0, Math.PI * 2);
        ctx.ellipse(o.x - o.r*0.5, o.y + o.r*0.1, o.r*0.7, o.r*0.45, 0, 0, Math.PI * 2);
        ctx.fill();
        // молния
        if (Math.sin(timeNow * 5 + i) > 0.85) {
          ctx.globalAlpha = 0.9;
          ctx.strokeStyle = "#ffe066"; ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(o.x, o.y + o.r*0.3);
          ctx.lineTo(o.x - 8, o.y + o.r*0.8);
          ctx.lineTo(o.x + 4, o.y + o.r*1.1);
          ctx.lineTo(o.x - 6, o.y + o.r*1.6);
          ctx.stroke();
        }
        ctx.restore();
      }
    }
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawPlane() {
    var p = plane;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    var face = p.vx < -20 ? -1 : 1;
    ctx.scale(face, 1);

    // тень/дым позади при тяге
    if (p.thrust > 0) {
      ctx.fillStyle = "rgba(255,200,120,.4)";
      for (var e = 0; e < 3; e++) {
        var rr = 6 - e * 1.5;
        ctx.beginPath(); ctx.arc(-30 - e * 10, 3, rr, 0, Math.PI * 2); ctx.fill();
      }
    }

    // корпус самолёта
    var g = ctx.createLinearGradient(0, -14, 0, 14);
    g.addColorStop(0, "#ffffff");
    g.addColorStop(0.5, "#e8eef5");
    g.addColorStop(1, "#c0ccd8");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(34, 0);
    ctx.quadraticCurveTo(20, -12, -4, -12);
    ctx.lineTo(-30, -8);
    ctx.quadraticCurveTo(-34, 0, -30, 8);
    ctx.lineTo(-4, 12);
    ctx.quadraticCurveTo(20, 12, 34, 0);
    ctx.closePath(); ctx.fill();

    // хвост
    ctx.fillStyle = "#d13b2a";
    ctx.beginPath();
    ctx.moveTo(-30, -8); ctx.lineTo(-42, -24); ctx.lineTo(-26, -6); ctx.closePath(); ctx.fill();
    // киль снизу
    ctx.beginPath();
    ctx.moveTo(-30, 8); ctx.lineTo(-40, 20); ctx.lineTo(-24, 6); ctx.closePath(); ctx.fill();

    // крылья
    ctx.fillStyle = "#d13b2a";
    ctx.beginPath();
    ctx.moveTo(2, 0); ctx.lineTo(-16, 22); ctx.lineTo(-2, 4); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(2, 0); ctx.lineTo(-14, -22); ctx.lineTo(-2, -2); ctx.closePath(); ctx.fill();

    // кабина
    ctx.fillStyle = "#5fa8e0";
    ctx.beginPath(); ctx.ellipse(16, -3, 9, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.6)";
    ctx.beginPath(); ctx.ellipse(14, -5, 4, 3, 0, 0, Math.PI * 2); ctx.fill();

    // пропеллер
    ctx.save();
    ctx.translate(34, 0);
    ctx.fillStyle = "#3a4048";
    var pblade = Math.sin(timeNow * 40) * 14;
    ctx.fillRect(-2, pblade - 3, 4, 20);
    ctx.fillRect(-2, -pblade - 17, 4, 20);
    ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // посылка на борту
    if (carrying) {
      ctx.fillStyle = "#c98a4a";
      ctx.fillRect(-14, -30, 24, 18);
      ctx.strokeStyle = "#8a5a2a"; ctx.lineWidth = 2;
      ctx.strokeRect(-14, -30, 24, 18);
      ctx.beginPath();
      ctx.moveTo(-2, -30); ctx.lineTo(-2, -12);
      ctx.moveTo(-14, -21); ctx.lineTo(10, -21);
      ctx.stroke();
    }

    ctx.restore();
  }

  /* ---------------------- Стрелка-указатель ---------------------- */
  function updateArrow() {
    var p = nextTarget();
    if (!p || !running) { arrowEl.style.opacity = "0"; return; }
    var tx = p.x + p.w / 2, ty = p.y - 30;
    var screenX = tx - camX, screenY = ty - camY;
    var ang = Math.atan2(screenY - H / 2, screenX - W / 2);
    var radius = Math.min(W, H) * 0.36;
    var ax = W / 2 + Math.cos(ang) * radius;
    var ay = H / 2 + Math.sin(ang) * radius;
    // если цель на экране — не показываем стрелку
    var onScreen = screenX > 60 && screenX < W - 60 && screenY > 60 && screenY < H - 60;
    if (onScreen) { arrowEl.style.opacity = "0"; return; }
    arrowEl.style.opacity = "0.95";
    arrowEl.style.left = (ax - 17) + "px";
    arrowEl.style.top = (ay - 17) + "px";
    arrowEl.style.transform = "rotate(" + (ang * 180 / Math.PI) + "deg)";
  }

  /* ---------------------- HUD ---------------------- */
  function updateHUD() {
    deliveredEl.textContent = delivered;
    scoreEl.textContent = score;
    cargoEl.textContent = carrying ? "📦 на борту" : "—";
    cargoEl.style.color = carrying ? "#ffd76e" : "#fff";
    fuelFill.style.width = clamp(fuel, 0, 100) + "%";
    fuelFill.className = fuel < 25 ? "low" : "";
  }

  /* ---------------------- Экраны ---------------------- */
  function showStart() {
    overlay.classList.remove("hidden");
    var keysHtml = isMobile
      ? '<div class="keys">' +
          '<div><span class="key">🕹️</span> джойстик — вверх/вниз/в стороны</div>' +
          '<div><span class="key">📦</span> кнопка — взять / сбросить посылку</div>' +
        '</div>'
      : '<div class="keys">' +
          '<div><span class="key">W</span> или <span class="key">↑</span> — набрать высоту</div>' +
          '<div><span class="key">S</span> или <span class="key">↓</span> — снизиться</div>' +
          '<div><span class="key">A</span><span class="key">D</span> или <span class="key">←</span><span class="key">→</span> — влево/вправо</div>' +
          '<div><span class="key">ПРОБЕЛ</span> — взять / сбросить посылку</div>' +
        '</div>';
    overlay.innerHTML =
      '<div class="card">' +
        '<h1>✈️ АВИАДОСТАВКА</h1>' +
        '<p>Ты — пилот-курьер. <b>Лети на склад</b> 🏭, забери посылку, потом <b>доставь её в дом</b> 🏠.</p>' +
        '<p>Собирай кольца в воздухе, но берегись <b>птиц</b>, <b>шаров</b> и <b>грозовых облаков</b>! Следи за топливом ⛽.</p>' +
        keysHtml +
        '<div class="legend">' +
          '<span>🏭 склад — взять посылку</span>' +
          '<span>🏠 дом — доставить</span>' +
          '<span>💍 кольца — бонус</span>' +
        '</div>' +
        '<button id="startBtn">ВЗЛЁТ!</button>' +
        '<p style="margin-top:12px;font-size:11px;opacity:.55">Стрелка показывает, куда лететь.</p>' +
      '</div>';
  }

  function winGame() {
    running = false;
    stopEngine();
    if (score > best) { best = score; try { localStorage.setItem("airdeliver_best", String(best)); } catch(e){} }
    bestEl.textContent = best;
    overlay.classList.remove("hidden");
    overlay.innerHTML =
      '<div class="card">' +
        '<h1>🎉 Доставка выполнена!</h1>' +
        '<div class="big">' + score + '</div>' +
        '<p>Ты доставил все посылки! Отличная работа, пилот!</p>' +
        '<div class="row">' +
          '<div class="col">Доставлено<b>' + delivered + '</b></div>' +
          '<div class="col">Рекорд<b>' + best + '</b></div>' +
        '</div>' +
        '<button id="startBtn">Ещё полёт</button>' +
      '</div>';
  }

  function endGame(reason) {
    running = false;
    stopEngine();
    if (score > best) { best = score; try { localStorage.setItem("airdeliver_best", String(best)); } catch(e){} }
    bestEl.textContent = best;
    overlay.classList.remove("hidden");
    overlay.innerHTML =
      '<div class="card">' +
        '<h1>' + (reason ? "⛽ Посадка" : "Посадка") + '</h1>' +
        '<p>' + (reason || "Полёт завершён.") + '</p>' +
        '<div class="big">' + score + '</div>' +
        '<div class="row">' +
          '<div class="col">Доставлено<b>' + delivered + '</b></div>' +
          '<div class="col">Рекорд<b>' + best + '</b></div>' +
        '</div>' +
        '<button id="startBtn">Ещё полёт</button>' +
      '</div>';
  }

  function startGame() {
    getAudio();
    startEngine();
    if (rafId) cancelAnimationFrame(rafId);
    buildWorld();
    resetPlane();
    delivered = 0; score = 0; timeNow = 0; wind = 0;
    particles = [];
    taskFlashT = 0;
    updateHUD();
    overlay.classList.add("hidden");
    running = true; paused = false;
    lastTs = 0;
    rafId = requestAnimationFrame(frame);
  }

  overlay.addEventListener("click", function (e) {
    var btn = e.target.closest && e.target.closest("button");
    if (btn) startGame();
  });
  overlay.addEventListener("touchend", function (e) {
    var btn = e.target.closest && e.target.closest("button");
    if (btn) { e.preventDefault(); startGame(); }
  });
  document.addEventListener("keydown", function (e) {
    if (!running && (e.key === " " || e.key === "Enter")) { e.preventDefault(); startGame(); }
  });

  function frame(ts) {
    var dt = lastTs ? Math.min((ts - lastTs) / 1000, 0.033) : 0.016;
    lastTs = ts;
    if (running) {
      var steps = 2, h = dt / steps;
      for (var i = 0; i < steps && running; i++) update(h);
    }
    render();
    rafId = requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);

  resize();
  buildWorld();
  resetPlane();
  updateHUD();
  showStart();
})();
</script>
</body>
</html>
