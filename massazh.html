<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Массаж — SPA 🕯️</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #app { display: flex; flex-direction: column; height: 100%;
    background: radial-gradient(circle at 50% 30%, #2e2440, #1a1226 70%, #120c1c 100%);
    color: #f0e6f5; }

  /* ===== Шапка ===== */
  #hud {
    display: flex; align-items: center; gap: 18px; padding: 10px 20px;
    background: linear-gradient(180deg, rgba(60,44,84,.9), rgba(40,28,58,.7));
    border-bottom: 1px solid rgba(200,170,255,.18); z-index: 10; flex-wrap: wrap;
  }
  #hud .item { white-space: nowrap; font-size: 14px; }
  #hud .label { opacity: .65; margin-right: 6px; font-size: 12px; }
  #hud .val { font-weight: 800; font-variant-numeric: tabular-nums; }
  #hud .spacer { flex: 1; }
  #time { color: #ffd9a0; }

  /* Шкала расслабления */
  #relaxWrap { display: flex; align-items: center; gap: 10px; min-width: 260px; }
  #relaxBar { position: relative; flex: 1; height: 22px; border-radius: 12px;
    background: rgba(255,255,255,.1); box-shadow: inset 0 2px 6px rgba(0,0,0,.5); overflow: hidden; }
  #relaxFill { height: 100%; width: 0%; border-radius: 12px;
    background: linear-gradient(90deg,#7fd4ff,#8fe0a0,#ffd76e,#ff9ec4);
    background-size: 400px 100%; transition: width .15s linear; }
  #relaxPct { font-weight: 800; color: #8fe0a0; min-width: 42px; text-align: right; }

  /* ===== Сцена ===== */
  #stage {
    position: relative; flex: 1; display: flex; align-items: center; justify-content: center;
    overflow: hidden; touch-action: none;
  }
  #bodyWrap { position: relative; width: min(72vmin, 520px); height: min(86vmin, 620px);
    z-index: 3; }
  #body { width: 100%; height: 100%; display: block;
    filter: drop-shadow(0 20px 30px rgba(0,0,0,.5)); }

  /* свечи-декор */
  .candle {
    position: absolute; width: 18px; height: 60px; border-radius: 6px;
    background: linear-gradient(180deg,#f5e6c8,#e0c9a0); bottom: 6%; z-index: 2;
    box-shadow: 0 6px 16px rgba(0,0,0,.5);
  }
  .candle::before {
    content: ""; position: absolute; left: 50%; top: -20px; width: 10px; height: 20px;
    margin-left: -5px; border-radius: 50% 50% 40% 40%;
    background: radial-gradient(circle at 50% 70%, #fff3b0, #ff9a3c 60%, rgba(255,120,40,0));
    animation: flicker .9s infinite alternate;
  }
  @keyframes flicker { from { transform: scaleY(1); opacity: .9; } to { transform: scaleY(1.1); opacity: 1; } }

  /* падающие лепестки */
  .petal {
    position: absolute; width: 12px; height: 12px; top: -20px; z-index: 1;
    border-radius: 60% 0 60% 0; background: #ff9ec4; opacity: .5;
    animation: fall linear infinite;
  }
  @keyframes fall {
    from { transform: translateY(0) rotate(0); }
    to   { transform: translateY(110vh) rotate(360deg); }
  }

  /* Эффекты масла/искр */
  .oildrop {
    position: absolute; pointer-events: none; z-index: 6;
    width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,240,180,.9), rgba(255,220,120,0));
    animation: oilpop .6s ease-out forwards;
  }
  @keyframes oilpop { 0% { transform: scale(.3); opacity: 1; } 100% { transform: scale(1.8); opacity: 0; } }

  /* ===== Флакон масла ===== */
  #oilBottle {
    position: absolute; left: 4%; bottom: 8%; width: 72px; z-index: 8;
    pointer-events: none; filter: drop-shadow(0 10px 20px rgba(0,0,0,.5));
  }
  #oilBottle .cap {
    width: 22px; height: 26px; margin: 0 auto -4px;
    background: linear-gradient(180deg,#d9b06a,#a8793a); border-radius: 5px 5px 3px 3px;
  }
  #oilBottle .flask {
    position: relative; width: 72px; height: 108px; border-radius: 14px 14px 18px 18px;
    background: linear-gradient(120deg, rgba(180,230,255,.35), rgba(255,255,255,.2));
    border: 2px solid rgba(200,235,255,.6); overflow: hidden;
    box-shadow: inset -8px 0 14px rgba(255,255,255,.3), inset 8px 0 14px rgba(120,180,220,.25);
  }
  #oilBottle .level {
    position: absolute; left: 0; right: 0; bottom: 0; top: 0;
  }
  #oilBottle .fill {
    position: absolute; left: 0; right: 0; bottom: 0; height: 100%;
    background: linear-gradient(180deg, rgba(255,238,170,.85), rgba(255,205,90,.95));
    transition: height .2s linear;
  }
  #oilBottle .fill::after {
    content: ""; position: absolute; left: 0; right: 0; top: -4px; height: 8px;
    border-radius: 50%; background: rgba(255,250,210,.9);
  }
  #oilBottle .label {
    position: absolute; left: 0; right: 0; bottom: 6px; text-align: center;
    font-size: 9px; font-weight: 800; letter-spacing: .1em; color: #8a5a1a;
  }

  /* блик масла на спине (остаётся) */
  .sheen {
    position: absolute; pointer-events: none; z-index: 5;
    border-radius: 50%; mix-blend-mode: screen;
    background: radial-gradient(circle at 40% 35%, rgba(255,250,220,.8), rgba(255,235,180,.3) 55%, rgba(255,230,160,0));
    transition: opacity 3s linear;
  }
  .sparkle { position: absolute; pointer-events: none; z-index: 6; color: #ffe08a;
    font-size: 16px; animation: spk .7s ease-out forwards; }
  @keyframes spk { 0% { transform: translate(-50%,-50%) scale(.4); opacity: 1; }
                   100% { transform: translate(-50%,-160%) scale(1.2); opacity: 0; } }
  .bubble {
    position: absolute; pointer-events: none; z-index: 7; white-space: nowrap;
    font-weight: 800; font-size: 15px; color: #bff0d0;
    text-shadow: 0 2px 6px rgba(0,0,0,.6);
    animation: bub 1.1s ease-out forwards;
  }
  @keyframes bub { 0% { transform: translate(-50%,-50%) scale(.7); opacity: 1; }
                   100% { transform: translate(-50%,-180%) scale(1.05); opacity: 0; } }

  /* ===== Оверлей ===== */
  #overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(20,12,32,.9); backdrop-filter: blur(6px); z-index: 40;
    text-align: center; padding: 20px; overflow: auto;
  }
  #overlay.hidden { display: none; }
  #overlay .card { max-width: 500px; width: 100%; padding: 34px 30px; border-radius: 26px;
    background: linear-gradient(180deg, rgba(60,44,84,.95), rgba(40,28,58,.98));
    border: 1px solid rgba(200,170,255,.28);
    box-shadow: 0 24px 70px rgba(0,0,0,.6), 0 0 90px rgba(180,120,255,.12) inset; }
  #overlay h1 { margin: 0 0 10px; font-size: 32px;
    background: linear-gradient(90deg,#ffd9a0,#ff9ec4,#b79cff);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  #overlay p { margin: 10px 0; line-height: 1.6; font-size: 15px; opacity: .92; }
  #overlay .keys { display: flex; flex-direction: column; gap: 8px; margin: 16px auto 0; max-width: 360px; }
  #overlay .keys div { display: flex; align-items: center; gap: 12px; font-size: 14px; }
  #overlay .key { display: inline-block; min-width: 34px; text-align: center; padding: 5px 10px;
    border-radius: 8px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
    font-weight: 800; font-size: 12px; }
  #overlay button { margin-top: 22px; padding: 15px 40px; font-size: 18px; font-weight: 800;
    color: #241033; background: linear-gradient(180deg,#ffd98a,#ff9b3d);
    border: none; border-radius: 14px; cursor: pointer; letter-spacing: .02em;
    box-shadow: 0 8px 26px rgba(255,150,60,.4); transition: transform .1s, box-shadow .15s;
    font-family: inherit; }
  #overlay button:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255,150,60,.55); }
  #overlay button:active { transform: translateY(1px) scale(.98); }
  #overlay .legend { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap;
    margin-top: 16px; font-size: 13px; opacity: .9; }
  #overlay .legend span { display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.08); padding: 6px 12px; border-radius: 999px; }
</style>
</head>
<body>
  <div id="app">
    <div id="hud">
      <div id="relaxWrap">
        <span class="label">Расслабление</span>
        <span id="relaxBar"><span id="relaxFill"></span></span>
        <span id="relaxPct">0%</span>
      </div>
      <div class="item"><span class="label">Размято узелков:</span><span class="val" id="knots">0</span></div>
      <div class="item"><span class="label">Сеанс:</span><span class="val" id="time">0:00</span></div>
      <div class="spacer"></div>
      <div class="item"><span class="label">Масло:</span><span class="val" id="oil">100%</span></div>
    </div>

    <div id="stage">
      <div id="overlay"></div>
      <div id="oilBottle" title="Флакон массажного масла">
        <div class="cap"></div>
        <div class="flask">
          <div class="level"><div class="fill" id="bottleFill"></div></div>
          <div class="label">🫧 МАСЛО</div>
        </div>
      </div>
      <div id="bodyWrap">
        <svg id="body" viewBox="0 0 460 600">
          <defs>
            <linearGradient id="tableGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#8a6a9a"/>
              <stop offset="0.5" stop-color="#6a4a7a"/>
              <stop offset="1" stop-color="#4a2f5a"/>
            </linearGradient>
            <linearGradient id="sheetGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f7f3fb"/>
              <stop offset="1" stop-color="#ddd3ea"/>
            </linearGradient>
            <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f0c9a4"/>
              <stop offset="1" stop-color="#dba884"/>
            </linearGradient>
            <radialGradient id="oilSheen" cx="0.4" cy="0.3" r="0.7">
              <stop offset="0" stop-color="rgba(255,250,220,.85)"/>
              <stop offset="0.6" stop-color="rgba(255,235,170,.35)"/>
              <stop offset="1" stop-color="rgba(255,230,160,0)"/>
            </radialGradient>
          </defs>

          <!-- ===== МАССАЖНЫЙ СТОЛ (вид сверху) ===== -->
          <rect x="40" y="40" width="380" height="540" rx="34" fill="url(#tableGrad)"/>
          <rect x="40" y="40" width="380" height="540" rx="34" fill="none" stroke="#3a2448" stroke-width="4"/>
          <!-- обивка стола -->
          <rect x="52" y="52" width="356" height="516" rx="26" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="2" stroke-dasharray="10 8"/>

          <!-- ПРОСТЫНЯ -->
          <path d="M70 120 Q230 100 390 120 L390 500 Q230 520 70 500 Z" fill="url(#sheetGrad)" opacity=".9"/>
          <path d="M70 120 Q230 100 390 120 L390 500 Q230 520 70 500 Z" fill="none" stroke="#c8bcd8" stroke-width="2"/>
          <!-- складки простыни -->
          <path d="M90 180 Q230 165 370 180 M90 440 Q230 455 370 440" stroke="#c8bcd8" stroke-width="1.5" fill="none" opacity=".6"/>

          <!-- ===== ЧЕЛОВЕК ЛЕЖИТ НА ЖИВОТЕ ===== -->
          <!-- ноги (под простынёй частично) -->
          <path d="M188 430 L182 585 Q181 594 190 594 L206 594 Q214 594 213 585 L216 430 Z" fill="url(#skinGrad)"/>
          <path d="M252 430 L258 585 Q259 594 250 594 L234 594 Q226 594 227 585 L224 430 Z" fill="url(#skinGrad)"/>
          <ellipse cx="197" cy="592" rx="18" ry="9" fill="#dba884"/>
          <ellipse cx="243" cy="592" rx="18" ry="9" fill="#dba884"/>

          <!-- туловище/спина -->
          <path d="M158 300 Q150 380 158 438 Q200 452 252 438 Q260 380 252 300 Q244 258 205 254 Q166 258 158 300 Z"
            fill="url(#skinGrad)"/>
          <!-- позвоночник -->
          <path d="M205 262 Q207 350 205 432" stroke="#c99a72" stroke-width="3.5" fill="none" opacity=".6" stroke-linecap="round"/>
          <!-- лопатки -->
          <ellipse cx="180" cy="322" rx="22" ry="17" fill="#e0ab84" opacity=".55"/>
          <ellipse cx="230" cy="322" rx="22" ry="17" fill="#e0ab84" opacity=".55"/>
          <!-- поясничная ямка -->
          <ellipse cx="205" cy="412" rx="40" ry="20" fill="#e0ab84" opacity=".35"/>
          <!-- тазовые косточки -->
          <ellipse cx="178" cy="432" rx="12" ry="10" fill="#dba884" opacity=".4"/>
          <ellipse cx="232" cy="432" rx="12" ry="10" fill="#dba884" opacity=".4"/>

          <!-- руки вдоль тела -->
          <path d="M158 292 Q132 345 140 415 Q144 432 156 428 L164 372 Q158 330 172 300 Z" fill="url(#skinGrad)"/>
          <path d="M252 292 Q278 345 270 415 Q266 432 254 428 L246 372 Q252 330 238 300 Z" fill="url(#skinGrad)"/>
          <ellipse cx="148" cy="430" rx="11" ry="15" fill="#dba884"/>
          <ellipse cx="262" cy="430" rx="11" ry="15" fill="#dba884"/>

          <!-- плечи -->
          <ellipse cx="168" cy="268" rx="28" ry="20" fill="url(#skinGrad)"/>
          <ellipse cx="242" cy="268" rx="28" ry="20" fill="url(#skinGrad)"/>

          <!-- шея -->
          <path d="M191 232 L219 232 L216 270 L194 270 Z" fill="#e2b18c"/>

          <!-- ===== ГОЛОВА В ОТВЕРСТИИ ДЛЯ ЛИЦА (лежит лицом вниз) ===== -->
          <!-- подголовник с отверстием -->
          <ellipse cx="205" cy="180" rx="76" ry="60" fill="#e8ddf2"/>
          <ellipse cx="205" cy="180" rx="76" ry="60" fill="none" stroke="#c8bcd8" stroke-width="2"/>
          <ellipse cx="205" cy="172" rx="44" ry="34" fill="#c9b8dc"/>
          <!-- затылок (мы видим макушку) -->
          <ellipse cx="205" cy="176" rx="52" ry="46" fill="#e8b894"/>
          <!-- волосы — затылок, лицо вниз -->
          <path d="M156 172 Q150 118 205 112 Q260 118 254 172 Q248 138 205 134 Q162 138 156 172 Z" fill="#6b4a32"/>
          <path d="M158 170 Q156 200 162 220 Q158 190 166 168 Z" fill="#6b4a32"/>
          <path d="M252 170 Q254 200 248 220 Q252 190 244 168 Z" fill="#6b4a32"/>
          <!-- пробор -->
          <path d="M205 118 Q205 145 205 160" stroke="#523620" stroke-width="2" fill="none" opacity=".6"/>
          <!-- уши -->
          <ellipse cx="157" cy="178" rx="9" ry="13" fill="#e0ab84"/>
          <ellipse cx="253" cy="178" rx="9" ry="13" fill="#e0ab84"/>

          <!-- МАСКА на глазах (полотенце поверх затылка не нужна — лицо вниз). 
               Полотенце на спине — массажный аксессуар -->
          <g id="towel" opacity=".9">
            <path d="M120 480 Q230 500 340 480 L338 505 Q230 525 122 505 Z" fill="#cfe8ff"/>
            <path d="M120 480 Q230 500 340 480" stroke="#9fc8e8" stroke-width="2" fill="none"/>
          </g>

          <!-- масло на спине (блики) -->
          <g id="oilLayer"></g>
          <!-- узелки -->
          <g id="knotsLayer"></g>
        </svg>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  /* ===================== НАСТРОЙКИ ===================== */
  var SESSION_TIME = 120;      // длительность сеанса, сек
  var WIN_RELAX    = 100;      // цель — полное расслабление
  var KNOT_COUNT   = 6;        // сколько узелков за сеанс
  var RUB_GAIN     = 22;       // прирост расслабления от растирания (в сек)
  var KNOT_HP      = 100;      // «прочность» узелка
  var KNOT_RUB     = 130;      // как быстро разминается узелок (в сек)
  var OIL_USE      = 4;        // расход масла (в сек при массаже)
  var OIL_REGEN    = 1.2;      // восстановление масла (в сек)
  /* ==================================================== */

  var stage = document.getElementById("stage");
  var bodyWrap = document.getElementById("bodyWrap");
  var svg = document.getElementById("body");
  var knotsLayer = document.getElementById("knotsLayer");
  var oilLayer = document.getElementById("oilLayer");
  var overlay = document.getElementById("overlay");
  var relaxFill = document.getElementById("relaxFill");
  var relaxPct = document.getElementById("relaxPct");
  var knotsEl = document.getElementById("knots");
  var timeEl = document.getElementById("time");
  var oilEl = document.getElementById("oil");
  var bottleFill = document.getElementById("bottleFill");

  var playing = false;
  var relax = 0, knotsDone = 0, sessionTime = 0, oil = 100;
  var massaging = false;
  var lastX = 0, lastY = 0, lastMoveT = 0;
  var knots = [];               // активные узелки
  var sheens = [];              // блеск масла на спине
  var rafId = null, lastTs = 0, timeNow = 0;
  var spawnTimer = 0;
  var lastOilT = 0;

  /* ---------------------- Звук ---------------------- */
  var audioCtx = null, ambient = null;
  function getAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, to, dur, type, vol, delay) {
    var ac = getAudio(); if (!ac) return;
    var t = ac.currentTime + (delay || 0);
    var o = ac.createOscillator(); o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(Math.max(1, to), t + dur);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.06);
  }
  function noise(dur, cutoff, vol) {
    var ac = getAudio(); if (!ac) return;
    var buf = ac.createBuffer(1, Math.max(1, Math.floor(ac.sampleRate * dur)), ac.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 1.4);
    var src = ac.createBufferSource(); src.buffer = buf;
    var f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cutoff || 900;
    var g = ac.createGain(); g.gain.value = vol || 0.12;
    src.connect(f); f.connect(g); g.connect(ac.destination); src.start();
  }
  function sndRub()   { noise(0.13, 700, 0.09); }
  function sndRelax() { tone(660, 900, 0.1, "sine", 0.1); }
  function sndKnot()  { tone(300, 90, 0.3, "sawtooth", 0.18); noise(0.2, 500, 0.12); }
  function sndKnotDone(){ tone(760, 1200, 0.12, "triangle", 0.16); tone(1000, 1500, 0.14, "triangle", 0.13, 0.1); }
  function sndWin()   { [660, 880, 1100, 1320].forEach(function (f, i) { tone(f, f*1.2, 0.2, "sine", 0.14, i*0.14); }); }
  function sndOil()   { tone(900, 1400, 0.1, "sine", 0.08); }

  function startAmbient() {
    var ac = getAudio(); if (!ac || ambient) return;
    // мягкий гул спа + шум
    var o1 = ac.createOscillator(); o1.type = "sine"; o1.frequency.value = 110;
    var o2 = ac.createOscillator(); o2.type = "sine"; o2.frequency.value = 165; o2.detune.value = 6;
    var g = ac.createGain(); g.gain.value = 0.0;
    g.gain.linearRampToValueAtTime(0.02, ac.currentTime + 2);
    var lfo = ac.createOscillator(); lfo.frequency.value = 0.15;
    var lg = ac.createGain(); lg.gain.value = 0.012;
    lfo.connect(lg); lg.connect(g.gain);
    o1.connect(g); o2.connect(g); g.connect(ac.destination);
    // шум-«дыхание»
    var buf = ac.createBuffer(1, ac.sampleRate * 3, ac.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * 0.25;
    var wind = ac.createBufferSource(); wind.buffer = buf; wind.loop = true;
    var wf = ac.createBiquadFilter(); wf.type = "lowpass"; wf.frequency.value = 320;
    var wg = ac.createGain(); wg.gain.value = 0.03;
    wind.connect(wf); wf.connect(wg); wg.connect(ac.destination);
    o1.start(); o2.start(); lfo.start(); wind.start();
    ambient = { o1:o1, o2:o2, lfo:lfo, g:g, wind:wind, wg:wg };
  }
  function stopAmbient() {
    if (!ambient) return;
    var ac = getAudio();
    try {
      ambient.g.gain.cancelScheduledValues(ac.currentTime);
      ambient.g.gain.linearRampToValueAtTime(0, ac.currentTime + 0.6);
      ambient.wg.gain.linearRampToValueAtTime(0, ac.currentTime + 0.6);
      ambient.o1.stop(ac.currentTime + 0.7); ambient.o2.stop(ac.currentTime + 0.7);
      ambient.lfo.stop(ac.currentTime + 0.7); ambient.wind.stop(ac.currentTime + 0.7);
    } catch (e) {}
    ambient = null;
  }

  /* ---------------------- Утилиты ---------------------- */
  function rand(a, b) { return Math.random() * (b - a) + a; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function fmtTime(s) { var m = Math.floor(s/60), ss = Math.floor(s%60); return m + ":" + (ss<10?"0":"") + ss; }

  /* ---------------------- Декор ---------------------- */
  function buildDecor() {
    // свечи
    for (var i = 0; i < 3; i++) {
      var c = document.createElement("div");
      c.className = "candle";
      c.style.left = (12 + i * 38) + "%";
      c.style.height = (45 + Math.random()*30) + "px";
      stage.appendChild(c);
    }
    // лепестки
    for (var p = 0; p < 12; p++) {
      var pe = document.createElement("div");
      pe.className = "petal";
      pe.style.left = Math.random()*100 + "%";
      pe.style.animationDuration = (8 + Math.random()*10) + "s";
      pe.style.animationDelay = (-Math.random()*12) + "s";
      pe.style.background = ["#ff9ec4","#ffb8d8","#c9a8ff","#ffd0e0"][p%4];
      pe.style.opacity = (0.3 + Math.random()*0.4).toFixed(2);
      stage.appendChild(pe);
    }
  }

  /* ---------------------- Узелки ---------------------- */
  // Точки на спине (в координатах SVG)
  var SPOTS = [
    { x: 180, y: 315 }, { x: 230, y: 315 },   // лопатки
    { x: 168, y: 272 }, { x: 242, y: 272 },   // плечи
    { x: 196, y: 358 }, { x: 214, y: 358 },   // середина спины
    { x: 190, y: 415 }, { x: 220, y: 415 },   // поясница
    { x: 205, y: 248 }, { x: 205, y: 385 }    // шея / центр
  ];

  function spawnKnot() {
    // выбираем свободную точку
    var used = knots.map(function (k) { return k.spotIdx; });
    var free = [];
    for (var i = 0; i < SPOTS.length; i++) if (used.indexOf(i) < 0) free.push(i);
    if (!free.length) return;
    var si = free[Math.floor(Math.random() * free.length)];
    var spot = SPOTS[si];
    var g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("class", "knot");
    g.setAttribute("transform", "translate(" + spot.x + "," + spot.y + ")");
    g.innerHTML =
      '<circle class="knotGlow" r="26" fill="rgba(255,120,120,.0)"/>' +
      '<circle r="17" fill="rgba(200,90,90,.55)"/>' +
      '<circle r="12" fill="rgba(170,60,60,.75)"/>' +
      '<circle r="7" fill="rgba(140,40,40,.9)"/>';
    knotsLayer.appendChild(g);
    var k = { el: g, spotIdx: si, x: spot.x, y: spot.y, hp: KNOT_HP, pulse: 0 };
    knots.push(k);
  }

  /* ---------------------- Массаж ---------------------- */
  function posToSvg(clientX, clientY) {
    // переводим экранные координаты в координаты SVG (viewBox 460x600)
    var r = svg.getBoundingClientRect();
    return {
      x: (clientX - r.left) / r.width * 460,
      y: (clientY - r.top) / r.height * 600
    };
  }

  function doRub(clientX, clientY) {
    if (!playing) return;
    var p = posToSvg(clientX, clientY);
    var sr = stage.getBoundingClientRect();
    var screenX = clientX - sr.left, screenY = clientY - sr.top;

    // движение — только если сдвинулись
    var moved = Math.hypot(p.x - lastX, p.y - lastY);
    lastX = p.x; lastY = p.y;
    if (moved < 2) return;

    // расслабление растёт от растирания (если есть масло)
    var haveOil = oil > 2;
    if (haveOil) {
      relax = Math.min(WIN_RELAX, relax + RUB_GAIN * 0.016 * Math.min(moved, 20));
    }
    oil = clamp(oil - OIL_USE * 0.016, 0, 100);

    // звук/эффект растирания
    if (timeNow - lastMoveT > 0.12) { lastMoveT = timeNow; sndRub(); }
    if (Math.random() < 0.28) oilGlow(screenX, screenY);
    // блеск масла остаётся на коже (только если есть масло)
    if (haveOil && Math.random() < 0.5) addSheen(p.x, p.y);

    // проверяем узелки рядом
    for (var i = knots.length - 1; i >= 0; i--) {
      var k = knots[i];
      var d = Math.hypot(p.x - k.x, p.y - k.y);
      if (d < 30) {
        k.hp -= KNOT_RUB * 0.016 * Math.min(moved, 20) * (haveOil ? 1 : 0.3);
        k.pulse = 1;
        k.el.querySelector("circle:nth-child(2)").setAttribute("r", 17 + Math.sin(timeNow*20)*2);
        if (k.hp <= 0) breakKnot(k);
      }
    }
    updateHUD();
  }

  function breakKnot(k) {
    // узелок размят!
    sndKnotDone();
    knotsDone++;
    relax = Math.min(WIN_RELAX, relax + 6);
    showPlus(k.x, k.y, "Узелок размят! +6");
    // вспышка
    var sp = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    sp.setAttribute("cx", k.x); sp.setAttribute("cy", k.y); sp.setAttribute("r", 6);
    sp.setAttribute("fill", "rgba(180,255,200,.9)");
    oilLayer.appendChild(sp);
    var animR = 6;
    var iv = setInterval(function () {
      animR += 3;
      sp.setAttribute("r", animR);
      sp.setAttribute("fill", "rgba(180,255,200," + (1 - animR/40) + ")");
      if (animR > 40) { clearInterval(iv); sp.remove(); }
    }, 30);
    k.el.remove();
    var idx = knots.indexOf(k); if (idx >= 0) knots.splice(idx, 1);
    updateHUD();
  }

  function showPlus(svgX, svgY, text) {
    var r = svg.getBoundingClientRect();
    var sx = svgX / 460 * r.width;
    var sy = svgY / 600 * r.height;
    var el = document.createElement("div");
    el.className = "bubble";
    el.textContent = text;
    el.style.left = (r.left - stage.getBoundingClientRect().left + sx) + "px";
    el.style.top = (r.top - stage.getBoundingClientRect().top + sy) + "px";
    stage.appendChild(el);
    setTimeout(function () { el.remove(); }, 1100);
  }

  function oilGlow(x, y) {
    var el = document.createElement("div");
    el.className = "oildrop";
    el.style.left = x + "px"; el.style.top = y + "px";
    stage.appendChild(el);
    setTimeout(function () { el.remove(); }, 600);
  }

  // Остающийся блеск масла на спине (в координатах SVG)
  function addSheen(svgX, svgY) {
    // только по спине (не на стол и не на голову)
    if (svgY < 250 || svgY > 445 || svgX < 150 || svgX > 260) return;
    if (sheens.length > 40) {
      var old = sheens.shift();
      if (old.el.parentNode) old.el.remove();
    }
    var el = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
    var r = rand(9, 20);
    el.setAttribute("cx", svgX); el.setAttribute("cy", svgY);
    el.setAttribute("rx", r); el.setAttribute("ry", r * 0.7);
    el.setAttribute("fill", "url(#oilSheen)");
    el.setAttribute("opacity", "0.85");
    oilLayer.appendChild(el);
    var s = { el: el, life: rand(6, 12), max: 12 };
    sheens.push(s);
  }

  /* ---------------------- Ввод ---------------------- */
  function onDown(e) {
    if (!playing) return;
    e.preventDefault();
    getAudio();
    massaging = true;
    var p = posToSvg(e.clientX, e.clientY);
    lastX = p.x; lastY = p.y;
    doRub(e.clientX, e.clientY);
  }
  function onMove(e) {
    if (!playing || !massaging) return;
    e.preventDefault();
    doRub(e.clientX, e.clientY);
  }
  function onUp() { massaging = false; }

  stage.addEventListener("mousedown", onDown);
  stage.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
  stage.addEventListener("touchstart", function (e) { var t = e.touches[0]; onDown(t); }, { passive: false });
  stage.addEventListener("touchmove", function (e) { var t = e.touches[0]; onMove(t); }, { passive: false });
  window.addEventListener("touchend", onUp);

  /* ---------------------- Цикл ---------------------- */
  function frame(ts) {
    if (!playing) return;
    var dt = lastTs ? Math.min((ts - lastTs) / 1000, 0.05) : 0.016;
    lastTs = ts;
    timeNow += dt;
    sessionTime += dt;

    // масло восстанавливается, когда не массируешь
    if (!massaging) oil = clamp(oil + OIL_REGEN * dt, 0, 100);

    // расслабление падает, если не массировать
    if (!massaging) relax = Math.max(0, relax - 1.6 * dt);

    // узелки пульсируют
    for (var i = 0; i < knots.length; i++) {
      var k = knots[i];
      var glow = k.el.querySelector(".knotGlow");
      if (glow) glow.setAttribute("fill", "rgba(255,120,120," + (0.15 + 0.15*Math.sin(timeNow*4 + i)) + ")");
    }

    // блеск масла постепенно высыхает
    for (var s = sheens.length - 1; s >= 0; s--) {
      var sh = sheens[s];
      sh.life -= dt;
      var op = clamp(sh.life / 4, 0, 1) * 0.85;
      sh.el.setAttribute("opacity", op);
      if (sh.life <= 0) { sh.el.remove(); sheens.splice(s, 1); }
    }

    // появляются новые узелки
    spawnTimer -= dt;
    if (spawnTimer <= 0 && knots.length < 3 && knotsDone + knots.length < KNOT_COUNT) {
      spawnTimer = rand(2.5, 5);
      spawnKnot();
    }

    updateHUD();

    if (relax >= WIN_RELAX) { winGame(); return; }
    if (sessionTime >= SESSION_TIME && knotsDone >= 3) { endSession(); return; }

    rafId = requestAnimationFrame(frame);
  }

  function updateHUD() {
    relaxFill.style.width = relax + "%";
    relaxPct.textContent = Math.round(relax) + "%";
    knotsEl.textContent = knotsDone;
    timeEl.textContent = fmtTime(Math.max(0, SESSION_TIME - sessionTime));
    oilEl.textContent = Math.round(oil) + "%";
    oilEl.style.color = oil < 15 ? "#ff8a8a" : "#8fe0a0";
    if (bottleFill) bottleFill.style.height = Math.round(oil) + "%";
  }

  /* ---------------------- Экраны ---------------------- */
  function showStart() {
    overlay.classList.remove("hidden");
    overlay.innerHTML =
      '<div class="card">' +
        '<h1>🕯️ Массаж в SPA</h1>' +
        '<p>Сделай клиенту расслабляющий массаж спины.<br>' +
        'Зажми мышку и <b>растирай спину</b> — расслабление растёт.</p>' +
        '<p>На спине появляются <b>красные узелки</b> (зажатые мышцы). Разомни их — они исчезнут!</p>' +
        '<div class="keys">' +
          '<div><span class="key">Мышь</span> зажми и растирай спину</div>' +
          '<div><span class="key">💆</span> круговыми движениями разминай узелки</div>' +
        '</div>' +
        '<div class="legend">' +
          '<span>🟥 узелок — разомни его</span>' +
          '<span>🫧 масло тратится, но восполняется</span>' +
        '</div>' +
        '<p style="margin-top:14px;font-size:13px;opacity:.8">Цель — расслабить клиента до <b>100%</b>!</p>' +
        '<button id="startBtn">Начать сеанс</button>' +
      '</div>';
  }

  function winGame() {
    playing = false;
    stopAmbient();
    sndWin();
    // салют из звёздочек
    for (var i = 0; i < 30; i++) {
      (function (k) {
        setTimeout(function () {
          var s = document.createElement("div");
          s.className = "sparkle";
          s.textContent = ["✨","💫","🌟","💜"][Math.floor(Math.random()*4)];
          s.style.left = (Math.random()*100) + "%";
          s.style.top = (30 + Math.random()*50) + "%";
          s.style.position = "absolute";
          stage.appendChild(s);
          setTimeout(function () { s.remove(); }, 900);
        }, k * 50);
      })(i);
    }
    overlay.classList.remove("hidden");
    overlay.innerHTML =
      '<div class="card">' +
        '<h1>😌 Полностью расслаблен!</h1>' +
        '<p>Клиент растаял от удовольствия. Все узелки размяты, спина как новая!</p>' +
        '<div style="font-size:44px;margin:10px 0">💆‍♀️✨</div>' +
        '<p>Размято узелков: <b>' + knotsDone + '</b> · Время: <b>' + fmtTime(sessionTime) + '</b></p>' +
        '<button id="startBtn">Ещё сеанс</button>' +
      '</div>';
  }

  function endSession() {
    playing = false;
    stopAmbient();
    var good = knotsDone >= 4;
    overlay.classList.remove("hidden");
    overlay.innerHTML =
      '<div class="card">' +
        '<h1>🕯️ Сеанс завершён</h1>' +
        '<p>' + (good ? "Отличный массаж! Клиент очень доволен." : "Неплохо, но можно было лучше.") + '</p>' +
        '<div style="font-size:44px;margin:10px 0">' + (good ? "😍" : "🙂") + '</div>' +
        '<p>Размято узелков: <b>' + knotsDone + '</b> · Расслабление: <b>' + Math.round(relax) + '%</b></p>' +
        '<button id="startBtn">Ещё сеанс</button>' +
      '</div>';
  }

  function startGame() {
    getAudio();
    startAmbient();
    if (rafId) cancelAnimationFrame(rafId);
    // очищаем узелки
    knotsLayer.innerHTML = "";
    oilLayer.innerHTML = "";
    knots = [];
    sheens = [];
    relax = 0; knotsDone = 0; sessionTime = 0; oil = 100;
    massaging = false; spawnTimer = 1.2; timeNow = 0;
    updateHUD();
    overlay.classList.add("hidden");
    playing = true;
    lastTs = 0;
    rafId = requestAnimationFrame(frame);
  }

  overlay.addEventListener("click", function (e) {
    var btn = e.target.closest && e.target.closest("button");
    if (btn) startGame();
  });
  document.addEventListener("keydown", function (e) {
    if (!playing && (e.key === " " || e.key === "Enter")) { e.preventDefault(); startGame(); }
  });
  window.addEventListener("resize", function () {});

  buildDecor();
  updateHUD();
  showStart();
})();
</script>
</body>
</html>
